name: Blueprint

# Builds the web blueprint (leanblueprint web) and deploys it to GitHub Pages.
# It does nothing useful until Pages is enabled for the repository with
# "GitHub Actions" as its source. The doc-gen4 API documentation is not built here.

on:
  push:
    branches: [master]
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Graphviz, and kpsewhich for plasTeX
        # Without kpsewhich, plasTeX resolves \input only for bare file names in the current
        # directory, so \input{macros/common} and \input{chapters/...} silently produce nothing.
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev texlive-base
      - name: Install leanblueprint
        run: pip install leanblueprint==0.0.20
      - name: Check that the chapters are generated from the current sources
        run: python scripts/gen_blueprint.py --check
      - name: Build the PDF version
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: print.tex
          working_directory: blueprint/src
          latexmk_use_xelatex: true
      - name: Build the web version
        run: leanblueprint web
      - name: Restore relation spacing in the web pages
        run: python scripts/fix_web_relations.py
      - name: Draw the dependency graph's nodes as rounded rectangles
        run: python scripts/fix_web_depgraph.py
      - name: Refuse an incomplete site
        # Every chapter of content.tex must have become a page, and the landing page must carry
        # the generated result count; otherwise the deploy stops here.
        run: |
          set -e
          want=$(grep -c '^\\input{chapters/' blueprint/src/content.tex)
          got=$(ls blueprint/web/chap-*.html | wc -l)
          echo "chapters: $got pages for $want inputs"
          test "$got" -ge "$want"
          grep -q 'results' blueprint/web/index.html
          grep -E -q '[0-9]+ results' blueprint/web/index.html
      - name: Add the PDF, and serve the Lean links from GitHub source lines
        # The site's Lean links go to docs/find/#doc/<name>, doc-gen4's search URL. Without
        # doc-gen4 pages, blueprint/docs-find/ answers there and redirects to the declaration.
        # The header's PDF link (blueprint/src/site.js) points to blueprint.pdf.
        run: |
          mkdir -p blueprint/web/docs/find
          cp -R blueprint/docs-find/. blueprint/web/docs/find/
          cp blueprint/src/print.pdf blueprint/web/blueprint.pdf
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: blueprint/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
