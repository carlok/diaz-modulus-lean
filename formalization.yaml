    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    Formalized and compared: the definitions hull and Hmat; conj_eq_rho_div,
    the identity conj(u) = (u·conj u)/u on which everything rests; eqOn_hull,
    that two ring homomorphisms of ℂ agreeing on K and at u agree on the hull;
    conj_comm, that a homomorphism fixing K and carrying u to a point t of the
    same circle intertwines complex conjugation on the hull;
    exists_algHom_of_transcendental, that such a map exists from K⟮u⟯ into ℂ
    when u and t are transcendental over K; no_vanishing_coeff_matrix, that no
    coefficient over K of the rank-one matrix vanishes; and
    coeff_indistinguishable, that no vanishing-coefficient statement over K
    separates two points off K on the same circle.

    NOT formalized and NOT claimed: any transcendence result, and any progress
    on Diaz's question, which is untouched and remains open. Nothing here shows
    the conjugation method fails in general — only that this particular family
    of statements does not separate the two points. The compared surface does
    not assert that any counterexample to Diaz's question exists.

    Boundary of the compared surface. exists_algHom_of_transcendental produces a
    K-algebra map on K⟮u⟯, NOT a ring endomorphism of all of ℂ. Extending that
    far requires a transcendence-basis argument which is not carried out here;
    every compared use evaluates the map only on the hull. The wider development
    in Diaz/ additionally proves results that do reach an endomorphism of ℂ, and
    those depend on the imported axioms listed below. None of them is in the
    compared surface.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "Diaz.hermite_lindemann"
    - "Diaz.exists_ringHom_of_transcendental"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted, human-directed formalization in Lean 4 with Mathlib, using
        Claude Opus 5 High through Claude Code. Proofs are ordinary Mathlib
        tactics and term-mode constructions; no native_decide anywhere. The
        literature search recorded in the companion note was likewise
        AI-assisted, in two passes; one pass misread a scanned source at a
        decisive point and the error was caught by checking the printed page and
        corrected. The note states this openly.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a — not recorded"
  spend_usd: "not tracked"
  notes: >-
    The mathematics, the formalization, the companion note and the literature
    search were developed with substantial LLM assistance, directed and accepted
    by the author, who is responsible for the content. No claim rests on an
    assertion by a language model: every mathematical statement is machine
    checked by Lean at the pinned toolchain, and every bibliographic claim in
    the note is checked against the cited page. The axiom closure of every
    compared declaration was audited with #print axioms.

fidelity:
  divergences: >-
    No divergence between the compared statements and the companion note is
    known; the note was written to state exactly these results and no others.
    Four qualifications a reviewer should weigh:

    (1) Challenge.lean and Solution.lean restate hull and Hmat with bodies
    character-identical to those in Diaz/Closure.lean and Diaz/Rigidity.lean,
    under the namespace DiazRigidity rather than Diaz. The Solution proofs
    delegate to the development by definitional equality. No statement is
    altered by this repackaging.

    (2) The existence theorem is proved on K⟮u⟯, not on all of ℂ. The
    repository's README and the wider development describe a stronger closure
    theorem producing a ring endomorphism of ℂ; that version rests on the
    imported axiom Diaz.exists_ringHom_of_transcendental and is deliberately
    outside the compared surface. A reader comparing the README against the
    Challenge will see the weaker existence statement, and this is intentional.

    (3) The development imports two transcendence results as axioms, declared
    above. They are used for results about actual counterexamples to Diaz's
    question — that a candidate is transcendental, that the circle carries a
    transcendental point, and hence candidate_indistinguishable. No compared
    declaration depends on either; #print axioms on all eight lists only
    propext, Classical.choice and Quot.sound.

    (4) Because the compared surface avoids Hermite–Lindemann, it does not
    assert that the hypothesis class is inhabited by an actual counterexample.
    The results are stated for an arbitrary conjugation-stable K and are not
    vacuous — they apply to every point of every such circle — but they do not
    claim that a counterexample to Diaz's question exists. It is not known
    whether one does.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Machine verification: the project builds under leanprover/lean4:v4.32.0 with
    Mathlib pinned to v4.32.0. #print axioms was run on every compared
    declaration; each depends only on propext, Classical.choice and Quot.sound,
    and in particular on neither imported axiom. There are no sorry holes
    outside the deliberate ones in Challenge.lean. Statement audit: the
    Challenge surface is 102 lines and 4.8 KiB, inside Palomar's preferred
    300-line/32 KiB review surface, and the pretty-printed types and definition
    bodies of all eight declarations were diffed between Challenge and Solution
    and are identical. Literature: see the companion note's search section, and
    the limits stated there. No independent mathematical review by a third party
    has been performed.

alignment:
  namespace: "DiazRigidity"
  statements:
    - source: "Companion note, Lemma 3.1 (the mechanism)"
      lean: "DiazRigidity.conj_eq_rho_div"
      module: "Challenge"
      status: "proved"
      note: >-
        conj(u) = (u·conj u)/u for u ≠ 0. Elementary, and the identity on which
        every other result here depends.
    - source: "Companion note, Lemma 4.1 (rigidity)"
      lean: "DiazRigidity.eqOn_hull"
      module: "Challenge"
      status: "proved"
      note: >-
        Two ring homomorphisms of ℂ agreeing on K and at u agree on hull K u.
    - source: "Companion note, Theorem 4.2 (the intertwining is forced)"
      lean: "DiazRigidity.conj_comm"
      module: "Challenge"
      status: "proved"
      note: >-
        A homomorphism fixing K with Φ(u) = t, both points on the same circle
        over K, commutes with conjugation on hull K u. Conditional on Φ; the
        existence is the next statement.
    - source: "Companion note, Theorem 5.1 (existence)"
      lean: "DiazRigidity.exists_algHom_of_transcendental"
      module: "Challenge"
      status: "proved"
      note: >-
        Proved on K⟮u⟯ rather than on ℂ; see status.scope and fidelity item (2).
        Discharged from Mathlib via RatFunc.algEquivOfTranscendental, with no
        appeal to the Steinitz axiom carried elsewhere in the repository.
    - source: "Companion note, Theorem 6.1 (no coefficient vanishes)"
      lean: "DiazRigidity.no_vanishing_coeff_matrix"
      module: "Challenge"
      status: "proved"
      note: >-
        For u ∉ K on the circle and non-zero w, v over K, the coefficient
        wᵀ H v is non-zero.
    - source: "Companion note, Corollary 6.2 (the negative result)"
      lean: "DiazRigidity.coeff_indistinguishable"
      module: "Challenge"
      status: "proved"
      note: >-
        No vanishing-coefficient statement over K separates two points off K on
        the same circle. This is the conclusion the note argues for, and it is
        the reason the selection is a statement about proof strategies rather
        than about any individual number.

acknowledgements: >-
  The Mathlib community, for Lean 4 and Mathlib. Guy Diaz, for the question and
  for the method question at p. 551 that this work answers in one direction, and
  Michel Waldschmidt, for the matrix configuration and for the standard
  reference in which this circle of conjectures is recorded. The formalization,
  the note and the literature search received substantial LLM assistance,
  directed and accepted by the author.
