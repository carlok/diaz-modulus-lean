# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Conjugation is not independent data: a formalized obstruction for Diaz's modulus question"
  description: >-
    A Lean 4 + Mathlib formalization of an elementary rigidity observation and
    its consequences for a class of transcendence proof strategies. Let K be a
    conjugation-stable subfield of ℂ and let u satisfy u·conj(u) ∈ K. Then
    conj(u) = (u·conj(u))/u, so on the subfield generated by K and u complex
    conjugation is a rational function of the generator rather than independent
    structure. Three consequences are formalized: a ring homomorphism fixing K
    and carrying u to another point of the same circle intertwines conjugation
    automatically; such a homomorphism exists on that subfield whenever both
    points are transcendental over K; and no vanishing-coefficient statement
    over K built from the associated rank-one matrix separates the two points.
    These are negative results about a class of proof strategies. No
    transcendence result is proved, and Diaz's question — whether a non-zero
    logarithm of an algebraic number can have algebraic modulus — is untouched
    and remains open.
  authors:
    - "Carlo Perassi"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Carlo Perassi"

# No `repository` block: this repository is the substantive proof development.

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11J81", "12F20", "68V20"]

sources:
  - title: >-
      Conjugation is not independent data: a formalized obstruction for Diaz's
      modulus question (companion note, tex/diaz-modulus.tex)
    authors:
      - "Carlo Perassi"
    id: "https://github.com/carlok/diaz-modulus-lean/blob/main/tex/diaz-modulus.tex"
    type: original-proof
    location: "tex/diaz-modulus.tex, in this repository"
    relationship: other
    note: >-
      The companion note is the informal account of this development and is
      first presented with it. Its section "Related work, and what was searched"
      records the literature search behind the originality claim: which sources
      were examined, at which pages, and with what outcome, including a
      mechanical check that neither Diaz paper contains any occurrence of
      homomorphisme, endomorphisme, isomorphisme, automorphisme, plongement or
      extension, so neither can contain a field-map argument. The note states
      the claim as the author's assertion after looking, not as proof of
      priority, and records the limits of the search. The matrix configuration
      and the question itself are prior art and are attributed at the page; see
      the background sources below.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: >-
      Utilisation de la conjugaison complexe dans l'étude de la transcendance de
      valeurs de la fonction exponentielle usuelle
    authors:
      - "Guy Diaz"
    id: "doi:10.5802/jtnb.459"
    type: "article"
    location: "J. Théor. Nombres Bordeaux 16 (2004), no. 3, 535–553"
    relationship: background
    note: >-
      States, at §5.1 p. 550, the question this work takes as its reference
      point: if u ≠ 0 and |u| is algebraic then exp(u) is transcendental. Also
      the source of the method question at p. 551 — whether maps such as
      z ↦ conj z and z ↦ |z| can be used — which the formalized observation
      answers in one direction. Nothing from this paper is formalized here; the
      paper contains no field-map argument.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: >-
      La conjecture des quatre exponentielles et les conjectures de D. Bertrand
      sur la fonction modulaire
    authors:
      - "Guy Diaz"
    id: "http://www.numdam.org/item/JTNB_1997__9_1_229_0/"
    type: "article"
    location: "J. Théor. Nombres Bordeaux 9 (1997), no. 1, 229–245"
    relationship: background
    note: >-
      Assertion (4-1), p. 237, is the companion condition |τ|² ∈ ℚ. Prior art,
      attributed in the note. Not formalized here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Diophantine Approximation on Linear Algebraic Groups"
    authors:
      - "Michel Waldschmidt"
    id: "Grundlehren der mathematischen Wissenschaften 326, Springer, 2000"
    type: "book"
    location: "Springer, Berlin, 2000"
    relationship: background
    note: >-
      p. 15 carries the matrix configuration used here (x₁=1, x₂=|λ|/λ, y₁=λ,
      y₂=|λ|); p. 399 states the modulus question crediting Diaz 1997. Both are
      prior art, attributed at the page in the note. Not formalized here.
    license: "unknown"
