# Chapter 5. Read by scripts/gen_blueprint.py; see its docstring for the format.

[chapter]
title = "The six exponentials theorem"
text = '''
Schneider's method in the form of Lang and Ramachandra, relativised to a fixed number field: an auxiliary function built by Siegel's lemma, a descent that extends its zeros over a lattice, and a zero estimate.

In this chapter $x=(x_1,\dots,x_d)$ and $y=(y_1,\dots,y_l)$ are families of complex numbers, each linearly independent over $\Q$. For $\lambda\in\N^{d}$ and $m\in\N^{l}$ write $\langle\lambda,x\rangle=\sum_i\lambda_ix_i$ and $\langle m,y\rangle=\sum_jm_jy_j$. For $L\in\N$ and integers $p_\lambda$ the auxiliary function is
\[ F_p(z)=\sum_{\lambda\in\{0,\dots,L-1\}^{d}}p_\lambda\,e^{\langle\lambda,x\rangle z}. \]
A number field $K$ is a subfield of $\C$ of finite degree over $\Q$.

Three sections prove Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}, \cite[Corollary 11.16]{Wal00} (Theorem~\ref{thm:strong_six_exponentials}): if $x_1,x_2$ are linearly independent over $\Qbar$ and $y_1,y_2,y_3$ are linearly independent over $\Qbar$, at least one of the six products $x_iy_j$ lies outside $\widetilde{\mathcal L}$, the $\Qbar$-span of $1$ and the logarithms of algebraic numbers. The theorem is classical, and the proof follows Waldschmidt's book \cite{Wal00}, called DALAG in the statements: the interpolation determinant, the linear subgroup theorem \cite[Theorem 11.21]{Wal00} (Theorem~\ref{thm:linear_subgroup_transcendence}), and Roy's map $\Upsilon$ \cite[\S11.6.2]{Wal00}. It is proved from one explicit hypothesis, \texttt{hME} (the Lean proposition \texttt{Diaz.MultiplicityEstimateElem}): the case $G^-=\{e\}$ of the multiplicity estimate \cite[Theorem 8.1]{Wal00}, after Philippon \cite{Phi86}, for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$, written in coordinates. The hypothesis is stated in full in Theorem~\ref{thm:linear_subgroup_transcendence}. The last five sections prove it (Theorem~\ref{thm:multiplicityEstimateElem}), so Roy's theorem holds with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}). In the library, \texttt{Diaz.strongSixExponentials\_of\_multiplicityEstimateElem} restates the conclusion of Theorem~\ref{thm:strong_six_exponentials} as the proposition \texttt{Diaz.StrongSixExponentials}, and \texttt{Diaz.strongSixExponentials} proves that proposition with no hypothesis, so that every result that takes Roy's theorem as a hypothesis holds without it (Chapter~\ref{chap:10-rank-one-configurations} has many).

The next three sections prove the Hilbert-function half of \texttt{hME}, at finite level: inequalities between dimensions of boxes of polynomials, with no Hilbert polynomials. They follow \cite[Chapters 5 and 8]{Wal00} (Chapter 8 is by D.~Roy): the Hilbert function $h_I(T)$ of a filtration (DALAG's $H(I;T)$), the chain bound \cite[Theorems 8.4 and 8.8]{Wal00} at finite level (Proposition~\ref{prop:boxHilb_le_of_height}), the model of $\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ inside $K[X,Y,Z]$, and the Hilbert side of the proof of \cite[Theorem 8.1]{Wal00} for $G^-=\{e\}$ on the boxes of \texttt{hME} (Theorem~\ref{thm:torus_hilbert_side}). The names \texttt{boxHilb}, \texttt{blockBox}, \texttt{torusBox}, \texttt{torusIdeal}, \texttt{torusList}, \texttt{torusReduced}, \texttt{boxD}, \texttt{torusCoeffPoly}, \texttt{torusPoint} and \texttt{UnmixedHeight} in the statements are those of the library file \texttt{Diaz/HilbertBox.lean} (on Prove2Me, the published definition \texttt{DiazHilbertBox}). The chain bound and the Hilbert side take one explicit hypothesis, \texttt{hU : UnmixedHeight}: Macaulay's unmixedness, in the form that for every weakly regular sequence $r_1,\dots,r_k$ of the ring, every associated prime of the quotient by $(r_1,\dots,r_k)$ has height at most $k$ \cite[\S8.2.1]{Wal00}. The last section proves it for polynomial rings over an algebraically closed field (Theorem~\ref{thm:unmixedHeight_mvPolynomial}), so over $\C$ the Hilbert side holds without \texttt{hU}: the library theorem \texttt{Diaz.torus\_hilbert\_side\_complex} passes the one to the other. The multiplicity side of \texttt{hME} and its assembly are the last five sections. These results are routine finite-level forms of the book's.

The section on Macaulay's unmixedness proves the inequality half of Macaulay's unmixedness theorem \cite{Mac16} for $K[X_\sigma]$, $K$ algebraically closed and $\sigma$ finite, in the form \texttt{UnmixedHeight} (Theorem~\ref{thm:unmixedHeight_mvPolynomial}); the reverse inequality is not stated. The route is local and goes through regular sequences only: a weakly regular sequence in the maximal ideal of a Noetherian local ring is no longer than the dimension of $A/\mathfrak{p}$ for any associated prime $\mathfrak{p}$ \cite[Th.~17.2]{Mat86}; Rees' characterisation of regular sequences through Ext, already in Mathlib, shortens a long regular sequence by at most the length of a weakly regular one; together they give unmixedness for a local ring with a regular sequence as long as its dimension \cite[Th.~2.1.6]{BH93}; and at a maximal ideal of $K[X_\sigma]$, which by the Nullstellensatz is the ideal of a point $a$, the $X_i - a_i$ are such a sequence. These are classical results, formalised routinely.

The five sections on the multiplicity estimate prove \texttt{hME}: the multiplicity estimate \cite[Theorem 8.1]{Wal00} in the case $G^-=\{e\}$, $G^+=G$, for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ over $\C$, written in coordinates (Theorem~\ref{thm:multiplicityEstimateElem}). For $G^-=\{e\}$ and finite $\Sigma$ the book notes that Theorem 8.1 is a special case of \cite[Theorem 2.1]{Phi86}. The proof is that of \cite[\S8.4]{Wal00} (Chapter 8 is by D.~Roy), at finite level and through elementary arguments: zero sets and heights on the torus, characters and subgroups, the invariant derivations of $G$, the tangent duals of Lemmas 8.14 and 8.15 with W\"ustholz's argument (8.20) and Lemma 8.16, and the descent of \S8.4.1 to an obstruction subgroup, whose Hilbert function is bounded below and compared with the Hilbert side above. The names \texttt{TorusGroup}, \texttt{torusPt}, \texttt{torusDeriv}, \texttt{torusDerivList}, \texttt{torusTransl}, \texttt{torusVanishing}, \texttt{torusZero}, \texttt{torusStab}, \texttt{torusMono}, \texttt{linForm}, \texttt{standardSet}, \texttt{sectionIdeal}, \texttt{vanishOrd}, \texttt{hmePoint} and \texttt{obstructionSpan} in the statements are those of the library file \texttt{Diaz/Multiplicity.lean} (on Prove2Me, the published definition \texttt{DiazMultiplicity}). The last theorem applies Theorem~\ref{thm:strong_six_exponentials} to it: Roy's strong six exponentials theorem with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}). In the library the results that took Roy's theorem as a hypothesis have corollaries without it, in \texttt{Diaz/RoyUnconditional.lean}. The theorems are classical, and this is a routine formalisation of their known proofs.

Chapter~\ref{chap:09-baker} derives Waldschmidt's five exponentials theorem from Roy's theorem and Baker's theorem (Theorem~\ref{thm:five_exponentials}).

The six sections that follow the one on Roy's Corollary~1 formalise Roy's Theorem 5 and printed applications of Roy's Corollary 1 (Theorem~\ref{thm:roy_rank_bound}), of his Theorem~4 and of his strong six exponentials theorem: results of Waldschmidt's \emph{Variations} \cite{Wal05a} and \emph{Further variations} \cite{Wal05b}, \cite[\S12.3]{Wal00}, Fischler's bound for the centraliser of a matrix of logarithms \cite[Th.~1.2]{Fis01}, Fischler's results on powers of linear forms and tensor powers whose coefficients lie in $\widetilde{\mathcal L}$ \cite[\S6]{Fis01}, and his Theorems~2.1, 2.3 and~5.3. Where a printed statement needed a correction, the node states the corrected form and its source says what was corrected; the file ERRATA.md at the root of the repository gives the details. Three consequences that also use Baker's theorem are in Chapter~\ref{chap:09-baker}, and a corrected corollary of \emph{Variations} that uses complex conjugation is in Chapter~\ref{chap:10-rank-one-configurations}. Fischler's bound also holds under the weaker hypothesis of the N.B. after his Prop.~5.5, that no hyperplane of $\mathrm{Mat}_n(\C)$ defined over $\Qbar$ contains both the matrix and the identity (Theorem~\ref{thm:fischler_centralizer_nb}). The fifth section applies Roy's strong six exponentials theorem with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}), each time to six products $x_iy_j$: it gives \cite[Cor.~1.3]{Wal05b} (Corollary~\ref{cor:fv_cor_1_3}), and Fischler's Lemma~6.1, Th.~1.1 (his Th.~6.2\,(1)), Th.~6.2\,(2), Th.~6.4, Cor.~6.3\,(1), the non-trivial inclusion of his Conjecture~1 for the $k$-th powers of linear forms, $k \geq 3$ (Corollary~\ref{cor:fischler_cor_6_3}), and Cor.~6.5\,(1), the same inclusion for the tensors $v \otimes \cdots \otimes v$ (Corollary~\ref{cor:fischler_cor_6_5}). Where Fischler applies \cite[Th.~2.3]{Fis01} to a larger matrix, or leaves implicit why a coefficient lies in $\widetilde{\mathcal L}$, the source lines say what is done here. The sixth section gives Fischler's Th.~2.3, the $d \times l$ form of \cite[Cor.~2]{Roy92}, which Roy prints for $2 \times 3$ matrices only (Theorem~\ref{thm:fischler_theorem_2_3}); his Th.~5.3, with a vector hyperplane where his Conjecture~2 asks for an affine one, from the bound behind his Th.~6.2 and Th.~6.4 and with no orbit theory (Theorem~\ref{thm:fischler_theorem_5_3}); and his Th.~2.1, Roy's Theorem~4 in Fischler's form (Theorem~\ref{thm:fischler_theorem_2_1}), where the strict inequality comes from Roy's Theorem~4 at every minimiser. These are routine formalisations of classical results.

The seventh section after the one on Roy's Corollary~1 states Fischler's Props.~3.1, 3.2 and Ths.~4.1, 4.2 \cite{Fis01} in pencil form, which is not printed: the representation of an algebraic group is replaced by $d \times d$ matrices $F_1, \dots, F_l$ with algebraic entries, the images of a basis of its Lie algebra, and the dimension of an orbit by the rank of the matrix $M_\alpha$ whose columns are the $F_a\alpha$ (Proposition~\ref{prop:fischler_prop_3_2_pencil}). The printed statements, on algebraic groups, are not formalised. That the pencil forms are the right reading of them rests on an argument, given in their source lines, and not on a formal proof: suitability gives the hypotheses (S1$'$)--(S3$'$), and a Zariski-dense orbit is the set where $\operatorname{rank} M_\alpha = d$. The pencil form of Th.~4.2 does not need a dense orbit, so it is a little more general (Theorem~\ref{thm:fischler_theorem_4_2_pencil}).

The three sections that follow these seven complete three of their results. Theorem~2.1 of \emph{Further variations} holds as printed, for every $\Qbar$-subspace $Y$ (Theorem~\ref{thm:fv_theorem_2_1_rank}): the printed proof treats finite-dimensional $Y$ (Theorem~\ref{thm:fv_theorem_2_1}), and a finite approximation (Proposition~\ref{prop:fv_finite_approx}) gives one finite-dimensional subspace of $Y$ that serves for every $\C$-subspace of $\C^{n}$ at once. Roy's Lemma \cite[p.~40]{Roy92} gives the largest value $\varphi(n, d)$ of the bound of Theorem~\ref{thm:roy_theorem_five} in closed form (Lemma~\ref{lem:roy_lemma_phi}); its integer part is DALAG's table $\Psi$ (Lemma~\ref{lem:dalag_psi_floor_roy_phi}), so \cite[Cor.~11.15]{Wal00} holds for $\Qbar$ and $\widetilde{\mathcal L}$ in its printed form (Corollary~\ref{cor:dalag_cor_11_15_psi}). The third of them has two lemmas for \cite[Cor.~12.23]{Wal00}, which uses Baker's theorem and is in Chapter~\ref{chap:09-baker} (Corollary~\ref{cor:dalag_cor_12_23}). These are routine formalisations of classical results; the printed proofs of \cite[Th.~2.1]{Wal05b} and of Roy's Lemma each needed one more step, which the source lines and ERRATA.md describe.

The seven sections that follow the one with two lemmas for \cite[Cor.~12.23]{Wal00} formalise, routinely, more classical results of \cite{Wal00} and \cite{Roy92}. \cite[Cor.~11.15]{Wal00} holds for $\Q$ and $\Q + \mathcal{L}$ in its printed form (Corollary~\ref{cor:dalag_cor_11_15_rat}) by Roy's route over $\Q$: his Theorem~4 holds over every subfield of $\Qbar$ \cite[Remark~(i), p.~37]{Roy92}, his Theorem~5 follows (Theorem~\ref{thm:roy_rat_theorem_five}), and his Lemma gives the table $\Psi$ as above, while DALAG's own proof of this case, through its Prop.~11.19, has a gap there and is not used (ERRATA.md, B9). Roy's Theorem~4 over $\Q$, in its minimal-ratio form (Theorem~\ref{thm:roy_rat_theorem_four}), gives \cite[Prop.~11.19]{Wal00} for $\Q$ and $\Q + \mathcal{L}$ as printed, finiteness included (Proposition~\ref{prop:dalag_prop_11_19_rat}); Roy's Remark~(i) leaves aside the form of his Theorem~1 over a subfield of $\Qbar$, which he quotes over $\Qbar$ only; a short argument supplies it, and the formal proofs do not need it (ERRATA.md, B10). \cite[Lemma~12.9]{Wal00}, that the structural rank can be computed through any injective map into affine forms, is Lemma~\ref{lem:dalag_lemma_12_9}, with the two steps that its printed proof leaves implicit (ERRATA.md, B7); the first of them, a dehomogenisation (Lemma~\ref{lem:dalag_lemma_12_9_dehomog}), gives \cite[Cor.~12.23]{Wal00} in the affine form of \cite[p.~435]{Wal00} in Chapter~\ref{chap:09-baker} (Corollary~\ref{cor:dalag_cor_12_23_affine}). The last four of them are on \cite[\S12.1]{Wal00}, linear algebra over two fields $k \subseteq K$. The first two of these give Prop.~12.7, that a subspace $V \subseteq K^{d}$ of dimension $n$ with $V \cap k^{d} = \{0\}$ meets $E^{d}$ in dimension at most $n(n + 1)/2$ over $k$ when $E$ has Property (A B; C 0) (Proposition~\ref{prop:dalag_prop_12_7}); Prop.~12.10, which DALAG credits to D.~Roy, that every polynomial in $X_1, \dots, X_n$ is the determinant of a square matrix with entries in $k + kX_1 + \dots + kX_n$ (Proposition~\ref{prop:dalag_prop_12_10}); and the implication (iv)$\Rightarrow$(iii) of Prop.~12.13 (Proposition~\ref{prop:dalag_prop_12_13_iv_iii}), through the dehomogenisation above. The printed proofs of Prop.~12.7 and of that implication need small corrections (ERRATA.md, C10 and B8). The last two complete \S12.1. Prop.~12.13 holds for every $k$-subspace $E \subseteq K$ containing $1$, finite-dimensional or not, with (iv) in presentation form (Proposition~\ref{prop:dalag_prop_12_13}): its four conditions are proved equivalent along a cycle in which (ii)$\Rightarrow$(iv), through Lemma~12.9, replaces the printed (i)$\Rightarrow$(iv), and Cor.~12.14 follows (Corollary~\ref{cor:dalag_cor_12_14}). Prop.~12.2, which DALAG credits to D.~Roy, that every matrix with entries in the $k$-span of algebraically independent elements is $k$-equivalent to a block matrix $\begin{pmatrix} A & B \\ C & 0 \end{pmatrix}$ with $A$ regular, holds for every field $k$ (Proposition~\ref{prop:dalag_prop_12_2}); its first printed proof works for every subspace with condition (ii) of Prop.~12.13 (Proposition~\ref{prop:dalag_prop_12_2_ii}). The same proof gives the Remark of p.~424, that $k + E_0$ has Property (A B; C 0) when $E_0$ is spanned by algebraically independent elements, without the hypothesis $E_0 \cap k = \{0\}$ (Proposition~\ref{prop:dalag_remark_12_1_3}): the printed reason, through $K(X)$, has a gap (ERRATA.md, B11), and the proof here runs the first proof of Prop.~12.2 on $k + E_0$ directly. Prop.~12.6 holds without its hypothesis $n < d$, which its proof does not use (Proposition~\ref{prop:dalag_prop_12_6}), and the conclusion of \S12.1.6, that rank equal to structural rank gives Property (A B; C 0), is Proposition~\ref{prop:dalag_conclusion_12_1_6}. ERRATA.md also records three slips in these pages (C14--C16).
'''

[[node]]
platform = "SX.exists_aux_expSum"
title = "The auxiliary function"
statement = '''
Let $d+l<dl$, and let $K$ be a number field containing every $e^{x_iy_j}$. There is $c>0$ such that for every large $M$ there are an integer $L\ge1$ with $L^{d}\le cM^{l}$ and integers $p_\lambda$ with $|p_\lambda|\le e^{cLM}$, not all zero for $\lambda\in\{0,\dots,L-1\}^{d}$, such that $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with $m_j<M$ for all $j$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
At the lattice points the exponentials are products of powers of the $e^{x_iy_j}$, so the conditions form a linear system over $K$: $M^{l}$ conditions on $L^{d}$ unknowns, and $d+l<dl$ leaves room for Siegel's lemma (Lemma~\ref{lem:siegel_entrywise}), with the denominators and houses of Lemma~\ref{lem:exists_denom_house_monomial_le}.
'''

[[node]]
platform = "SX.descent_step"
title = "The descent step"
statement = '''
Let $d+l<dl$, let $K$ be a number field containing every $e^{x_iy_j}$, and let $c>0$. There is $M_0$ such that for all $M\ge M_0$, all $L\ge1$ with $L^{d}\le cM^{l}$, all integers $p_\lambda$ with $|p_\lambda|\le e^{cLM}$ and all $N\ge M$: if $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with all $m_j<N$, then $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with all $m_j<N+1$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
At a new lattice point $F_p$ is small, by Lemma~\ref{lem:expPoly_grid_estimate} applied to the zeros already known. Its value there is an element of $K$ with controlled denominator and house (Lemma~\ref{lem:exists_denom_house_monomial_le}), so if it were non-zero Lemma~\ref{lem:liouville_house} would bound it from below. The two bounds are incompatible because $dl>d+l$.
'''

[[node]]
platform = "SX.eq_zero_of_expSum_vanishes"
title = "Vanishing on the whole lattice"
statement = '''
Let $l\ge2$, $L\in\N$ and $p_\lambda$ integers. If $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$, then $p_\lambda=0$ for every $\lambda\in\{0,\dots,L-1\}^{d}$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
The exponents $\langle\lambda,x\rangle$ are pairwise distinct, and as $l\ge2$ and the $y_j$ are independent, $\lambda\mapsto(e^{\langle\lambda,x\rangle y_j})_j$ is injective; Dedekind's independence of characters concludes.
'''

[[node]]
platform = "SX.six_exponentials_of_numberField"
env = "theorem"
title = "Six exponentials over a number field"
statement = '''
Let $d,l\in\N$ with $d+l<dl$, let $x_1,\dots,x_d$ and $y_1,\dots,y_l$ be complex numbers, each family linearly independent over $\Q$, and let $K$ be a number field. Then some $e^{x_iy_j}$ does not lie in $K$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[Theorem 1.12]{Wal00}.'''
sketch = '''
Otherwise Lemma~\ref{lem:exists_aux_expSum} gives an auxiliary function, Lemma~\ref{lem:descent_step} makes it vanish on the whole lattice by induction, and Lemma~\ref{lem:eq_zero_of_expSum_vanishes} makes all its coefficients zero ($d+l<dl$ forces $l\ge2$), a contradiction.
'''

[[node]]
platform = "DiazModulus.six_exponentials"
root = true
env = "theorem"
title = "The six exponentials theorem"
statement = '''
Let $x_1,x_2$ be complex numbers linearly independent over $\Q$, and let $y_1,y_2,y_3$ be complex numbers linearly independent over $\Q$. Then at least one of the six numbers $e^{x_iy_j}$ ($i=1,2$, $j=1,2,3$) is transcendental.
'''
source = '''Lang \cite[Ch.~II]{Lang66}, Ramachandra \cite{Ram68}; see \cite[\S1.3, Theorem 1.12]{Wal00}.'''
sketch = '''
Finitely many algebraic numbers lie in one number field; apply Theorem~\ref{thm:six_exponentials_of_numberField} with $(d,l)=(2,3)$.
'''

[[node]]
platform = "Schanuel.six_exponentials"
root = true
same_as = "DiazModulus.six_exponentials"

# --- Roy's strong six exponentials theorem from a multiplicity estimate (C1.4, 29 October 2026) --------

# --- the interpolation determinant ----------------------------------------
[[node]]
platform = "DiazModulus.thetaN_ge_mul_sub"
section = "Roy's theorem from a multiplicity estimate: the interpolation determinant"
env = "lemma"
title = 'A lower bound for $\Theta_n(L)$'
statement = '''
Let $n \geq 1$ and $L, A \in \N$. Then $A\,(L - A^n) \leq \Theta_n(L)$, where $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map), and $L - A^n$ is truncated at $0$.
'''
source = '''The function $\Theta_n(L)$ is that of \cite[\S6.2.2]{Wal00}; compare Lemma 6.5 (\S6.2.3) there. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
For $n \geq 1$ the map $l \mapsto (l, \dots, l)$ is injective, so it suffices to bound every admissible sum from below. Fix an injective $\kappa'$. At most $A^n$ indices $l$ have $\kappa'(l)$ in the box $\{0, \dots, A - 1\}^n$, as $\kappa'$ maps them injectively into it; every other $l$ has a coordinate $\geq A$, hence degree $\geq A$. So the total degree is at least $A$ times the number of indices outside the box, which is at least $L - A^n$.
'''

[[node]]
platform = "DiazModulus.iteratedDeriv_det_eq_sum"
env = "lemma"
title = 'The Leibniz rule for a determinant'
statement = '''
Let $g_{l\mu}$ ($l, \mu \in \{1, \dots, L\}$) be entire functions, $j \in \N$ and $z \in \C$. Then the $j$-th derivative of $x \mapsto \det(g_{l\mu}(x))$ at $z$ is $\sum_q \frac{j!}{\prod_\mu q_\mu!} \det(g_{l\mu}^{(q_\mu)}(z))$, the sum over the $q \in \N^L$ with $\sum_\mu q_\mu = j$: column $\mu$ is differentiated $q_\mu$ times.
'''
source = '''Classical (the Leibniz rule for products). Used for \cite[Lemma 9.2.]{Wal00}'''
sketch = '''
Expand the determinant over permutations. By linearity it suffices to differentiate a product $\prod_\mu h_\mu$ of entire functions; the general Leibniz rule $(\prod_\mu h_\mu)^{(j)} = \sum_{\sum q = j} \binom{j}{q} \prod_\mu h_\mu^{(q_\mu)}$ is proved by induction on $L$, splitting off the factor $\mu = 0$, applying the binomial Leibniz rule and the induction hypothesis, and reindexing the double sum through $q \mapsto (q_0, (q_1, \dots))$, with $\binom{j}{(i, q')} = \binom{i + |q'|}{i}\binom{|q'|}{q'}$. Exchanging the sums over permutations and over $q$ gives the statement.
'''

[[node]]
platform = "DiazModulus.iteratedDeriv_iteratedFDeriv_line"
env = "lemma"
title = 'Derivatives along a line'
statement = '''
Let $f$ be an entire function on $\C^n$, $\zeta \in \C^n$, $\sigma, q \in \N$ and $v_1, \dots, v_\sigma \in \C^n$. Then the $q$-th derivative at $z = 0$ of $z \mapsto D^\sigma f(z\zeta)(v_1, \dots, v_\sigma)$ is $D^{\sigma + q} f(0)(v_1, \dots, v_\sigma, \zeta, \dots, \zeta)$, with $q$ copies of $\zeta$.
'''
source = '''Classical (chain rule and symmetry of derivatives). Used for \cite[Lemma 9.2.]{Wal00}'''
sketch = '''
The identity holds at every $z$. For one derivative, the chain rule for $z \mapsto z\zeta$, whose derivative is $\zeta$, gives $D^{N+1} f(z\zeta)(\zeta, w)$, since evaluation at a fixed tuple is a continuous linear map. Induction on $q$ puts each further $\zeta$ in front of the arguments, while the statement has it at the end; the two agree by the symmetry of iterated derivatives of a smooth function.
'''

[[node]]
platform = "DiazModulus.interpolation_det_order"
env = "lemma"
title = 'The order of an interpolation determinant at the origin'
statement = '''
Let $f_1, \dots, f_L$ be entire functions on $\C^n$, and for $\mu = 1, \dots, L$ let $\zeta_\mu \in \C^n$, $\sigma_\mu \in \N$ and $v_\mu \in (\C^n)^{\sigma_\mu}$. Then $\Delta(z) = \det(D^{\sigma_\mu} f_l(z\zeta_\mu)(v_\mu))_{l,\mu}$ vanishes at $z = 0$ to order at least $\Theta_n(L) - \sum_\mu \sigma_\mu$; precisely, $\Theta_n(L) \leq \mathrm{ord}_0 \Delta + \sum_\mu \sigma_\mu$ in $\N \cup \{\infty\}$. Here $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map).
'''
source = '''\cite[Lemma 9.2.]{Wal00}'''
sketch = '''
$\Delta$ is entire, so it suffices that $\Delta^{(j)}(0) = 0$ when $j + \sum_\mu \sigma_\mu < \Theta_n(L)$. By the Leibniz rule for determinants (Lemma~\ref{lem:iteratedDeriv_det_eq_sum}) $\Delta^{(j)}(0)$ is a combination of determinants whose column $\mu$ is differentiated $q_\mu$ times, $\sum q_\mu = j$, and by Lemma~\ref{lem:iteratedDeriv_iteratedFDeriv_line} each entry is $D^{m_\mu} f_l(0)$ at a tuple of vectors, with $m_\mu = \sigma_\mu + q_\mu$ and $\sum m_\mu < \Theta_n(L)$. Expanding the vectors in the standard basis and using multilinearity, the determinant is a sum of determinants indexed by choices of basis vectors; for each choice let $\kappa'(\mu)$ count how often each basis vector occurs in column $\mu$, a multi-index of degree $m_\mu$. If $\kappa'$ is injective then $\Theta_n(L) \leq \sum m_\mu$, which is excluded; otherwise two columns are equal, by the symmetry of iterated derivatives, and the determinant vanishes.
'''

[[node]]
platform = "DiazModulus.schwarz_order_at_zero"
env = "lemma"
title = 'A Schwarz lemma at one zero'
statement = '''
Let $F$ be an entire function with a zero of order at least $T$ at $0$, let $R \geq 1$, and suppose $|F(z)| \leq B$ whenever $|z| = R$. Then $|F(1)| \leq R^{-T} B$.
'''
source = '''Schwarz's lemma: \cite[Lemma 2.4.]{Wal00}'''
sketch = '''
Write $F(z) = z^T g(z)$ near $0$ with $g$ analytic there. Then $G(z) = F(z)/z^T$, extended by $g(0)$ at $0$, is entire, and $|G(z)| \leq B/R^T$ on $|z| = R$. The maximum modulus principle on the disc $|z| \leq R$ gives $|G(1)| \leq B/R^T$, as $R \geq 1$, and $G(1) = F(1)$.
'''

[[node]]
platform = "DiazModulus.iteratedFDeriv_expMono_eq_op"
env = "lemma"
title = 'Derivatives of exponential monomials'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). Let $\tau \in \N^{\iota_0}$, $t \in \Z^{\iota_1}$, $p$ a point, and $f(z) = z'^\tau e^{\langle t, z'' \rangle}$, where $z'^\tau = \prod_h z_h'^{\tau_h}$ and $\langle t, z'' \rangle = \sum_i t_i z''_i$. Then for $k_1, \dots, k_r \in \kappa_0$, $D^r f(p)(w_{k_1}, \dots, w_{k_r}) = (\mathrm{Op}^t_{w,k} X^\tau)(p')\, e^{\langle t, p'' \rangle}$.
'''
source = '''Classical; the invariant derivations $D_w$ of \cite[\S8.1]{Wal00} and \S8.3.2 (Lemma 8.11), as used in Step 3 of the proof of Th. 11.21 (\S11.7.1).'''
sketch = '''
For a polynomial $Q$ put $G_Q(z) = Q(z') e^{\langle t, z'' \rangle}$. The product rule and the derivative of polynomial evaluation (by induction on $Q$) give $DG_Q(z)\,v = G_{\mathrm{Op}^t_v Q}(z)$. Then induct on $r$ for all $Q$ at once: the $(r+1)$-st derivative is the $r$-th derivative of $DG_Q$ evaluated at the last direction, and evaluation at a fixed vector commutes with iterated derivatives, which gives the $r$-th derivative of $G_{\mathrm{Op}^t_{w_{k_{r+1}}} Q}$. Take $Q = X^\tau$.
'''

[[node]]
platform = "DiazModulus.op_monomial_eval_norm_le"
env = "lemma"
title = 'A size bound for the derivation operators'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). Here the weights $t \in \C^{\iota_1}$ may be complex. Suppose every coordinate of every $w_k$ has absolute value at most $H$, with $H \geq 0$; every coordinate of $p \in \C^{\iota_0}$ has absolute value at most $P$, with $P \geq 1$; and $\sum_i |t_i| \leq t_b$. Then for $r \in \N$, $k_1, \dots, k_r \in \kappa_0$ and $\tau \in \N^{\iota_0}$, $|(\mathrm{Op}^t_{w,k} X^\tau)(p)| \leq (H(|\tau| + t_b + 1))^r P^{|\tau|}$, where $|\tau| = \sum_h \tau_h$.
'''
source = '''An elementary estimate for Step 4 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
By induction on $r$, for all exponents at once, peeling off the last operator. One operator sends $X^s$ to $\sum_h w'_h s_h X^{s - e_h} + c X^s$ with $|c| = |\sum_i w''_i t_i| \leq H t_b$. The remaining operators are linear, so the induction hypothesis bounds each term; $s - e_h$ lies below $s$, and $P \geq 1$, $H \geq 0$ make the bound increase with $|s|$. Summing gives $H(|s| + t_b)B \leq H(|s| + t_b + 1)B$. The base case is $|p^s| \leq P^{|s|}$.
'''

[[node]]
platform = "DiazModulus.op_entry_denom_house"
env = "lemma"
title = 'Denominators and houses of the interpolation entries'
statement = '''
Let $K$ be a number field, $\iota_0, \iota_1, \kappa_0, \kappa_1$ finite, $w_k \in K^{\iota_0} \times K^{\iota_1}$ ($k \in \kappa_0$), $u_j \in K^{\iota_0}$ and $a_{ji} \in K$ ($j \in \kappa_1$, $i \in \iota_1$), and define $\mathrm{Op}^t_{w,k}$ as for complex points. There are a non-zero algebraic integer $b \in K$ and $H \geq 1$ such that for all $r$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$, $\tau \in \N^{\iota_0}$ and $t \in \Z^{\iota_1}$, with $E = r + |\tau| + (\sum_i |t_i|)(\sum_j |s_j|)$ and $e = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$, the number $b^E e$ is an algebraic integer whose house (the largest absolute value of a conjugate) is at most $H^E (|\tau| + \sum_i |t_i| + 1)^r (\sum_j |s_j| + 1)^{|\tau|}$.
'''
source = '''Bookkeeping for Liouville's inequality in Step 5 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Liouville's inequality: \cite[\S3.5]{Wal00} (cf. Exercise 3.8, Prop. 13.8, cited in Step 5). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The data (the coordinates of the $w_k$ and $u_j$, the $a_{ji}$ and their inverses) form one finite family, and Lemma~\ref{lem:exists_denom_house_monomial_le} gives a common denominator $b$ and a bound $H_0$ for their houses. Say $x$ has property $Q(n, B)$ if $b^n x$ is integral of house at most $H_0^n B$; it is stable under sums, products (adding the $n$), integer multiples and raising $n$. By induction on the operators, every coefficient of $\mathrm{Op}^t_{w,k} X^\tau$ has $Q(r, ((|\iota_0| + 1)(|\tau| + |t| + 1))^r)$, with support below $\tau$; evaluation at $\sum_j s_j u_j$ costs $(|s| + 1)$ per degree, over at most $2^{|\tau|}$ monomials; and the product of the $a_{ji}^{s_j t_i}$ has $Q(|t||s|, 1)$. The constants are absorbed into $H = 2H_0(|\iota_0| + 1)$.
'''

[[node]]
platform = "DiazModulus.interp_det_upper"
env = "proposition"
title = 'The interpolation determinant: the analytic upper bound'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n$ containing every $w_k$ ($k \in \kappa_0$) and every $\eta_j$ ($j \in \kappa_1$). Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$, and for every choice of $L$ row data $(r_\lambda, k_\lambda, s_\lambda)$, one for each column $\lambda$, with $r_\lambda \leq N_0$ and $|s_{\lambda,j}| \leq N_1$, the determinant $\Delta$ of the $L \times L$ matrix $(E_{(r_\lambda, k_\lambda, s_\lambda), \lambda'})_{\lambda, \lambda'}$ satisfies $|\Delta| \leq \exp(-(\Theta_n(L) - L N_0) + C L \Xi)$, with $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$ and $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map).
'''
source = '''Step 4 (upper bound) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1); compare Lemma 9.2; Schwarz's lemma is Lemma 2.4.'''
sketch = '''
Fix a basis of $V$ and let $\psi : \C^n \to V$ be the coordinate map. Each column gives the entire function $f_\lambda \circ \psi$, $f_\lambda(z) = z'^\tau e^{\langle t, z'' \rangle}$, and each row the point $\psi^{-1}(\sum_j s_j \eta_j)$ and the directions $\psi^{-1}(w_k)$. By Lemma~\ref{lem:iteratedFDeriv_expMono_eq_op} the entries of $F(z) = \det(D^{r}(f \circ \psi)(z\zeta)(v))$ are the polynomial parts at $zp'$ times $e^{z\langle t, p'' \rangle}$, so $F(1) = \Delta$ up to transposition. Lemma~\ref{lem:interpolation_det_order} (DALAG Lemma 9.2) gives $\mathrm{ord}_0 F \geq \Theta_n(L) - L N_0$, and Lemma~\ref{lem:schwarz_order_at_zero} (Schwarz) with $R = e$ gives $|\Delta| \leq e^{-\mathrm{ord}} \sup_{|z| = e} |F|$. On $|z| = e$ each entry is at most $e^\beta$, by Lemma~\ref{lem:op_monomial_eval_norm_le} for the polynomial part and $|e^u| \leq e^{|u|}$, so $|F| \leq L!\, e^{L\beta}$; finally $\log L + \beta \leq K\Xi$ is elementary.
'''

[[node]]
platform = "DiazModulus.interp_det_liouville"
env = "proposition"
title = "The interpolation determinant: Liouville's lower bound"
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$, and for every choice of $L$ row data $(r_\lambda, k_\lambda, s_\lambda)$, one for each column $\lambda$, with $r_\lambda \leq N_0$ and $|s_{\lambda,j}| \leq N_1$, the determinant $\Delta$ of the $L \times L$ matrix $(E_{(r_\lambda, k_\lambda, s_\lambda), \lambda'})_{\lambda, \lambda'}$ satisfies $\log |\Delta| \geq -C L \Xi$ whenever $\Delta \neq 0$, with $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$.
'''
source = '''Step 5 (Liouville's inequality) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Liouville's inequality: \cite[\S3.5]{Wal00} (cf. Exercise 3.8, Prop. 13.8, cited in Step 5).'''
sketch = '''
All data are algebraic, so they lie in a number field $F \subseteq \C$, and $\Delta$ is the image of the determinant of the same matrix over $F$. Lemma~\ref{lem:op_entry_denom_house} gives $b$ and $H$; with a uniform exponent $E^* = N_0 + |\iota_0| T_0 + |\iota_1| T_1 |\kappa_1| N_1$ every entry of $b^{E^*} M_F$ is integral of bounded house, so $\alpha = \det(b^{E^*} M_F)$ is a non-zero algebraic integer of house at most $L!\, B^L$. Liouville's inequality (Lemma~\ref{lem:liouville_house}) gives $1 \leq H'^{E^* L} |\Delta| (L!\, B^L)^{[F:\Q] - 1}$; taking logarithms and using $\log L! \leq L \log L$ and elementary bounds gives $\log |\Delta| \geq -CL\Xi$.
'''

[[node]]
platform = "DiazModulus.exists_ne_zero_mulVec_eq_zero_of_minors"
env = "lemma"
title = 'A kernel vector from vanishing minors'
statement = '''
Let $M$ be a $\rho \times \gamma$ matrix over a field, with $\rho, \gamma$ finite. If every square minor $\det(M_{f(\mu), \mu'})_{\mu, \mu' \in \gamma}$, for $f : \gamma \to \rho$, is $0$, then $Mc = 0$ for some $c \neq 0$.
'''
source = '''Classical linear algebra.'''
sketch = '''
Otherwise $c \mapsto Mc$ is injective, so $M$ has rank $|\gamma|$ and its rows span a space of dimension $|\gamma|$. Some linearly independent family of rows has the same span, hence $|\gamma|$ members; indexing it by $\gamma$ gives $f$ whose square submatrix has independent rows, hence a non-zero determinant.
'''

[[node]]
platform = "DiazModulus.interp_kernel"
env = "proposition"
title = 'The interpolation matrix has a kernel vector'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n \geq 1$ containing every $w_k$ and every $\eta_j$, and suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$ with $C \Xi \leq L^{1/n}$, where $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$, some non-zero vector $c$ on the columns satisfies $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq N_0$, every $k_1, \dots, k_r$ and every $s$ with $|s_j| \leq N_1$. This is the premise of the multiplicity estimate.
'''
source = '''Steps 3–5 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
Index the rows by the finite set of row data with $r \leq N_0$ and $|s_j| \leq N_1$. If some maximal minor $\Delta$ were non-zero, Proposition~\ref{prop:interp_det_liouville} would give $\log |\Delta| \geq -C_{10} L \Xi$ and Proposition~\ref{prop:interp_det_upper} $|\Delta| \leq \exp(-(\Theta_n(L) - LN_0) + C_9 L \Xi)$, so $\Theta_n(L) \leq LN_0 + (C_9 + C_{10}) L \Xi$. With $A = \lfloor L^{1/n}/2 \rfloor$, $2A^n \leq L$, and Lemma~\ref{lem:thetaN_ge_mul_sub} gives $AL \leq 2\Theta_n(L)$; as $1 \leq \Xi$ and $N_0 \leq \Xi$, the hypothesis with $C = 8 + 4(C_9 + C_{10})$ excludes this. So every maximal minor vanishes, and Lemma~\ref{lem:exists_ne_zero_mulVec_eq_zero_of_minors} gives the kernel vector.
'''

# --- the linear subgroup theorem ----------------------------------------
[[node]]
platform = "DiazModulus.exists_coord_complement"
section = "Roy's theorem from a multiplicity estimate: the linear subgroup theorem"
env = "lemma"
title = 'A coordinate complement of the span of integer vectors'
statement = '''
Let $N$ be a finite set and $A \subseteq \Z^N$, and let $S \subseteq \Q^N$ be the $\Q$-span of $A$. There is $J \subseteq N$ with $|J| + \dim_{\Q} S = |N|$ such that the only vector of $S$ vanishing outside $J$ is $0$.
'''
source = '''Classical linear algebra.'''
sketch = '''
The images of the standard basis vectors span $\Q^N / S$; some injectively indexed subfamily $e_j$, $j \in J$, maps to a basis, so $|J| = |N| - \dim S$. If $v \in S$ vanishes outside $J$, then $v = \sum_{j \in J} v_j e_j$ maps to $0$, so every $v_j$ is $0$ by independence.
'''

[[node]]
platform = "DiazModulus.obstruction_1123"
env = "proposition"
title = 'The obstruction given by the multiplicity estimate'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Let $w_k$ ($k \in \kappa_0$), $u_j \in \C^{\iota_0}$ and non-zero $a_{ji}$ ($j \in \kappa_1$) be given, $T_0, T_1 \geq 1$, $S_0, S_1 \in \N$, $d = |\iota_0| + |\iota_1|$, and $c \neq 0$ a vector on the columns with $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dS_0$, every $k$ and every $s$ with $|s_j| \leq dS_1$. Assume \texttt{hME}. Then there are $V \subseteq \C^{\iota_0}$, $\varphi_1, \dots, \varphi_q \in \Z^{\iota_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$ ($W$ the span of the $w_k$) and $\dim V + \dim L_1 < d$, such that $(S_0 + 1)^\ell (2S_1 + 1)^{\lambda'} T_0^{\dim V} T_1^{\dim L_1} \leq \ell!\, K_d\, T_0^{|\iota_0|} T_1^{|\iota_1|}$, where $\lambda' = |\kappa_1| - \rho$, the relation rank $\rho$ is the dimension of the $\Q$-span of the set of $s \in \Z^{\kappa_1}$ congruent to $0$ modulo $(V, \varphi)$, two vectors $s, s' \in \Z^{\kappa_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$, and $K_d$ is as in \texttt{hME} with $A_0 = \iota_0$, $A_1 = \iota_1$.
'''
source = '''Step 6 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1), with the multiplicity estimate (\cite[Th.~8.1]{Wal00}; \cite{Phi86}) carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}.'''
sketch = '''
Apply \texttt{hME} to $c$ at $(D_0, D_1, M_0, M_1) = (T_0, T_1, S_0, S_1)$; its premise is the hypothesis on $c$. It gives $(V, \varphi, L_1, \ell)$ and a bound for every set $R$ of pairwise incongruent vectors in the box $|s_j| \leq S_1$. By Lemma~\ref{lem:exists_coord_complement} the $\Q$-span of the vectors congruent to $0$ has a coordinate complement $J$ with $|J| = |\kappa_1| - \rho$. Take for $R$ the box on $J$ (zero off $J$): it has $(2S_1 + 1)^{|J|}$ points, and two of its points that are congruent differ by a vector of that span supported on $J$, hence are equal. Finally $(S_0 + 1)^\ell \leq \ell! \binom{S_0 + \ell}{\ell}$, and multiplying the bound by $\ell!$ concludes.
'''

[[node]]
platform = "DiazModulus.params_1122_eventually"
env = "lemma"
title = 'The parameters satisfy the constraint for large $S_1$'
statement = '''
Let $d_0, d_1, n \in \N$ with $1 \leq n < d = d_0 + d_1$ and $d_0 \leq n$, let $C > 0$ and $\nu > (d_0 + n)/(d - n)$. For $S_1 \in \N$ put $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0 / \log S_1 \rfloor$ and $T_1 = \lfloor S_0 / S_1 \rfloor$. Then for all large $S_1$: $T_0 \geq 2$, $T_1 \geq 2$, and $C(S_0 \log(T_0 + T_1 + 2) + T_0 \log(S_1 + 2) + T_1(S_1 + 1)) \leq ((T_0 + 1)^{d_0} (2T_1 + 1)^{d_1})^{1/n}$.
'''
source = '''Step 7 (choice of parameters, condition (11.22)) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
Write $x = S_1$, $\Lambda = \log x$, $e = d_1/(d - n) \geq 1$ and $F = x^e \Lambda^\nu$. As $\nu > 0$ and $e \geq 1$, $F/x \geq \Lambda^\nu \to \infty$, so the floors give $T_0 \geq F/(2\Lambda)$, $T_1 \geq F/(2x)$, both $\geq 2$, and $T_0 \leq F/\Lambda$, $T_1 \leq F/x$. The left side is at most $K F \Lambda$ with $K = C(6 + e + \nu)$, and the right side at least $((F/(2\Lambda))^{d_0} (F/x)^{d_1})^{1/n}$. Comparing logarithms, with $\log F = e\Lambda + \nu \log\Lambda$, the coefficient of $\Lambda$ is $(e(d - n) - d_1)/n = 0$ and that of $\log\Lambda$ is $((d - n)\nu - d_0 - n)/n > 0$, so the inequality holds once $\log\log x$ is large.
'''

[[node]]
platform = "DiazModulus.params_exponents"
env = "lemma"
title = 'The exponents of the obstruction'
statement = '''
Let $d_0, d_1, n \in \N$ with $n < d = d_0 + d_1$ and $d_0 \leq n$, let $\nu > 0$, $c_8 \in \R$, and $a, b, c_0, c_1 \in \N$ with $c_0 + c_1 \geq 1$ and $a \leq c_0 + c_1$. For $S_1 \in \N$ put $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0 / \log S_1 \rfloor$ and $T_1 = \lfloor S_0 / S_1 \rfloor$. Suppose that for infinitely many $S_1$, $\lfloor S_0/d \rfloor^a \lfloor S_1/d \rfloor^b \leq c_8 T_0^{c_0} T_1^{c_1}$ (an inequality of the shape (11.23)). Then $a < c_0 + c_1$ and $(b + c_1)(d - n) \leq d_1(c_0 + c_1 - a)$.
'''
source = '''Step 7 (from (11.23) to the conclusion) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
With $x = S_1$, $\Lambda = \log x$, $e = d_1/(d - n)$ and $F = x^e\Lambda^\nu$, for large $x$ the left side is at least $(F/(2d))^a (x/(2d))^b$ and the right side at most $\max(c_8, 1) (F/\Lambda)^{c_0} (F/x)^{c_1}$. The logarithm of their ratio is $-g\Lambda - h\log\Lambda - \mathrm{const}$ with $g = e(c_0 + c_1 - a) - c_1 - b$ and $h = \nu(c_0 + c_1 - a) - c_0$. If the conclusion fails, then $g < 0$, or $g = 0$ and $h = -c_0 < 0$ (when $a = c_0 + c_1$ and $b = c_1 = 0$). In both cases the left side exceeds the right side for all large $S_1$, against the hypothesis.
'''

[[node]]
platform = "DiazModulus.linear_subgroup_transcendence"
root = true
env = "theorem"
title = 'The linear subgroup theorem, from the multiplicity estimate'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Let $d_0 = |\iota_0|$, $d_1 = |\iota_1|$, $d = d_0 + d_1$, and let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n$ with $1 \leq n < d$ and $d_0 \leq n$. Let $w_k \in V$ ($k \in \kappa_0$) and $\eta_j \in V$ ($j \in \kappa_1$), and suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Assume \texttt{hME}. Then there are a subspace $V' \subseteq \C^{\iota_0}$, $\varphi_1, \dots, \varphi_q \in \Z^{\iota_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V' \times L_1)) = \dim W$, $W$ the span of the $w_k$, such that $\ell < d'$ and $(\lambda' + d'_1)(d - n) \leq d_1(d' - \ell)$. Here $d'_0 = d_0 - \dim V'$, $d'_1 = d_1 - \dim L_1$, $d' = d'_0 + d'_1$, $\lambda' = |\kappa_1| - \rho$, and $\rho$ is the dimension of the $\Q$-span of the set of $s \in \Z^{\kappa_1}$ with $\sum_j s_j \eta'_j \in V'$ and $\prod_i (\prod_j e^{s_j \eta''_{j,i}})^{\varphi_{k,i}} = 1$ for every $k$.

This is DALAG Th. 11.21 in the case $d_0 \leq n$, with $W$ the span of algebraic vectors and the obstruction subgroup recorded as $(V', \varphi)$.
'''
source = '''\cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1), case $d_0\leq n$, Steps 2–7; the multiplicity estimate (\cite[Th.~8.1]{Wal00}; \cite{Phi86}) is carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}.'''
sketch = '''
Proposition~\ref{prop:interp_kernel} gives a constant $C$. Fix $\nu = (d_0 + n)/(d - n) + 1$ and the curve of Lemma~\ref{lem:params_1122_eventually}: $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0/\log S_1 \rfloor$, $T_1 = \lfloor S_0/S_1 \rfloor$. For all large $S_1$, Lemma~\ref{lem:params_1122_eventually} gives $T_0, T_1 \geq 2$ and the constraint of Proposition~\ref{prop:interp_kernel} at $(N_0, N_1) = (S_0, S_1)$, so Proposition~\ref{prop:interp_kernel} yields $c \neq 0$ whose vanishing covers the premise of Proposition~\ref{prop:obstruction_1123} at $(\lfloor S_0/d \rfloor, \lfloor S_1/d \rfloor)$. Proposition~\ref{prop:obstruction_1123} returns $(V', \varphi, L_1, \ell)$ with $(\lfloor S_0/d \rfloor + 1)^\ell (2\lfloor S_1/d \rfloor + 1)^{\lambda'} T_0^{\dim V'} T_1^{\dim L_1} \leq \ell!\, K_d\, T_0^{d_0} T_1^{d_1}$; cancelling gives (11.23) with exponents $(\ell, \lambda', d'_0, d'_1)$, and $\ell \leq d'$. These four numbers range over a finite set, so one tuple occurs for infinitely many $S_1$, and Lemma~\ref{lem:params_exponents} applied to it gives $\ell < d'$ and $(\lambda' + d'_1)(d - n) \leq d_1(d' - \ell)$.
'''

# --- Roy's argument ----------------------------------------
[[node]]
platform = "DiazModulus.exists_sse_lifts"
section = "Roy's theorem from a multiplicity estimate: Roy's argument"
env = "lemma"
title = 'Restriction of scalars'
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ is the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $x \in \C^2$ and $y \in \C^3$ with $x_i y_j \in \widetilde{\mathcal L}$ for all $i, j$. Then there are $m \geq 1$, $\omega_1, \dots, \omega_m \in \Qbar$ linearly independent over $\Q$, and $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \Qbar^2 \times \mathcal{L}^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$.
'''
source = '''\cite[\S11.6.2]{Wal00} (the map $\Upsilon$ and the basis $\omega$ of a number field), after \cite{Roy92}.'''
sketch = '''
Write each $x_i y_j$ as a finite sum $\sum_l f_l g_l$ with $f_l \in \Qbar$ and $g_l \in \{1\} \cup \mathcal{L}$. Let $K = \Q(\text{all } f_l)$, a number field, and $\omega$ a $\Q$-basis of $K$. For $c \in K$ and $g \in \{1\} \cup \mathcal{L}$, $cg$ has the shape $u + \sum_k \omega_k v_k$ with $u \in \Qbar$, $v_k \in \mathcal{L}$: take $u = c$ if $g = 1$, and otherwise $c = \sum_k r_k\omega_k$ with $r_k \in \Q$ and $v_k = r_k g \in \mathcal{L}$ (Lemma~\ref{lem:exp_ratMul_isAlgebraic}). As $\mathcal{L}$ contains $0$ and is closed under addition, the shape survives finite sums; applied to $\omega_a x_i y_j$ it gives $\eta_{a,j}$.
'''

[[node]]
platform = "DiazModulus.sse_independence_facts"
env = "lemma"
title = 'Two independence facts'
statement = '''
Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, and let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$ (the algebraic numbers). Then:

- if $s \in \Z^{m \times 3}$ and $\sum_{a,j} s_{a,j}\,\omega_a y_j = 0$, then $s = 0$;
- if $\beta \neq 0$, $v \in \Qbar^2$, $c \in \C$ and $c x_i = \beta v_i$ for $i = 1, 2$, then $c = 0$.
'''
source = '''Elementary. Part (1) is used where \cite[\S11.6.2]{Wal00}, appeals to Baker's theorem (Lemma 11.18 (4)). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
(1) Group the sum by $j$: the coefficient $\sum_a s_{a,j}\omega_a$ of $y_j$ is algebraic, so the $\Qbar$-independence of $y$ makes it $0$, and the $\Q$-independence of $\omega$ makes every $s_{a,j}$ zero. (2) If $c \neq 0$, multiplying $v_2 x_1 - v_1 x_2$ by $c$ gives $0$, so $v_2 x_1 - v_1 x_2 = 0$ and the $\Qbar$-independence of $x$ forces $v = 0$; then $cx_1 = 0$, so $x_1 = 0$, which an independent family excludes.
'''

[[node]]
platform = "DiazModulus.intMatrix_ker_facts"
env = "lemma"
title = 'Integer matrices with no rational kernel'
statement = '''
Let $\iota$ be finite and $\varphi_1, \dots, \varphi_q \in \Z^\iota$, and suppose the only $v \in \Q^\iota$ with $\langle \varphi_k, v \rangle = 0$ for all $k$ is $0$. Then the only such $v \in \C^\iota$ is $0$; and if $z \in \C^\iota$ has $\langle \varphi_k, z \rangle \in 2\pi i \Z$ for every $k$, then $z \in 2\pi i\,\Q^\iota$.
'''
source = '''Classical linear algebra.'''
sketch = '''
The map $v \mapsto (\langle \varphi_k, v \rangle)_k$ from $\Q^\iota$ to $\Q^q$ is injective, so it has a rational left inverse $B$, with $\sum_k B_{ik}\varphi_{k,j} = \delta_{ij}$; the identity persists over $\C$. So $w_i = \sum_k B_{ik} \langle \varphi_k, w \rangle$ for every complex $w$: this gives $w = 0$ when every $\langle \varphi_k, w \rangle$ is $0$, and $z_i = 2\pi i \sum_k B_{ik} e_k$ with $e_k \in \Z$ when $\langle \varphi_k, z \rangle = 2\pi i e_k$.
'''

[[node]]
platform = "DiazModulus.rank_le_of_injOn_lattice"
env = "lemma"
title = 'The rank of a lattice on which a linear map is injective'
statement = '''
Let $N$ be finite, $\Psi : \C^N \to \C^q$ a $\C$-linear map, and $A \subseteq \Z^N$ a subgroup with $\Psi(A) \subseteq 2\pi i\,\Z^q$ and $\Psi(s) \neq 0$ for every non-zero $s \in A$. Then the dimension of the $\Q$-span of $A$ is at most the dimension of the range of $\Psi$.
'''
source = '''Elementary. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Pick a $\Q$-basis of the span of $A$ inside $A$, elements $s_b$, with $\Psi(s_b) = 2\pi i e_b$, $e_b \in \Z^q$. It suffices that the $\Psi(s_b)$ are $\C$-independent. A complex relation among them is a complex kernel vector of the integer matrix $(e_b)$, and such a matrix has none once it has no rational one (the left-inverse argument of Lemma~\ref{lem:intMatrix_ker_facts}). A rational kernel vector $c$, cleared of denominators to $Dc_b \in \Z$, gives $s = \sum_b Dc_b s_b \in A$ with $\Psi(s) = 0$, so $s = 0$, and the independence of the basis gives $c = 0$.
'''

[[node]]
platform = "DiazModulus.sse_setup"
env = "lemma"
title = "Roy's map: the subspace and its kernel"
statement = '''
Let $m \in \N$, $\omega \in \C^m$ and $x \in \C^2$ with $x \neq 0$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Then $\Upsilon^{-1}(\mathbb{C}x)$ has dimension $2m + 1$, and $\ker\Upsilon$ is spanned by the vectors $b_{k,i} = (-\omega_k e_i, e_{k,i})$ ($k \leq m$, $i = 1, 2$), where $e_i$ and $e_{k,i}$ are standard basis vectors.
'''
source = '''\cite[\S11.6.2]{Wal00}, Lemma 11.18 (1)–(2), after \cite{Roy92}.'''
sketch = '''
$\Upsilon$ is surjective, as $\Upsilon(u, 0) = u$. Composed with the quotient map $\C^2 \to \C^2/\mathbb{C}x$, of dimension $1$ as $x \neq 0$, it is a surjection with kernel $\Upsilon^{-1}(\mathbb{C}x)$, and rank–nullity on a domain of dimension $2 + 2m$ gives $2m + 1$. Each $b_{k,i}$ lies in $\ker\Upsilon$, and every $z \in \ker\Upsilon$ equals $\sum_p z''_p b_p$, since $z'_i = -\sum_k \omega_k z''_{k,i}$ on the kernel.
'''

[[node]]
platform = "DiazModulus.sse_tangent_count"
env = "lemma"
title = 'The tangent count'
statement = '''
Let $m \in \N$ and $\omega \in \C^m$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $V' \subseteq \C^2$ and $L_1 \subseteq \C^{m \times 2}$ be subspaces, $T = \Upsilon(V' \times L_1)$, and $\ell \in \N$ with $\ell + \dim(\ker\Upsilon \cap (V' \times L_1)) = \dim\ker\Upsilon$. Then $\dim\ker\Upsilon = 2m$, $\ell + (2 - \dim T) = (2 - \dim V') + (2m - \dim L_1)$, and $\dim V' \leq \dim T$.
'''
source = '''A dimension count in the setting of \cite[\S11.6.2]{Wal00} (compare Lemma 11.18 (3)). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\Upsilon$ is surjective, so $\dim\ker\Upsilon = 2m$. Rank–nullity for $\Upsilon$ restricted to $P = V' \times L_1$ gives $\dim V' + \dim L_1 = \dim T + \dim(\ker\Upsilon \cap P)$, and the identity follows by integer arithmetic from the hypothesis and $\dim T, \dim V' \leq 2$, $\dim L_1 \leq 2m$. Finally $V' \subseteq T$, since $\Upsilon(u, 0) = u$ and $(u, 0) \in P$ for $u \in V'$.
'''

[[node]]
platform = "DiazModulus.sse_relRank_generic"
env = "lemma"
title = 'The relation rank when the tangent space meets the line only in zero'
statement = '''
Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$, and let $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \C^2 \times \C^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$. Let $V' \subseteq \C^2$ be a subspace, $\varphi_1, \dots, \varphi_q \in \Z^{m \times 2}$ with common complex kernel $L_1$, and $T = \Upsilon(V' \times L_1)$. Let $\rho$ be the dimension of the $\Q$-span of the set of $s \in \Z^{m \times 3}$ with $\sum_p s_p \eta'_p \in V'$ and $\prod_i (\prod_p e^{s_p \eta''_{p,i}})^{\varphi_{k,i}} = 1$ for every $k$. Suppose $T \cap \mathbb{C}x = \{0\}$. Then $\rho \leq 2m - \dim L_1$.
'''
source = '''The setting of \cite[\S11.6.2]{Wal00}, after \cite{Roy92}. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The multiplicative condition reads $e^{\Psi(s)_k} = 1$ for the $\C$-linear map $\Psi$ with $\Psi(z)_k = \sum_i \varphi_{k,i} \sum_p z_p \eta''_{p,i}$, so the relation set is a subgroup $A \subseteq \Z^{m \times 3}$ with $\Psi(A) \subseteq 2\pi i\,\Z^q$. $\Psi$ is injective on $A$: if $\Psi(s) = 0$ then $\zeta = \sum_p s_p \eta_p \in V' \times L_1$, and $\Upsilon(\zeta) = (\sum_{a,j} s_{a,j}\omega_a y_j)\,x$ lies in $T \cap \mathbb{C}x = \{0\}$; as $x \neq 0$ the coefficient vanishes, and $s = 0$ by Lemma~\ref{lem:sse_independence_facts}. Then Lemma~\ref{lem:rank_le_of_injOn_lattice} bounds $\rho$ by $\dim\mathrm{range}\,\Psi \leq \dim\mathrm{range}\,\Phi = 2m - \dim L_1$, where $\Phi(v)_k = \sum_i \varphi_{k,i} v_i$ has kernel $L_1$.
'''

[[node]]
platform = "DiazModulus.sse_relRank_rational"
env = "lemma"
title = 'The relation rank when the tangent space lies in the line'
statement = '''
Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$, and let $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \C^2 \times \C^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$. Suppose moreover $\eta'_{a,j} \in \Qbar^2$ for all $a, j$. Let $V' \subseteq \C^2$ be a subspace, $\varphi_1, \dots, \varphi_q \in \Z^{m \times 2}$ with common complex kernel $L_1$, and $T = \Upsilon(V' \times L_1)$. Let $\rho$ be the dimension of the $\Q$-span of the set of $s \in \Z^{m \times 3}$ with $\sum_p s_p \eta'_p \in V'$ and $\prod_i (\prod_p e^{s_p \eta''_{p,i}})^{\varphi_{k,i}} = 1$ for every $k$. Suppose $T \subseteq \mathbb{C}x$. Then $L_1 = \{0\}$ and $\rho = 0$.

$V'$ is any subspace; it need not be defined over $\Qbar$.
'''
source = '''The setting of \cite[\S11.6.2]{Wal00}, after \cite{Roy92}. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$L_1 = 0$: if $v \in \Q^{m \times 2}$ has $\langle \varphi_k, v \rangle = 0$ for all $k$, then $\Upsilon(0, v) \in T \subseteq \mathbb{C}x$ is algebraic, so it is $0$ by Lemma~\ref{lem:sse_independence_facts} (with $\beta = 1$), and $\sum_k \omega_k v_{k,i} = 0$ gives $v = 0$. So $\varphi$ has no rational kernel, hence no complex kernel (Lemma~\ref{lem:intMatrix_ker_facts}). Next, for $s$ in the relation set, $z = \sum_p s_p \eta''_p$ has $\langle \varphi_k, z \rangle \in 2\pi i\,\Z$, so $z = 2\pi i\,r$ with $r$ rational (Lemma~\ref{lem:intMatrix_ker_facts}). The vector $\sum_p s_p \eta'_p$ lies in $V' \subseteq T \subseteq \mathbb{C}x$ and is algebraic, so it is $0$. Then $(\sum_{a,j} s_{a,j}\omega_a y_j)\,x = \Upsilon(\sum_p s_p\eta_p) = 2\pi i\,(\sum_k \omega_k r_{k,i})_i$, an algebraic vector times $2\pi i \neq 0$, so the coefficient is $0$ and $s = 0$ (Lemma~\ref{lem:sse_independence_facts}). The relation set is $\{0\}$.
'''

[[node]]
platform = "DiazModulus.strong_six_exponentials"
root = true
env = "theorem"
title = "Roy's strong six exponentials theorem, from the multiplicity estimate"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ is the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$.

Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Assume \texttt{hME}. Let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$. Then $x_i y_j \notin \widetilde{\mathcal L}$ for some $i, j$.

This is Roy's strong six exponentials theorem, the case $d = 2$, $\ell = 3$ of DALAG Cor. 11.16 (\S11.6.1), conditional on \texttt{hME}. \texttt{hME} is carried as an explicit hypothesis here. It is the case $G^- = \{e\}$ of DALAG Th. 8.1 (Philippon's multiplicity estimate), and Theorem~\ref{thm:multiplicityEstimateElem} proves it, so Theorem~\ref{thm:strong_six_exponentials_unconditional} holds with no hypothesis.
'''
source = '''Roy's strong six exponentials theorem: \cite{Roy92}, Cor. 2; \cite[Cor.~11.16]{Wal00} (\S11.6.1; this node is its case $d=2$, $\ell=3$), through Th. 11.21 (\S11.7.1). The multiplicity estimate (\cite[Th.~8.1]{Wal00}, \S8.1; \cite{Phi86}) is carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}; Theorem~\ref{thm:multiplicityEstimateElem} proves it.'''
sketch = '''
Suppose $x_i y_j \in \widetilde{\mathcal L}$ for all $i, j$. Lemma~\ref{lem:exists_sse_lifts} gives $m \geq 1$, a $\Q$-free algebraic $\omega$ and lifts $\eta_{a,j} \in \Qbar^2 \times \mathcal{L}^{m \times 2}$ with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$, where $\Upsilon(u, v)_i = u_i + \sum_k \omega_k v_{k,i}$. Apply Theorem~\ref{thm:linear_subgroup_transcendence} (DALAG Th. 11.21) in $G = \mathbb{G}_a^2 \times \mathbb{G}_m^{2m}$ with $V = \Upsilon^{-1}(\mathbb{C}x)$, of dimension $2m + 1$ by Lemma~\ref{lem:sse_setup} (so $d - n = 1$), the algebraic spanning family $(-\omega_k e_i, e_{k,i})$ of $\ker\Upsilon$ (Lemma~\ref{lem:sse_setup}) and the lifts $\eta$. It returns $(V', \varphi, L_1, \ell)$ with $\ell < d'$ and $3m - \rho + d'_1 \leq 2m(d' - \ell)$. By Lemma~\ref{lem:sse_tangent_count}, $d' - \ell = \delta = 2 - \dim T$ for $T = \Upsilon(V' \times L_1)$, so $\delta \geq 1$. If $T \subseteq \mathbb{C}x$, Lemma~\ref{lem:sse_relRank_rational} gives $L_1 = 0$ and $\rho = 0$, so $5m \leq 2m\delta \leq 4m$. Otherwise $\dim T = 1$ and $T \cap \mathbb{C}x = 0$, and Lemma~\ref{lem:sse_relRank_generic} gives $\rho \leq 2m - \dim L_1$, so $3m \leq 2m$. Both contradict $m \geq 1$.
'''

# --- The Hilbert side of the multiplicity estimate (C1.1, 29 October 2026) ----------------------------

# --- Hilbert functions of filtrations ----------------------------------------
[[node]]
platform = "DiazModulus.boxHilb_add_finrank_inf"
section = "Towards the multiplicity estimate: Hilbert functions of filtrations"
env = "lemma"
title = 'Rank–nullity for the Hilbert function'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and every $T \in \N^B$, $h_I(T) + \dim_K (F_T \cap I) = \dim_K F_T$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra (rank–nullity). The Hilbert function $H(I; T)$ is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy), here for an abstract filtration and at finite level.'''
sketch = '''
Restrict the quotient map $q : S \to S/I$, as a $K$-linear map, to $F_T$. Its range is $q(F_T)$, of dimension $h_I(T)$, and its kernel is $F_T \cap I$; rank–nullity gives the identity.
'''

[[node]]
platform = "DiazModulus.boxHilb_mono"
env = "lemma"
title = 'The Hilbert function is monotone in the degree'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$) and that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and all $T \le T'$ in $\N^B$ (coordinatewise), $h_I(T) \le h_I(T')$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. The Hilbert function is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
$F_T \subseteq F_{T'}$, so the image of $F_T$ in $S/I$ lies in the image of $F_{T'}$, which is finite-dimensional; dimension is monotone on subspaces of a finite-dimensional space.
'''

[[node]]
platform = "DiazModulus.boxHilb_anti"
env = "lemma"
title = 'The Hilbert function is antitone in the ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for all ideals $I \subseteq J$ of $S$ and every $T \in \N^B$, $h_J(T) \le h_I(T)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Compare \cite[Exercise 8.3]{Wal00} (p. 248; Chapter 8 is by D. Roy), the corresponding inequality for the normalised leading coefficient of ideals of the same rank.'''
sketch = '''
Since $I \subseteq J$, the quotient map $S \to S/J$ factors through $S/I$, so the image of $F_T$ in $S/J$ is the image under a linear map of its image in $S/I$, which is finite-dimensional; a linear map does not raise dimension.
'''

[[node]]
platform = "DiazModulus.card_le_boxHilb_of_linearIndependent"
env = "lemma"
title = 'Families independent modulo an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $T \in \N^B$, and let $e_i$ ($i \in \iota$, $\iota$ finite) be elements of $F_T$ whose classes in $S/I$ are linearly independent over $K$. Then $|\iota| \le h_I(T)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. The Hilbert function is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
The classes of the $e_i$ lie in the image $W$ of $F_T$ in $S/I$ and are independent there; $W$ is finite-dimensional of dimension $h_I(T)$, and an independent family in it has at most $\dim W$ members.
'''

[[node]]
platform = "DiazModulus.exists_boxHilb_family"
root = true
env = "lemma"
title = 'A basis of the image modulo an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and every $T \in \N^B$ there are $N = h_I(T)$ elements $e_1, \dots, e_N$ of $F_T$ whose classes in $S/I$ are linearly independent over $K$, such that every $x \in F_T$ is congruent modulo $I$ to an element of the $K$-span of $e_1, \dots, e_N$ (for $N = 0$ the family is empty and $F_T \subseteq I$). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Compare the subspace E of dimension $H(J; D_0, D)$ in the proof of \cite[Th.~8.18]{Wal00} (\S8.3.3, p. 245; Chapter 8 is by D. Roy).'''
sketch = '''
Take a basis $b_1, \dots, b_N$ of the image $W$ of $F_T$ in $S/I$ and lift each $b_i$ to some $e_i \in F_T$. The classes of the $e_i$ are the $b_i$, hence independent, and the image of the span of the $e_i$ is the span of the $b_i$, which is $W$; so each $x \in F_T$ has the class of some $y$ in that span, that is, $x - y \in I$.
'''

[[node]]
platform = "DiazModulus.boxHilb_map_algEquiv"
env = "lemma"
title = 'Automorphisms that preserve the filtration'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Let $\sigma$ be a $K$-algebra automorphism of $S$, $I$ an ideal of $S$ and $T \in \N^B$ with $\sigma(F_T) = F_T$. Then $h_{\sigma(I)}(T) = h_I(T)$, where $\sigma(I)$ is the image ideal. No finiteness hypothesis is needed (a \texttt{Module.finrank} of an infinite-dimensional space is $0$ on both sides). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Used for translates as in \cite[\S5.3.2]{Wal00} (Chapter 5 is by D. Roy), at finite level.'''
sketch = '''
$\sigma$ induces a $K$-algebra isomorphism $\varphi : S/I \to S/\sigma(I)$ with $\varphi \circ q_I = q_{\sigma(I)} \circ \sigma$. Since $\sigma(F_T) = F_T$, the image of $F_T$ in $S/\sigma(I)$ is $\varphi$ of its image in $S/I$, and a linear isomorphism preserves the dimension of a subspace.
'''

[[node]]
platform = "DiazModulus.sum_boxHilb_le_boxHilb_iInf"
env = "lemma"
title = 'Separators and the Hilbert function of an intersection'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $\iota$ be a finite type, and for $i \in \iota$ let $I_i$ be an ideal of $S$ and $P_i \in S$; let $C, T \in \N^B$. Assume that $P_i \in F_C$, that $P_i \in I_j$ whenever $j \ne i$, and that $a P_i \in I_i$ implies $a \in I_i$ for every $a \in S$. Then $\sum_i h_{I_i}(T) \le h_{\bigcap_i I_i}(T + C)$ (for $\iota$ empty the intersection is $S$ and both sides are $0$). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''\cite[Exercise 8.5(a)]{Wal00} (pp. 248–249; Chapter 8 is by D. Roy), the injective map $A\mapsto\sum_i A_iP_i$, here for an abstract filtration and with the separators as hypotheses.'''
sketch = '''
For each $i$ lift a basis of the image of $F_T$ in $S/I_i$ to elements $e_{i,k} \in F_T$, $k < h_{I_i}(T)$. The products $e_{i,k} P_i$ lie in $F_{T+C}$ and are independent modulo $\bigcap_j I_j$: if $\sum g_{i,k} e_{i,k} P_i \in \bigcap_j I_j$, then for each $j$ the terms with $i \ne j$ lie in $I_j$, so $(\sum_k g_{j,k} e_{j,k}) P_j \in I_j$, hence $\sum_k g_{j,k} e_{j,k} \in I_j$ and all $g_{j,k} = 0$. There are $\sum_i h_{I_i}(T)$ of them, and Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} concludes.
'''

[[node]]
platform = "DiazModulus.exists_card_mul_boxHilb_le_translates"
root = true
env = "proposition"
title = 'Comaximal translates of an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$), that every $F_T$ is finite-dimensional and that $F$ is exhaustive (every element of $S$ lies in some $F_T$). Let $\iota$ be a finite type with $N$ elements, $H$ an ideal of $S$ and $\sigma_i$ ($i \in \iota$) $K$-algebra automorphisms of $S$ with $\sigma_i(F_T) = F_T$ for every $i$ and every $T$, such that $\sigma_i(H) + \sigma_j(H) = S$ whenever $i \ne j$. Then there is $C \in \N^B$ such that $N\,h_H(T) \le h_{\bigcap_i \sigma_i(H)}(T + C)$ for every $T \in \N^B$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Finite-level form of one inequality of \cite[Lemma 5.10]{Wal00} (\S5.3.2, p. 160; Chapter 5 is by D. Roy), as used in \S8.4.1 (pp. 245–247; Chapter 8 is by D. Roy); the separators are the Chinese remainder theorem. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write $J_i = \sigma_i(H)$. For $i \ne j$, comaximality gives $x + y = 1$ with $x \in J_i$, $y \in J_j$, so $q_{ij} = y \in J_j$ is $\equiv 1$ modulo $J_i$; then $P_i = \prod_{j \ne i} q_{ij}$ lies in every $J_j$ with $j \ne i$ and is $\equiv 1$ modulo $J_i$, so $a P_i \in J_i$ forces $a \in J_i$. Each $P_i$ lies in some $F_{T_i}$ (exhaustion), hence in $F_C$ with $C = \sum_i T_i$. Lemma~\ref{lem:sum_boxHilb_le_boxHilb_iInf} gives $\sum_i h_{J_i}(T) \le h_{\bigcap J_i}(T + C)$, and $h_{J_i}(T) = h_H(T)$ by Lemma~\ref{lem:boxHilb_map_algEquiv}. The shift $C$ depends only on the separators.
'''

# --- the chain bound under unmixedness ----------------------------------------
[[node]]
platform = "DiazModulus.boxHilb_sup_span_add_le"
section = "Towards the multiplicity estimate: the chain bound under unmixedness"
env = "lemma"
title = 'Cutting by a regular element'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $D, T \in \N^B$, and $P \in F_D$ a nonzerodivisor on $S/I$ (multiplication by $P$ on $S/I$ is injective). Then $h_{I+(P)}(T+D) + h_I(T) \le h_I(T+D)$, where $I + (P)$ is the ideal generated by $I$ and $P$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''DALAG, the proof of Lemma 8.5 (\S8.2.3, pp. 236–237; Chapter 8 is by D. Roy), the inequality before the passage to the limit; compare the proof of Lemma 5.4 (\S5.2.4, p. 154; Chapter 5 is by D. Roy).'''
sketch = '''
Work in $S/I$. Let $W$ be the image of $F_{T+D}$ (dimension $h_I(T+D)$) and $W_T$ that of $F_T$ (dimension $h_I(T)$). The image of $F_{T+D}$ in $S/(I+(P))$ is the image of $W$ under the factor map $g$. Multiplication by $P$ is injective on $S/I$, so $P\,W_T$ has dimension $h_I(T)$; it lies in $W$ because $F_T F_D \subseteq F_{T+D}$, and $g$ kills it. Rank–nullity for $g$ on $W$ gives $\dim g(W) + \dim P\,W_T \le \dim W$.
'''

[[node]]
platform = "DiazModulus.nat_telescope_step"
env = "lemma"
title = 'One telescoping step'
statement = '''
Let $f, g : \N \to \N$ with $g$ monotone and $g(v+1) + f(v) \le f(v+1)$ for every $v \in \N$. Then $u\,g(u) \le f(2u)$ for every $u \in \N$.
'''
source = '''Elementary. It replaces the limit argument at the end of the proof of \cite[Lemma 5.4]{Wal00} (\S5.2.4, pp. 154–155; Chapter 5 is by D. Roy), which the proof of Lemma 8.5 repeats. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
By induction on $k$, $f(u) + k\,g(u) \le f(u+k)$: each step adds $g(u+k+1) \ge g(u)$. Take $k = u$.
'''

[[node]]
platform = "DiazModulus.nat_telescope_iter"
env = "lemma"
title = 'Iterated telescoping'
statement = '''
Let $f_0, f_1, f_2, \dots$ be functions $\N \to \N$ and $j \in \N$. Assume that for every $k < j$ the function $f_{k+1}$ is monotone and $f_{k+1}(v+1) + f_k(v) \le f_k(v+1)$ for every $v \in \N$. Then $2^{j(j-1)/2} u^j f_j(u) \le f_0(2^j u)$ for every $u \in \N$ (the exponent $j(j-1)/2$ is an integer, and $0$ for $j = 0$).
'''
source = '''Elementary. A finite-level replacement for the limits in the proofs of \cite[Lemma 5.4]{Wal00} (\S5.2.4; Chapter 5 is by D. Roy) and Th. 8.4 (\S8.2.3, pp. 236–238; Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Induction on $j$, for all $u$ at once; for $j = 0$ both sides are $f_0(u)$. For $j + 1$, Lemma~\ref{lem:nat_telescope_step} with $f = f_j$, $g = f_{j+1}$ gives $u\,f_{j+1}(u) \le f_j(2u)$, and the induction hypothesis at $2u$ gives $2^{j(j-1)/2} (2u)^j f_j(2u) \le f_0(2^{j+1} u)$. Multiply the step by $2^{j(j-1)/2} 2^j u^j$ and use $j(j-1)/2 + j = (j+1)j/2$.
'''

[[node]]
platform = "DiazModulus.exists_mem_forall_notMem_of_not_subset"
env = "lemma"
title = 'Prime avoidance for subspaces'
statement = '''
Let $K$ be an infinite field, $S$ a commutative $K$-algebra, $V$ a $K$-subspace of $S$ and $\mathcal{P}$ a finite set of ideals of $S$ (not necessarily prime) such that $V \not\subseteq p$ for every $p \in \mathcal{P}$. Then some $x \in V$ lies in no $p \in \mathcal{P}$.
'''
source = '''Classical (avoidance over an infinite field). Compare the choice of $P_{k+1}$ in the proof of \cite[Th.~8.4]{Wal00} (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy).'''
sketch = '''
For each $p \in \mathcal{P}$, $V \cap p$ is a $K$-subspace of $V$, proper since $V \not\subseteq p$. A vector space over an infinite field is not a finite union of proper subspaces, so some $x \in V$ lies in no $V \cap p$.
'''

[[node]]
platform = "DiazModulus.exists_mem_isSMulRegular_of_associatedPrimes"
env = "lemma"
title = 'A regular element in a subspace'
statement = '''
Let $K$ be an infinite field, $S$ a commutative Noetherian $K$-algebra, $M$ a finitely generated $S$-module and $V$ a $K$-subspace of $S$ contained in no associated prime of $M$. Then $V$ contains an element $x$ that is regular on $M$ (multiplication by $x$ on $M$ is injective).
'''
source = '''Classical commutative algebra (associated primes and zero divisors). Used as in the proof of \cite[Th.~8.4]{Wal00} (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy).'''
sketch = '''
$M$ has finitely many associated primes, so Lemma~\ref{lem:exists_mem_forall_notMem_of_not_subset} gives $x \in V$ outside all of them. Over a Noetherian ring the union of the associated primes of $M$ is the set of non-regular elements on $M$, so $x$ is $M$-regular.
'''

[[node]]
platform = "DiazModulus.isSMulRegular_quotient_of_isWeaklyRegular_append"
env = "lemma"
title = 'Regular sequences, read in turn'
statement = '''
Let $S$ be a commutative ring, $ps_0$ a finite list of elements of $S$ and $P_0, \dots, P_{r-1} \in S$, and assume that the list $ps_0$ followed by $P_0, \dots, P_{r-1}$ is weakly regular on $S$. Then for every $k < r$, $P_k$ is a nonzerodivisor on $S/((ps_0) + (P_j : j < k))$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length.
'''
source = '''Classical commutative algebra (regular sequences); a reformulation of the definition.'''
sketch = '''
This is the definition of weak regularity read at the position $|ps_0| + k$: the entry there is $P_k$, and the ideal generated by the earlier entries is $(ps_0) + (P_j : j < k)$. Mathlib states regularity on the quotient module $S/(I \cdot S)$, and $I \cdot S = I$ for an ideal.
'''

[[node]]
platform = "DiazModulus.exists_isWeaklyRegular_append_of_height"
env = "lemma"
title = 'Extending a regular sequence under unmixedness'
statement = '''
Let $K$ be an infinite field and $S$ a commutative Noetherian $K$-algebra with \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $V$ a $K$-subspace of $S$ and $r \in \N$, and assume that every prime ideal $p$ of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$ (a vacuous hypothesis when $(ps_0) + (V) = S$). Then there is a list $rs$ of $r$ elements of $V$ such that $ps_0$ followed by $rs$ is weakly regular on $S$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''DALAG, the proof of Th. 8.4 (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy), with Macaulay's unmixedness theorem (\S8.2.1, p. 235) taken as the hypothesis UnmixedHeight.'''
sketch = '''
Induction on the length $m \le r$ of $rs$. Let $L = ps_0$ followed by $rs$ be weakly regular, with $m < r$. Every associated prime $p$ of $S/(L)$ contains $(L) \supseteq (ps_0)$, and \texttt{hU} bounds its height by $|ps_0| + m$; if $V \subseteq p$, the height hypothesis would give $|ps_0| + r \le |ps_0| + m$, so $V \not\subseteq p$. Lemma~\ref{lem:exists_mem_isSMulRegular_of_associatedPrimes}, applied to the finite module $S/(L)$, gives $x \in V$ regular on $S/(L)$, and $L$ followed by $x$ is weakly regular. If $S/(L) = 0$ there is no associated prime and the step is the same.
'''

[[node]]
platform = "DiazModulus.boxHilb_chain_bound"
env = "proposition"
title = 'The regular chain bound'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $D \in \N^B$, $r \in \N$ and $P_0, \dots, P_{r-1} \in F_D$ such that each $P_k$ is a nonzerodivisor on $S/(I + (P_j : j < k))$. Then for every $u \in \N$, $2^{r(r-1)/2} u^r h_{I + (P_0, \dots, P_{r-1})}(uD) \le h_I(2^r u D)$, where $uD$ is the coordinatewise multiple. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Finite-level form of \cite[Th.~8.4]{Wal00} and its proof through Lemma 8.5 (\S8.2.3, pp. 236–238; Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Put $I_k = I + (P_j : j < k)$ and $f_k(v) = h_{I_k}(vD)$. Each $f_{k+1}$ is monotone (Lemma~\ref{lem:boxHilb_mono}), and for $k < r$, Lemma~\ref{lem:boxHilb_sup_span_add_le} with $T = vD$ gives $f_{k+1}(v+1) + f_k(v) \le f_k(v+1)$, since $(v+1)D = vD + D$. The iterated telescope Lemma~\ref{lem:nat_telescope_iter} with $j = r$ gives $2^{r(r-1)/2} u^r f_r(u) \le f_0(2^r u)$, which is the claim.
'''

[[node]]
platform = "DiazModulus.boxHilb_le_of_height"
env = "proposition"
title = 'The chain bound from heights, under unmixedness'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $K$ is infinite, $S$ is Noetherian, $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and every $F_T$ is finite-dimensional, and let \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $D \in \N^B$, $V$ a $K$-subspace of $S$ with $V \subseteq F_D$, and $r \in \N$, and assume that every prime ideal of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$. Then for every $u \in \N$, $2^{r(r-1)/2} u^r h_{(ps_0)+(V)}(uD) \le h_{(ps_0)}(2^r u D)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$). A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of \cite[Th.~8.8]{Wal00} (\S8.3.1, p. 239) and Th. 8.4 (\S8.2.3, p. 236), the step that gives (8.21) in \S8.4.1 (p. 246); Chapter 8 is by D. Roy. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:exists_isWeaklyRegular_append_of_height} gives $r$ elements $P_0, \dots, P_{r-1}$ of $V$ such that $ps_0$ followed by them is weakly regular, and Lemma~\ref{lem:isSMulRegular_quotient_of_isWeaklyRegular_append} turns this into the chain condition: $P_k$ is regular on $S/((ps_0) + (P_j : j < k))$. Each $P_k \in V \subseteq F_D$, so Proposition~\ref{prop:boxHilb_chain_bound} gives $2^{r(r-1)/2} u^r h_{(ps_0)+(P)}(uD) \le h_{(ps_0)}(2^r uD)$. Finally $(ps_0) + (P) \subseteq (ps_0) + (V)$, and the Hilbert function is antitone in the ideal (Lemma~\ref{lem:boxHilb_anti}).
'''

# --- the torus model and the Hilbert side ----------------------------------------
[[node]]
platform = "DiazModulus.restrictSupport_block_filtration"
section = "Towards the multiplicity estimate: the torus model and the Hilbert side"
env = "lemma"
title = 'Block boxes form a filtration'
statement = '''
Let $K$ be a field, $\sigma$ a finite type, $\iota$ a type and $\beta : \sigma \to \iota$ a map grouping the variables of $K[X_s : s \in \sigma]$ into blocks. For $T \in \N^\iota$ let $B_T$ be \texttt{blockBox K $\beta$ T}, the span of the monomials $X^m$ whose degree in each block, $\sum_{\beta(s) = b} m_s$, is at most $T_b$. Then (i) $fg \in B_{T+T'}$ whenever $f \in B_T$ and $g \in B_{T'}$; (ii) every $B_T$ is finite-dimensional over $K$; (iii) every polynomial lies in some $B_T$.
'''
source = '''Classical. The multidegree filtration of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy), for an arbitrary partition of the variables.'''
sketch = '''
(i) The exponents of $fg$ are sums of exponents of $f$ and of $g$, and block degrees add. (ii) Every exponent $m$ of $B_T$ has $m_s \le T_{\beta(s)}$, so the admissible exponents form a finite set, and the monomials are a basis. (iii) Take $T_b$ to be the sum over the exponents of $f$ of their degrees in block $b$.
'''

[[node]]
platform = "DiazModulus.torus_reduce_mem_restrictSupport"
env = "lemma"
title = 'Reduction modulo the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Then for every $T \in \N^{A_0 \sqcup A_1}$ and every $f$ in the box $T$ there is a $K$-linear combination $g$ of reduced monomials, also in the box $T$, with $f - g \in J_0$.
'''
source = '''Classical (normal forms modulo $YZ-1$). The ring $K[X, Y, Z]$ and its ideal are those of \cite[\S8.3.1]{Wal00} (Chapter 8 is by D. Roy), for K[G].'''
sketch = '''
The reduced form of $X^a Y^b Z^c$ replaces each pair $(b_i, c_i)$ by $(\max(b_i - c_i, 0), \max(c_i - b_i, 0))$; it is reduced, it is coordinatewise below the original exponent, so it stays in the box, and it does not change when $b_i$ and $c_i$ both go up by one. By strong induction on the degree every monomial is congruent to its reduced form modulo $J_0$, since $X^{m'} Y_i Z_i - X^{m'} = X^{m'} (Y_i Z_i - 1)$. Take for $g$ the image of $f$ under $X^m \mapsto X^{\mathrm{red}(m)}$.
'''

[[node]]
platform = "DiazModulus.torus_reduced_inf_eq_bot"
env = "lemma"
title = 'Reduced monomials are independent modulo the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Then the $K$-span of the reduced monomials meets $J_0$ only in $0$. No hypothesis on $K$ is needed.
'''
source = '''Classical (normal forms modulo $YZ-1$). The ring $K[X, Y, Z]$ and its ideal are those of \cite[\S8.3.1]{Wal00} (Chapter 8 is by D. Roy), for K[G].'''
sketch = '''
Let $\rho$ be the $K$-linear map $X^m \mapsto X^{\mathrm{red}(m)}$, with the reduced form of the previous node. Since $\mathrm{red}$ does not change when $b_i$ and $c_i$ both go up by one, $\rho(q\,Y_i Z_i) = \rho(q)$ for every $q$, so $\rho$ vanishes on $J_0$; and $\rho$ is the identity on combinations of reduced monomials. So a reduced combination in $J_0$ equals its image under $\rho$, which is $0$.
'''

[[node]]
platform = "DiazModulus.boxHilb_torusIdeal"
env = "proposition"
title = 'The Hilbert function of the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_0$ and $A_1$ are finite. Then for every $T \in \N^{A_0 \sqcup A_1}$, $h_{J_0}(T) = \prod_{h \in A_0} (T_h + 1) \cdot \prod_{i \in A_1} (2T_i + 1)$, where $h_{J_0}(T)$ is \texttt{boxHilb (torusBox K A$_0$ A$_1$) (torusIdeal K A$_0$ A$_1$) T}, the dimension of the image of the box $T$ in $K[X, Y, Z]/J_0$.
'''
source = '''Compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy), the case G* = G, there with the total degree in the additive variables; the passage to $K[X, Y, Z]$ is that of \S8.3.1 (Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Let $\mathcal{B}$ be the box (finite-dimensional by Lemma~\ref{lem:restrictSupport_block_filtration}) and $R$ the span of the reduced monomials. By Lemma~\ref{lem:torus_reduce_mem_restrictSupport}, $\mathcal{B} = (\mathcal{B} \cap R) + (\mathcal{B} \cap J_0)$, and by Lemma~\ref{lem:torus_reduced_inf_eq_bot} the two pieces meet in $0$; with Lemma~\ref{lem:boxHilb_add_finrank_inf}, $h_{J_0}(T) = \dim (\mathcal{B} \cap R)$, the number of reduced exponents in the box. These are $X^a Y^b Z^c$ with $a_h \le T_h$, $b_i + c_i \le T_i$ and $\min(b_i, c_i) = 0$, and $(b_i, c_i) \mapsto T_i + b_i - c_i$ is a bijection onto $\{0, \dots, 2T_i\}$.
'''

[[node]]
platform = "DiazModulus.isWeaklyRegular_torusList"
env = "lemma"
title = 'The torus generators form a regular sequence'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_1$ is finite. Then the list \texttt{torusList K A$_0$ A$_1$} of the generators $Y_i Z_i - 1$ of $J_0$, one for each $i \in A_1$, is a weakly regular sequence in $K[X, Y, Z]$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length.
'''
source = '''Classical commutative algebra. Compare \cite[Lemma 8.7]{Wal00} (\S8.3.1; Chapter 8 is by D. Roy), which shows that the ideals of algebraic subgroups in $K[X, Y, Z]$ are complete intersections.'''
sketch = '''
It suffices that $f_j = Y_j Z_j - 1$ is a nonzerodivisor modulo $I = (f_i : i \in s)$ for every $j$ and every set $s$ of indices not containing $j$. Separating the variables $Y_j, Z_j$ from the others writes $K[X, Y, Z]$ as $S[Y_j, Z_j]$, with $I = I_0 \cdot S[Y_j, Z_j]$ for an ideal $I_0$ of $S$, so the quotient is $(S/I_0)[Y_j, Z_j]$. There $Y_j Z_j - 1$ has constant coefficient $-1$, a unit, so it is a unit of the power series ring and hence a nonzerodivisor of the polynomial ring.
'''

[[node]]
platform = "DiazModulus.exists_translation_algEquiv"
root = true
env = "lemma"
title = 'Translations act by automorphisms'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Let $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$. Then there is a $K$-algebra automorphism $e$ of $K[X, Y, Z]$ with $e(X_h) = X_h + x_h$, $e(Y_i) = y_i Y_i$ and $e(Z_i) = y_i^{-1} Z_i$, which maps every per-coordinate box onto itself and maps $J_0$ onto itself ($e(J_0) = J_0$).
'''
source = '''Classical. Translations of \cite[\S5.3.2]{Wal00} (Chapter 5 is by D. Roy), written on $K[X, Y, Z]$ as in \S8.3.1 (Chapter 8 is by D. Roy).'''
sketch = '''
Define $e$ on the variables and its inverse by $X_h \mapsto X_h - x_h$, $Y_i \mapsto y_i^{-1} Y_i$, $Z_i \mapsto y_i Z_i$. Each sends a monomial $X^m$ into the span of the monomials with exponent $\le m$; every box is a lower set of exponents, so it is mapped into itself by both, hence onto itself. Finally $e(Y_i Z_i - 1) = y_i y_i^{-1} Y_i Z_i - 1 = Y_i Z_i - 1$.
'''

[[node]]
platform = "DiazModulus.torus_coeff_poly"
root = true
env = "lemma"
title = 'The polynomial of a coefficient vector'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_0$ and $A_1$ are finite, let $D_0, D_1 \in \N$, and let $c$ be a family of elements of $K$ indexed by the pairs $(\tau, s)$ with $\tau \in \{0, \dots, D_0\}^{A_0}$ and $s \in \{0, \dots, 2D_1\}^{A_1}$. Let $P_c$ be \texttt{torusCoeffPoly D$_0$ D$_1$ c}, that is $P_c = \sum_{\tau, s} c_{\tau,s}\, X^\tau \prod_i Y_i^{(s_i - D_1)_+} Z_i^{(D_1 - s_i)_+}$, with $(\cdot)_+$ the positive part. Then (i) $P_c$ lies in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} ($X_h$-degree at most $D_0$, $\deg_{Y_i} + \deg_{Z_i}$ at most $D_1$); (ii) if $c \ne 0$ then $P_c \notin J_0$; (iii) for every $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$, the value of $P_c$ at the point \texttt{torusPoint x y} $= (x, y, y^{-1})$ is $\sum_{\tau, s} c_{\tau,s} \prod_h x_h^{\tau_h} \prod_i y_i^{s_i - D_1}$, with the integer exponents $s_i - D_1 \in \{-D_1, \dots, D_1\}$.
'''
source = '''The polynomials $P=\sum c\,X^\tau Y^t$ of \cite[Th.~8.1]{Wal00} (\S8.1, p. 232; Chapter 8 is by D. Roy), for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$, written in $K[X, Y, Z]$ as in \S8.3.1. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
(i) Each monomial of $P_c$ has $X_h$-degree $\tau_h \le D_0$ and $(Y_i, Z_i)$-degree $(s_i - D_1)_+ + (D_1 - s_i)_+ = |s_i - D_1| \le D_1$. (ii) The monomials of $P_c$ are reduced, since one of the two positive parts vanishes, and distinct $(\tau, s)$ give distinct monomials, since $s_i = D_1 + (s_i - D_1)_+ - (D_1 - s_i)_+$; so if $P_c \in J_0$, Lemma~\ref{lem:torus_reduced_inf_eq_bot} gives $P_c = 0$ and every $c_{\tau,s}$, a coefficient of $P_c$, is $0$. (iii) Evaluation is a ring map, and $y_i^{(s_i - D_1)_+} (y_i^{-1})^{(D_1 - s_i)_+} = y_i^{s_i - D_1}$.
'''

[[node]]
platform = "DiazModulus.le_of_forall_mul_pow_le"
env = "lemma"
title = 'Extracting a leading coefficient'
statement = '''
Let $a, b, c, n \in \N$. If $a u^n \le b (u + c)^n$ for every integer $u \ge 1$, then $a \le b$.
'''
source = '''Elementary. A replacement for the limits defining the normalised leading coefficient in \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
Dividing by $u^n$ gives $a \le b (1 + c/u)^n$ for every $u \ge 1$; as $u \to \infty$ the right side tends to $b$, and a bound that holds eventually passes to the limit.
'''

[[node]]
platform = "DiazModulus.box_ray_upper_bound"
env = "lemma"
title = 'Box counts along a ray: an upper bound'
statement = '''
Let $A_0, A_1$ be finite types with $d_0$ and $d_1$ elements, $D_0, D_1 \ge 1$ and $v \in \N$. Then $(vD_0 + 1)^{d_0} (2vD_1 + 1)^{d_1} \le (v+1)^{d_0+d_1} D_0^{d_0} (2D_1)^{d_1}$ (the left side is written in Lean as a product of constant factors over $A_0$ and over $A_1$).
'''
source = '''Elementary. The number of monomials of the box $(vD_0; vD_1)$, compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy).'''
sketch = '''
Since $D_0, D_1 \ge 1$, $vD_0 + 1 \le (v+1) D_0$ and $2vD_1 + 1 \le (v+1)(2D_1)$; take powers and regroup the factors $v + 1$.
'''

[[node]]
platform = "DiazModulus.box_ray_lower_bound"
root = true
env = "lemma"
title = 'Box counts along a ray: a lower bound'
statement = '''
Let $H$ and $J$ be finite sets (of elements of arbitrary types) and $D_0, D_1, u \in \N$. Then $u^{|H|+|J|} D_0^{|H|} D_1^{|J|} \le (uD_0 + 1)^{|H|} (2uD_1 + 1)^{|J|}$ (the right side is written in Lean as a product of constant factors over $H$ and over $J$). No hypothesis is needed.
'''
source = '''Elementary. A partial count of the box $(uD_0; uD_1)$, compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy).'''
sketch = '''
The left side is $(uD_0)^{|H|} (uD_1)^{|J|}$, and $uD_0 \le uD_0 + 1$, $uD_1 \le 2uD_1 + 1$; take powers and multiply.
'''

[[node]]
platform = "DiazModulus.boxHilb_hilbert_side"
env = "proposition"
title = 'The Hilbert side, abstract form'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $K$ is infinite, $S$ is Noetherian, $B$ is finite, $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and every $F_T$ is finite-dimensional, and let \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $D \in \N^B$ with $D_b \ge 1$ for every $b$, $V$ a $K$-subspace of $S$ with $V \subseteq F_D$, and $r, n \in \N$; assume that every prime ideal of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$. Let $\kappa \in \N$ with $h_{(ps_0)}(vD) \le \kappa (v+1)^n$ for every $v \in \N$, and let $\lambda \in \N$ and $C \in \N^B$ with $\lambda u^{n-r} \le h_{(ps_0)+(V)}(uD + C)$ for every integer $u \ge 1$, where $n - r$ is truncated at $0$. Then $\lambda\, 2^{r(r-1)/2} \le \kappa\, 2^{rn}$. No condition $r \le n$ is assumed. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$). A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of the comparison of Hilbert functions in \cite[\S8.4.1]{Wal00} (pp. 245–247; Chapter 8 is by D. Roy), the proof of Th. 8.1 for $G^-=\{e\}$, through (8.21). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Let $I = (ps_0)$, $I' = (ps_0) + (V)$ and $j = \max_b C_b$. Since $D \ge 1$, $uD + C \le wD$ with $w = u + j$, so by Lemma~\ref{lem:boxHilb_mono} $\lambda u^{n-r} \le h_{I'}(wD)$. Proposition~\ref{prop:boxHilb_le_of_height} at $w$ and the upper bound give $2^{r(r-1)/2} w^r h_{I'}(wD) \le h_I(2^r w D) \le \kappa (2^r w + 1)^n$. For $u \ge 1$, $u^n \le u^{n-r} w^r$ for every $r$ (if $r > n$ then $u^{n-r} = 1$ and $u^n \le u^r$), and $2^r w + 1 \le 2^r (w + 1)$, so $\lambda\, 2^{r(r-1)/2} u^n \le \kappa\, 2^{rn} (u + j + 1)^n$ for all $u \ge 1$, and Lemma~\ref{lem:le_of_forall_mul_pow_le} concludes.
'''

[[node]]
platform = "DiazModulus.torus_hilbert_side"
root = true
env = "theorem"
title = 'The Hilbert side of the multiplicity estimate'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $K$ is infinite and that $A_0, A_1$ are finite, with $d_0$ and $d_1$ elements, and put $d = d_0 + d_1$; let \texttt{hU : UnmixedHeight K[X, Y, Z]}. Let $D_0, D_1 \ge 1$, let $V$ be a $K$-subspace of the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} ($X_h$-degree at most $D_0$, $\deg_{Y_i} + \deg_{Z_i}$ at most $D_1$), and $r \in \N$; assume that every prime ideal of $K[X, Y, Z]$ containing $J_0 + (V)$ has height at least $d_1 + r$. Let $\lambda \in \N$ and $C \in \N^{A_0 \sqcup A_1}$ with $\lambda u^{d-r} \le h_{J_0 + (V)}(uD + C)$ for every integer $u \ge 1$, where $D$ is the multidegree equal to $D_0$ on $A_0$ and $D_1$ on $A_1$, $h$ is the Hilbert function of the per-coordinate boxes and $d - r$ is truncated at $0$. Then $\lambda\, 2^{r(r-1)/2} \le 2^{rd} D_0^{d_0} (2D_1)^{d_1}$. No condition $r \le d$ is assumed. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight K[X, Y, Z]} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of the comparison of Hilbert functions in \cite[\S8.4.1]{Wal00} (pp. 245–247; Chapter 8 is by D. Roy), for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ through $K[X, Y, Z]$ (\S8.3.1). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Apply Proposition~\ref{prop:boxHilb_hilbert_side} to $S = K[X, Y, Z]$ with the boxes as filtration (monotone by \texttt{Diaz.blockBox\_mono}, multiplicative and finite-dimensional by Lemma~\ref{lem:restrictSupport_block_filtration}), the base list of the generators $Y_i Z_i - 1$ (weakly regular by Lemma~\ref{lem:isWeaklyRegular_torusList}, of length $d_1$, generating $J_0$), the ray $D \ge 1$ and $n = d$. The upper count $h_{J_0}(vD) = (vD_0 + 1)^{d_0} (2vD_1 + 1)^{d_1}$ is Proposition~\ref{prop:boxHilb_torusIdeal}, and Lemma~\ref{lem:box_ray_upper_bound} bounds it by $\kappa (v+1)^d$ with $\kappa = D_0^{d_0} (2D_1)^{d_1}$.
'''

[[node]]
platform = "DiazModulus.le_hME_constant"
root = true
env = "lemma"
title = 'The constant of the multiplicity estimate'
statement = '''
Let $\lambda, r, d_0, d_1, D_0, D_1 \in \N$ and $d = d_0 + d_1$. If $\lambda\, 2^{r(r-1)/2} \le 2^{rd} D_0^{d_0} (2D_1)^{d_1}$, then $\lambda \le 2^{d(d+1)/2}\, d!\, 2^{d_1} d_0^{d_0} \cdot D_0^{d_0} D_1^{d_1}$, with $0^0 = 1$ (the exponents $r(r-1)/2$ and $d(d+1)/2$ are integers). For $d_0 = |A_0|$ and $d_1 = |A_1|$ the factor $2^{d(d+1)/2}\, d!\, 2^{d_1} d_0^{d_0}$ is the constant $K_d$ of the hypothesis \texttt{hME} (the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library), the elementary multiplicity estimate.
'''
source = '''Elementary. The constant is that of the elementary multiplicity estimate, the case $G^-=\{e\}$ of \cite[Th.~8.1]{Wal00} (\S8.1, p. 232; Chapter 8 is by D. Roy), in coordinates. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
For every $r$, $rd \le d(d+1)/2 + r(r-1)/2$, since $d(d+1) + r(r-1) - 2rd = (d - r)(d - r + 1) \ge 0$. So $2^{rd} \le 2^{d(d+1)/2} 2^{r(r-1)/2}$, and cancelling $2^{r(r-1)/2}$ gives $\lambda \le 2^{d(d+1)/2} 2^{d_1} D_0^{d_0} D_1^{d_1}$; the factors $d!$ and $d_0^{d_0}$ are at least $1$.
'''

# --- Macaulay's unmixedness for polynomial rings (C1.2, 29 October 2026) --------------------------------

# --- Macaulay's unmixedness for polynomial rings ----------------------------------------
[[node]]
platform = "DiazModulus.length_le_ringKrullDim_quotient_of_mem_associatedPrimes"
section = "Towards the multiplicity estimate: Macaulay's unmixedness for polynomial rings"
env = "lemma"
title = 'Regular sequences and the dimension of an associated prime'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, $M$ a finitely generated $A$-module and $rs = (r_1, \dots, r_n)$ a weakly $M$-regular sequence of elements of $\mathfrak{m}$. Then $n \le \dim A/\mathfrak{p}$ for every associated prime $\mathfrak{p}$ of $M$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $M$-regular when each $r_i$ is a nonzerodivisor on $M/(r_1, \dots, r_{i-1})M$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $M$-regular (\texttt{IsRegular}) when moreover $M/(r_1, \dots, r_n)M \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights of prime ideals in $\N \cup \{\infty\}$.
'''
source = '''\cite[Th.~17.2]{Mat86}, in the form of regular sequences; compare \cite[Th.~2.1.2(a)]{BH93}, the equality for Cohen--Macaulay modules. Classical.'''
sketch = '''
Induction on $n$; for $n = 0$, $A/\mathfrak{p}$ is a nonzero ring, of dimension at least $0$. Let $x = r_1$ and write $\mathfrak{p} = \operatorname{ann}(m)$ with $m \ne 0$. By Krull's intersection theorem there is a largest $j$ with $m \in x^j M$; writing $m = x^j m'$ gives $m' \notin xM$, and $\operatorname{ann}(m') = \mathfrak{p}$ because $x$ is $M$-regular. The class of $m'$ in $M/xM$ is nonzero, so it lies under an associated prime $\mathfrak{q}$ of $M/xM$, with $\mathfrak{p} + (x) \subseteq \mathfrak{q}$, while $x \notin \mathfrak{p}$. Since $x$ is a nonzerodivisor of the domain $A/\mathfrak{p}$ and $A/\mathfrak{q}$ is a quotient of $(A/\mathfrak{p})/(x)$, $\dim A/\mathfrak{q} + 1 \le \dim A/\mathfrak{p}$; the induction hypothesis for $M/xM$, $r_2, \dots, r_n$ and $\mathfrak{q}$ gives $n - 1 \le \dim A/\mathfrak{q}$.
'''

[[node]]
platform = "DiazModulus.exists_isRegular_quotient_ofList"
env = "lemma"
title = 'Regular sequences after cutting by a weakly regular one'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, and $M$ a nonzero finitely generated $A$-module (in the universe of $A$, as Mathlib's $\mathrm{Ext}$ requires). Let $ps$ be a weakly $M$-regular sequence of elements of $\mathfrak{m}$ and $zs$ an $M$-regular sequence of elements of $\mathfrak{m}$. Then there is an $M/(ps)M$-regular sequence $ts$ of elements of $\mathfrak{m}$ with $|zs| \le |ts| + |ps|$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $M$-regular when each $r_i$ is a nonzerodivisor on $M/(r_1, \dots, r_{i-1})M$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $M$-regular (\texttt{IsRegular}) when moreover $M/(r_1, \dots, r_n)M \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length.
'''
source = '''Rees' characterisation of regular sequences through Ext, and the long exact Ext sequence of multiplication by a regular element; see \cite[\S1.2]{BH93}. Classical.'''
sketch = '''
Induction on $ps$, one element $p \in \mathfrak{m}$ at a time, replacing $M$ by $M/pM$, which is finitely generated and, by Nakayama's lemma, nonzero. The step: if $M$ has a regular sequence of length $n + 1$ in $\mathfrak{m}$ and $p \in \mathfrak{m}$ is $M$-regular, then $M/pM$ has one of length $n$. By Rees' theorem (Mathlib's \texttt{ModuleCat.exists\_isRegular\_tfae}), the hypothesis gives $\mathrm{Ext}^i_A(A/\mathfrak{m}, M) = 0$ for $i \le n$; the long exact $\mathrm{Ext}$ sequence of $0 \to M \stackrel{p}{\to} M \to M/pM \to 0$ gives $\mathrm{Ext}^i_A(A/\mathfrak{m}, M/pM) = 0$ for $i < n$, and Rees' theorem turns this back into a regular sequence of length $n$ in $\mathfrak{m}$ on $M/pM$. Finally $M/(p, ps')M \cong (M/pM)/(ps')(M/pM)$, and regularity is carried by linear isomorphisms.
'''

[[node]]
platform = "DiazModulus.height_le_length_of_mem_associatedPrimes"
env = "proposition"
title = 'Unmixedness for a local ring with a long regular sequence'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, and assume that $A$ has an $A$-regular sequence $zs$ of elements of $\mathfrak{m}$ with $\dim A \le |zs|$ (so $A$ is Cohen–Macaulay). Let $ps$ be a weakly $A$-regular sequence of elements of $\mathfrak{m}$. Then every associated prime $\mathfrak{p}$ of the $A$-module $A/(ps)$ has height at most $|ps|$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $A$-regular when each $r_i$ is a nonzerodivisor on $A/(r_1, \dots, r_{i-1})A$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $A$-regular (\texttt{IsRegular}) when moreover $A/(r_1, \dots, r_n)A \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights of prime ideals in $\N \cup \{\infty\}$.
'''
source = '''The local form of Macaulay's unmixedness theorem: \cite[Th.~2.1.6 and Th.~2.1.2]{BH93}; \cite[\S17]{Mat86}. Classical.'''
sketch = '''
$A/(ps)$ is nonzero, since it has an associated prime. Lemma~\ref{lem:exists_isRegular_quotient_ofList}, with $M = A$, gives an $A/(ps)$-regular sequence $ts$ in $\mathfrak{m}$ with $|zs| \le |ts| + |ps|$, and Lemma~\ref{lem:length_le_ringKrullDim_quotient_of_mem_associatedPrimes} gives $|ts| \le \dim A/\mathfrak{p}$. In any commutative ring, $\operatorname{ht} \mathfrak{p} + \dim A/\mathfrak{p} \le \dim A$: in the prime spectrum the height of $\mathfrak{p}$ is its order height, $\dim A/\mathfrak{p}$ its coheight, and the Krull dimension is the supremum of height plus coheight. Since $\dim A \le |zs|$, all these numbers are finite, and $\operatorname{ht} \mathfrak{p} \le |zs| - \dim A/\mathfrak{p} \le |zs| - |ts| \le |ps|$.
'''

[[node]]
platform = "DiazModulus.exists_isWeaklyRegular_vanishing"
env = "lemma"
title = 'The variables minus a point form a regular sequence'
statement = '''
Let $R$ be a commutative ring, $\sigma$ a finite type and $a \in R^\sigma$. Then there is a list of $|\sigma|$ polynomials in $R[X_\sigma]$ (\texttt{MvPolynomial $\sigma$ R}), each vanishing at $a$, which is a weakly regular sequence on $R[X_\sigma]$: the $X_i - a_i$, $i \in \sigma$, in some order. A list $r_1, \dots, r_n$ of elements of a commutative ring $S$ is weakly regular on $S$ when each $r_i$ is a nonzerodivisor on $S/(r_1, \dots, r_{i-1})$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero).
'''
source = '''Classical: the variables minus the coordinates of a point form a regular sequence in a polynomial ring.'''
sketch = '''
For one variable: $X - b$ is monic, hence a nonzerodivisor of $R[X]$, and $R[X]/(X - b) \cong R$ as $R$-modules, so $X - b$ followed by the constants of a weakly $R$-regular sequence is weakly regular on $R[X]$. Induction on $n$ through $R[X_0, \dots, X_n] \cong R[X_1, \dots, X_n][X_0]$ shows that $X_0 - a_0, \dots, X_{n-1} - a_{n-1}$ is weakly regular on $R[X_0, \dots, X_{n-1}]$. Renaming the variables along a bijection between $\sigma$ and $\{0, \dots, |\sigma| - 1\}$ gives the statement, since ring isomorphisms carry weakly regular sequences.
'''

[[node]]
platform = "DiazModulus.unmixedHeight_mvPolynomial"
root = true
env = "theorem"
title = "Macaulay's unmixedness for polynomial rings"
statement = '''
Let $K$ be an algebraically closed field and $\sigma$ a finite type. Then \texttt{UnmixedHeight (MvPolynomial $\sigma$ K)} holds: for every weakly regular sequence $r_1, \dots, r_k$ of the polynomial ring $K[X_\sigma]$, every associated prime of $K[X_\sigma]/(r_1, \dots, r_k)$ has height at most $k$. This is the inequality half of Macaulay's unmixedness theorem for $K[X_\sigma]$; the reverse inequality is not part of the statement. A sequence is weakly regular when each entry is a nonzerodivisor modulo the ideal generated by the earlier ones (Mathlib's \texttt{IsWeaklyRegular}), and heights are taken in $\N \cup \{\infty\}$. The proposition \texttt{UnmixedHeight} is that of the library file \texttt{Diaz/HilbertBox.lean} (on Prove2Me, the published definition \texttt{DiazHilbertBox}). It is the hypothesis \texttt{hU} of Lemma~\ref{lem:exists_isWeaklyRegular_append_of_height}, Proposition~\ref{prop:boxHilb_le_of_height}, Proposition~\ref{prop:boxHilb_hilbert_side} and Theorem~\ref{thm:torus_hilbert_side}. For Theorem~\ref{thm:torus_hilbert_side} the ring is the polynomial ring $K[X, Y, Z]$, so for $K$ algebraically closed, for instance $K = \C$, this theorem supplies that hypothesis.
'''
source = '''Macaulay's unmixedness theorem \cite{Mac16} for polynomial rings over a field, which are Cohen--Macaulay; in this form \cite[Th.~2.1.6]{BH93} and \cite[\S17]{Mat86}. The sections above carry it as the hypothesis \texttt{UnmixedHeight}, in place of Macaulay's theorem as quoted in \cite[\S8.2.1]{Wal00} (p. 235; Chapter 8 is by D. Roy). Classical; only the inequality half, and only over an algebraically closed field.'''
sketch = '''
Let $S = K[X_\sigma]$ and let $\mathfrak{p}$ be an associated prime of $S/(rs)$; it contains $rs$. Choose a maximal ideal $\mathfrak{m} \supseteq \mathfrak{p}$ and let $A = S_{\mathfrak{m}}$, a Noetherian local ring. By the Nullstellensatz $\mathfrak{m}$ is the ideal of a point $a$, so Lemma~\ref{lem:exists_isWeaklyRegular_vanishing} gives a weakly regular sequence of $|\sigma|$ elements of $\mathfrak{m}$; localised, it is a regular sequence in the maximal ideal of $A$, and $\dim A = \operatorname{ht} \mathfrak{m} \le \dim S = |\sigma|$. The sequence $rs$ localises in the same way to a regular sequence in the maximal ideal of $A$, and $\mathfrak{p}A$ is an associated prime of $A/(rs)A$ with the height of $\mathfrak{p}$. Proposition~\ref{prop:height_le_length_of_mem_associatedPrimes} then gives $\operatorname{ht} \mathfrak{p} = \operatorname{ht} \mathfrak{p}A \le |rs|$.
'''

# --- The multiplicity estimate (C1.3, 30 October 2026) --------------------------------------------------

# --- zero sets and heights on the torus ----------------------------------------
[[node]]
platform = "DiazModulus.isPrime_iInf_ker_eval_of_analytic"
section = "The multiplicity estimate: zero sets and heights on the torus"
env = "lemma"
title = 'Zero sets of analytic images are prime'
statement = '''
Let $E$ be a normed space over $\C$, $\sigma$ a type and $F : E \to \C^\sigma$ a map each of whose coordinates $e \mapsto F(e)_i$ is analytic on all of $E$. Then the polynomials of $\C[X_\sigma]$ vanishing at every point $F(e)$, $e \in E$ (the ideal $\bigcap_{e} \ker \mathrm{eval}_{F(e)}$), form a prime ideal.
'''
source = '''Classical complex analysis: the identity theorem for analytic functions on a connected normed space.'''
sketch = '''
The ideal does not contain $1$. If $fg$ vanishes on the image while $f(F(e_0)) \ne 0$, then $g \circ F$ vanishes near $e_0$, and the identity theorem on the connected space $E$ makes it vanish everywhere.
'''

[[node]]
platform = "DiazModulus.le_height_torusVanishing"
env = "lemma"
title = 'The torus points have codimension at least the rank'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). The ideal of the polynomials vanishing at every point $(x, y, y^{-1})$ (\texttt{torusPoint x y}), $x \in \C^{A_0}$, $y \in (\C^\times)^{A_1}$, has height at least $|A_1|$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical dimension theory: the torus $\mathbb{G}_m^{A_1}$ has codimension $|A_1|$ in $\mathbb{A}^{2|A_1|}$.'''
sketch = '''
A chain of $|A_1| + 1$ primes below that ideal: the $k$-th member is the ideal of the image of the analytic map setting $(Y_i, Z_i) = (e^{u_i}, e^{-u_i})$ for the indices numbered below $k$ and leaving the others free; each is prime by Lemma~\ref{lem:isPrime_iInf_ker_eval_of_analytic}, and $Y_iZ_i - 1$ separates consecutive members.
'''

[[node]]
platform = "DiazModulus.torusVanishing_univ"
env = "proposition"
title = 'The ideal of the torus'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. Then $I(G) = J_0$, $J_0$ is prime, and $\operatorname{ht} J_0 \ge |A_1|$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical: the ideal of the torus $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$ in its coordinate ring.'''
sketch = '''
If $f$ vanishes on $G$, shifting exponents gives a polynomial $q$ with $q \prod_i Y_i$ vanishing everywhere, so $q = 0$, and $f \equiv \prod_i Z_i^N q = 0$ modulo $J_0$. $I(G)$ is the ideal of the image of $(x, u) \mapsto (x, e^u, e^{-u})$, prime by Lemma~\ref{lem:isPrime_iInf_ker_eval_of_analytic}; the height is Lemma~\ref{lem:le_height_torusVanishing}.
'''

[[node]]
platform = "DiazModulus.torusVanishing_torusZero"
env = "lemma"
title = 'The Nullstellensatz on the torus'
statement = '''
Let $K$ be an algebraically closed field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For every ideal $\mathfrak{b} \supseteq J_0$ of $R$, $I(Z_G(\mathfrak{b})) = \sqrt{\mathfrak{b}}$, and $Z_G(\mathfrak{b}) = \emptyset$ implies $\mathfrak{b} = R$.
'''
source = '''Classical: Hilbert's Nullstellensatz, on the torus $K^{A_0} \times (K^\times)^{A_1}$.'''
sketch = '''
A zero of $\mathfrak{b} \supseteq J_0$ in $K^{A_0} \times K^{A_1} \times K^{A_1}$ has $Y_i Z_i = 1$, so it is the point of some $g \in G$; Hilbert's Nullstellensatz for the affine zero locus gives the radical.
'''

[[node]]
platform = "DiazModulus.torusTransl_algEquiv"
env = "lemma"
title = 'Translations of the torus'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the $K$-algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. Then for $g \in G$ there is a $K$-algebra automorphism $e$ of $R$ with $e(f) = \sigma_g f$ for every $f$, which maps every box \texttt{torusBox K A$_0$ A$_1$ T} onto itself and $J_0$ onto $J_0$, with $e(I(S)) = I(\{z : zg \in S\})$ for every $S \subseteq G$ and $Z_G(e(\mathfrak{b})) = \{z : zg \in Z_G(\mathfrak{b})\}$ for every ideal $\mathfrak{b}$. Moreover $\sigma_g \circ \sigma_h = \sigma_{gh}$ and $\sigma_1$ is the identity.
'''
source = '''Classical: translations of $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$; compare \cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.3.'''
sketch = '''
Lemma~\ref{lem:exists_translation_algEquiv} gives an automorphism with the same values on the variables, preserving boxes and $J_0$; it equals $\sigma_g$. The rest follows from $(\sigma_g f)(z) = f(zg)$ and is checked on the variables.
'''

[[node]]
platform = "DiazModulus.ringKrullDim_quotient_sectionIdeal_le"
env = "lemma"
title = 'The dimension of a section ideal'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). \texttt{sectionIdeal $\ell$ $\psi$} is the ideal $J_0 + (\sum_{h'} \ell_{k,h'} X_{h'})_k + (Y^{\psi_k^+} Z^{\psi_k^-} - 1)_k$ of $R$. Let $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in K^{A_0}$ and $\psi_i \in \Z^{A_1}$ (all $h \in A_0$, $i \in A_1$), with the forms normalised off $H$ ($\ell_{h,h} = 1$, $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$) and the rows triangular off $J$ ($\psi_{i,i} \ne 0$, $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$). Then $\dim R/\mathfrak{a} \le |H| + |J|$ for $\mathfrak{a}$ = \texttt{sectionIdeal $\ell$ $\psi$}. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical commutative algebra: dimension does not grow along an integral extension.'''
sketch = '''
$R/\mathfrak{a}$ is integral over $K[t_H, s_J]$, $t_h \mapsto X_h$, $s_j \mapsto Y_j + Z_j$: $X_h$ by $\ell_h$ for $h \notin H$; $Y_j, Z_j$ are roots of $T^2 - (Y_j + Z_j)T + 1$; and for $i \notin J$, a power $Y_i^{\pm\psi_{i,i}}$ is a Laurent monomial in the $Y_j$, $j \in J$. Integral extensions do not raise the dimension.
'''

[[node]]
platform = "DiazModulus.card_le_height_add_of_ringKrullDim_quotient_le"
env = "proposition"
title = 'Height plus dimension in a polynomial ring'
statement = '''
Let $K$ be an algebraically closed field, $\sigma$ a finite type and $\mathfrak{p}$ a prime ideal of $K[X_\sigma]$ (\texttt{MvPolynomial $\sigma$ K}) with $\dim K[X_\sigma]/\mathfrak{p} \le e$ for some $e \in \N$. Then $|\sigma| \le \operatorname{ht}\mathfrak{p} + e$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical dimension theory of polynomial rings over a field: $\operatorname{ht}\mathfrak{p} + \dim K[X_\sigma]/\mathfrak{p} = |\sigma|$; compare \cite[\S17]{Mat86}.'''
sketch = '''
Localise at a maximal ideal $\mathfrak{m} = (X - a) \supseteq \mathfrak{p}$, where Lemma~\ref{lem:exists_isWeaklyRegular_vanishing} gives a regular sequence of length $|\sigma|$. A maximal weakly regular list $ps$ inside $\mathfrak{p}$ has length at most $\operatorname{ht}\mathfrak{p}$ and $\mathfrak{p}$ lies in an associated prime $\mathfrak{q}$ of the quotient by $ps$; then Lemma~\ref{lem:exists_isRegular_quotient_ofList} and Lemma~\ref{lem:length_le_ringKrullDim_quotient_of_mem_associatedPrimes} give $|\sigma| \le |ps| + \dim A/\mathfrak{q} \le \operatorname{ht}\mathfrak{p} + e$.
'''

# --- characters and subgroups of the torus ----------------------------------------
[[node]]
platform = "DiazModulus.eval_eq_zero_of_sum_mul_char"
section = "The multiplicity estimate: characters and subgroups of the torus"
env = "lemma"
title = "Dedekind's lemma with polynomial coefficients"
statement = '''
Let $\Gamma$ be a commutative group, $A_0$ a type, $\iota$ a finite type, $\rho$ a homomorphism from $\Gamma$ to the additive group $\C^{A_0}$ (\texttt{$\Gamma$ $\to$* Multiplicative (A$_0$ $\to$ $\C$)}), $\chi_c : \Gamma \to \C^\times$ ($c \in \iota$) pairwise distinct characters, and $F_c \in \C[X_{A_0}]$. If $\sum_c F_c(\rho(g))\,\chi_c(g) = 0$ for every $g \in \Gamma$, then $F_c(\rho(g)) = 0$ for every $c$ and every $g$.
'''
source = '''Classical: Dedekind's (Artin's) lemma on the linear independence of characters, here with coefficients that are polynomials along an additive homomorphism.'''
sketch = '''
By finite differences: $g \mapsto F(\rho(g))$ has finite difference degree, while a non-zero multiple of a non-trivial character has none. Induction on the set of characters and, inside it, on the degree of one coefficient, applied to the translated relation.
'''

[[node]]
platform = "DiazModulus.eval_eq_zero_on_span_of_addSubgroup"
env = "lemma"
title = 'Vanishing on an additive subgroup and its span'
statement = '''
Let $A_0$ be a type, $\Lambda$ an additive subgroup of $\C^{A_0}$ and $F \in \C[X_{A_0}]$ a polynomial vanishing at every point of $\Lambda$. Then $F$ vanishes at every point of the complex span of $\Lambda$.
'''
source = '''Classical: a polynomial vanishing on infinitely many points of a line vanishes on the line.'''
sketch = '''
For $z = \sum_{i < n} c_i x_i$ with $x_i \in \Lambda$, induction on $n$ for every base point $y \in \Lambda$: the one-variable polynomial $t \mapsto F(y + r + t x_0)$ vanishes at every integer, hence identically.
'''

[[node]]
platform = "DiazModulus.exists_coordinate_section_add"
env = "lemma"
title = 'Coordinate sections of a subspace'
statement = '''
Let $K$ be a field, $A_0$ a finite type and $V$ a subspace of $K^{A_0}$. Then there are $H \subseteq A_0$ and vectors $\ell_h \in K^{A_0}$ ($h \in A_0$) with $\ell_h = 0$ for $h \in H$, normalised off $H$ ($\ell_{h,h} = 1$ and $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$), such that $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \text{ for every } h\}$, every $x \in K^{A_0}$ agrees on $H$ with some element of $V$, and $\dim V = |H|$.
'''
source = '''Classical linear algebra: a subspace as a graph over a coordinate subspace (reduced row echelon form).'''
sketch = '''
Take $H$ of largest size with $V \to K^H$ onto; maximality makes it injective. With $e_{h'}$ the lift of the indicator of $h'$, put $\ell_h = X_h - \sum_{h' \in H} (e_{h'})_h X_{h'}$ for $h \notin H$.
'''

[[node]]
platform = "DiazModulus.exists_coordinate_section_mul"
env = "lemma"
title = 'Coordinate sections of a lattice'
statement = '''
Let $A_1$ be a finite type and $\Phi$ a subgroup of $\Z^{A_1}$. Then there are $J \subseteq A_1$ and $\psi_i \in \Phi$ ($i \in A_1$) such that the only element of $\Phi$ vanishing off $J$ is $0$, $\psi_i = 0$ for $i \in J$, $\psi_{i,i} \ne 0$ and $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$, and every complex subspace $L \subseteq \C^{A_1}$ with $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \text{ for every } i\}$ has $\dim L = |J|$.
'''
source = '''Classical: a maximal coordinate set avoiding a lattice, and the triangular system it gives.'''
sketch = '''
Take $J$ of largest size with $\Phi \cap \Z^J = 0$. For $i \notin J$ maximality gives a non-zero $\psi_i \in \Phi$ supported on $J \cup \{i\}$, with $\psi_{i,i} \ne 0$. The system is triangular off $J$, so restriction to $J$ is a linear bijection from $L$ onto $\C^J$.
'''

[[node]]
platform = "DiazModulus.linearIndependent_on_subgroup"
env = "proposition"
title = 'Independence on a subgroup with coordinate sections'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). Let $\Gamma$ be a subgroup of $G$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Let $f \in R$ be reduced (no monomial of $f$ is divisible by any $Y_iZ_i$; \texttt{torusReduced}), with every monomial in the variables $X_h$ ($h \in H$), $Y_j$, $Z_j$ ($j \in J$) only. If $f$ vanishes at every $g \in \Gamma$, then $f = 0$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1; the classical independence of characters (Dedekind), applied to the stabiliser.'''
sketch = '''
On $\Gamma$, $f = \sum_\lambda F_\lambda(x_g)\,y_g^\lambda$ with distinct characters $y^\lambda$ ($\lambda \in \Z^J$). Lemma~\ref{lem:eval_eq_zero_of_sum_mul_char} gives $F_\lambda(x_g) = 0$ on $\Gamma$, Lemma~\ref{lem:eval_eq_zero_on_span_of_addSubgroup} on the span of the $x_g$, and the section $H$ gives $F_\lambda = 0$.
'''

[[node]]
platform = "DiazModulus.torusStab_subgroup"
env = "lemma"
title = 'The stabiliser of a zero set'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. Let $\mathfrak{p} \supseteq J_0$ be a prime of $R$. Then there is a subgroup $\Gamma$ of $G$ with underlying set \texttt{torusStab $\mathfrak{p}$} such that for every $g$ the coset $\Gamma g^{-1} = \{z : zg \in \Gamma\}$ satisfies $Z_G(I(\Gamma g^{-1})) = \Gamma g^{-1}$, and $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the stabiliser of the zero set of $\mathfrak{p}$).'''
sketch = '''
Inverses: for $g \in \Gamma$, $\sigma_g\mathfrak{p}$ is a prime with $Z(\sigma_g\mathfrak{p}) = Z(\mathfrak{p}) g^{-1} \supseteq Z(\mathfrak{p})$, so $\sigma_g\mathfrak{p} \subseteq \mathfrak{p}$ by Lemma~\ref{lem:torusVanishing_torusZero}, with equality since the heights agree (Lemma~\ref{lem:torusTransl_algEquiv}). A coset is the common zero set of translates of $\mathfrak{p}$; distinct cosets have no common zero, so their ideals are comaximal by the torus Nullstellensatz.
'''

# --- invariant derivations ----------------------------------------
[[node]]
platform = "DiazModulus.torusDeriv_mem_torusBox"
section = "The multiplicity estimate: invariant derivations"
env = "lemma"
title = 'Invariant derivations preserve the boxes'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. Let $w \in K^{A_0} \times K^{A_1}$. Then $D_w$ maps every box \texttt{torusBox K A$_0$ A$_1$ T} (the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$) into itself, and maps $J_0$ into itself.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.11 (the invariant derivations of $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$).'''
sketch = '''
$D_w$ sends a monomial to a combination of the monomial itself (from $Y_i$, $Z_i$, which are eigenvectors) and of monomials with one $X_h$ fewer, so boxes are stable. $D_w(Y_iZ_i - 1) = 0$, and the Leibniz rule keeps the ideal generated by these elements stable.
'''

[[node]]
platform = "DiazModulus.torusDeriv_torusTransl"
env = "lemma"
title = 'Invariant derivations commute with translations'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the $K$-algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. Then $D_w(\sigma_g f) = \sigma_g(D_w f)$ for every $w$, every $g \in G$ and every $f \in R$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.11 and (8.10): $D(P) \circ \tau_g = D(P \circ \tau_g)$.'''
sketch = '''
Induction on $f$: both sides are additive and kill constants, and the Leibniz rule reduces the claim to the variables, where $D_w(X_h + x_h) = \xi_h$, $D_w(y_iY_i) = y_i\eta_iY_i$ and $D_w(y_i^{-1}Z_i) = -y_i^{-1}\eta_iZ_i$.
'''

[[node]]
platform = "DiazModulus.eval_torusDerivList_torusCoeffPoly"
env = "lemma"
title = 'Derivatives at a torus point'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. Let $D_0, D_1 \in \N$, let $c$ be a family of coefficients in $K$ indexed by the pairs $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, D_0\}^{A_0}$ and $t \in \{0, \dots, 2D_1\}^{A_1}$, and $P_c$ = \texttt{torusCoeffPoly D$_0$ D$_1$ c} $= \sum_\lambda c_\lambda X^\tau \prod_i Y_i^{(t_i - D_1)_+} Z_i^{(D_1 - t_i)_+}$. For $w = (\xi, \eta)$ and $\lambda$ let $\mathrm{Op}^\lambda_w = \sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (t_i - D_1)$, a linear operator on $K[X_{A_0}]$. Then for $w_1, \dots, w_r$, $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$, the value of $D_{w_1} \cdots D_{w_r} P_c$ at $(x, y, y^{-1})$ is $\sum_\lambda c_\lambda\, (\mathrm{Op}^\lambda_{w_1} \cdots \mathrm{Op}^\lambda_{w_r} X^\tau)(x)\, \prod_i y_i^{t_i - D_1}$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.1 and Lemma 8.11: the derivatives $D_{w_1} \cdots D_{w_r} P$ of the premise of Th. 8.1.'''
sketch = '''
$D_w$ acts on $X$-polynomials as $\sum_h \xi_h \partial/\partial X_h$, and each Laurent monomial of the box, $\prod_i Y_i^{(t_i - D_1)_+} Z_i^{(D_1 - t_i)_+}$, is an eigenvector of $D_w$ with eigenvalue $\sum_i \eta_i (t_i - D_1)$; Leibniz and induction on the list, then evaluation.
'''

[[node]]
platform = "DiazModulus.eval_torusDerivList_eq_zero"
env = "lemma"
title = 'The premise of the multiplicity estimate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). Let $B_0$ be a type, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$) with span $W$, $D_0, D_1, M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, coefficients $c$ and $P_c$ as in \texttt{torusCoeffPoly}, and assume the premise of the Definition \texttt{MultiplicityEstimateElem} for the complex numbers $a_{ji}$: for every $r \le dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s \in \Z^{B_1}$ with $|s_j| \le dM_1$, $\sum_\lambda c_\lambda (\mathrm{Op}^\lambda_{w_{k_1}} \cdots \mathrm{Op}^\lambda_{w_{k_r}} X^\tau)(\sum_j s_j u_j) \prod_i (\prod_j a_{ji}^{s_j})^{t_i - D_1} = 0$, with $\mathrm{Op}^\lambda_w$ as in Lemma~\ref{lem:eval_torusDerivList_torusCoeffPoly}. Then $D_l P_c$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $dM_0$ and every $s$ with $|s_j| \le dM_1$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Th. 8.1 (\S8.1): the vanishing hypothesis, for $G = \mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$.'''
sketch = '''
By Lemma~\ref{lem:eval_torusDerivList_torusCoeffPoly} the premise says that evaluation at $g_s$ kills $D_{w_{k_1}} \cdots D_{w_{k_n}} P_c$ for $n \le dM_0$, hence the span $V_n$ of these. Since $w \mapsto D_w$ is linear, $D_w V_n \subseteq V_{n+1}$ for $w \in W$, so $D_l P_c \in V_{|l|}$.
'''

[[node]]
platform = "DiazModulus.vanishOrd_ideal"
env = "lemma"
title = 'Vanishing to an order is an ideal'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). Then \texttt{vanishOrd J W t} is the underlying set of an ideal $I$ of $R$, and $J_0 \subseteq J$ implies $J_0 \subseteq I$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (vanishing to a given order along $W$ on a finite set).'''
sketch = '''
Each $D_l$ is linear. Stability under multiplication goes by induction on the length bound, writing a list as $L$ followed by $b$ and using Leibniz for $D_b$. If $J_0 \subseteq J$, then $J_0$ is stable under every $D_w$ (Lemma~\ref{lem:torusDeriv_mem_torusBox}), hence under every $D_l$.
'''

# --- tangent duals and multiplicities ----------------------------------------
[[node]]
platform = "DiazModulus.exists_tangent_dual"
section = "The multiplicity estimate: tangent duals and multiplicities"
env = "lemma"
title = 'Dual derivations on a standard set'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $\ell_h \in K^{A_0}$ ($h \in A_0$), $\psi_i \in \Z^{A_1}$ ($i \in A_1$), $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \text{ for every } h\}$, $L = \{v \in K^{A_1} : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \text{ for every } i\}$, $W$ a subspace of $K^{A_0} \times K^{A_1}$ and $S \subseteq V \times T_\psi$. Then there are $n \in \N$, $w_1, \dots, w_n \in W$ and $P_1, \dots, P_n \in I(S)$ with $n + \dim(W \cap (V \times L)) = \dim W$ and $D_{w_i} P_j - \delta_{ij} \in I(S)$ for all $i, j$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.14.'''
sketch = '''
Let $\beta(\xi, \eta) = ((\sum_{h'} \ell_{h,h'}\xi_{h'})_h, (\sum_{i'} \psi_{i,i'}\eta_{i'})_i)$, whose kernel is $V \times L$. On the span of the forms $\sum_{h'} \ell_{h,h'} X_{h'}$ and the $Y^{\psi_k^+}Z^{\psi_k^-} - 1$, which vanish on $S$, $D_w$ acts modulo $I(S)$ by the constants of $\beta(w)$. Dual bases of $\beta(W)$ give the $w_i$ and $P_j$, and rank--nullity gives $n$.
'''

[[node]]
platform = "DiazModulus.exists_tangent_dual_cosets"
env = "lemma"
title = 'Dual derivations on a union of cosets'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. Let $\Gamma$ be a subgroup of $G$. The cosets of $\Gamma$ are comaximal: $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$, where $\Gamma g^{-1} = \{z : zg \in \Gamma\}$. $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. Let $M_1 \in \N$, $w_1, \dots, w_n \in \C^{A_0} \times \C^{A_1}$ and $P_1, \dots, P_n \in I(\Gamma)$ with $D_{w_i} P_j - \delta_{ij} \in I(\Gamma)$. Then there are $Q_1, \dots, Q_n$ and $C_Q \in \N^{A_0 \sqcup A_1}$ with every $Q_j$ in the box $C_Q$, $Q_j \in I(\Sigma \cdot \Gamma)$ and $D_{w_i} Q_j - \delta_{ij} \in I(\Sigma \cdot \Gamma)$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.15.'''
sketch = '''
$\Sigma \cdot \Gamma$ lies in finitely many cosets of $\Gamma$, whose ideals are pairwise comaximal; the Chinese remainder theorem gives $B_c \equiv 1$ on the coset $c$ and $B_c = 0$ on the others. Put $Q_j = \sum_c B_c^2\,\sigma_{r_c} P_j$; Leibniz and Lemma~\ref{lem:torusDeriv_torusTransl} give the congruences, and Lemma~\ref{lem:restrictSupport_block_filtration} a box.
'''

[[node]]
platform = "DiazModulus.derivation_pow_mul_mem"
env = "lemma"
title = 'Derivatives of a product along dual derivations'
statement = '''
Let $R$, $S$ be commutative rings with $S$ an $R$-algebra, $D_1, \dots, D_n$ $R$-derivations of $S$, $J$ an ideal of $S$ and $Q_1, \dots, Q_n \in J$ with $D_i Q_j - \delta_{ij} \in J$. Let $P \in S$, $\alpha \in \N^n$ and $k = (k_1, \dots, k_m)$ a list of indices with $m \le \alpha_1 + \cdots + \alpha_n$. Then $D_{k_1} \circ \cdots \circ D_{k_m} (P \prod_j Q_j^{\alpha_j}) - c \in J$, where $c = (\prod_i \alpha_i!)\,P$ if every index $i$ occurs exactly $\alpha_i$ times in $k$, and $c = 0$ otherwise.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.16.'''
sketch = '''
Induction on the list, peeling off the innermost derivation, computing in $S/J$: Leibniz writes $D_k(P Q^\alpha)$ as $D_kP\,Q^\alpha + \sum_j \alpha_j D_kQ_j\,P Q^{\alpha - e_j}$, and $D_kQ_j \equiv \delta_{kj}$. No commutation of the derivations is needed.
'''

[[node]]
platform = "DiazModulus.card_multiIndex"
env = "lemma"
title = 'Counting multi-indices'
statement = '''
For $n, S \in \N$, the number of $\alpha : \{1, \dots, n\} \to \{0, \dots, S\}$ with $\alpha_1 + \cdots + \alpha_n \le S$ is $\binom{S + n}{n}$.
'''
source = '''Classical combinatorics: stars and bars.'''
sketch = '''
Adding the slack $S - \sum_i \alpha_i$ as an extra entry is a bijection onto the tuples in $\N^{n+1}$ of sum $S$, counted by stars and bars.
'''

[[node]]
platform = "DiazModulus.wustholz_le_boxHilb"
env = "proposition"
title = 'An inequality of W\"ustholz at finite level'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). Let $J$, $A$ be ideals of $R$, $W$ a subspace of $\C^{A_0} \times \C^{A_1}$ and $S_0 \in \N$ with $A \subseteq$ \texttt{vanishOrd J W S$_0$}; let $w_1, \dots, w_n \in W$ and $Q_1, \dots, Q_n \in J$ in a box $C_Q$ with $D_{w_i} Q_j - \delta_{ij} \in J$. Then $\binom{S_0 + n}{n}\, h_J(T) \le h_A(T + S_0 C_Q)$ for every $T$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), (8.20) (W\"ustholz's argument) with Lemmas 8.15 and 8.16.'''
sketch = '''
With $e_1, \dots, e_h$ in the box $T$ independent modulo $J$, $h = h_J(T)$ (Lemma~\ref{lem:exists_boxHilb_family}), the products $e_i Q^\alpha$, $|\alpha| \le S_0$ (Lemma~\ref{lem:card_multiIndex} counts them), lie in the box $T + S_0 C_Q$ and are independent modulo $A$: applying $D^\beta$ to a relation and Lemma~\ref{lem:derivation_pow_mul_mem} isolate the coefficients of length $|\beta|$, by induction on $|\beta|$. Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} concludes.
'''

# --- the obstruction, and Roy's theorem with no hypothesis ----------------------------------------
[[node]]
platform = "DiazModulus.exists_chain_prime"
section = "The multiplicity estimate: the obstruction, and Roy's theorem with no hypothesis"
env = "lemma"
title = 'The descent to a prime'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. Let $P \in R$, $W \subseteq \C^{A_0} \times \C^{A_1}$ a subspace, $M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, and assume that $D_l P$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $d M_0$ and every $s$ with $|s_j| \le d M_1$. Assume moreover $P \notin J_0$. Then there are $r < d$ and a prime $\mathfrak{p} \supseteq J_0$ with $P \in \mathfrak{p}$ such that (b) $\sigma_{g_s}(D_l P) \in \mathfrak{p}$ for $|s_j| \le (r+1) M_1$ and every list $l$ of elements of $W$ of length at most $(r+1) M_0$; (c) for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the chain of ideals and the choice of $\mathfrak{p}$).'''
sketch = '''
The heights of $I_0 \subseteq \cdots \subseteq I_d$ satisfy $\operatorname{ht} I_0 \ge |A_1| + 1$ ($P \notin J_0$, $J_0$ prime of height $\ge |A_1|$, Proposition~\ref{prop:torusVanishing_univ}) and $\operatorname{ht} I_d \le |A_0| + 2|A_1|$ ($I_d$ vanishes at the point of $1$). So the height stops growing at some $r < d$; a prime $\mathfrak{p} \supseteq I_{r+1}$ of that height gives (b), and (c) follows since $\sigma_z$ preserves heights (Lemma~\ref{lem:torusTransl_algEquiv}).
'''

[[node]]
platform = "DiazModulus.obstructionSpan_vanishOrd"
env = "lemma"
title = 'The obstruction ideal'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. Let $D_0, D_1 \in \N$, $P$ in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} (degree at most $D_0$ in each $X_h$ and at most $D_1$ in each pair $Y_i, Z_i$), $r, M_0, M_1 \in \N$, and $\mathfrak{p}$ an ideal such that $\sigma_{g_s}(D_l P) \in \mathfrak{p}$ for $|s_j| \le (r+1) M_1$ and every list $l$ of elements of $W$ of length at most $(r+1) M_0$. Let $S \subseteq G$ with $v\gamma \in Z_G(\mathfrak{p})$ for $v \in Z_G(\mathfrak{p})$, $\gamma \in S$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Then $F_{\mathfrak{p}}$ lies in that box and $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ S)) W M$_0$}.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the ideal generated by the translates of the derivatives of $P$).'''
sketch = '''
A generator $\sigma_{g_s v}(D_l P)$ stays in the box (Lemma~\ref{lem:torusDeriv_mem_torusBox}, Lemma~\ref{lem:torusTransl_algEquiv}). For a $W$-list $l'$ of length $\le M_0$, $D_{l'}\sigma_{g_s v} D_l P = \sigma_{g_s v} D_{l' + l} P$ (Lemma~\ref{lem:torusDeriv_torusTransl}), whose value at $g_{s'}\gamma$ is that of $\sigma_{g_{s+s'}} D_{l'+l} P \in \mathfrak{p}$ at $v\gamma \in Z_G(\mathfrak{p})$, i.e. $0$; Lemma~\ref{lem:vanishOrd_ideal} passes to the ideal.
'''

[[node]]
platform = "DiazModulus.exists_le_translate_of_le_torusVanishing"
env = "lemma"
title = 'Primes over the obstruction ideal contain a translate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. Let $r \in \N$ and $\mathfrak{p} \supseteq J_0$ a prime such that for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Let $\mathfrak{a} \subseteq I(\text{torusStab}\,\mathfrak{p})$ be an ideal and $\mathfrak{q} \supseteq A$ a prime. Then $\mathfrak{a} \subseteq \sigma_g^{-1}(\mathfrak{q})$ for some $g \in G$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the zero set of $A$ meets finitely many cosets of the stabiliser).'''
sketch = '''
For $z \in Z_G(A)$, $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ (Lemma~\ref{lem:torusVanishing_torusZero}, Lemma~\ref{lem:torusTransl_algEquiv}), one of the finitely many minimal primes of $I_r$; points giving the same prime differ by the stabiliser. So finitely many translates of $\mathfrak{a}$ have their intersection in $\sqrt{A} \subseteq \mathfrak{q}$, and prime avoidance picks one.
'''

[[node]]
platform = "DiazModulus.le_height_obstruction"
env = "lemma"
title = 'The height of the obstruction ideal'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. \texttt{sectionIdeal $\ell$ $\psi$} is the ideal $J_0 + (\sum_{h'} \ell_{k,h'} X_{h'})_k + (Y^{\psi_k^+} Z^{\psi_k^-} - 1)_k$ of $R$. Let $r \in \N$, $d = |A_0| + |A_1|$, $\mathfrak{p} \supseteq J_0$ a prime such that for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Let $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$. The forms are normalised off $H$: $\ell_{h,h} = 1$ and $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$; the rows are triangular off $J$: $\psi_{i,i} \ne 0$ and $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$. If \texttt{sectionIdeal $\ell$ $\psi$} $\subseteq I(\text{torusStab}\,\mathfrak{p})$, then every prime $\mathfrak{q} \supseteq A$ has $\operatorname{ht}\mathfrak{q} \ge |A_1| + (d - (|H| + |J|))$ (truncated subtraction).
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the height of the primes over $A$).'''
sketch = '''
By Lemma~\ref{lem:exists_le_translate_of_le_torusVanishing}, $\mathfrak{a} = $ \texttt{sectionIdeal $\ell$ $\psi$} lies in some $\sigma_g^{-1}(\mathfrak{q})$, whose quotient has dimension at most $\dim R/\mathfrak{a} \le |H| + |J|$ (Lemma~\ref{lem:ringKrullDim_quotient_sectionIdeal_le}); Proposition~\ref{prop:card_le_height_add_of_ringKrullDim_quotient_le} gives $|A_0| + 2|A_1| \le \operatorname{ht} + |H| + |J|$, and $\sigma_g$ keeps heights (Lemma~\ref{lem:torusTransl_algEquiv}).
'''

[[node]]
platform = "DiazModulus.le_boxHilb_torusVanishing_subgroup"
env = "proposition"
title = 'A lower bound for the Hilbert function of a subgroup'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. Let $\Gamma$ be a subgroup of $G$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Then $\prod_{h \in H} (T_h + 1) \prod_{j \in J} (2T_j + 1) \le h_{I(\Gamma)}(T)$ for every $T$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the Hilbert function of the obstruction subgroup, bounded below).'''
sketch = '''
The monomials $X_H^a Y_J^{\lambda^+} Z_J^{\lambda^-}$ with $a_h \le T_h$ and $|\lambda_j| \le T_j$ lie in the box and are linearly independent modulo $I(\Gamma)$ by Proposition~\ref{prop:linearIndependent_on_subgroup}; Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} counts them.
'''

[[node]]
platform = "DiazModulus.hlow_le_boxHilb"
env = "proposition"
title = 'The lower side of the multiplicity estimate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $\Gamma$ be a subgroup of $G$. The cosets of $\Gamma$ are comaximal: $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$, where $\Gamma g^{-1} = \{z : zg \in \Gamma\}$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Let $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$, $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \ \forall h\}$, $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \ \forall i\}$, with $\Gamma \subseteq V \times T_\psi$, $\dim V = |H|$ and $\dim L = |J|$; let $W$ be a subspace and $n$ with $n + \dim(W \cap (V \times L)) = \dim W$; let $M_0, M_1 \in \N$ and $A$ an ideal with $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ $\Gamma$)) W M$_0$}. Let $D_0, D_1 \in \N$ and $R_e$ a finite set of $s \in \Z^{B_1}$ with $|s_j| \le M_1$, pairwise incongruent modulo $(V, \psi)$ ($s$, $s'$ are congruent when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\psi_{k,i}} = 1$ for every $k$). Then there is $C \in \N^{A_0 \sqcup A_1}$ such that, with $d = |A_0| + |A_1|$ and $D$ = \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$}, $\binom{M_0 + n}{n} |R_e| D_0^{\dim V} D_1^{\dim L}\, t^{d - (d - (\dim V + \dim L))} \le h_A(tD + C)$ for every $t \ge 1$. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the lower bound for the Hilbert function of $A$), with (8.20) and Lemma 8.15.'''
sketch = '''
Lemma~\ref{lem:exists_tangent_dual} and Lemma~\ref{lem:exists_tangent_dual_cosets} give the dual pairs on $\Sigma \cdot \Gamma$, and Proposition~\ref{prop:wustholz_le_boxHilb} gives $\binom{M_0 + n}{n} h_{I(\Sigma \cdot \Gamma)}(T) \le h_A(T + M_0 C_Q)$. Incongruent $s \ne s'$ give distinct cosets $\Gamma g_s$, whose ideals $\sigma I(\Gamma)$ (Lemma~\ref{lem:torusTransl_algEquiv}) are comaximal: Proposition~\ref{prop:exists_card_mul_boxHilb_le_translates} and Lemma~\ref{lem:boxHilb_anti} bound $|R_e| h_{I(\Gamma)}$ by $h_{I(\Sigma \cdot \Gamma)}$. Finally Proposition~\ref{prop:le_boxHilb_torusVanishing_subgroup} and Lemma~\ref{lem:box_ray_lower_bound} bound $h_{I(\Gamma)}(tD)$ below.
'''

[[node]]
platform = "DiazModulus.exists_obstruction"
env = "proposition"
title = 'The obstruction subgroup'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $P \in R$, $W \subseteq \C^{A_0} \times \C^{A_1}$ a subspace, $M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, and assume that $D_l P$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $d M_0$ and every $s$ with $|s_j| \le d M_1$. Let $D_0, D_1 \in \N$, $P$ in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} and $P \notin J_0$. Then there are $r \in \N$, an ideal $\mathfrak{p}$, a subgroup $\Gamma$ of $G$, $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$ and subspaces $V \subseteq \C^{A_0}$, $L \subseteq \C^{A_1}$ such that: the cosets of $\Gamma$ are comaximal ($I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ when $gg'^{-1} \notin \Gamma$); $H$, $J$ are coordinate sections of $\Gamma$ (as in Proposition~\ref{prop:linearIndependent_on_subgroup}); $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \ \forall h\}$ and $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \ \forall i\}$; $\Gamma \subseteq V \times T_\psi$; $\dim V = |H|$, $\dim L = |J|$ and $\dim V + \dim L < d$; and, with $A$ and $F_{\mathfrak{p}}$ as follows, For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. $F_{\mathfrak{p}}$ lies in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$}, every prime $\mathfrak{q} \supseteq A$ has $\operatorname{ht}\mathfrak{q} \ge |A_1| + (d - (\dim V + \dim L))$, and $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ $\Gamma$)) W M$_0$}.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the obstruction subgroup and its ideal).'''
sketch = '''
Lemma~\ref{lem:exists_chain_prime} gives $r$ and $\mathfrak{p}$; $\Gamma$ is the stabiliser (Lemma~\ref{lem:torusStab_subgroup}), and Lemma~\ref{lem:exists_coordinate_section_add} and Lemma~\ref{lem:exists_coordinate_section_mul} give $(H, \ell, V)$ and $(J, \psi, L)$ with $\Gamma \subseteq V \times T_\psi$. The section ideal vanishes on $\Gamma$, so Lemma~\ref{lem:le_height_obstruction} gives the heights and Lemma~\ref{lem:obstructionSpan_vanishOrd} the box and the vanishing. Properness: if $H$ and $J$ were everything, the reduced form of $\sigma_v P$ ($v \in Z_G(\mathfrak{p})$, non-empty by Lemma~\ref{lem:torusVanishing_torusZero}; Lemma~\ref{lem:torus_reduce_mem_restrictSupport}, Lemma~\ref{lem:torusTransl_algEquiv}) would vanish on $\Gamma$, hence be $0$ by Proposition~\ref{prop:linearIndependent_on_subgroup}, forcing $P \in J_0$.
'''

[[node]]
platform = "DiazModulus.multiplicityEstimateElem"
root = true
env = "theorem"
title = 'The elementary multiplicity estimate'
statement = '''
The proposition \texttt{hME} holds. In the library it is \texttt{Diaz.MultiplicityEstimateElem}, and on Prove2Me the published definition \texttt{MultiplicityEstimateElem}. It is the elementary multiplicity estimate, DALAG Th. 8.1 in the case $G^- = \{e\}$ for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ over $\C$, written in coordinates: for finite $A_0, A_1, B_0, B_1$, $d = |A_0| + |A_1|$, vectors $w_b \in \C^{A_0} \times \C^{A_1}$ with span $W$, $u_j \in \C^{A_0}$, non-zero $a_{ji}$, $D_0, D_1 \ge 1$, $M_0, M_1 \in \N$ and a non-zero coefficient vector $c$, if the polynomial $P_c$ and its derivatives $D_{w_{k_1}} \cdots D_{w_{k_r}} P_c$, $r \le dM_0$, vanish at the points $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i)$, $|s_j| \le dM_1$, then there are a subspace $V \subseteq \C^{A_0}$, integer rows $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L$ and $\ell$ with $\ell + \dim(W \cap (V \times L)) = \dim W$, such that $\dim V + \dim L < d$ and every set $R$ of $s$ with $|s_j| \le M_1$, pairwise incongruent modulo $(V, \varphi)$, satisfies $\binom{M_0 + \ell}{\ell} |R|\, D_0^{\dim V} D_1^{\dim L} \le 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|} D_0^{|A_0|} D_1^{|A_1|}$. With Theorem~\ref{thm:strong_six_exponentials} (Roy's strong six exponentials theorem under \texttt{hME}), it gives Roy's strong six exponentials theorem with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}).
'''
source = '''\cite[Th.~8.1]{Wal00} (\S8.1, p.~232; Chapter~8 is by D.~Roy), the case $G^-=\{e\}$, $G^+=G$, with the proof of \S8.4 (\S8.4.1, Lemmas 8.14--8.16, (8.20)) at finite level. For $G^-=\{e\}$ and finite $\Sigma$, the book notes that Theorem~8.1 is a special case of \cite[Th.~2.1]{Phi86}. Classical; routine formalisation.'''
sketch = '''
$P = P_c$ lies in the box and not in $J_0$ (Lemma~\ref{lem:torus_coeff_poly}), and Lemma~\ref{lem:eval_torusDerivList_eq_zero} turns the premise into the vanishing of $D_l P$ at the $g_s$. Proposition~\ref{prop:exists_obstruction} gives the obstruction subgroup $\Gamma$, its sections and $V \times L$ with $\dim V + \dim L < d$, and the ideal $A$. For each set $R$, Proposition~\ref{prop:hlow_le_boxHilb} bounds $h_A$ below on the rays $tD + C$; Theorem~\ref{thm:torus_hilbert_side}, with Macaulay's unmixedness Theorem~\ref{thm:unmixedHeight_mvPolynomial}, bounds it above, and Lemma~\ref{lem:le_hME_constant} turns the comparison into the stated constant. The conclusion takes $\varphi = \psi$ reindexed by an enumeration of $A_1$ and $\ell = \dim W - \dim(W \cap (V \times L))$.
'''

[[node]]
platform = "DiazModulus.strong_six_exponentials_unconditional"
root = true
env = "theorem"
title = "Roy's strong six exponentials theorem, with no hypothesis"
statement = '''
Here $\overline{\Q}$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal{L}}$ is the $\overline{\Q}$-vector space spanned by $1$ and $\mathcal{L}$ (\texttt{Qbar} and \texttt{LogAlgTilde} of the library). Let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\overline{\Q}$. Then $x_i y_j \notin \widetilde{\mathcal{L}}$ for some $i, j$. This is Roy's strong six exponentials theorem, with no hypothesis: Theorem~\ref{thm:strong_six_exponentials} proves it under the hypothesis \texttt{hME}, and Theorem~\ref{thm:multiplicityEstimateElem} proves that hypothesis.
'''
source = '''Roy's strong six exponentials theorem: \cite{Roy92}, Cor.~2; \cite[Cor.~11.16]{Wal00} (\S11.6.1; this node is its case $d=2$, $\ell=3$). Here from Theorem~\ref{thm:strong_six_exponentials} and the multiplicity estimate, \cite[Th.~8.1]{Wal00} in the case $G^-=\{e\}$ after \cite{Phi86}. Classical.'''
sketch = '''
Apply Theorem~\ref{thm:strong_six_exponentials} to Theorem~\ref{thm:multiplicityEstimateElem}.
'''

# --- Roy's Corollary 1 ----------------------------------------
[[node]]
platform = "DiazModulus.roy_field_lifts"
section = "Roy's Corollary 1: the rank of a matrix of logarithms"
env = "lemma"
title = "Lifts through Roy's map"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. A subspace $S \subseteq \C^d$ is \emph{rational} if it is spanned by vectors with algebraic coordinates. For $\omega \in \C^m$, Roy's map $\Upsilon : \C^d \times \C^{m \times d} \to \C^d$ is $\Upsilon(x, y)_i = x_i + \sum_{k=1}^m \omega_k y_{k,i}$, and $\Upsilon_1(y) = \Upsilon(0, y)$.

Let $z_1, \dots, z_{\ell} \in \widetilde{\mathcal L}^d$. Then there are $m \geq 1$ and algebraic numbers $\omega_1, \dots, \omega_m$, linearly independent over $\Q$, whose $\Q$-span $k$ contains $1$ and is closed under multiplication (so $k$ is a number field), and vectors $\eta_{b,i} = (x, y)$ with $x \in k^d$ and $y \in \mathcal{L}^{m \times d}$, such that $\Upsilon(\eta_{b,i}) = \omega_b z_i$ for all $b \leq m$ and $i \leq \ell$.
'''
source = '''\cite[\S11.6.2, Lemma~11.18(4)]{Wal00}, after \cite{Roy92}, proof of Th.~4; lifts of a $\Q$-basis replace the appeal to Baker's theorem. Routine.'''
sketch = '''
Write each coordinate of each $z_i$ as $\sum_l f_l g_l$ with $f_l \in \Qbar$ and $g_l \in \{1\} \cup \mathcal{L}$, let $k$ be the number field generated by all the $f_l$ and $\omega$ a $\Q$-basis of $k$. Since $\mathcal{L}$ is a $\Q$-vector space, a product $cg$ with $c \in k$ and $g \in \{1\} \cup \mathcal{L}$ has the shape $u + \sum_k \omega_k v_k$ with $u \in k$ and $v_k \in \mathcal{L}$ (take $u = c$ if $g = 1$; otherwise expand $c = \sum_k r_k \omega_k$ and take $v_k = r_k g$). The shape survives finite sums; applied to $\omega_b z_i$ it gives $\eta_{b,i}$.
'''

[[node]]
platform = "DiazModulus.roy_upsilon_dims"
env = "lemma"
title = "Dimensions under Roy's map"
statement = '''
Let $\Upsilon : \C^d \times \C^{m \times d} \to \C^d$ be Roy's map for some $\omega \in \C^m$ (Lemma~\ref{lem:roy_field_lifts}). For every subspace $U \subseteq \C^d$ and every subspace $X \subseteq \C^d \times \C^{m \times d}$: $\dim \Upsilon^{-1}(U) = \dim U + md$; $\ker \Upsilon$ is spanned by the vectors $(-\omega_k e_i, e_{k,i})$ ($k \leq m$, $i \leq d$); and $\dim(\ker\Upsilon + X) = md + \dim \Upsilon(X)$.
'''
source = '''\cite[\S11.6.2, Lemma~11.18(1)--(2)]{Wal00}. Routine.'''
sketch = '''
$\Upsilon$ is onto, since $\Upsilon(u, 0) = u$; rank--nullity for $\Upsilon$ followed by $\C^d \to \C^d/U$ gives the first claim. Each $(-\omega_k e_i, e_{k,i})$ is in the kernel, and a kernel vector $z$ equals $\sum_{k,i} z_{2,(k,i)}(-\omega_k e_i, e_{k,i})$. Finally $\ker\Upsilon + X = \Upsilon^{-1}(\Upsilon(X))$, and the first claim applies to $U = \Upsilon(X)$.
'''

[[node]]
platform = "DiazModulus.roy_intKer_image"
env = "lemma"
title = "The image of an integer kernel"
statement = '''
Let $\omega_1, \dots, \omega_m$ be algebraic and linearly independent over $\Q$, $\Upsilon_1$ as in Lemma~\ref{lem:roy_field_lifts}, and $L_1 \subseteq \C^{m \times d}$ the common kernel of finitely many linear forms with integer coefficients. Then $\dim L_1 \leq m \dim \Upsilon_1(L_1)$, and $\Upsilon_1(L_1)$ is a rational subspace of $\C^d$.
'''
source = '''\cite[\S11.6.2, Lemma~11.18(3)]{Wal00} (the estimate $d_1' \geq m d'$), here without assuming that the obstruction subgroup is defined over $\Qbar$. Routine.'''
sketch = '''
$L_1$ is the $\C$-span of its rational points $L_{\Q}$: expand the coordinates of $y \in L_1$ in a $\Q$-basis of their $\Q$-span. So $\dim L_1 \leq \dim_{\Q} L_{\Q}$. Some $w = \dim \Upsilon_1(L_1)$ coordinates $a_1, \dots, a_w$ separate the points of $\Upsilon_1(L_1)$, and $r \mapsto (r_{(k, a_j)})_{j,k}$ is injective on $L_{\Q}$, because $\omega$ is $\Q$-free; hence $\dim_{\Q} L_{\Q} \leq mw$. Each $\Upsilon_1(r)$ with $r$ rational has algebraic coordinates, and these vectors span $\Upsilon_1(L_1)$.
'''

[[node]]
platform = "DiazModulus.roy_relation_rank_le"
env = "lemma"
title = "The rank of the relations at Roy's lifts"
statement = '''
Let $\omega$ be algebraic and $\Q$-free, $k$ its $\Q$-span, $z_1, \dots, z_{\ell} \in \C^d$ linearly independent over $\Qbar$, and $\eta_{b,i} \in k^d \times \mathcal{L}^{m \times d}$ with $\Upsilon(\eta_{b,i}) = \omega_b z_i$ (Lemma~\ref{lem:roy_field_lifts}). Let $V' \subseteq \C^d$ be a subspace and $L_1$ the common kernel of integer linear forms $\varphi_1, \dots, \varphi_q$. Let $\rho$ be the dimension of the $\Q$-span of the integer vectors $s$ with $\sum_j s_j \eta'_j \in V'$ and $\prod_i (\prod_j e^{s_j \eta''_{j,i}})^{\varphi_{k,i}} = 1$ for every $k$ (the relations of Theorem~\ref{thm:linear_subgroup_transcendence}). With $T = \Upsilon(\mathrm{span}_{\C}(V' \cap \Qbar^d) \times L_1)$,
\[ \rho \leq m \dim_{\Qbar} \bigl(\mathrm{span}_{\Qbar}(z) \cap \{\tau + 2\pi i\,\kappa : \tau \in T,\ \kappa \in \Qbar^d\}\bigr). \]
'''
source = '''A step of the proof of \cite[Th.~4]{Roy92}, in the setting of \cite[\S11.6.2]{Wal00}. The route here is an induction on $d$ that splits along a rational subspace of maximal slope and applies \cite[Th.~11.21]{Wal00} once at each semistable step, counting the periods through one extra rational subspace; \cite{Wal00} argues instead through Th.~11.5\,(3$'$) and Lemma~11.24, and \cite{Roy92} through his Th.~2. Not found in the sources read in this form; routine.'''
sketch = '''
For a relation $s$ put $\zeta = \sum_j s_j \eta_j$, so that $\sum_{b,i} s_{b,i}\,\omega_b z_i = \Upsilon(\zeta)$. The exponential condition says $\sum_i \varphi_{k,i} \zeta_{2,i} \in 2\pi i\,\Z$; a $\Q$-linear projection $\C \to \Q$ fixing $1$ gives a rational $r$ with $\zeta_2 - 2\pi i\,r \in L_1$, and $\zeta_1 \in V'$ is algebraic. So the relation maps into the space on the right. In the basis $z$ its coordinates are $\sum_b s_{b,j}\omega_b$; as in Lemma~\ref{lem:roy_intKer_image}, a choice of separating coordinates and the $\Q$-freeness of $\omega$ give the factor $m$.
'''

[[node]]
platform = "DiazModulus.roy_period_space"
env = "lemma"
title = "The space of periods"
statement = '''
Let $c \neq 0$, let $T, U \subseteq \C^d$ be subspaces with $T$ rational, and let $F$ be a finite-dimensional $\Qbar$-subspace of $U$ every element of which is $\tau + c\kappa$ with $\tau \in T$ and $\kappa \in \Qbar^d$. Then $R = T + \mathrm{span}_{\C} F$ is rational, $\dim_{\Qbar} F + \dim T \leq \dim_{\Qbar}(F \cap T) + \dim R$, and $\dim(U \cap R) + \dim T = \dim(U \cap T) + \dim R$.
'''
source = '''Linear algebra; a step of the proof of \cite[Th.~4]{Roy92} (first case), on the route of Lemma~\ref{lem:roy_relation_rank_le}. Not found in the sources read in this form; routine.'''
sketch = '''
For $x = \tau + c\kappa \in F$, $\kappa = c^{-1}(x - \tau) \in R$, so $R$ is spanned by algebraic vectors. The $\Qbar$-space of pairs $(x, \kappa)$ with $x \in F$, $\kappa \in \Qbar^d$ and $x - c\kappa \in T$ projects onto $F$ with a kernel of dimension at least $\dim T$, and its second projection has a kernel inside $F \cap T$ and an image of algebraic vectors of $R$, of $\Qbar$-dimension at most $\dim R$. Rank--nullity twice gives the inequality. As $\mathrm{span}_{\C} F \subseteq U$, $U + R = U + T$, and the dimension formula gives the identity.
'''

[[node]]
platform = "DiazModulus.roy_rational_adapted_basis"
env = "lemma"
title = "Coordinates adapted to a rational subspace"
statement = '''
For every rational subspace $S \subseteq \C^d$ there is a linear automorphism $g$ of $\C^d$ such that $g$ and $g^{-1}$ map $\Qbar^d$ into itself and $\widetilde{\mathcal L}^d$ into itself, and $v \in S$ if and only if $(gv)_i = 0$ for every $i \geq \dim S$.
'''
source = '''Classical linear algebra over $\Qbar \subseteq \C$. Routine.'''
sketch = '''
Complete a $\Qbar$-basis of the algebraic vectors of $S$ to a basis of $\Qbar^d$, and let $g$ be the inverse of the matrix with these columns. Both matrices are algebraic, so they preserve $\Qbar^d$ and $\widetilde{\mathcal L}^d$; the columns from the basis of $S$ span $S$ over $\C$ and are $\C$-independent, so their number is $\dim S$.
'''

[[node]]
platform = "DiazModulus.roy_semistable_node"
env = "proposition"
title = "Roy's Theorem 4, the semistable case"
statement = '''
Assume \texttt{hME} (the hypothesis of Theorem~\ref{thm:linear_subgroup_transcendence}; Theorem~\ref{thm:multiplicityEstimateElem} proves it), and assume the conclusion of Proposition~\ref{prop:roy_slope_bound} in every dimension $t < d$. Let $U \subseteq \C^d$ with $n = \dim U < d$ and $d \dim(U \cap S) \leq n \dim S$ for every rational $S \subseteq \C^d$, and let $z_1, \dots, z_{\ell} \in U \cap \widetilde{\mathcal L}^d$ be linearly independent over $\Qbar$. Then $(d - n)\,\ell \leq dn$.
'''
source = '''\cite[Th.~4]{Roy92}, first case; \cite[Prop.~11.19]{Wal00} (\S11.6.2), first case, through \cite[Th.~11.21]{Wal00} (Theorem~\ref{thm:linear_subgroup_transcendence}), applied once, on the route of Lemma~\ref{lem:roy_relation_rank_le}.'''
sketch = '''
Lemma~\ref{lem:roy_field_lifts} gives $\omega$ and lifts $\eta$. Theorem~\ref{thm:linear_subgroup_transcendence} at $V = \Upsilon^{-1}(U)$, of dimension $n + md$ (Lemma~\ref{lem:roy_upsilon_dims}), with the algebraic spanning family of $\ker\Upsilon$, returns $(V', \varphi, L_1)$. Put $T = \Upsilon(\mathrm{span}(V' \cap \Qbar^d) \times L_1)$: it is rational of dimension $t < d$ (Lemma~\ref{lem:roy_intKer_image}), and the inequality of the theorem becomes $(m\ell - \rho)(d - n) \leq mn(d - t)$. Lemma~\ref{lem:roy_relation_rank_le} bounds $\rho$ by the dimension of a space $F$ of periods, Lemma~\ref{lem:roy_period_space} turns $F$ into a rational $R$, and semistability at $R$ bounds $\dim(U \cap R)$. The induction hypothesis at $t$, moved to $\C^t$ by Lemma~\ref{lem:roy_rational_adapted_basis}, gives $(d - n)\dim(\mathrm{span}\,z \cap T) \leq d \dim(U \cap T)$; adding these inequalities gives the claim.
'''

[[node]]
platform = "DiazModulus.roy_slope_bound"
env = "proposition"
title = "The slope bound"
statement = '''
Assume \texttt{hME} (Theorem~\ref{thm:multiplicityEstimateElem} proves it). Let $U \subseteq \C^d$ and let $a < b$ be natural numbers with $b \dim(U \cap S) \leq a \dim S$ for every rational $S \subseteq \C^d$, and let $z_1, \dots, z_{\ell} \in U \cap \widetilde{\mathcal L}^d$ be linearly independent over $\Qbar$. Then $(b - a)\,\ell \leq b \dim U$. With $(a, b) = (\dim U, d)$ this is the first case of Roy's Theorem 4: $\ell/(d + \ell) \leq n/d$.
'''
source = '''\cite[Th.~4]{Roy92}, first case (p.~34), in a form that passes to subspaces and quotients; \cite[Prop.~11.19]{Wal00}. The proof is the induction on $d$ described in the source of Lemma~\ref{lem:roy_relation_rank_le}.'''
sketch = '''
Induction on $d$; for $d = 0$ the family is empty. If $d \dim(U \cap S) \leq n \dim S$ for all rational $S$, the hypothesis at $S = \C^d$ gives $n < d$, and Proposition~\ref{prop:roy_semistable_node} gives $(d - n)\ell \leq dn$, which implies the claim. Otherwise a rational $S_1 \neq 0$ of maximal slope $\dim(U \cap S)/\dim S$ has $0 < \dim S_1 < d$. Coordinates adapted to $S_1$ (Lemma~\ref{lem:roy_rational_adapted_basis}) identify $S_1$ with $\C^{s_1}$ and give a projection $\pi$ onto $\C^{d - s_1}$ with kernel $S_1$; by maximality, $U \cap S_1$ and $\pi(U)$ satisfy the hypothesis with $(a, b) = (\dim(U \cap S_1), s_1)$. The span of $z$ splits into its part in $S_1$ and its image under $\pi$, and the induction hypothesis on both pieces adds up to the claim.
'''

[[node]]
platform = "DiazModulus.roy_theorem_four"
env = "theorem"
title = "Roy's Theorem 4"
statement = '''
Assume \texttt{hME} (Theorem~\ref{thm:multiplicityEstimateElem} proves it). Let $U \subseteq \C^d$, $n = \dim U$, and $z_1, \dots, z_{\ell} \in U \cap \widetilde{\mathcal L}^d$ linearly independent over $\Qbar$, spanning $Z$. Let $S \neq \C^d$ be a rational subspace minimising $(n - \dim(U \cap S))/(d - \dim S)$ among the rational subspaces $\neq \C^d$. With $d' = d - \dim S$, $n' = n - \dim(U \cap S)$ and $\ell' = \ell - \dim_{\Qbar}(Z \cap S)$, the dimensions of the images under the quotient by $S$,
\[ \ell' d' \leq n' (d' + \ell') \quad\text{and}\quad n' d \leq n d'. \]
'''
source = '''\cite[Th.~4]{Roy92} (\S4, p.~34), for $K = \Qbar$ and $\widetilde{\mathcal L} = \Qbar + \Qbar\mathcal{L}$; \cite[Prop.~11.19]{Wal00} (\S11.6.2, p.~402).'''
sketch = '''
The second inequality is the minimality at $S' = 0$. For the first, coordinates adapted to $S$ (Lemma~\ref{lem:roy_rational_adapted_basis}) give a projection $\pi : \C^d \to \C^{d'}$ with kernel $S$ and an algebraic section, which maps $\widetilde{\mathcal L}^d$ into $\widetilde{\mathcal L}^{d'}$. A rational $S'' \subseteq \C^{d'}$ pulls back to a rational $S' \supseteq S$, and the minimality of $S$ at $S'$ gives $d' \dim(\pi(U) \cap S'') \leq n' \dim S''$. If $n' < d'$, Proposition~\ref{prop:roy_slope_bound} with $(a, b) = (n', d')$, applied to a $\Qbar$-basis of $\pi(Z)$, gives $(d' - n')\ell' \leq d'n'$; if $n' \geq d'$ the claim is clear.
'''

[[node]]
platform = "DiazModulus.roy_rank_bound"
root = true
env = "theorem"
title = "Roy's Corollary 1: the rank of a matrix of logarithms"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$.

Let $M$ be a $d \times l$ matrix with entries in $\widetilde{\mathcal L}$, $d \geq 1$. Then there are integers $0 < d' \leq d$ and $0 \leq l' \leq l$ and invertible matrices $P$, $Q$ with algebraic entries such that the entries $(PMQ)_{ij}$ with $i \leq d'$ and $j > l'$ vanish, and
\[ d\,l' \leq \operatorname{rank}(M)\,(d' + l'). \]
This is Roy's lower bound $\operatorname{rank}(M) \geq d\,\theta(M)/(1 + \theta(M))$, where $\theta(M)$ is the least $l'/d'$ over such block forms: the block form above gives $\theta(M) \leq l'/d'$, and $x \mapsto x/(1 + x)$ is increasing. It holds with no hypothesis.
'''
source = '''\cite{Roy92}, \S4, Cor.~1 (p.~38), deduced from Th.~4; \cite[\S12.3, Th.~12.20 and Cor.~12.21]{Wal00}.'''
sketch = '''
Let $U$ be the column space of $M$, $n = \operatorname{rank} M$, and $z$ a $\Qbar$-basis of the $\Qbar$-span $Z$ of the columns. Pick a rational $S \neq \C^d$ minimising $(n - \dim(U \cap S))/(d - \dim S)$; Theorem~\ref{thm:roy_theorem_four}, with Theorem~\ref{thm:multiplicityEstimateElem}, gives $d\ell' \leq n(d' + \ell')$. $P$ is the matrix of coordinates adapted to $S$ (Lemma~\ref{lem:roy_rational_adapted_basis}), with the $d'$ coordinates that vanish on $S$ on top. $Q$ comes from coordinates adapted to the rational space $K$ spanned by the algebraic $x$ with $Mx \in S$, with the $l - \dim K$ last columns in $K$; so the top right block of $PMQ$ vanishes. A count over $\Qbar$ gives $l - \dim K \leq \ell'$, and $n \leq d$ finishes the inequality with $l' = l - \dim K$.
'''

[[node]]
platform = "DiazModulus.roy_theorem_four_exists"
section = '''Roy's Theorem 5 and Waldschmidt's \emph{Variations}'''
env = "lemma"
title = "Roy's Theorem 4 at a minimiser"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. A subspace $S \subseteq \C^{d}$ is \emph{rational} if it is spanned by vectors with algebraic coordinates. Dimensions of subspaces of $\C^{d}$ are over $\C$; $\dim_{\Qbar}$ is the dimension of a $\Qbar$-vector space.

Let $d \geq 1$, let $U \subseteq \C^{d}$ be a subspace, $n = \dim U$, and let $z_1, \dots, z_{\ell} \in U$ have coordinates in $\widetilde{\mathcal L}$ and be linearly independent over $\Qbar$, spanning $Z$ over $\Qbar$. Then there is a rational subspace $S \neq \C^{d}$ such that
\[ \bigl(n - \dim(U \cap S)\bigr)\,(d - \dim S') \leq \bigl(n - \dim(U \cap S')\bigr)\,(d - \dim S) \]
for every rational subspace $S' \neq \C^{d}$, so that $S$ minimises $(n - \dim(U \cap S))/(d - \dim S)$ among them, and, with $d' = d - \dim S$, $n' = n - \dim(U \cap S)$ and $\ell' = \ell - \dim_{\Qbar}(Z \cap S)$,
\[ \ell' d' \leq n'(d' + \ell') \quad\text{and}\quad n' d \leq n d'. \]
'''
source = '''\cite[Th.~4]{Roy92} (p.~34), at a rational subspace minimising the ratio; the minimum exists because the ratio takes finitely many values. A step of the proof of \cite[Th.~5]{Roy92} (p.~39). Routine.'''
sketch = '''
The zero subspace is rational and differs from $\C^{d}$, as $d \geq 1$. For a rational $S \neq \C^{d}$ the numerator $n - \dim(U \cap S)$ lies in $\{0, \dots, d\}$ and the denominator $d - \dim S$ in $\{1, \dots, d\}$, so the ratios take finitely many values and one of them is least. With positive denominators cleared, minimality at $S$ is the hypothesis of Theorem~\ref{thm:roy_theorem_four}, which, applied with Theorem~\ref{thm:multiplicityEstimateElem}, gives both inequalities.
'''

[[node]]
platform = "DiazModulus.roy_hull_transport"
env = "lemma"
title = "Transport to a rational subspace of least dimension"
statement = '''
Let $S_0 \subseteq \C^{d}$ be a rational subspace of dimension $s$, and $U \subseteq S_0$ a subspace that contains no non-zero vector with algebraic coordinates, such that every rational subspace $T \supseteq U$ has $\dim T \geq s$. Let $z_1, \dots, z_{\ell} \in U$ have coordinates in $\widetilde{\mathcal L}$ and be linearly independent over $\Qbar$. Then there are a subspace $U' \subseteq \C^{s}$ and vectors $z'_1, \dots, z'_{\ell} \in U'$ with coordinates in $\widetilde{\mathcal L}$, linearly independent over $\Qbar$, such that $\dim U' = \dim U$, $U'$ contains no non-zero vector with algebraic coordinates, and $\C^{s}$ is the only rational subspace of $\C^{s}$ containing $U'$.
'''
source = '''A step of the proof of \cite[Th.~5]{Roy92} (pp.~39--40): Roy's injection of $\C^{d^{*}}$ onto the kernel of $t$ (p.~39), written through coordinates adapted to $S_0$, with a left inverse that preserves $\widetilde{\mathcal L}$. Routine.'''
sketch = '''
Lemma~\ref{lem:roy_rational_adapted_basis} gives an automorphism $g$ of $\C^{d}$ that preserves algebraic vectors and $\widetilde{\mathcal L}$-vectors in both directions, with $v \in S_0$ exactly when the coordinates of $gv$ of index $> s$ vanish. Let $\iota = g^{-1} \circ \mathrm{pad}$, where $\mathrm{pad}$ extends a vector of $\C^{s}$ by zeros, and let $\rho(v)$ consist of the coordinates $1, \dots, s$ of $gv$. Then $\iota$ is injective with image $S_0$, $\rho \circ \iota = \mathrm{id}$, and $\iota \circ \rho = \mathrm{id}$ on $S_0$. Take $U' = \iota^{-1}(U)$ and $z' = \rho \circ z$. Since $\iota$ maps $U'$ onto $U$ and algebraic vectors to algebraic vectors, $\dim U' = \dim U$ and $U'$ meets $\Qbar^{s}$ only in $0$; $\rho$ preserves $\widetilde{\mathcal L}$-coordinates; and $\iota z' = z$ gives the freeness. A rational $T \supseteq U'$ maps to a rational $\iota(T) \supseteq U$ of the same dimension, so $\dim T \geq s$ and $T = \C^{s}$.
'''

[[node]]
platform = "DiazModulus.roy_theorem_five"
root = true
env = "theorem"
title = "Roy's Theorem 5"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. A subspace $S \subseteq \C^{d}$ is \emph{rational} if it is spanned by vectors with algebraic coordinates. A \emph{decomposition} of a pair $(n, d)$ of natural numbers is a finite list $(n_1, d_1), \dots, (n_k, d_k)$ of pairs of natural numbers with $0 < n_i < d_i$ for every $i$, $\sum_i n_i = n$ and $\sum_i d_i = d$; the empty list decomposes $(0, 0)$ only.

Let $U \subseteq \C^{d}$ be a subspace that contains no non-zero vector with algebraic coordinates, such that $\C^{d}$ is the only rational subspace of $\C^{d}$ containing $U$, and let $z_1, \dots, z_{\ell} \in U$ have coordinates in $\widetilde{\mathcal L}$ and be linearly independent over $\Qbar$. Then $0 < \dim U < d$ if $d \geq 1$, and there is a decomposition $(n_1, d_1), \dots, (n_k, d_k)$ of $(\dim U, d)$ with
\[ \ell \leq \sum_{i=1}^{k} \frac{n_i d_i}{d_i - n_i}. \]
Roy's $\varphi(n, d)$ is the largest value of this sum over the decompositions of $(n, d)$, so $\ell \leq \varphi(\dim U, d)$ for every such family. The bound for $\dim_{\Qbar}(U \cap \widetilde{\mathcal L}^{d})$ itself, with its finiteness, is the case $d_{\min} = d$ of Corollary~\ref{cor:roy_theorem_five_dmin}. It holds with no hypothesis.
'''
source = '''\cite[Th.~5]{Roy92} (p.~39), for $\Qbar$ and $\widetilde{\mathcal L}$, with one decomposition in place of Roy's $\varphi(n, d)$, the largest value over all decompositions (pp.~38--39); \cite[Cor.~11.15]{Wal00} in the case $d_{\min} = d$. The proof is Roy's induction on $d$ (pp.~39--40), through Theorem~\ref{thm:roy_theorem_four} and Theorem~\ref{thm:multiplicityEstimateElem}.'''
sketch = '''
If $d \geq 1$, then $U \neq 0$, for otherwise the zero subspace would be a rational subspace different from $\C^{d}$ containing $U$, and $U \neq \C^{d}$, since $\C^{d}$ contains non-zero algebraic vectors; so $0 < n = \dim U < d$. The decomposition comes by strong induction on $d$; for $d = 0$, $\ell = 0$ and the list is empty. For $d \geq 1$, Lemma~\ref{lem:roy_theorem_four_exists} gives a rational $S \neq \C^{d}$ minimising $(n - \dim(U \cap S))/(d - \dim S)$, with $\ell' d' \leq n'(d' + \ell')$ and $n' d \leq n d'$ in its notation. Since $\C^{d}$ is the only rational subspace containing $U$, $U \not\subseteq S$ and $n' \geq 1$; from $n < d$ and $n' d \leq n d'$, $n' < d'$; hence $\ell' \leq n'd'/(d' - n')$. Minimality of the ratio shows that every rational subspace containing $U \cap S$ has dimension at least $\dim S$, so Lemma~\ref{lem:roy_hull_transport} moves $U \cap S$, with a $\Qbar$-basis of $Z \cap S$, to $\C^{\dim S}$ with full rational hull. The induction hypothesis there gives a decomposition of $(\dim(U \cap S), \dim S)$ bounding $\dim_{\Qbar}(Z \cap S) = \ell - \ell'$, and $(n', d')$ is added to it.
'''

[[node]]
platform = "DiazModulus.roy_theorem_five_dmin"
root = true
env = "corollary"
title = '''DALAG Corollary 11.15 for $\Qbar$ and $\widetilde{\mathcal L}$'''
statement = '''
Decompositions are as in Theorem~\ref{thm:roy_theorem_five}. Let $V \subseteq \C^{d}$ be a subspace that contains no non-zero vector with algebraic coordinates, and let $S_0 \supseteq V$ be a rational subspace of least dimension among the rational subspaces containing $V$; write $d_{\min} = \dim S_0$. Then $V \cap \widetilde{\mathcal L}^{d}$ is a finite-dimensional $\Qbar$-vector space, and there is a decomposition $(n_1, d_1), \dots, (n_k, d_k)$ of $(\dim V, d_{\min})$ with
\[ \dim_{\Qbar}\bigl(V \cap \widetilde{\mathcal L}^{d}\bigr) \leq \sum_{i=1}^{k} \frac{n_i d_i}{d_i - n_i}. \]
For $d_{\min} = d$ this is Theorem~\ref{thm:roy_theorem_five}.
'''
source = '''\cite[Cor.~11.15]{Wal00} (p.~398), for $(\Qbar, \widetilde{\mathcal L})$, in the decomposition form. DALAG states the bound as $\Psi(\dim V, d_{\min})$; the passage from the decomposition form to $\Psi$ uses Roy's closed form of $\varphi$ \cite[p.~40]{Roy92} and is Corollary~\ref{cor:dalag_cor_11_15_psi}. The case $d_{\min} = d$ is \cite[Th.~5]{Roy92} (p.~39). The proof follows \cite[Th.~5]{Roy92}, not DALAG's argument for Cor.~11.15.'''
sketch = '''
Let $W = V \cap \widetilde{\mathcal L}^{d}$, a $\Qbar$-subspace. For a $\Qbar$-free family $z$ of $\ell$ vectors of $W$, Lemma~\ref{lem:roy_hull_transport} moves $(V, z)$ to $\C^{d_{\min}}$ with full rational hull and the same dimension, and Theorem~\ref{thm:roy_theorem_five} there gives a decomposition of $(\dim V, d_{\min})$ with $\ell \leq \sum_i n_i d_i/(d_i - n_i)$. Each term is at most $n_i d_{\min}$, since $d_i \leq d_{\min}$ and $d_i - n_i \geq 1$, so every finite free family in $W$ has at most $d_{\min} \dim V$ elements, and $W$ is finite-dimensional over $\Qbar$. The same argument applied to a $\Qbar$-basis of $W$ gives the bound.
'''

[[node]]
platform = "DiazModulus.variations_hyperplane_bound"
root = true
env = "theorem"
title = '''Waldschmidt's hyperplane bound (\emph{Variations}, Theorem 3.1)'''
statement = '''
Let $V \subseteq \C^{d}$ be a hyperplane ($\dim V + 1 = d$) that contains no non-zero vector with algebraic coordinates. Then $V \cap \widetilde{\mathcal L}^{d}$ is a finite-dimensional $\Qbar$-vector space, and
\[ \dim_{\Qbar}\bigl(V \cap \widetilde{\mathcal L}^{d}\bigr) \leq d\,(d - 1). \]
'''
source = '''\cite[Th.~3.1]{Wal05a} (p.~347), the case of a hyperplane in \cite[Th.~5]{Roy92} and \cite[Cor.~11.15]{Wal00}.'''
sketch = '''
If $d = 1$, then $V = 0$, and Corollary~\ref{cor:roy_theorem_five_dmin} with $S_0 = 0$ gives a decomposition of $(0, 0)$, which is empty, so the dimension is $0$. If $d \geq 2$, a rational $T \neq \C^{d}$ containing $V$ has dimension $d - 1 = \dim V$, so $T = V$, and a rational $V \neq 0$ would contain a non-zero algebraic vector. So $S_0 = \C^{d}$, and Corollary~\ref{cor:roy_theorem_five_dmin} gives a decomposition of $(d - 1, d)$. Since $\sum_i (d_i - n_i) = 1$ and every summand is at least $1$, it has one part, $(d - 1, d)$, and the bound is $(d - 1)d/1$.
'''

[[node]]
platform = "DiazModulus.variations_cor_3_2"
root = true
env = "corollary"
title = '''Waldschmidt, \emph{Variations}, Corollary 3.2'''
statement = '''
Let $M = (\Lambda_{ij})$ be an $m \times \ell$ matrix with entries in $\widetilde{\mathcal L}$ whose $\ell$ columns are linearly independent over $\Qbar$, let $x_1, \dots, x_m \in \C$ be linearly independent over $\Qbar$, and assume $\ell > m(m - 1)$. Then for some $j \in \{1, \dots, \ell\}$
\[ x_1\Lambda_{1j} + \dots + x_m\Lambda_{mj} \neq 0. \]
'''
source = '''\cite[Cor.~3.2]{Wal05a} (p.~348), from Th.~3.1.'''
sketch = '''
Suppose every $\sum_i x_i\Lambda_{ij}$ vanishes. If $m = 0$, the columns are $\ell > 0$ vectors of the zero space, which cannot be free. If $m \geq 1$, then $x_1 \neq 0$, so $\psi(z) = \sum_i x_i z_i$ maps $\C^{m}$ onto $\C$ and its kernel $V$ is a hyperplane. An algebraic $z \in V$ is a $\Qbar$-relation $\sum_i z_i x_i = 0$, so $z = 0$. The columns of $M$ are $\ell$ $\Qbar$-free vectors of $V \cap \widetilde{\mathcal L}^{m}$, so $\ell \leq m(m - 1)$ by Theorem~\ref{thm:variations_hyperplane_bound}, a contradiction.
'''

[[node]]
platform = "DiazModulus.variations_theorem_2_11"
root = true
env = "theorem"
title = '''Waldschmidt, \emph{Variations}, Theorem 2.11'''
statement = '''
Let $M = (\Lambda_{ij})$ be an $m \times \ell$ matrix with entries in $\widetilde{\mathcal L}$ such that the $m + \ell$ columns of the $m \times (m + \ell)$ matrix $(I_m, M)$ are linearly independent over $\Qbar$. Let $\Lambda_1, \dots, \Lambda_m \in \widetilde{\mathcal L}$ be such that $1, \Lambda_1, \dots, \Lambda_m$ are linearly independent over $\Qbar$, and assume $\ell > m^{2}$. Then for some $j \in \{1, \dots, \ell\}$
\[ \Lambda_1\Lambda_{1j} + \dots + \Lambda_m\Lambda_{mj} \notin \widetilde{\mathcal L}. \]
'''
source = '''\cite[Th.~2.11]{Wal05a} (p.~346; proof p.~348); \cite[Th.~6.2]{Wal05c} (p.~10).'''
sketch = '''
Suppose every $\Lambda'_j = \Lambda_1\Lambda_{1j} + \dots + \Lambda_m\Lambda_{mj}$ lies in $\widetilde{\mathcal L}$. In $\C^{m+1}$ let $\varphi(z) = \Lambda_1 z_1 + \dots + \Lambda_m z_m - z_{m+1}$ and $V = \ker\varphi$; since $\varphi(-w e_{m+1}) = w$, $V$ is a hyperplane. An algebraic $z \in V$ is an algebraic relation $z_1\Lambda_1 + \dots + z_m\Lambda_m - z_{m+1} \cdot 1 = 0$, so $z = 0$. The $m + \ell$ points $(e_i, \Lambda_i)$ and $(M_{\cdot j}, \Lambda'_j)$ lie in $V$ and have coordinates in $\widetilde{\mathcal L}$; they are $\Qbar$-free because their coordinates $1, \dots, m$ are the columns of $(I_m, M)$. Theorem~\ref{thm:variations_hyperplane_bound} gives $m + \ell \leq (m + 1)m$, against $\ell > m^{2}$.
'''

[[node]]
platform = "DiazModulus.role_cor_6_3"
root = true
env = "corollary"
title = '''Waldschmidt, \emph{Role}, Corollary 6.3 (\emph{Variations}, Corollary 2.12, corrected)'''
statement = '''
Let $M = (\Lambda_{ij})$ be a $2 \times 5$ matrix with entries in $\widetilde{\mathcal L}$ such that $1, \Lambda_{11}, \Lambda_{21}$ are linearly independent over $\Qbar$ and the seven columns of the $2 \times 7$ matrix $(I_2, M)$ are linearly independent over $\Qbar$. Then for some $j \in \{2, 3, 4, 5\}$
\[ \Lambda_{11}\Lambda_{2j} - \Lambda_{21}\Lambda_{1j} \notin \widetilde{\mathcal L}. \]
'''
source = '''\cite[Cor.~6.3]{Wal05c} (pp.~10--11), the corrected form of \cite[Cor.~2.12]{Wal05a} (p.~346). The printed Cor.~2.12 assumes ``$\Lambda_{21} \neq 0$ and $\Lambda_{11}/\Lambda_{21}$ transcendental'' in place of the freeness of $1, \Lambda_{11}, \Lambda_{21}$, and is false as printed: $\Lambda_{11} = 1$, $\Lambda_{21} = \log 2$, $\Lambda_{1j} = 0$ and $\Lambda_{2j} = \log 3, \log 5, \log 7, \log 11$ ($j = 2, \dots, 5$) satisfy its hypotheses, the seven columns of $(I_2, M)$ being linearly independent over $\Qbar$ by Baker's theorem, while every $\Lambda_{11}\Lambda_{2j} - \Lambda_{21}\Lambda_{1j} = \Lambda_{2j}$ lies in $\mathcal{L}$. The author corrected it in \cite[\S4, p.~8]{Wal05b} and in \cite[Cor.~6.3]{Wal05c}, replacing that hypothesis by the linear independence of $1, \Lambda_{11}, \Lambda_{21}$ over $\Qbar$. This node is the corrected form; its proof is the printed one.'''
sketch = '''
Apply Theorem~\ref{thm:variations_theorem_2_11} with $m = 2$, $\ell = 5$, $\Lambda_1 = -\Lambda_{21}$ and $\Lambda_2 = \Lambda_{11}$, both in $\widetilde{\mathcal L}$. A relation $a + b\Lambda_1 + c\Lambda_2 = 0$ reads $a + c\Lambda_{11} - b\Lambda_{21} = 0$, so $1, \Lambda_1, \Lambda_2$ are free over $\Qbar$; the columns of $(I_2, M)$ are free by hypothesis, and $5 > 2^{2}$. So some $\Lambda_1\Lambda_{1j} + \Lambda_2\Lambda_{2j} = \Lambda_{11}\Lambda_{2j} - \Lambda_{21}\Lambda_{1j}$ is not in $\widetilde{\mathcal L}$. For $j = 1$ this number is $\Lambda_{11}\Lambda_{21} - \Lambda_{21}\Lambda_{11} = 0 \in \widetilde{\mathcal L}$, so $j \geq 2$.
'''

[[node]]
platform = "DiazModulus.fv_dot_orthogonal"
section = '''\emph{Further variations}: the 2 × 2 minors'''
env = "lemma"
title = "The orthogonal for the dot product"
statement = '''
Here $\Qbar$, $\mathcal{L}$ and $\widetilde{\mathcal L}$ are as in Lemma~\ref{lem:roy_theorem_four_exists}. For $u, v \in \C^{n}$, $u \cdot v = \sum_k u_k v_k$ is the bilinear dot product (not the Hermitian one). For a $\Qbar$-subspace $X$ and a $\C$-subspace $W$ of $\C^{n}$, $X \cap W$ is a $\Qbar$-subspace; dimensions are over $\Qbar$ for $\Qbar$-subspaces, written $\dim_{\Qbar}$, and over $\C$ for $\C$-subspaces.

For every $\C$-subspace $W \subseteq \C^{n}$ there is a $\C$-subspace $V \subseteq \C^{n}$ with
\[ V = \{z \in \C^{n} : w \cdot z = 0 \text{ for all } w \in W\} \quad\text{and}\quad \dim V + \dim W = n. \]
'''
source = '''Classical linear algebra; a step of the proof of \cite[Th.~2.1]{Wal05b} (pp.~5--6). Routine.'''
sketch = '''
The map $v \mapsto (z \mapsto v \cdot z)$ is a linear isomorphism of $\C^{n}$ onto its dual. The orthogonal of $W$ is the common kernel of the image of $W$, a subspace of the dual of dimension $\dim W$, and that common kernel has dimension $n - \dim W$.
'''

[[node]]
platform = "DiazModulus.fv_max_slope"
env = "lemma"
title = "A subspace of maximal slope"
statement = '''
Let $n \geq 1$ and let $X \subseteq \C^{n}$ be a finite-dimensional $\Qbar$-subspace. Then there is a $\C$-subspace $W_0 \neq 0$ of $\C^{n}$ such that
\[ \dim_{\Qbar}(X \cap W) \cdot \dim W_0 \leq \dim_{\Qbar}(X \cap W_0) \cdot \dim W \]
for every $\C$-subspace $W \subseteq \C^{n}$; that is, $W_0$ maximises the slope $\dim_{\Qbar}(X \cap W)/\dim W$ among the $\C$-subspaces $W \neq 0$.
'''
source = '''A step of the proof of \cite[Th.~2.1]{Wal05b} (pp.~5--6); the analogue of \cite[Lemme~5.1]{Wal81} (p.~106). Routine.'''
sketch = '''
For $W \neq 0$ the numerator of the slope lies in $\{0, \dots, \dim_{\Qbar} X\}$ and the denominator in $\{1, \dots, n\}$, so the slope takes finitely many values; $W = \C^{n}$ is admissible because $n > 0$. Take $W_0$ realising the largest value. For $W \neq 0$ the inequality is the comparison of slopes with the positive denominators cleared; for $W = 0$ its left side is $0$.
'''

[[node]]
platform = "DiazModulus.fv_gram_zero_block"
env = "lemma"
title = "Roy's Corollary 1 for a Gram matrix"
statement = '''
Let $X, Y \subseteq \C^{n}$ be finite-dimensional $\Qbar$-subspaces with $d = \dim_{\Qbar} X \geq 1$ and $x \cdot y \in \widetilde{\mathcal L}$ for all $x \in X$ and $y \in Y$. Then there are $\Qbar$-subspaces $X_1 \subseteq X$ and $Y_1 \subseteq Y$ with $\dim_{\Qbar} X_1 \geq 1$ and $x \cdot y = 0$ for all $x \in X_1$ and $y \in Y_1$, such that, with $\ell' = \dim_{\Qbar} Y - \dim_{\Qbar} Y_1$ and $r = \dim \mathrm{span}_{\C} X$,
\[ d\,\ell' \leq r\,(\dim_{\Qbar} X_1 + \ell'). \]
'''
source = '''A step of the proof of \cite[Th.~2.1]{Wal05b} (p.~6): \cite[Cor.~1]{Roy92} (Theorem~\ref{thm:roy_rank_bound}; \cite[Th.~12.20]{Wal00}, p.~435) applied to the Gram matrix $(x_i \cdot y_j)$ of bases of $X$ and $Y$. Routine.'''
sketch = '''
Take $\Qbar$-bases $x_1, \dots, x_d$ of $X$ and $y_1, \dots, y_{\ell}$ of $Y$. The Gram matrix $G = (x_i \cdot y_j)$ has entries in $\widetilde{\mathcal L}$, so Theorem~\ref{thm:roy_rank_bound} gives invertible algebraic $P$, $Q$ and $1 \leq d' \leq d$, $\ell' \leq \ell$ with $(PGQ)_{ij} = 0$ for $i \leq d'$ and $j > \ell'$, and $d\ell' \leq \operatorname{rank}(G)\,(d' + \ell')$. Put $\tilde x_i = \sum_a P_{ia}x_a$ and $\tilde y_j = \sum_b Q_{bj}y_b$: as $P$ and $Q$ are invertible with algebraic entries, these are again $\Qbar$-bases of $X$ and $Y$, and $\tilde x_i \cdot \tilde y_j = (PGQ)_{ij}$ by bilinearity. Let $X_1$ be spanned by the $\tilde x_i$ with $i \leq d'$ (dimension $d'$) and $Y_1$ by the $\tilde y_j$ with $j > \ell'$ (dimension $\ell - \ell'$); then $X_1 \cdot Y_1 = 0$. Finally $G$ is the product of the matrix with rows $x_i$ and the transpose of the matrix with rows $y_j$, so $\operatorname{rank} G$ is at most the dimension of the $\C$-span of the $x_i$, which is $r$.
'''

[[node]]
platform = "DiazModulus.fv_semistable_core"
env = "proposition"
title = "The semistable case, relative form"
statement = '''
For a finite-dimensional $\Qbar$-subspace $Y \subseteq \C^{n}$ with $n \geq 1$, $\mu(Y, \C^{n})$ is the minimum of $\bigl(\dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V)\bigr)/(n - \dim V)$ over the $\C$-subspaces $V \neq \C^{n}$; the ratio takes finitely many values, so the minimum is attained.

Let $W_0 \subseteq \C^{n}$ be a $\C$-subspace, $n_0 = \dim W_0$, and let $X_0, Y \subseteq \C^{n}$ be finite-dimensional $\Qbar$-subspaces with $X_0 \subseteq W_0$ and $d_0 = \dim_{\Qbar} X_0 > n_0$. Assume that $n_0 \dim_{\Qbar}(X_0 \cap W) \leq d_0 \dim W$ for every $\C$-subspace $W \subseteq \C^{n}$ ($X_0$ is semistable relative to $W_0$), and that $x \cdot y \in \widetilde{\mathcal L}$ for all $x \in X_0$ and $y \in Y$. Then there is a $\C$-subspace $V \neq \C^{n}$ with
\[ (d_0 - n_0)\bigl(\dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V)\bigr) \leq d_0\,(n - \dim V), \]
that is, $\mu(Y, \C^{n}) \leq d_0/(d_0 - n_0)$.
'''
source = '''A step of the proof of \cite[Th.~2.1]{Wal05b}: the semistable case (p.~6; \cite[Prop.~6.1]{Wal81}), here for a subspace $X_0$ of $W_0$ semistable relative to $W_0$, with \cite[Cor.~1]{Roy92} used once. The coefficient $\mu$ is that of \cite[p.~4]{Wal05b}, where $V$ ranges over all $\C$-subspaces $V \neq \C^{n}$. Routine.'''
sketch = '''
Lemma~\ref{lem:fv_gram_zero_block} for $X_0$ and $Y$ gives $X_1 \subseteq X_0$ of dimension $d' \geq 1$ and $Y_1 \subseteq Y$ with $X_1 \cdot Y_1 = 0$ and $d_0\ell' \leq r(d' + \ell')$, where $\ell' = \dim_{\Qbar} Y - \dim_{\Qbar} Y_1$ and $r$ is the dimension of the $\C$-span of $X_0$. That span lies in $W_0$, so $r \leq n_0$ and $(d_0 - n_0)\ell' \leq n_0 d'$. Let $W$ be the $\C$-span of $X_1$, of dimension $w \geq 1$. As $X_1 \subseteq X_0 \cap W$, semistability gives $n_0 d' \leq d_0 w$. The orthogonal $V$ of $W$ (Lemma~\ref{lem:fv_dot_orthogonal}) has dimension $n - w$, so $V \neq \C^{n}$, and $Y_1 \subseteq Y \cap V$, so $\dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V) \leq \ell'$. Chaining, $(d_0 - n_0)\bigl(\dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V)\bigr) \leq (d_0 - n_0)\ell' \leq n_0 d' \leq d_0 w$.
'''

[[node]]
platform = "DiazModulus.fv_theorem_2_1"
root = true
env = "theorem"
title = '''Waldschmidt, \emph{Further variations}, Theorem 2.1, for finite-dimensional $Y$'''
statement = '''
With the notation of Lemma~\ref{lem:fv_dot_orthogonal} and the coefficient $\mu$ of Proposition~\ref{prop:fv_semistable_core}: let $X, Y \subseteq \C^{n}$ be finite-dimensional $\Qbar$-subspaces with $d = \dim_{\Qbar} X > n$, and assume that for every $\C$-subspace $V \neq \C^{n}$
\[ d\,(n - \dim V) < (d - n)\bigl(\dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V)\bigr), \]
that is, $\mu(Y, \C^{n}) > d/(d - n)$. Then $x \cdot y \notin \widetilde{\mathcal L}$ for some $x \in X$ and $y \in Y$.
'''
source = '''\cite[Th.~2.1]{Wal05b} (p.~5; proof pp.~5--6), for finite-dimensional $Y$. \cite{Wal05b} states it for every $\Qbar$-subspace $Y$ of $\C^{n}$, but the printed proof writes $Y = \Qbar y_1 + \dots + \Qbar y_{\ell}$ and so covers finite-dimensional $Y$ only. For infinite-dimensional $Y$ one needs a finite-dimensional $Y_f \subseteq Y$ with $\mu(Y_f, \C^{n}) > d/(d - n)$, which is not automatic, since $V$ ranges over infinitely many subspaces; Proposition~\ref{prop:fv_finite_approx} supplies one, and Theorem~\ref{thm:fv_theorem_2_1_rank} is the statement for every $Y$. Every application in \cite{Wal05b} (Th.~1.2, Cor.~1.4) has $\dim Y = 5$. The proof replaces the reduction of \cite[p.~5]{Wal05b}, after \cite[Lemmes~5.1--5.2]{Wal81}, and the inequality (2.3) by one $\C$-subspace of maximal slope for $X$ and a relative form of the semistable case, and uses \cite[Cor.~1]{Roy92} once (Theorem~\ref{thm:roy_rank_bound}; \cite[Th.~12.20]{Wal00}).'''
sketch = '''
Suppose every $x \cdot y$ lies in $\widetilde{\mathcal L}$; as $d > n$, $n \geq 1$. Lemma~\ref{lem:fv_max_slope} gives a $\C$-subspace $W_0 \neq 0$ of maximal slope for $X$; put $n_0 = \dim W_0$, $X_0 = X \cap W_0$ and $d_0 = \dim_{\Qbar} X_0$. Maximality gives $n_0 \dim_{\Qbar}(X \cap W) \leq d_0 \dim W$ for every $W$; at $W = \C^{n}$ this is $d n_0 \leq d_0 n$, so $d_0 > n_0$, and since $X_0 \cap W \subseteq X \cap W$, $X_0$ is semistable relative to $W_0$. Proposition~\ref{prop:fv_semistable_core} for $W_0$, $X_0$ and $Y$ gives $V \neq \C^{n}$ with $(d_0 - n_0)\rho \leq d_0 c$, where $\rho = \dim_{\Qbar} Y - \dim_{\Qbar}(Y \cap V)$ and $c = n - \dim V$, while the hypothesis at the same $V$ says $dc < (d - n)\rho$. Multiplying the former by $d$ and the latter by $d_0$ gives $\rho\,(d n_0 - d_0 n) > 0$, which is impossible because $d n_0 \leq d_0 n$.
'''

[[node]]
platform = "DiazModulus.fv_two_by_three_lines"
env = "lemma"
title = '''Lines meet the column space of $(I_2, M)$ in dimension at most three'''
statement = '''
Let $M$ be a complex $2 \times 3$ matrix such that the five rows of the $5 \times 3$ matrix $\begin{pmatrix} M \\ I_3 \end{pmatrix}$ are linearly independent over $\Qbar$, and let $X$ be the $\Qbar$-span of the five columns of the $2 \times 5$ matrix $(I_2, M)$. Then for every $\C$-subspace $V \neq \C^{2}$
\[ \dim_{\Qbar}(X \cap V) \leq 3. \]
'''
source = '''A step of the proof of \cite[Th.~1.2]{Wal05b} (p.~7): the core of the estimate (3.1). Routine.'''
sketch = '''
A $\C$-subspace $V \neq \C^{2}$ lies in the kernel of a non-zero linear form $p(z) = s_1 z_1 + s_2 z_2$. By rank--nullity for the $\Qbar$-linear map $p$ on $X$, $\dim_{\Qbar}(X \cap V) \leq \dim_{\Qbar}(X \cap \ker p) = \dim_{\Qbar} X - \dim_{\Qbar} p(X)$, and $\dim_{\Qbar} X \leq 5$, so it suffices that $\dim_{\Qbar} p(X) \geq 2$. Otherwise $p(X) = \Qbar c$, with $s_1 = a_1 c$, $s_2 = a_2 c$ and $s_1 M_{1j} + s_2 M_{2j} = b_j c$ for algebraic $a$, $b$. Then $c \neq 0$, as $s \neq 0$, and dividing by $c$ gives the relation $a_1 \cdot (\text{row } 1) + a_2 \cdot (\text{row } 2) - \sum_j b_j e_j = 0$ among the five rows of $\begin{pmatrix} M \\ I_3 \end{pmatrix}$. So $a_1 = a_2 = 0$, hence $s = 0$, a contradiction.
'''

[[node]]
platform = "DiazModulus.fv_theorem_1_2"
root = true
env = "theorem"
title = '''Waldschmidt, \emph{Further variations}, Theorem 1.2'''
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$.

Let $M = (\Lambda_{ij})$ be a $2 \times 3$ matrix with entries in $\widetilde{\mathcal L}$. Assume that the five rows of the $5 \times 3$ matrix $\begin{pmatrix} M \\ I_3 \end{pmatrix}$ are linearly independent over $\Qbar$, and that the five columns of the $2 \times 5$ matrix $(I_2, M)$ are linearly independent over $\Qbar$. Then at least one of the three $2 \times 2$ minors of $M$, up to sign,
\[ \Lambda_{12}\Lambda_{23} - \Lambda_{13}\Lambda_{22}, \qquad \Lambda_{13}\Lambda_{21} - \Lambda_{11}\Lambda_{23}, \qquad \Lambda_{11}\Lambda_{22} - \Lambda_{12}\Lambda_{21}, \]
is not in $\widetilde{\mathcal L}$.
'''
source = '''\cite[Th.~1.2]{Wal05b} (pp.~2--3; proof p.~7, through Th.~2.1 and the estimate (3.1), which is checked here at $V = 0$ and at every line).'''
sketch = '''
Let $v_1, \dots, v_5$ be the columns of $(I_2, M)$ and $X$ their $\Qbar$-span, of dimension $5$. Let $J(z_1, z_2) = (-z_2, z_1)$ and $Y = J(X)$, also of dimension $5$. For $x, x' \in \C^{2}$, $x \cdot J(x')$ is the determinant with columns $x'$, $x$, so on the generators each $v_k \cdot J(v_{k'})$ is $0$, $\pm1$, $\pm\Lambda_{ij}$ or $\pm$ one of the three numbers. If all three lie in $\widetilde{\mathcal L}$, then every $x \cdot y$ with $x \in X$, $y \in Y$ does, by bilinearity, since $\widetilde{\mathcal L}$ is a $\Qbar$-space containing $1$ and the entries of $M$. On the other hand Theorem~\ref{thm:fv_theorem_2_1} applies with $n = 2$ and $\dim_{\Qbar} X = 5$: for $V = 0$ the required inequality is $10 < 15$; for a line $V$, $J$ maps $X \cap J^{-1}(V)$ onto $Y \cap V$ and $J^{-1}(V)$ is a line, so $\dim_{\Qbar}(Y \cap V) \leq 3$ by Lemma~\ref{lem:fv_two_by_three_lines}, and the inequality is $5 < 3 \cdot (5 - 3)$. So some $x \cdot y \notin \widetilde{\mathcal L}$, a contradiction.
'''

[[node]]
platform = "DiazModulus.fv_lambda_squares"
root = true
env = "corollary"
title = '''The $\Lambda^{2}$ corollary of \emph{Further variations}'''
statement = '''
Let $\Lambda_1, \Lambda_2, \Lambda_3 \in \widetilde{\mathcal L}$ be such that $1, \Lambda_1, \Lambda_2, \Lambda_3$ are linearly independent over $\Qbar$. Then at least one of
\[ \Lambda_1^{2} - \Lambda_2\Lambda_3, \qquad \Lambda_2^{2} - \Lambda_3\Lambda_1, \qquad \Lambda_3^{2} - \Lambda_1\Lambda_2 \]
is not in $\widetilde{\mathcal L}$.
'''
source = '''\cite[p.~3]{Wal05b}, stated there as a consequence of Th.~1.2; it is Th.~1.2 for the matrix $\begin{pmatrix} \Lambda_1 & \Lambda_2 & \Lambda_3 \\ \Lambda_2 & \Lambda_3 & \Lambda_1 \end{pmatrix}$.'''
sketch = '''
Apply Theorem~\ref{thm:fv_theorem_1_2} to $M = \begin{pmatrix} \Lambda_1 & \Lambda_2 & \Lambda_3 \\ \Lambda_2 & \Lambda_3 & \Lambda_1 \end{pmatrix}$. Its three numbers are $\Lambda_1\Lambda_2 - \Lambda_3^{2}$, $\Lambda_2\Lambda_3 - \Lambda_1^{2}$ and $\Lambda_1\Lambda_3 - \Lambda_2^{2}$, the negatives of the three numbers of the statement, and $\widetilde{\mathcal L}$ is closed under negation. A relation among the rows of $\begin{pmatrix} M \\ I_3 \end{pmatrix}$, with coefficients $a$, $b$ on the rows of $M$ and $c_1, c_2, c_3$ on those of $I_3$, has coordinate $1$ equal to $c_1 + a\Lambda_1 + b\Lambda_2 = 0$, so $a = b = c_1 = 0$, and the other two coordinates give $c_2 = c_3 = 0$. A relation among the columns of $(I_2, M)$, with coefficients $a$, $b$ on those of $I_2$ and $c_1, c_2, c_3$ on those of $M$, has top coordinate $a + c_1\Lambda_1 + c_2\Lambda_2 + c_3\Lambda_3 = 0$, so $a = c_1 = c_2 = c_3 = 0$, and the bottom coordinate gives $b = 0$.
'''

[[node]]
platform = "DiazModulus.dalag_cor_12_21"
section = "DALAG §12.3: rank and structural rank"
root = true
env = "corollary"
title = "DALAG Corollary 12.21"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$.

Let $M = (\Lambda_{ij})$ be a $d \times \ell$ matrix with entries in $\widetilde{\mathcal L}$ such that
\[ \sum_{i=1}^{d}\sum_{j=1}^{\ell} \tau_i\sigma_j\Lambda_{ij} \neq 0 \]
for all non-zero $\tau \in \Qbar^{d}$ and $\sigma \in \Qbar^{\ell}$. Then
\[ d\,\ell \leq \operatorname{rank}(M)\,(d + \ell), \]
that is, $\operatorname{rank}(M) \geq d\ell/(d + \ell)$ when $d + \ell > 0$.
'''
source = '''\cite[\S12.3, Cor.~12.21]{Wal00} (p.~435), from Th.~12.20, that is \cite[Cor.~1]{Roy92} (p.~38; Theorem~\ref{thm:roy_rank_bound}).'''
sketch = '''
If $d = 0$ there is nothing to prove. Otherwise Theorem~\ref{thm:roy_rank_bound} gives invertible algebraic $P$, $Q$ and $1 \leq d' \leq d$, $\ell' \leq \ell$ with $(PMQ)_{ij} = 0$ for $i \leq d'$ and $j > \ell'$, and $d\ell' \leq \operatorname{rank}(M)(d' + \ell')$. If $\ell' < \ell$, the entry $(PMQ)_{1\ell}$ vanishes; it equals $\sum_i\sum_j \tau_i\sigma_j\Lambda_{ij}$ for $\tau$ the top row of $P$ and $\sigma$ the last column of $Q$, both algebraic and non-zero because $P$ and $Q$ are invertible. This contradicts the hypothesis, so $\ell' = \ell$ and $d\ell \leq \operatorname{rank}(M)(d' + \ell) \leq \operatorname{rank}(M)(d + \ell)$.
'''

[[node]]
platform = "DiazModulus.matrix_rank_le_of_zero_block"
env = "lemma"
title = "The rank of a matrix with a zero block"
statement = '''
Let $K$ be a field, $N = (N_{ij})$ a $d \times \ell$ matrix with entries in $K$, and $d' \leq d$ and $\ell'$ natural numbers such that $N_{ij} = 0$ whenever $i \leq d'$ and $j > \ell'$ (rows and columns are numbered from $1$). Then
\[ \operatorname{rank} N + d' \leq d + \ell'. \]
'''
source = '''Classical linear algebra; a step of the proofs of \cite[Cor.~12.18]{Wal00} (p.~433) and \cite[Cor.~12.22]{Wal00} (p.~436). Routine.'''
sketch = '''
The rank of $N$ is the dimension of its row space. Each of the rows $1, \dots, d'$ has zero coordinates beyond $\ell'$, so it lies in the span of the unit vectors $e_j$ with $j \leq \ell'$, of dimension at most $\ell'$; the other $d - d'$ rows span a space of dimension at most $d - d'$. The row space lies in the sum of the two, so $\operatorname{rank} N \leq \ell' + (d - d')$.
'''

[[node]]
platform = "DiazModulus.dalag_cor_12_22"
root = true
env = "corollary"
title = "DALAG Corollary 12.22: the rank is at least half the structural rank"
statement = '''
Let $M$ be a $d \times \ell$ matrix with entries in $\widetilde{\mathcal L}$, and suppose that $M = \sum_{k=1}^{m} e_k N_k$ with $e_1, \dots, e_m \in \C$ linearly independent over $\Qbar$ and $N_1, \dots, N_m$ matrices of size $d \times \ell$ with algebraic entries. Let $N(X) = \sum_{k=1}^{m} X_k N_k$, a matrix over the field $\Qbar(X_1, \dots, X_m)$ of rational functions in $m$ variables. Then
\[ \operatorname{rank}_{\Qbar(X_1, \dots, X_m)} N(X) \leq 2 \operatorname{rank} M. \]
The rank of $N(X)$ is the structural rank of $M$ over $\Qbar$ in the sense of DALAG \S12.1.4; the statement holds for every such presentation of $M$.
'''
source = '''\cite[Cor.~12.22]{Wal00} (p.~436), deduced from Th.~12.20 (\cite[Cor.~1]{Roy92}; Theorem~\ref{thm:roy_rank_bound}) as Cor.~12.18 is deduced from Th.~12.17 (p.~433); the structural rank (\S12.1.4, pp.~426--427) is written through a presentation $M = \sum_k e_k N_k$.'''
sketch = '''
Let $r = \operatorname{rank} N(X)$; if $r = 0$ there is nothing to prove. Otherwise choose $r$ linearly independent rows $I$ of $N(X)$; the row submatrix $M_I$ has entries in $\widetilde{\mathcal L}$. Theorem~\ref{thm:roy_rank_bound} for $M_I$ gives invertible algebraic $P$, $Q$ and $1 \leq d' \leq r$, $\ell'$ with $(PM_{I}Q)_{ij} = 0$ for $i \leq d'$ and $j > \ell'$, and $r\ell' \leq \operatorname{rank}(M_I)(d' + \ell')$. Since $(PM_{I}Q)_{ij} = \sum_k e_k\,(P(N_k)_{I}Q)_{ij}$ with algebraic coefficients and $e$ is free over $\Qbar$, every $(P(N_k)_{I}Q)_{ij}$ vanishes in that block, so $PN(X)_{I}Q$ has the same zero block. It has rank $r$, since $P$ and $Q$ are invertible over $\Qbar$, so Lemma~\ref{lem:matrix_rank_le_of_zero_block} gives $r + d' \leq r + \ell'$, that is $d' \leq \ell'$. Then $\ell' \geq 1$ and $r\ell' \leq 2\ell' \operatorname{rank}(M_I)$, so $r \leq 2\operatorname{rank}(M_I) \leq 2\operatorname{rank}(M)$. The argument uses only that $\Qbar \to \Qbar(X_1, \dots, X_m)$ is a field embedding.
'''

[[node]]
platform = "DiazModulus.dalag_cor_12_24"
root = true
env = "corollary"
title = "DALAG Corollary 12.24, from Theorem 12.20"
statement = '''
Let $M$ be a $d \times \ell$ matrix with entries in $\widetilde{\mathcal L}$ whose $d$ rows are linearly independent over $\Qbar$ and whose $\ell$ columns are linearly independent over $\Qbar$, and assume $d\ell > d + \ell$. Then $\operatorname{rank} M \geq 2$.
'''
source = '''\cite[Cor.~12.24]{Wal00} (p.~436), proved here from Th.~12.20 (\cite[Cor.~1]{Roy92}; Theorem~\ref{thm:roy_rank_bound}). DALAG introduces it as a consequence of Cor.~12.22 and prints no argument. Cor.~12.22 gives only $\operatorname{rank} M \geq \operatorname{rstr}(M)/2$, and the structural rank can be $2$ with free rows and free columns: for every $d, \ell \geq 2$, the structural matrix with top row $(a_1 + b_1, a_2, \dots, a_{\ell})$, left column $(a_1 + b_1, b_2, \dots, b_d)$ and zeros elsewhere ($a_j$, $b_i$ independent variables) is one. For $d = 2$, $\ell = 3$, the strong six exponentials case, the structural rank is at most $2$, so Cor.~12.22 yields only $\operatorname{rank} M \geq 1$. The statement itself is \cite[Cor.~11.16]{Wal00} restated, and it also follows from Cor.~12.21 (Corollary~\ref{cor:dalag_cor_12_21}) in two lines; the proof here is a direct case analysis of the block shape of Th.~12.20. No correction of this point was found in the sources consulted.'''
sketch = '''
The hypothesis $d\ell > d + \ell$ forces $d, \ell \geq 2$. Suppose $\operatorname{rank} M \leq 1$, and let $P$, $Q$, $d'$, $\ell'$ be as in Theorem~\ref{thm:roy_rank_bound}, so that $d\ell' \leq \operatorname{rank}(M)(d' + \ell') \leq d' + \ell'$, and put $N = PMQ$. No row of $N$ is zero: otherwise, $Q$ being invertible, a row of $P$ gives an algebraic relation among the rows of $M$, so that row of $P$ vanishes and $\det P = 0$. Transposing, no column of $N$ is zero. If $\ell' = \ell$, then $d\ell \leq d' + \ell \leq d + \ell$, a contradiction. If $\ell' = 0$, the top row of $N$ is zero. Otherwise the last column of $N$ vanishes in the rows $i \leq d'$ but not everywhere, so some row $i_1 > d'$ has a non-zero entry there, while the top row of $N$ is non-zero and vanishes there; these two rows are linearly independent, so $\operatorname{rank} M = \operatorname{rank} N \geq 2$, a contradiction. The route does not pass through Corollary~\ref{cor:dalag_cor_12_22}.
'''

[[node]]
platform = "DiazModulus.remond_commuting_end"
section = "Fischler's centraliser bound"
env = "lemma"
title = "Rémond's lemma for endomorphisms"
statement = '''
Let $E$ be a finite-dimensional complex vector space, $n = \dim E$, and let $U, V$ be $\C$-subspaces of $\operatorname{End}_{\C}(E)$ such that $ab = ba$ for all $a \in U$ and $b \in V$. Then
\[ \dim U + \dim V \leq n^{2} + 1. \]
'''
source = '''\cite[Lemma~5.6]{Fis01} (pp.~181--182), due to Rémond, for the field $\C$ and in the language of endomorphisms; the proof is the printed induction on $n$. Routine.'''
sketch = '''
Strong induction on $n$. Replacing $(U, V)$ by $(U \cap V, U + V)$ keeps the sum of dimensions and the commuting property, so one may assume $U \subseteq V$. If $U \subseteq \C \cdot 1$, then $\dim U \leq 1$ and $\dim V \leq n^{2}$. Otherwise pick $a_0 \in U$ outside $\C \cdot 1$, an eigenvalue $\lambda$ of $a_0$ and $F = \ker(a_0 - \lambda)$, so $0 \neq F \neq E$; everything commuting with $a_0$ preserves $F$, and this covers $V$, hence $U$. Restriction to $F$ and the induced map on $E/F$ are multiplicative, so the images of $U$, $V$ in $\operatorname{End}(F)$ and in $\operatorname{End}(E/F)$ commute, and the induction bounds their dimensions by $f^{2} + 1$ and $(n - f)^{2} + 1$, where $f = \dim F$. A map preserving $F$ and killed by both restrictions lies in $K_0 = \{a : a(F) = 0,\ a(E) \subseteq F\} \cong \operatorname{Hom}(E/F, F)$, of dimension $f(n - f)$. Rank--nullity twice then gives $\dim U + \dim V \leq n^{2} + 2$, since $(f^{2} + 1) + ((n - f)^{2} + 1) + 2f(n - f) = n^{2} + 2$. A case analysis removes the extra $1$: if $V$ misses part of $K_0$, the count for $V$ drops by one; in the remaining case $K_0 \subseteq V$, some $a \in U$ maps $E$ into $F$ and is non-zero on $F$, and an explicit $b \in K_0$ has $ab \neq 0 = ba$, against the commuting property.
'''

[[node]]
platform = "DiazModulus.remond_commuting_subspaces"
root = true
env = "lemma"
title = "Rémond's lemma (Fischler, Lemma 5.6)"
statement = '''
Let $U, V$ be $\C$-subspaces of $\mathrm{Mat}_n(\C)$ such that $AB = BA$ for all $A \in U$ and $B \in V$. Then
\[ \dim U + \dim V \leq n^{2} + 1. \]
'''
source = '''\cite[Lemma~5.6]{Fis01} (pp.~181--182), due to Rémond, for the field $\C$.'''
sketch = '''
Transport Lemma~\ref{lem:remond_commuting_end} along the algebra isomorphism between $\mathrm{Mat}_n(\C)$ and $\operatorname{End}_{\C}(\C^{n})$: the images of $U$ and $V$ have the same dimensions, they still commute elementwise since the isomorphism is multiplicative, and $\dim \C^{n} = n$.
'''

[[node]]
platform = "DiazModulus.fischler_commute_of_trace"
env = "lemma"
title = "Free entries and a vanishing trace force commuting"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, and a $\C$-subspace of $\mathrm{Mat}_n(\C)$ is \emph{rational} if it is spanned by matrices with algebraic entries.

Let $M$ be a complex $n \times n$ matrix whose $n^{2}$ entries are linearly independent over $\Qbar$, and let $U, V \subseteq \mathrm{Mat}_n(\C)$ be rational subspaces such that $\operatorname{Tr}\bigl(M(AB - BA)\bigr) = 0$ for all $A \in U$ and $B \in V$. Then $AB = BA$ for all $A \in U$ and $B \in V$.
'''
source = '''A step of the proof of \cite[Th.~1.2]{Fis01} (p.~181). Routine.'''
sketch = '''
For algebraic $A$ and $B$ the commutator $K = AB - BA$ has algebraic entries, and $\operatorname{Tr}(MK) = \sum_{i,j} K_{ji}M_{ij}$ is a $\Qbar$-linear combination of the $n^{2}$ entries of $M$; if it vanishes, the freeness of these entries kills every coefficient, so $K = 0$. Since $U$ and $V$ are spanned by their algebraic elements and $(A, B) \mapsto AB - BA$ is bilinear, the identity $AB = BA$ extends from algebraic $A \in U$, $B \in V$ to all of $U \times V$: in $B$ for fixed algebraic $A$, then in $A$ for any $B \in V$.
'''

[[node]]
platform = "DiazModulus.fischler_prop_5_5"
env = "proposition"
title = "Fischler's Proposition 5.5, in rational form"
statement = '''
For $M \in \mathrm{Mat}_n(\C)$, $C(M) = \{A \in \mathrm{Mat}_n(\C) : AM = MA\}$ is the centraliser of $M$; $\widetilde{\mathcal L}$ is as in Lemma~\ref{lem:roy_theorem_four_exists}.

Let $M$ be an $n \times n$ matrix with entries in $\widetilde{\mathcal L}$ such that $2\dim C(M) \geq n^{2} + 2$. Then there are rational subspaces $U, V \subseteq \mathrm{Mat}_n(\C)$ such that $\dim U + \dim V \geq n^{2} + 2$ and
\[ \operatorname{Tr}\bigl(M(AB - BA)\bigr) = 0 \quad\text{for all } A \in U,\ B \in V. \]
'''
source = '''\cite[Prop.~5.5]{Fis01} (pp.~181--183), in rational form; a step of the proof of \cite[Th.~1.2]{Fis01} (p.~169). \cite[Cor.~1]{Roy92} (Theorem~\ref{thm:roy_rank_bound}; \cite[Th.~12.20]{Wal00}, p.~435) is applied to $\operatorname{ad} M$ on the trace-zero matrices written in coordinates, in place of \cite[Cor.~2.2]{Fis01} (pp.~170--171), so that $U$ and $V$ are spanned by explicit algebraic matrices. Routine.'''
sketch = '''
Let $c = \dim C(M)$; the hypothesis $2c \geq n^{2} + 2$ forces $n \geq 2$. Fix a diagonal position $(i_0, i_0)$ and let $\kappa$ be the other $n^{2} - 1$ positions. The matrix $R$ of $X \mapsto ([M, X]_p)_{p \in \kappa}$, in the standard basis of $\mathrm{Mat}_n(\C)$, has entries in $\widetilde{\mathcal L}$, being $\Qbar$-combinations of entries of $M$, and its rank is at most $n^{2} - c$, the rank of $\operatorname{ad} M$. Theorem~\ref{thm:roy_rank_bound} for $R$ gives invertible algebraic $P$, $Q$ and $d' \geq 1$, $\ell'$ with $(PRQ)_{ij} = 0$ for $i \leq d'$ and $j > \ell'$, and $(n^{2} - 1)\ell' \leq (n^{2} - c)(d' + \ell')$; since $2(n^{2} - c) \leq n^{2} - 2$, this forces $d' > \ell'$. Let $U$ be spanned by the matrices $f_j$ whose coordinates are the columns $j > \ell'$ of $Q$, and $V$ by the identity and the matrices $G_i$ ($i \leq d'$) with $\operatorname{Tr}(G_i C) = \sum_p P_{ip} C_p$, built from the rows of $P$ with a zero at $(i_0, i_0)$; so the identity is not in the span of the $G_i$, both spaces are rational, and $\dim U + \dim V = n^{2} - \ell' + d' + 1 \geq n^{2} + 2$. Finally $\operatorname{Tr}(M[A, B]) = \operatorname{Tr}([M, A]B)$, with $\operatorname{Tr}(G_i[M, f_j]) = (PRQ)_{ij} = 0$ and $\operatorname{Tr}([M, f_j]) = 0$, so the trace vanishes on $U \times V$ by bilinearity.
'''

[[node]]
platform = "DiazModulus.fischler_centralizer"
root = true
env = "theorem"
title = "Fischler's Theorem 1.2: the centraliser of a matrix of logarithms"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. For $M \in \mathrm{Mat}_n(\C)$, $C(M) = \{A \in \mathrm{Mat}_n(\C) : AM = MA\}$ is the centraliser of $M$.

Let $M$ be an $n \times n$ matrix with entries in $\widetilde{\mathcal L}$ whose $n^{2}$ entries are linearly independent over $\Qbar$. Then
\[ 2\dim C(M) \leq n^{2} + 1, \]
that is, $\dim C(M) \leq (n^{2} + 1)/2$.
'''
source = '''\cite[Th.~1.2]{Fis01} (p.~169), complex case. Fischler's $\mathcal{L}$, the $\Qbar$-vector space spanned by $1$ and the logarithms of algebraic numbers, is $\widetilde{\mathcal L}$ here, so this is the printed statement.'''
sketch = '''
Suppose $2\dim C(M) \geq n^{2} + 2$. Proposition~\ref{prop:fischler_prop_5_5} gives rational subspaces $U$, $V$ of $\mathrm{Mat}_n(\C)$ with $\dim U + \dim V \geq n^{2} + 2$ and $\operatorname{Tr}(M(AB - BA)) = 0$ for all $A \in U$, $B \in V$. As the $n^{2}$ entries of $M$ are free over $\Qbar$, Lemma~\ref{lem:fischler_commute_of_trace} gives $AB = BA$ on $U \times V$, and Lemma~\ref{lem:remond_commuting_subspaces} bounds $\dim U + \dim V \leq n^{2} + 1$, a contradiction.
'''

[[node]]
platform = "DiazModulus.fischler_centralizer_nb"
root = true
env = "theorem"
title = "Fischler's Theorem 1.2 under the hypothesis of his N.B."
statement = '''
Here $\Qbar$, $\widetilde{\mathcal L}$ and the centraliser $C(M)$ are as in Theorem~\ref{thm:fischler_centralizer}.

Let $M$ be an $n \times n$ matrix with entries in $\widetilde{\mathcal L}$, and assume that no hyperplane of $\mathrm{Mat}_n(\C)$ defined over $\Qbar$ contains both $M$ and the identity matrix: if $c = (c_{ij})$ is an $n \times n$ matrix with algebraic entries such that $\sum_{i,j} c_{ij} M_{ij} = 0$ and $\sum_i c_{ii} = 0$, then $c = 0$. Then
\[ 2\dim C(M) \leq n^{2} + 1. \]
The hypothesis holds when the $n^{2}$ entries of $M$ are linearly independent over $\Qbar$, so this implies Theorem~\ref{thm:fischler_centralizer}.
'''
source = '''The N.B. after \cite[Prop.~5.5]{Fis01} (p.~183): \cite[Th.~1.2]{Fis01} (p.~169), complex case, still holds when the hypothesis that the $n^{2}$ entries of $M$ are linearly independent over $\Qbar$ is replaced by: no hyperplane of $\mathrm{Mat}_n(\C)$ defined over $\Qbar$ contains both $M$ and the identity. Hyperplanes are vector hyperplanes (the convention of p.~169), and one defined over $\Qbar$ is the kernel of a non-zero linear form with algebraic coefficients (p.~170). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The N.B. has no separate proof: the printed proof of Th.~1.2 (pp.~181--183) uses the freeness only to show that algebraic $A$, $B$ with $\operatorname{Tr}(M(AB - BA)) = 0$ commute, and the hypothesis gives that. Routine.'''
sketch = '''
Suppose $2\dim C(M) \geq n^{2} + 2$. Proposition~\ref{prop:fischler_prop_5_5}, which needs only the entries of $M$ in $\widetilde{\mathcal L}$, gives rational subspaces $U$, $V$ of $\mathrm{Mat}_n(\C)$ with $\dim U + \dim V \geq n^{2} + 2$ and $\operatorname{Tr}(M(AB - BA)) = 0$ for all $A \in U$, $B \in V$. For algebraic $A \in U$ and $B \in V$, the commutator $K = AB - BA$ is algebraic, with $\operatorname{Tr} K = 0$ and $\operatorname{Tr}(MK) = 0$: the hyperplane $\{N : \operatorname{Tr}(NK) = 0\}$ is defined over $\Qbar$ and contains $M$ and the identity, so the hypothesis, applied to the transpose of $K$, gives $K = 0$. The maps $B \mapsto AB - BA$ and $A \mapsto AB - BA$ are linear, so $AB = BA$ extends from algebraic spanning sets to all of $V$, then to all of $U$, and Lemma~\ref{lem:remond_commuting_subspaces} gives $\dim U + \dim V \leq n^{2} + 1$, a contradiction.
'''

# --- Further variations Corollary 1.3 and Fischler's Section 6 ----------
[[node]]
platform = "DiazModulus.fv_cor_1_3"
section = '''\emph{Further variations}, Corollary 1.3, and Fischler's Section 6: powers of linear forms'''
root = true
env = "corollary"
title = '''\emph{Further variations}, Corollary 1.3'''
statement = '''
Here $\Qbar$, $\mathcal{L}$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $\Lambda_1, \Lambda_2, \Lambda_3 \in \widetilde{\mathcal L}$. Assume that $\Lambda_1$ is transcendental and that $1, \Lambda_2, \Lambda_3$ are linearly independent over $\Qbar$. Then at least one of the two numbers $\Lambda_1\Lambda_2$, $\Lambda_1\Lambda_3$ is not in $\widetilde{\mathcal L}$.
'''
source = '''\cite[Cor.~1.3]{Wal05b} (p.~3), as printed. No proof is printed: the paper presents it as a consequence of its Th.~1.1, Roy's strong six exponentials theorem, and the proof here is that one, for $x = (1, \Lambda_1)$ and $y = (1, \Lambda_2, \Lambda_3)$. Routine.'''
sketch = '''
Suppose that $\Lambda_1\Lambda_2$ and $\Lambda_1\Lambda_3$ lie in $\widetilde{\mathcal L}$, and put $x = (1, \Lambda_1)$ and $y = (1, \Lambda_2, \Lambda_3)$. The six products $x_i y_j$ are $1, \Lambda_2, \Lambda_3, \Lambda_1, \Lambda_1\Lambda_2, \Lambda_1\Lambda_3$, all in $\widetilde{\mathcal L}$. The triple $y$ is linearly independent over $\Qbar$ by hypothesis, and so is the pair $x$: a relation $s + t\Lambda_1 = 0$ with $t \neq 0$ would make $\Lambda_1 = -s/t$ algebraic, and $t = 0$ forces $s = 0$. This contradicts Theorem~\ref{thm:strong_six_exponentials_unconditional}.
'''

[[node]]
platform = "DiazModulus.fischler_lemma_6_1"
root = true
env = "lemma"
title = '''Fischler's Lemma 6.1: geometric progressions in $\widetilde{\mathcal L}$'''
statement = '''
Here $\widetilde{\mathcal L}$ is as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $\lambda_1, \dots, \lambda_q$ be non-zero elements of $\widetilde{\mathcal L}$ in geometric progression with ratio $t$, that is, $\lambda_{j+1} = t\lambda_j$ for $1 \leq j < q$, and assume that $t$ is transcendental. Then $q \leq 3$.
'''
source = '''\cite[Lemma~6.1]{Fis01} (p.~184). Fischler's $\mathcal{L}$, the $\Qbar$-vector space spanned by $1$ and the logarithms of algebraic numbers, is $\widetilde{\mathcal L}$ here. The printed proof applies \cite[Th.~2.3]{Fis01}, that is \cite[Cor.~2]{Roy92}, to the $2 \times (q - 1)$ matrix of consecutive terms; here Roy's strong six exponentials theorem (Theorem~\ref{thm:strong_six_exponentials_unconditional}) is applied to its $2 \times 3$ corner. Routine.'''
sketch = '''
Suppose $q \geq 4$. By induction, $\lambda_{j+1} = t^{j}\lambda_1$. As $t$ is transcendental, $1, t, t^{2}$ are linearly independent over $\Qbar$. Take $x = (1, t)$ and $y = \lambda_1 (1, t, t^{2})$: $x$ is linearly independent over $\Qbar$, and so is $y$, multiplication by $\lambda_1 \neq 0$ being injective. Each product $x_i y_j$ is $t^{e}\lambda_1 = \lambda_{e+1}$ with $e \leq 3 < q$, a term of the progression, so it lies in $\widetilde{\mathcal L}$. This contradicts Theorem~\ref{thm:strong_six_exponentials_unconditional}.
'''

[[node]]
platform = "DiazModulus.fischler_linear_pow_prod_mem"
env = "lemma"
title = "The coefficients of a power of a linear form"
statement = '''
Here $\widetilde{\mathcal L}$ is as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $\lambda \in \C^{m}$ and $k \geq 0$, and suppose that every coefficient of the polynomial $(\lambda_1 X_1 + \dots + \lambda_m X_m)^{k} \in \C[X_1, \dots, X_m]$ lies in $\widetilde{\mathcal L}$. Then
\[ \lambda_{I(1)} \lambda_{I(2)} \cdots \lambda_{I(k)} \in \widetilde{\mathcal L} \]
for every map $I : \{1, \dots, k\} \to \{1, \dots, m\}$.
'''
source = '''A step of the proofs of \cite[Th.~1.1 and Th.~6.2]{Fis01} (pp.~168--169, 184--185): the coefficients of $\Lambda^{k}$ are positive integer multiples of the products of $k$ coefficients of $\Lambda$. Proved by differentiation and induction on $k$; Fischler also differentiates $P$ (p.~185). Routine.'''
sketch = '''
Write $L = \sum_i \lambda_i X_i$. More generally, if every coefficient of $aL^{k}$ lies in $\widetilde{\mathcal L}$, then $a\lambda_{I(1)} \cdots \lambda_{I(k)} \in \widetilde{\mathcal L}$ for every $I$; the statement is the case $a = 1$. By induction on $k$: for $k = 0$ the constant coefficient is $a$. For the step, the derivative of $aL^{k+1}$ in $X_{I(1)}$ is $a(k + 1)\lambda_{I(1)} L^{k}$, and each coefficient of a partial derivative is a natural multiple of a coefficient of the polynomial, so it lies in the $\Qbar$-vector space $\widetilde{\mathcal L}$. The induction hypothesis for $a(k + 1)\lambda_{I(1)}$ and the rest of $I$ gives $(k + 1)\,a\lambda_{I(1)} \cdots \lambda_{I(k+1)} \in \widetilde{\mathcal L}$, and dividing by $k + 1$ gives the claim.
'''

[[node]]
platform = "DiazModulus.fischler_power_span_finrank"
env = "lemma"
title = '''Products of coordinates in $\widetilde{\mathcal L}$ bound the rank over $\Qbar$'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $k \geq 2$ and $v \in \C^{m}$, and suppose that $v_{I(1)} v_{I(2)} \cdots v_{I(k)} \in \widetilde{\mathcal L}$ for every map $I : \{1, \dots, k\} \to \{1, \dots, m\}$. Then the $\Qbar$-span of $v_1, \dots, v_m$ has dimension at most $2$ over $\Qbar$, and at most $1$ if $k \geq 3$.
'''
source = '''A step of the proofs of \cite[Th.~6.2 and Th.~6.4]{Fis01} (pp.~184--186), their common core: $n \leq 2$, and $n \leq 1$ for $k \geq 3$, with $n$ the dimension of the $\Qbar$-span of the coefficients. The printed proofs apply \cite[Th.~2.3]{Fis01} to a symmetric $n \times n$ matrix and, for $k \geq 3$, Lemma~6.1 (Lemma~\ref{lem:fischler_lemma_6_1}); here both steps apply Roy's strong six exponentials theorem (Theorem~\ref{thm:strong_six_exponentials_unconditional}) to a $2 \times 3$ corner, and Lemma~6.1 is not used. Routine.'''
sketch = '''
Let $V$ be the $\Qbar$-span of $v_1, \dots, v_m$. Expanding each factor in the $v_i$, every product of $k$ elements of $V$ is a $\Qbar$-combination of products $v_{I(1)} \cdots v_{I(k)}$, so it lies in $\widetilde{\mathcal L}$. If $\dim V \geq 3$, pick $c_0, c_1, c_2 \in V$ linearly independent over $\Qbar$, write $k = p + 2$, and take $x = (c_0, c_1)$ and $y = c_0^{p}(c_0, c_1, c_2)$: both are linearly independent over $\Qbar$, and each $x_i y_j = c_0^{p} c_i c_j$ is a product of $k$ elements of $V$, against Theorem~\ref{thm:strong_six_exponentials_unconditional}. If $k \geq 3$ and $\dim V \geq 2$, pick $c_0, c_1 \in V$ linearly independent over $\Qbar$ and write $k = p + 3$. The ratio $\tau = c_1/c_0$ is not algebraic, so $1, \tau, \tau^{2}$ are linearly independent over $\Qbar$; take $x = (c_0, c_1)$ and $y = c_0^{p}(c_0^{2}, c_0c_1, c_1^{2}) = c_0^{p+2}(1, \tau, \tau^{2})$. Each $x_i y_j$ is $c_0^{p}$ times a product of three elements of $V$, and the same theorem gives a contradiction.
'''

[[node]]
platform = "DiazModulus.fischler_rational_hull"
env = "lemma"
title = "The rational hull of a complex vector"
statement = '''
Here $\Qbar$ is as in Theorem~\ref{thm:strong_six_exponentials_unconditional}. For $u, v \in \C^{m}$ write $u \cdot v = \sum_i u_i v_i$.

Let $v \in \C^{m}$, and let $n$ be the dimension over $\Qbar$ of the $\Qbar$-span of $v_1, \dots, v_m$. Then there are $c_1, \dots, c_n \in \C$, linearly independent over $\Qbar$, and vectors $w_1, \dots, w_n \in \C^{m}$ with algebraic coordinates, linearly independent over $\Qbar$, such that
\[ v = c_1 w_1 + \dots + c_n w_n, \]
and every $\psi \in \C^{m}$ with algebraic coordinates and $\psi \cdot v = 0$ satisfies $\psi \cdot w_a = 0$ for $a = 1, \dots, n$.
'''
source = '''A step of the proofs of \cite[Th.~6.2 and Th.~6.4]{Fis01} (pp.~184--186): the $\C$-span of the $w_a$ is the smallest subspace of $\C^{m}$ defined over $\Qbar$ that contains $v$ (p.~185), given here by an explicit decomposition. Routine.'''
sketch = '''
Let $c_1, \dots, c_n$ be a $\Qbar$-basis of the $\Qbar$-span $V$ of $v_1, \dots, v_m$, and let $w_{a,i}$ be the $a$-th coordinate of $v_i$ in this basis. Then every $w_{a,i}$ is algebraic and $v = \sum_a c_a w_a$. The $w_a$ are linearly independent over $\Qbar$: a relation $\sum_a \gamma_a w_a = 0$ says that the linear form $\sum_a \gamma_a c_a^{*}$ on $V$ vanishes at every $v_i$, hence on $V$, hence at each $c_a$, so every $\gamma_a = 0$. Finally, if $\psi$ is algebraic and $\psi \cdot v = 0$, then $\sum_a (\psi \cdot w_a) c_a = 0$ is a relation over $\Qbar$ among the $c_a$, since each $\psi \cdot w_a$ is algebraic, so every $\psi \cdot w_a$ vanishes.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_1_1"
root = true
env = "theorem"
title = '''Fischler's Theorem 1.1: powers of linear forms with coefficients in $\widetilde{\mathcal L}$'''
statement = '''
Here $\Qbar$, $\mathcal{L}$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $k \geq 3$ and $m \geq 0$. Let $P \in \C[X_1, \dots, X_m]$ have all its coefficients in $\widetilde{\mathcal L}$, and assume that $P = (\lambda_1 X_1 + \dots + \lambda_m X_m)^{k}$ for some $\lambda \in \C^{m}$. Then there are $\varphi_1, \dots, \varphi_m \in \Qbar$ and $a \in \widetilde{\mathcal L}$ such that
\[ P = a\,(\varphi_1 X_1 + \dots + \varphi_m X_m)^{k}. \]
The printed hypothesis that $P$ is homogeneous of degree $k$ is not stated: it follows from $P$ being the power of a linear form.
'''
source = '''\cite[Th.~1.1]{Fis01} (pp.~168--169), complex case; it is \cite[Th.~6.2\,(1)]{Fis01} (p.~184), here for any $m$. Fischler's $\mathcal{L}$, the $\Qbar$-vector space spanned by $1$ and the logarithms of algebraic numbers, is $\widetilde{\mathcal L}$ here. The printed proof (of Th.~6.2, pp.~184--185) stops at $n \leq 1$ and leaves implicit why $a$ lies in $\widetilde{\mathcal L}$; here $a = c_1^{k}$ is a $\Qbar$-multiple of the coefficient $\lambda_j^{k}$ of $X_j^{k}$ in $P$. Routine.'''
sketch = '''
By Lemma~\ref{lem:fischler_linear_pow_prod_mem} every product $\lambda_{I(1)} \cdots \lambda_{I(k)}$ lies in $\widetilde{\mathcal L}$, so by Lemma~\ref{lem:fischler_power_span_finrank}, as $k \geq 3$, the $\Qbar$-span of $\lambda_1, \dots, \lambda_m$ has dimension at most $1$. Lemma~\ref{lem:fischler_rational_hull} writes $\lambda = \sum_a c_a w_a$ with that many terms. If there are none, $\lambda = 0$ and $P = 0 = 0 \cdot 0^{k}$. If there is one, $\lambda = c_1 w_1$ with $w_1$ algebraic and non-zero; for $j$ with $w_{1j} \neq 0$, $\lambda_j^{k} = c_1^{k} w_{1j}^{k}$ is a coefficient of $P$, so it lies in $\widetilde{\mathcal L}$, and dividing by the non-zero algebraic number $w_{1j}^{k}$ gives $a = c_1^{k} \in \widetilde{\mathcal L}$. Then $\lambda_1 X_1 + \dots + \lambda_m X_m = c_1 \varphi$ with $\varphi = \sum_i w_{1i} X_i$, and $P = a\varphi^{k}$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_6_2_two"
root = true
env = "theorem"
title = '''Fischler's Theorem 6.2\,(2): squares of linear forms'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $m \geq 0$. Let $P \in \C[X_1, \dots, X_m]$ have all its coefficients in $\widetilde{\mathcal L}$, and assume that $P = (\lambda_1 X_1 + \dots + \lambda_m X_m)^{2}$ for some $\lambda \in \C^{m}$. Then there are two linear forms $\varphi_1 = \sum_i \varphi_{1i} X_i$ and $\varphi_2 = \sum_i \varphi_{2i} X_i$ with algebraic coefficients, and $a, b \in \C$, such that
\[ P = (a\varphi_1 + b\varphi_2)^{2}. \]
The printed hypothesis that $P$ is homogeneous of degree $2$ is not stated: it follows from $P$ being the square of a linear form. The printed hypothesis $m \geq 2$ is not made either.
'''
source = '''\cite[Th.~6.2, part~2]{Fis01} (p.~184), complex case, without the printed hypothesis $m \geq 2$ (for $m \leq 2$ the conclusion is immediate). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. Routine.'''
sketch = '''
By Lemma~\ref{lem:fischler_linear_pow_prod_mem} every product $\lambda_i\lambda_j$ lies in $\widetilde{\mathcal L}$, so by Lemma~\ref{lem:fischler_power_span_finrank} the $\Qbar$-span of $\lambda_1, \dots, \lambda_m$ has dimension at most $2$, and Lemma~\ref{lem:fischler_rational_hull} writes $\lambda = \sum_a c_a w_a$ with that many terms and algebraic $w_a$. It suffices to write $\lambda = a\varphi_1 + b\varphi_2$ with algebraic $\varphi_1$, $\varphi_2$: with no term, take $a = b = 0$; with one, $a = c_1$, $\varphi_1 = w_1$ and $b = 0$; with two, $a = c_1$, $b = c_2$, $\varphi_1 = w_1$ and $\varphi_2 = w_2$.
'''

[[node]]
platform = "DiazModulus.fischler_cor_6_3"
root = true
env = "corollary"
title = '''Fischler's Corollary 6.3\,(1): Conjecture 1 for the $k$-th powers of linear forms'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $k \geq 3$ and $m \geq 0$. Let $P \in \C[X_1, \dots, X_m]$ have all its coefficients in $\widetilde{\mathcal L}$, and assume that $P = (\lambda_1 X_1 + \dots + \lambda_m X_m)^{k}$ for some $\lambda \in \C^{m}$. Then there is a polynomial $Q \in \C[X_1, \dots, X_m]$ with algebraic coefficients such that $P \in \C Q$ and every element of the line $\C Q$ is the $k$-th power $(\lambda'_1 X_1 + \dots + \lambda'_m X_m)^{k}$ of a linear form, for some $\lambda' \in \C^{m}$.

So every $k$-th power of a linear form whose coefficients, as a polynomial, lie in $\widetilde{\mathcal L}$ lies on a line defined over $\Qbar$ and contained in the set $\mathcal{V}(k, m)$ of $k$-th powers of linear forms: the non-trivial inclusion of Fischler's Conjecture~1 for $\mathcal{V}(k, m)$.
'''
source = '''\cite[Cor.~6.3, part~1]{Fis01} (p.~184; proof p.~185): \cite[Conjecture~1]{Fis01} (p.~168) for $\mathcal{V}(k, m)$, $k \geq 3$, in the form of its non-trivial inclusion, with a vector line $\C Q$ as the affine subspace defined over $\Qbar$; the other inclusion is immediate. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. Part~2, a conditional reduction to $\mathcal{V}(2, 2)$, is not formalised. Routine.'''
sketch = '''
Theorem~\ref{thm:fischler_theorem_1_1} gives $P = a\varphi^{k}$ with $a \in \widetilde{\mathcal L}$ and $\varphi = \sum_i \varphi_i X_i$ with algebraic coefficients. Take $Q = \varphi^{k}$: its coefficients are algebraic, as $Q$ is the image of a polynomial over $\Qbar$, and $P = aQ \in \C Q$. For $\gamma \in \C$ choose $z$ with $z^{k} = \gamma$; then $\gamma Q = (z\varphi)^{k} = \bigl(\sum_i z\varphi_i X_i\bigr)^{k}$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_6_4_one"
root = true
env = "theorem"
title = '''Fischler's Theorem 6.4\,(1): tensor powers'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}. For $v \in \C^{m}$ and a map $I : \{1, \dots, k\} \to \{1, \dots, m\}$ write $v_I = v_{I(1)} v_{I(2)} \cdots v_{I(k)}$; these are the coordinates of $v \otimes \cdots \otimes v$ ($k$ factors) in the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$ of $(\C^{m})^{\otimes k}$, which is defined over $\Qbar$.

Let $k \geq 3$ and $v \in \C^{m}$, and suppose that $v_I \in \widetilde{\mathcal L}$ for every map $I : \{1, \dots, k\} \to \{1, \dots, m\}$. Then there are $a \in \widetilde{\mathcal L}$ and $v' \in \C^{m}$ with algebraic coordinates such that $v_I = a\,v'_I$ for every $I$, that is, $v \otimes \cdots \otimes v = a\, v' \otimes \cdots \otimes v'$.
'''
source = '''\cite[Th.~6.4, part~1]{Fis01} (p.~185), complex case, for any $m$ (printed: $m \geq 2$), in the coordinates of the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$, which is defined over $\Qbar$ (p.~170). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The printed proof (pp.~185--186) stops at $n \leq 1$ and leaves implicit why $a$ lies in $\widetilde{\mathcal L}$; here $a = c_1^{k}$ is a $\Qbar$-multiple of the coordinate $v_j^{k}$. Routine.'''
sketch = '''
By Lemma~\ref{lem:fischler_power_span_finrank}, as $k \geq 3$, the $\Qbar$-span of $v_1, \dots, v_m$ has dimension at most $1$, and Lemma~\ref{lem:fischler_rational_hull} writes $v = \sum_a c_a w_a$ with that many terms. If there are none, $v = 0$, and $a = 0$, $v' = 0$ work, since $k \geq 1$. If there is one, $v = c_1 w_1$ with $w_1$ algebraic and non-zero; for $j$ with $w_{1j} \neq 0$, $v_j^{k} = c_1^{k} w_{1j}^{k} \in \widetilde{\mathcal L}$, and dividing by the non-zero algebraic number $w_{1j}^{k}$ gives $a = c_1^{k} \in \widetilde{\mathcal L}$. With $v' = w_1$, every $v_I$ equals $c_1^{k} v'_I = a\,v'_I$.
'''

[[node]]
platform = "DiazModulus.qbar_linearIndependent_complex"
env = "lemma"
title = '''Algebraic vectors linearly independent over $\Qbar$ are linearly independent over $\C$'''
statement = '''
Here $\Qbar$ is as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $w_1, \dots, w_n \in \C^{m}$ be vectors with algebraic coordinates, linearly independent over $\Qbar$. Then $w_1, \dots, w_n$ are linearly independent over $\C$.
'''
source = '''Classical linear algebra; a step of the proof of \cite[Th.~6.4\,(2)]{Fis01} (p.~185). Routine.'''
sketch = '''
Suppose $\sum_j a_j w_j = 0$ with complex $a_j$ and some $a_i \neq 0$. As $\C$ is a free $\Qbar$-vector space, there is a $\Qbar$-linear form $\varphi : \C \to \Qbar$ with $\varphi(a_i) \neq 0$. The coordinates $w_{j,l}$ are algebraic, so $\varphi$ commutes with multiplication by them: $\sum_j \varphi(a_j) w_{j,l} = \varphi\bigl(\sum_j a_j w_{j,l}\bigr) = 0$ for every $l$. Hence $\sum_j \varphi(a_j) w_j = 0$ is a relation over $\Qbar$ among the $w_j$, so every $\varphi(a_j)$ vanishes, against $\varphi(a_i) \neq 0$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_6_4_two"
root = true
env = "theorem"
title = '''Fischler's Theorem 6.4\,(2): tensor squares'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $m \geq 2$ and $v \in \C^{m}$, and suppose that $v_i v_j \in \widetilde{\mathcal L}$ for all $i, j \in \{1, \dots, m\}$ (the coordinates of $v \otimes v$ in the basis $e_i \otimes e_j$). Then there are $w_1, w_2 \in \C^{m}$ with algebraic coordinates, linearly independent over $\C$, such that $v$ lies in the $\C$-span of $w_1$ and $w_2$. So $F = \C w_1 + \C w_2$ is a subspace of $\C^{m}$ defined over $\Qbar$, of dimension $2$, which contains $v$.
'''
source = '''\cite[Th.~6.4, part~2]{Fis01} (p.~185), complex case, in the coordinates of the basis $e_i \otimes e_j$, which is defined over $\Qbar$; a subspace defined over $\Qbar$ is one spanned by vectors with algebraic coordinates (p.~170). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The hypothesis $m \geq 2$ is printed and needed. Routine.'''
sketch = '''
By Lemma~\ref{lem:fischler_power_span_finrank} the $\Qbar$-span of $v_1, \dots, v_m$ has dimension at most $2$, and Lemma~\ref{lem:fischler_rational_hull} writes $v = \sum_a c_a w_a$ with that many terms, the $w_a$ algebraic and linearly independent over $\Qbar$. With no term, $v = 0$ and the first two unit vectors work. With one, $v = c_1 w_1$ with $w_1 \neq 0$; pick $i_0$ with $w_{1,i_0} \neq 0$ and $j \neq i_0$, possible as $m \geq 2$: then $w_1$ and the unit vector $e_j$ are linearly independent over $\C$ (a relation $s w_1 + t e_j = 0$ read at $i_0$ gives $s = 0$, then at $j$ gives $t = 0$), and their span contains $v$. With two, $w_1$ and $w_2$ are linearly independent over $\C$ by Lemma~\ref{lem:qbar_linearIndependent_complex}, and $v = c_1 w_1 + c_2 w_2$ lies in their span.
'''

[[node]]
platform = "DiazModulus.fischler_cor_6_5"
root = true
env = "corollary"
title = '''Fischler's Corollary 6.5\,(1): Conjecture 1 for tensor powers'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}, and $v_I = v_{I(1)} v_{I(2)} \cdots v_{I(k)}$ as in Theorem~\ref{thm:fischler_theorem_6_4_one}: the coordinates of $v \otimes \cdots \otimes v$ ($k$ factors) in the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$ of $(\C^{m})^{\otimes k}$, which is defined over $\Qbar$.

Let $k \geq 3$, $m \geq 0$ and $v \in \C^{m}$, and suppose that $v_I \in \widetilde{\mathcal L}$ for every map $I : \{1, \dots, k\} \to \{1, \dots, m\}$. Then there is a family $y = (y_I)_I$ of algebraic numbers, indexed by these maps, such that $(v_I)_I$ lies in $\C y$ and every element of $\C y$ is $(v''_I)_I$ for some $v'' \in \C^{m}$, that is, $\C y$ consists of tensors $v'' \otimes \cdots \otimes v''$.

So every $v \otimes \cdots \otimes v$ ($k$ factors) whose coordinates lie in $\widetilde{\mathcal L}$ lies on a line (or the point $0$) defined over $\Qbar$ and contained in the set $\mathcal{T}(k, m)$ of such tensors: the non-trivial inclusion of Fischler's Conjecture~1 for $\mathcal{T}(k, m)$.
'''
source = '''\cite[Cor.~6.5, part~1]{Fis01} (p.~185): \cite[Conjecture~1]{Fis01} (p.~168) for $\mathcal{T}(k, m) = \{v \otimes \cdots \otimes v\}$ (p.~179), $k \geq 3$, in the coordinates of the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$, which is defined over $\Qbar$ (p.~170), in the form of its non-trivial inclusion, with a vector line $\C y$ as the affine subspace defined over $\Qbar$; the other inclusion is immediate. Here for any $m$; Th.~6.4, on which it rests, is printed for $m \geq 2$. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. Part~2, a conditional reduction to $\mathcal{T}(2, 2)$, is not formalised. Routine.'''
sketch = '''
Theorem~\ref{thm:fischler_theorem_6_4_one} gives $a \in \widetilde{\mathcal L}$ and $v' \in \C^{m}$ with algebraic coordinates such that $v_I = a\,v'_I$ for every $I$. Take $y = (v'_I)_I$: its entries are products of algebraic numbers, hence algebraic, and $(v_I)_I = a y \in \C y$. For $\gamma \in \C$ choose $z$ with $z^{k} = \gamma$; then $\gamma\,v'_I = \prod_t z\,v'_{I(t)}$, so $\gamma y = (v''_I)_I$ with $v'' = z v'$.
'''

# --- Fischler's Theorems 2.3, 5.3 and 2.1 ----------
[[node]]
platform = "DiazModulus.fischler_theorem_2_3"
section = "Fischler's Theorems 2.3, 5.3 and 2.1"
root = true
env = "theorem"
title = '''Fischler's Theorem 2.3: matrices of rank one with entries in $\widetilde{\mathcal L}$'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}.

Let $d \geq 2$ and $l \geq 3$, and let $M$ be a $d \times l$ matrix of rank $1$ with entries in $\widetilde{\mathcal L}$. Then the $d$ rows of $M$ are linearly dependent over $\Qbar$, or its $l$ columns are linearly dependent over $\Qbar$.
'''
source = '''\cite[Th.~2.3]{Fis01} (p.~171), as printed. It is the $d \times l$ form of \cite[Cor.~2]{Roy92}, which is printed for $2 \times 3$ matrices only (p.~38); Fischler states the $d \times l$ form as Th.~2.3 and presents it as a corollary of his Th.~2.1 (Theorem~\ref{thm:fischler_theorem_2_1}). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The proof applies Roy's strong six exponentials theorem (Theorem~\ref{thm:strong_six_exponentials_unconditional}) to a $2 \times 3$ corner of a factorisation $M_{ij} = u_i c_j$. Routine.'''
sketch = '''
The column space of $M$ is a line $\C u$, so $M_{ij} = u_i c_j$ for some $u \in \C^{d}$ and $c \in \C^{l}$. If the rows of $M$ are linearly independent over $\Qbar$, so are $u_1, \dots, u_d$: a relation $\sum_i \beta_i u_i = 0$ with algebraic $\beta_i$ gives $\sum_i \beta_i M_{ij} = 0$ for every $j$. In the same way, if the columns are linearly independent over $\Qbar$, so are $c_1, \dots, c_l$. Suppose both are. Then $x = (u_1, u_2)$ and $y = (c_1, c_2, c_3)$ are linearly independent over $\Qbar$, and every product $x_i y_j = M_{ij}$ lies in $\widetilde{\mathcal L}$, against Theorem~\ref{thm:strong_six_exponentials_unconditional}.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_5_3"
root = true
env = "theorem"
title = '''Fischler's Theorem 5.3, with a vector hyperplane: Conjecture 2 for tensor powers'''
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}, and $v_I = v_{I(1)} v_{I(2)} \cdots v_{I(k)}$, the coordinates of $v \otimes \cdots \otimes v$ ($k$ factors) in the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$ of $(\C^{m})^{\otimes k}$, as in Theorem~\ref{thm:fischler_theorem_6_4_one}.

Let $m \geq 2$ and $k \geq 2$ with $(k, m) \neq (2, 2)$, let $v \in \C^{m}$, and suppose that $v_I \in \widetilde{\mathcal L}$ for every map $I : \{1, \dots, k\} \to \{1, \dots, m\}$. Then there is a family $(\psi_I)_I$ of algebraic numbers, indexed by these maps and not all zero, such that
\[ \sum_I \psi_I v_I = 0. \]
So $v \otimes \cdots \otimes v$ lies in the vector hyperplane $\sum_I \psi_I x_I = 0$ of $(\C^{m})^{\otimes k}$, which is defined over $\Qbar$: Fischler's Conjecture~2 for the set $\mathcal{T}(k, m)$ of tensors $v \otimes \cdots \otimes v$, with a hyperplane through $0$.
'''
source = '''\cite[Th.~5.3]{Fis01} (p.~180), in the setting of \S5.1 ($m \geq 2$, $k \geq 2$, p.~178), with \cite[Conjecture~2]{Fis01} (p.~168) in the coordinates of the basis $e_{I(1)} \otimes \cdots \otimes e_{I(k)}$, which is defined over $\Qbar$ (p.~170). The conclusion is slightly stronger than printed: the hyperplane is a vector hyperplane, where Conjecture~2 asks for an affine one; Fischler notes that his method gives vector hyperplanes (p.~169). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The printed proof goes through the orbit results of \S4 and is sketched (p.~178); Fischler points to Th.~6.4 for a more precise result (p.~180). The proof here uses only the bound of Lemma~\ref{lem:fischler_power_span_finrank}, the common core of the proofs of Th.~6.2 and Th.~6.4, and no orbit theory; neither Th.~6.4 nor the rational hull of $v$ is used. Routine.'''
sketch = '''
By Lemma~\ref{lem:fischler_power_span_finrank} the $\Qbar$-span of $v_1, \dots, v_m$ has dimension $n \leq 2$, and $n \leq 1$ if $k \geq 3$. As $m \geq 2$ and $(k, m) \neq (2, 2)$, in both cases $n < m$, so $\sum_i \beta_i v_i = 0$ for some algebraic $\beta_i$, not all zero. The map $\iota(i) = (i, 1, \dots, 1)$ from indices to maps $\{1, \dots, k\} \to \{1, \dots, m\}$ is injective; let $\psi$ be $\beta_i$ at $\iota(i)$ and $0$ elsewhere. Then $\psi$ is algebraic and non-zero, and $\sum_I \psi_I v_I = \sum_i \beta_i v_i v_1^{k-1} = 0$.
'''

[[node]]
platform = "DiazModulus.rational_common_kernel"
env = "lemma"
title = "A rational subspace is the common kernel of algebraic linear forms"
statement = '''
Here $\Qbar$ is as in Theorem~\ref{thm:strong_six_exponentials_unconditional}, and a subspace of $\C^{d}$ is \emph{rational} if it is spanned by vectors with algebraic coordinates. For $u, v \in \C^{d}$ write $u \cdot v = \sum_i u_i v_i$.

Let $T \subseteq \C^{d}$ be a rational subspace. Then there are $\psi_1, \dots, \psi_d \in \C^{d}$ with algebraic coordinates such that, for every $v \in \C^{d}$, $v \in T$ if and only if $\psi_i \cdot v = 0$ for $i = 1, \dots, d$.
'''
source = '''Classical linear algebra over $\Qbar$: one half of the remark of \cite[p.~170]{Fis01} that a subspace defined over $\Qbar$ is one defined by linear equations with coefficients in $\Qbar$. Used for Th.~2.1 (through Lemma~\ref{lem:rational_proper_annihilator}) and for the pencil forms of Prop.~3.1 and Th.~4.2. Routine.'''
sketch = '''
Lemma~\ref{lem:roy_rational_adapted_basis} gives a linear automorphism $g$ of $\C^{d}$ that maps algebraic vectors to algebraic vectors, such that $v \in T$ if and only if the last $d - \dim T$ coordinates of $gv$ vanish. The columns $g(e_j)$ of the matrix $G$ of $g$ are algebraic, so $G$ has algebraic entries and the $i$-th coordinate of $gv$ is $G_i \cdot v$, with $G_i$ the $i$-th row of $G$. Take $\psi_i = G_i$ for the last $d - \dim T$ indices $i$ and $\psi_i = 0$ for the others.
'''

[[node]]
platform = "DiazModulus.rational_proper_annihilator"
env = "lemma"
title = "A proper rational subspace is killed by a non-zero algebraic linear form"
statement = '''
With the notation of Lemma~\ref{lem:rational_common_kernel}: let $T \subseteq \C^{d}$ be a rational subspace with $T \neq \C^{d}$. Then there is a non-zero $\varphi \in \C^{d}$ with algebraic coordinates such that $\varphi \cdot v = 0$ for every $v \in T$.
'''
source = '''Classical linear algebra over $\Qbar$, for a proper subspace: the half of the remark of \cite[p.~170]{Fis01} quoted in Lemma~\ref{lem:rational_common_kernel}. A step of the proof of \cite[Th.~2.1]{Fis01} (pp.~170--171) in Theorem~\ref{thm:fischler_theorem_2_1}. Routine.'''
sketch = '''
Lemma~\ref{lem:rational_common_kernel} writes $T$ as the common kernel of algebraic $\psi_1, \dots, \psi_d$. If every $\psi_i$ were zero, $T$ would be $\C^{d}$; a non-zero $\psi_i$ is the required $\varphi$.
'''

[[node]]
platform = "DiazModulus.rational_preimage_finrank"
env = "lemma"
title = "A rational preimage of the algebraic part of a subspace"
statement = '''
With the notation of Lemma~\ref{lem:rational_common_kernel}: let $M$ be a $d \times l$ complex matrix whose $l$ columns are linearly independent over $\Qbar$ ($Mb \neq 0$ for every non-zero $b \in \C^{l}$ with algebraic coordinates), let $T \subseteq \C^{d}$ be any subspace, rational or not, and let $W \subseteq \C^{d}$ be the $\Qbar$-vector space spanned by the columns of $M$. Then there is a rational subspace $S \subseteq \C^{l}$ such that $Ms \in T$ for every $s \in S$ and
\[ \dim S = \dim_{\Qbar}(W \cap T). \]
'''
source = '''A step of the proof of \cite[Th.~2.1]{Fis01} (pp.~170--171) in Theorem~\ref{thm:fischler_theorem_2_1}: it gives the subspace $S$ of the conclusion, whose codimension $l - \dim S$ is then the number $\ell'$ of Roy's Th.~4 (Theorem~\ref{thm:roy_theorem_four}). The statement keeps the hypothesis that the columns of $M$ are linearly independent over $\Qbar$; the proof does not use it, and the conclusion holds for every complex matrix $M$. Routine.'''
sketch = '''
Let $y_1, \dots, y_n$ be a $\Qbar$-basis of $W \cap T$. Each $y_k$ lies in $W$, so $y_k = M b_k$ with $b_k \in \C^{l}$ algebraic. The $b_k$ are linearly independent over $\Qbar$, since $b \mapsto Mb$ is $\Qbar$-linear and sends them to the free family of the $y_k$, and so, being algebraic, they are linearly independent over $\C$ (Lemma~\ref{lem:qbar_linearIndependent_complex}). Their $\C$-span $S$ is rational, of dimension $n$, and $MS \subseteq T$ since every $M b_k = y_k$ lies in $T$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_2_1"
root = true
env = "theorem"
title = "Fischler's Theorem 2.1: Roy's Theorem 4 in Fischler's form"
statement = '''
Here $\Qbar$ and $\widetilde{\mathcal L}$ are as in Theorem~\ref{thm:strong_six_exponentials_unconditional}, and rational subspaces as in Lemma~\ref{lem:rational_common_kernel}.

Let $M$ be a $d \times l$ matrix with entries in $\widetilde{\mathcal L}$, of rank $r$. Assume that the $l$ columns of $M$ are linearly independent over $\Qbar$ ($Mb \neq 0$ for every non-zero $b \in \C^{l}$ with algebraic coordinates), that its $d$ rows are linearly independent over $\Qbar$ ($\varphi^{\mathsf T} M \neq 0$ for every non-zero $\varphi \in \C^{d}$ with algebraic coordinates), and that $(d + l)\,r < dl$. Then there are rational subspaces $S \subseteq \C^{l}$ and $T \subseteq \C^{d}$ and an integer $r_1 \geq 1$ such that, with $l_1 = l - \dim S$ and $d_1 = d - \dim T$, we have $l_1 \geq 1$, $d_1 \geq 1$, $Ms \in T$ for every $s \in S$, and
\[ r_1 d < r d_1 \quad\text{and}\quad l_1 d_1 \leq r_1 (l_1 + d_1), \]
that is, $r_1/d_1 < r/d$ and $r_1 \geq l_1 d_1/(l_1 + d_1)$.

In Fischler's terms: $M$ is the matrix of a linear map $u$ in bases defined over $\Qbar$, its kernel contains no non-zero vector defined over $\Qbar$, its image lies in no hyperplane defined over $\Qbar$, $r < dl/(d + l)$, and $S$, $T$ are defined over $\Qbar$ with $u(S) \subseteq T$.
'''
source = '''\cite[Th.~2.1]{Fis01} (pp.~170--171): Roy's Th.~4 in Fischler's form, in coordinates for bases defined over $\Qbar$ (a subspace defined over $\Qbar$ is a rational one, p.~170). The printed hypotheses 2 and 3 say that the columns and the rows of $M$ are linearly independent over $\Qbar$; hyperplanes are vector hyperplanes (the convention of p.~169); the printed hypothesis that the spaces $E$ and $F$ are non-zero follows from $(d + l)r < dl$ and is omitted; the integer $r_1$ is existentially quantified, as printed. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. Fischler derives the theorem from \cite[Th.~4]{Roy92} (p.~34), referring to Roy's proof of Cor.~1 (p.~38), which does not contain the step that gives the strict inequality $r_1/d_1 < r/d$; here that step comes from Roy's Th.~4, which holds at every minimiser (p.~34), applied at the zero subspace. Routine.'''
sketch = '''
Let $U$ be the column space of $M$ and $W$ the $\Qbar$-span of its columns; $(d + l)r < dl$ forces $d, l \geq 1$. Lemma~\ref{lem:roy_theorem_four_exists}, with Theorem~\ref{thm:multiplicityEstimateElem}, gives a rational $T \neq \C^{d}$ minimising $(r - \dim(U \cap T))/(d - \dim T)$, and Theorem~\ref{thm:roy_theorem_four} gives, with $d_1 = d - \dim T$, $r_1 = r - \dim(U \cap T)$ and $\ell' = l - \dim_{\Qbar}(W \cap T)$, the inequalities $\ell' d_1 \leq r_1(d_1 + \ell')$ and $r_1 d \leq r d_1$. The second is strict: in case of equality the zero subspace minimises the ratio too, and Theorem~\ref{thm:roy_theorem_four} there gives $ld \leq r(d + l)$, against the hypothesis. Lemma~\ref{lem:rational_preimage_finrank} gives a rational $S$ with $MS \subseteq T$ and $\dim S = \dim_{\Qbar}(W \cap T)$, so $l_1 = \ell'$. Finally $U \not\subseteq T$: by Lemma~\ref{lem:rational_proper_annihilator} a non-zero algebraic $\varphi$ vanishes on $T$, and it would kill every column of $M$, against the hypothesis on the rows. This gives $r_1 \geq 1$ and, as $S = \C^{l}$ would give $U \subseteq T$, also $l_1 \geq 1$; and $d_1 \geq 1$ as $T \neq \C^{d}$.
'''

# --- Fischler's Sections 3 and 4 in pencil form ----------
[[node]]
platform = "DiazModulus.fischler_prop_3_2_pencil"
section = "Fischler's Sections 3 and 4 in pencil form"
env = "proposition"
title = "Fischler's Proposition 3.2 in pencil form, not printed in this form"
statement = '''
Here $\Qbar$, $\widetilde{\mathcal L}$ and rational subspaces are as in Theorem~\ref{thm:fischler_theorem_2_1}. For $d \times d$ matrices $F_1, \dots, F_l$ and $\alpha \in \C^{d}$, $M_\alpha$ is the $d \times l$ matrix whose $a$-th column is $F_a\alpha$, so that $M_\alpha s = (s_1F_1 + \dots + s_lF_l)\,\alpha$ for $s \in \C^{l}$.

Let $d \geq 1$. Let $F_1, \dots, F_l$ be $d \times d$ matrices with algebraic entries, let $x \in \C^{d}$ have all its coordinates in $\widetilde{\mathcal L}$, and put $r = \operatorname{rank} M_x$. Let $\mathcal{E}$ be the intersection of all rational subspaces of $\C^{d}$ that contain $x$. Then there are subspaces $S \subseteq \C^{l}$ and $T \subseteq \C^{d}$ such that, with $l_1 = l - \dim S$ and $d_1 = d - \dim T$, we have $d_1 \geq 1$,
\[ (d - r)\,l_1 \leq r\,d_1, \]
and $(s_1F_1 + \dots + s_lF_l)\,\alpha \in T$ for every $s \in S$ and every $\alpha \in \mathcal{E}$. No bound on $l_1$ is asserted, and $S$ and $T$ are not required to be rational, as in print.
'''
source = '''\cite[Prop.~3.2]{Fis01} (p.~174), in pencil form; not printed in this form. Fischler's setting (\S2.3, pp.~171--172): $\rho : G \to \mathrm{GL}(W)$ a representation of an affine algebraic group, both defined over $\Qbar$, $X$ an orbit, $d = \dim W$, $l = \dim G$, $r = \dim X$, $f_A = \mathrm{Lie}(\rho)(A)$ and $M_\alpha(A) = f_A(\alpha)$. The pencil form replaces $\mathrm{Lie}(\rho)$ by the algebraic matrices $F_1, \dots, F_l$, the images of a basis of the Lie algebra defined over $\Qbar$ (so $f_A = \sum_a s_a F_a$ for $A = \sum_a s_a A_a$), and $\dim X$ by $\operatorname{rank} M_x$, which is Fischler's Lemma~2.4; the printed statement follows from the pencil form with Lemma~2.4. This dictionary is an argument, not a formal proof: the printed statement, on algebraic groups, is not formalised. No property of the $F_a$ beyond being algebraic is assumed, and $x \in X(\mathcal{L})$, with Fischler's $\mathcal{L}$, becomes $x \in \widetilde{\mathcal L}^{d}$: the printed proof uses nothing more. $\mathcal{E}$, the smallest subspace defined over $\Qbar$ that contains $x$, is written as the intersection of all rational subspaces containing $x$; $d \geq 1$ is implicit in print ($d_1 \geq 1$). As printed, $l_1 \geq 0$ and $S$, $T$ are not said to be defined over $\Qbar$. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The proof is the printed one: Roy's Cor.~1 (Fischler's Cor.~2.2) applied to $M_x$. Routine.'''
sketch = '''
The matrix $M_x$ has entries in $\widetilde{\mathcal L}$, the $F_a$ being algebraic. Theorem~\ref{thm:roy_rank_bound} gives invertible algebraic $P$, $Q$ and $0 < d' \leq d$, $0 \leq l' \leq l$ such that $(PM_xQ)_{ij} = 0$ for $i \leq d'$ and $j > l'$, and $dl' \leq r(d' + l')$, that is, $(d - r)l' \leq rd'$. Let $S$ be the span of the last $l - l'$ columns of $Q$ and $T$ the common kernel of the first $d'$ rows of $P$, so that $l_1 = l'$ and $d_1 = d'$. For a column $s$ of $Q$ in $S$, each of the first $d'$ rows of $P(\sum_a s_aF_a)$ is an algebraic linear form vanishing at $x$. Lemma~\ref{lem:fischler_rational_hull} writes $x = \sum_b c_b w_b$ with algebraic $w_b$, and such a form vanishes at every $w_b$; the $\C$-span of the $w_b$ is rational and contains $x$, hence contains $\mathcal{E}$, so the form vanishes on $\mathcal{E}$. Hence $(\sum_a s_aF_a)\alpha \in T$ for $\alpha \in \mathcal{E}$, and linearity extends this to all of $S$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_4_2_pencil"
root = true
env = "theorem"
title = "Fischler's Theorem 4.2 in pencil form, not printed in this form"
statement = '''
With $F_1, \dots, F_l$ and $M_\alpha$ as in Proposition~\ref{prop:fischler_prop_3_2_pencil}: let $F_1, \dots, F_l$ be $d \times d$ matrices with algebraic entries, let $x \in \C^{d}$ have all its coordinates in $\widetilde{\mathcal L}$, and put $r = \operatorname{rank} M_x$. Assume that $2r < d$. Then there is a rational subspace $E \subseteq \C^{d}$ with $x \in E$ such that $\operatorname{rank} M_\alpha < d$ for every $\alpha \in E$.
'''
source = '''\cite[Th.~4.2]{Fis01} (p.~175), in pencil form; not printed in this form. Printed: if $\rho$ has a Zariski-dense orbit $Y$ and $X$ has dimension $r < d/2$, every $x \in X(\mathcal{L})$ lies in a subspace defined over $\Qbar$ that is disjoint from $Y$. The pencil form uses the dictionary of Proposition~\ref{prop:fischler_prop_3_2_pencil}, with $r = \operatorname{rank} M_x$, and reads disjointness from $Y$ as $\operatorname{rank} M_\alpha < d$ on $E$: when a Zariski-dense orbit $Y$ exists, $Y$ is the set of $\alpha$ with $\operatorname{rank} M_\alpha = d$, by Lemma~2.4 and since an orbit is open in its closure. The dense-orbit hypothesis is not needed, so the pencil form is slightly more general. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The proof is the printed one: $E$ is the least rational subspace containing $x$, and Proposition~\ref{prop:fischler_prop_3_2_pencil} with rank--nullity bounds $\operatorname{rank} M_\alpha$ on $E$. Routine.'''
sketch = '''
Lemma~\ref{lem:fischler_rational_hull} writes $x = \sum_b c_b w_b$ with the $c_b$ linearly independent over $\Qbar$ and the $w_b$ algebraic; let $E$ be the $\C$-span of the $w_b$, which is rational and contains $x$. It lies in every rational subspace containing $x$: by Lemma~\ref{lem:rational_common_kernel} such a subspace is the common kernel of algebraic linear forms, which vanish at $x$, hence at every $w_b$. So $E$ lies in the subspace $\mathcal{E}$ of Proposition~\ref{prop:fischler_prop_3_2_pencil}, which gives $S$, $T$ with $d_1 \geq 1$, $(d - r)l_1 \leq rd_1$ and $M_\alpha s \in T$ for $s \in S$ and $\alpha \in E$. If $\operatorname{rank} M_\alpha = d$ for some $\alpha \in E$, rank--nullity for $M_\alpha$ on a splitting $\C^{l} = S \oplus S'$ gives $d \leq \dim T + l_1$, that is, $d_1 \leq l_1$, so $l_1 \geq 1$; then $(d - r)l_1 \leq rd_1 \leq rl_1$ gives $d \leq 2r$, against $2r < d$.
'''

[[node]]
platform = "DiazModulus.fischler_prop_3_1_pencil"
env = "proposition"
title = "Fischler's Proposition 3.1 in pencil form, not printed in this form"
statement = '''
With $F_1, \dots, F_l$ and $M_\alpha$ as in Proposition~\ref{prop:fischler_prop_3_2_pencil}, and $u \cdot v$ as in Lemma~\ref{lem:rational_common_kernel}: let $F_1, \dots, F_l$ be $d \times d$ matrices with algebraic entries, let $x \in \C^{d}$ have all its coordinates in $\widetilde{\mathcal L}$, and put $r = \operatorname{rank} M_x$. Assume

(S1$'$) $F_1, \dots, F_l$ are linearly independent over $\Qbar$;

(S2$'$) no non-zero $\varphi \in \C^{d}$ with algebraic coordinates satisfies $\varphi^{\mathsf T} F_a = 0$ for $a = 1, \dots, l$;

(S3$'$) $(d + l)\,r < dl$.

Assume also that $x$ lies in no hyperplane defined over $\Qbar$: $\varphi \cdot x \neq 0$ for every non-zero $\varphi \in \C^{d}$ with algebraic coordinates. Then there are subspaces $S \subseteq \C^{l}$ and $T \subseteq \C^{d}$ and an integer $r_1 \geq 1$ such that, with $l_1 = l - \dim S$ and $d_1 = d - \dim T$, we have $l_1 \geq 1$, $d_1 \geq 1$, $(s_1F_1 + \dots + s_lF_l)\,\alpha \in T$ for every $s \in S$ and every $\alpha \in \C^{d}$ (the image of $s_1F_1 + \dots + s_lF_l$ lies in $T$), and
\[ r_1 d < r d_1 \quad\text{and}\quad l_1 d_1 \leq r_1 (l_1 + d_1), \]
that is, $r_1/d_1 < r/d$ and $r_1 \geq l_1 d_1/(l_1 + d_1)$. $S$ and $T$ are not required to be rational, as in print.
'''
source = '''\cite[Prop.~3.1]{Fis01} (p.~173), in pencil form; not printed in this form, with the dictionary of Proposition~\ref{prop:fischler_prop_3_2_pencil}. The printed hypothesis that $(\rho, X)$ is suitable (p.~172) is replaced by its linear consequences: $\mathrm{Lie}(\rho)$ injective gives (S1$'$); the condition that no open subgroup of $G^{\mathrm{op}}$ fixes a non-zero $\varphi$ in $W^{*}$ gives (S2$'$) in the complex case, through the exponential, and the printed proof uses it only for algebraic $\varphi$; $r < dl/(d + l)$ is (S3$'$) with $r = \operatorname{rank} M_x$ (Lemma~2.4). Hyperplanes are vector hyperplanes (the convention of p.~169). As printed, $S$ and $T$ are not said to be defined over $\Qbar$. Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The proof is the printed one (pp.~173--174): Fischler's Th.~2.1 (Theorem~\ref{thm:fischler_theorem_2_1}) applied to $M_x$, whose columns and rows are linearly independent over $\Qbar$ by (S1$'$), (S2$'$) and the hypothesis on $x$. Routine.'''
sketch = '''
$M_x$ has entries in $\widetilde{\mathcal L}$, and $M_x b = (\sum_a b_aF_a)x$. If $b$ is algebraic and $M_x b = 0$, each row of $\sum_a b_aF_a$ is an algebraic linear form vanishing at $x$, hence zero, so $\sum_a b_aF_a = 0$ and $b = 0$ by (S1$'$). If $\varphi$ is algebraic and $\varphi^{\mathsf T}M_x = 0$, the algebraic forms $\varphi^{\mathsf T}F_a$ vanish at $x$, hence are zero, so $\varphi = 0$ by (S2$'$). Theorem~\ref{thm:fischler_theorem_2_1} then gives rational $S$, $T$ with $l_1, d_1 \geq 1$ and $M_xS \subseteq T$, and $r_1$ with the two inequalities. By Lemma~\ref{lem:rational_common_kernel}, $T$ is the common kernel of algebraic forms $\psi_1, \dots, \psi_d$. For algebraic $s \in S$, $(\sum_a s_aF_a)x \in T$, so each algebraic form $\psi_k^{\mathsf T}(\sum_a s_aF_a)$ vanishes at $x$, hence is zero: the image of $\sum_a s_aF_a$ lies in $T$. As $S$ is spanned by its algebraic vectors and $s \mapsto \sum_a s_aF_a$ is linear, this holds for every $s \in S$.
'''

[[node]]
platform = "DiazModulus.fischler_theorem_4_1_pencil"
root = true
env = "theorem"
title = "Fischler's Theorem 4.1 in pencil form, not printed in this form"
statement = '''
With $F_1, \dots, F_l$, $M_\alpha$ and $u \cdot v$ as in Proposition~\ref{prop:fischler_prop_3_1_pencil}: let $k \geq 2$, let $F_1, \dots, F_l$ be $d \times d$ matrices with algebraic entries, let $x \in \C^{d}$ have all its coordinates in $\widetilde{\mathcal L}$, and put $r = \operatorname{rank} M_x$. Assume (S1$'$)--(S3$'$) of Proposition~\ref{prop:fischler_prop_3_1_pencil}: $F_1, \dots, F_l$ are linearly independent over $\Qbar$, no non-zero $\varphi \in \C^{d}$ with algebraic coordinates satisfies $\varphi^{\mathsf T} F_a = 0$ for $a = 1, \dots, l$, and $(d + l)\,r < dl$. Assume also that $d < \operatorname{rank} M_\alpha + k$ for some $\alpha \in \C^{d}$, and that $kr \leq d$. Then $x$ lies in a hyperplane defined over $\Qbar$: there is a non-zero $\varphi \in \C^{d}$ with algebraic coordinates such that $\varphi \cdot x = 0$.
'''
source = '''\cite[Th.~4.1]{Fis01} (pp.~174--175), in pencil form; not printed in this form, with the dictionary of Proposition~\ref{prop:fischler_prop_3_2_pencil}. The printed hypotheses ($k > 1$; $(\rho, X)$ suitable; a $\rho$-orbit of codimension less than $k$ in $W$; $X$ of dimension $r \leq d/k$) become $k \geq 2$, (S1$'$)--(S3$'$) as in Proposition~\ref{prop:fischler_prop_3_1_pencil}, $d - \operatorname{rank} M_\alpha < k$ for some $\alpha$, and $k \operatorname{rank} M_x \leq d$, orbit dimensions being read as ranks (Lemma~2.4). Hyperplanes are vector hyperplanes (the convention of p.~169). Fischler's $\mathcal{L}$ is $\widetilde{\mathcal L}$ here. The proof is the printed one (p.~175), its arithmetic cleared of denominators. Routine.'''
sketch = '''
Suppose that $x$ lies in no hyperplane defined over $\Qbar$. Proposition~\ref{prop:fischler_prop_3_1_pencil} gives $S$, $T$ with $l_1, d_1 \geq 1$ and $(\sum_a s_aF_a)(\C^{d}) \subseteq T$ for $s \in S$, and $r_1 \geq 1$ with $r_1 d < rd_1$ and $l_1 d_1 \leq r_1(l_1 + d_1)$. As $M_\alpha s = (\sum_a s_aF_a)\alpha$, $M_\alpha$ maps $S$ into $T$, and rank--nullity on a splitting $\C^{l} = S \oplus S'$ gives $d_1 \leq l_1 + (d - \operatorname{rank} M_\alpha) \leq l_1 + k - 1$. From $kr \leq d$, $kr_1 r \leq r_1 d < rd_1$, so $kr_1 < d_1$. Multiplying $r_1 d < rd_1$ by $l_1 + d_1$ and using $l_1 d_1 \leq r_1(l_1 + d_1)$ gives $dl_1 < r(l_1 + d_1)$, so $kl_1 < l_1 + d_1$. If $l_1 = 1$, then $k \leq kr_1 < d_1 \leq k$. If $l_1 \geq 2$, then $kl_1 < l_1 + d_1 \leq 2l_1 + k - 1$ forces $k = 2$; then $d_1 = l_1 + 1$ and $2r_1 \leq l_1$, and $l_1(l_1 + 1) \leq r_1(2l_1 + 1) \leq l_1(2l_1 + 1)/2$ fails. So $x$ lies in a hyperplane defined over $\Qbar$.
'''

# --- Further variations: Theorem 2.1 for every subspace ----------
[[node]]
platform = "DiazModulus.fv_rho_excess"
section = '''\emph{Further variations}: Theorem 2.1 for every subspace'''
env = "lemma"
title = "The excess does not increase along a chain"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, and $\C^{n}$ is a $\Qbar$-vector space by restriction of scalars. For a $\Qbar$-subspace $Z$ and a $\C$-subspace $V$ of $\C^{n}$, $Z \cap V$ is a $\Qbar$-subspace; when $Z$ is finite-dimensional write
\[ \rho_Z(V) = \dim_{\Qbar} Z - \dim_{\Qbar}(Z \cap V), \]
the dimension of $Z/(Z \cap V)$ over $\Qbar$. Dimensions of $\C$-subspaces are over $\C$.

Let $Z \subseteq Z'$ be $\Qbar$-subspaces of $\C^{n}$ with $Z'$ finite-dimensional, and let $V \subseteq V'$ be $\C$-subspaces of $\C^{n}$. Then
\[ \rho_{Z'}(V') + \rho_Z(V) \leq \rho_Z(V') + \rho_{Z'}(V). \]
That is, the excess $\rho_{Z'}(V) - \rho_Z(V)$, which is non-negative, does not increase as $V$ grows. At $V' = \C^{n}$ this is the monotonicity $\rho_Z(V) \leq \rho_{Z'}(V)$.
'''
source = '''Classical linear algebra (Grassmann's formula); a step of the finite approximation (Proposition~\ref{prop:fv_finite_approx}) that extends \cite[Th.~2.1]{Wal05b} to every $Y$. Routine.'''
sketch = '''
Since $Z \subseteq Z'$, $Z \cap (Z' \cap V) = Z \cap V$, so Grassmann's formula for $Z$ and $Z' \cap V$ gives
\[ \rho_{Z'}(V) - \rho_Z(V) = \dim_{\Qbar} Z' - \dim_{\Qbar}\bigl(Z + (Z' \cap V)\bigr), \]
which is $\geq 0$ because $Z + (Z' \cap V) \subseteq Z'$. For $V \subseteq V'$, $Z + (Z' \cap V) \subseteq Z + (Z' \cap V')$, so the excess at $V'$ is at most the excess at $V$. All four numbers are natural numbers, and adding $\rho_Z(V) + \rho_Z(V')$ to both sides gives the inequality. At $V' = \C^{n}$ both $\rho_Z(\C^{n})$ and $\rho_{Z'}(\C^{n})$ vanish.
'''

[[node]]
platform = "DiazModulus.fv_rho_inf"
env = "lemma"
title = "The quotient at an intersection of two subspaces"
statement = '''
With the notation of Lemma~\ref{lem:fv_rho_excess}: let $Z \subseteq \C^{n}$ be a finite-dimensional $\Qbar$-subspace and $V_1, V_2$ $\C$-subspaces of $\C^{n}$. Then
\[ \rho_Z(V_1 \cap V_2) \leq \rho_Z(V_1) + \rho_Z(V_2). \]
'''
source = '''Classical linear algebra (Grassmann's formula); a step of Lemma~\ref{lem:fv_rho_sInf}. Routine.'''
sketch = '''
Put $A = Z \cap V_1$ and $B = Z \cap V_2$. Then $A \cap B = Z \cap V_1 \cap V_2$ and $A + B \subseteq Z$, so Grassmann's formula gives $\dim_{\Qbar}(Z \cap V_1 \cap V_2) = \dim_{\Qbar} A + \dim_{\Qbar} B - \dim_{\Qbar}(A + B) \geq \dim_{\Qbar} A + \dim_{\Qbar} B - \dim_{\Qbar} Z$. Subtracting from $\dim_{\Qbar} Z$ gives $\rho_Z(V_1 \cap V_2) \leq (\dim_{\Qbar} Z - \dim_{\Qbar} A) + (\dim_{\Qbar} Z - \dim_{\Qbar} B)$.
'''

[[node]]
platform = "DiazModulus.fv_rho_sInf"
env = "lemma"
title = "The quotient at the intersection of a family"
statement = '''
With the notation of Lemma~\ref{lem:fv_rho_excess}: let $Z \subseteq \C^{n}$ be a finite-dimensional $\Qbar$-subspace, $\mathfrak{F}$ a set of $\C$-subspaces of $\C^{n}$, finite or not, and $D$ a natural number with $\rho_Z(V) \leq D$ for every $V \in \mathfrak{F}$. Let $J$ be the intersection of the members of $\mathfrak{F}$ ($J = \C^{n}$ if $\mathfrak{F}$ is empty). Then
\[ \rho_Z(J) \leq n\,D. \]
'''
source = '''Classical linear algebra; a step of the finite approximation (Proposition~\ref{prop:fv_finite_approx}), where $\mathfrak{F}$ is uncountable in general. Routine.'''
sketch = '''
By induction on $k \leq n$ there is a $\C$-subspace $W \supseteq J$ with $\rho_Z(W) \leq kD$ and either $W = J$ or $\dim W + k \leq n$. For $k = 0$ take $W = \C^{n}$. Given $W$ for $k < n$, keep it if $W = J$; otherwise some $V \in \mathfrak{F}$ does not contain $W$, and $W \cap V$ contains $J$, has dimension at most $\dim W - 1$, and has $\rho_Z(W \cap V) \leq kD + D$ by Lemma~\ref{lem:fv_rho_inf}. At $k = n$, either $W = J$, or $\dim W = 0$ and then $J \subseteq W = 0$ gives $W = J$ again. So $\rho_Z(J) \leq nD$; the argument shows that $J$ is $\C^{n}$ or the intersection of at most $n$ members of $\mathfrak{F}$.
'''

[[node]]
platform = "DiazModulus.fv_finite_approx"
env = "proposition"
title = "Finite approximation"
statement = '''
With the notation of Lemma~\ref{lem:fv_rho_excess}: let $Y \subseteq \C^{n}$ be a $\Qbar$-subspace, of any dimension, and $B$ a natural number. Then there is a finite-dimensional $\Qbar$-subspace $Y_0 \subseteq Y$ such that
\[ \min\bigl(\rho_{Y_1}(V), B\bigr) \leq \rho_{Y_0}(V) \]
for every $\C$-subspace $V \subseteq \C^{n}$ and every finite-dimensional $\Qbar$-subspace $Y_1 \subseteq Y$. Equivalently, $\dim_{\Qbar}\bigl(Y_0/(Y_0 \cap V)\bigr) \geq \min\bigl(\dim_{\Qbar}(Y/(Y \cap V)), B\bigr)$ for every $V$, an infinite dimension counting as larger than $B$: one finite-dimensional $Y_0$ serves for all $V$ at once.
'''
source = '''The step that \cite[Th.~2.1]{Wal05b} needs for infinite-dimensional $Y$: its proof (pp.~5--6) writes $Y = \Qbar y_1 + \dots + \Qbar y_{\ell}$, and for infinite-dimensional $Y$ a finite-dimensional $Y_0$ with $\mu(Y_0, \C^{n}) > d/(d - n)$ is not automatic, since $V$ ranges over infinitely many subspaces (Theorem~\ref{thm:fv_theorem_2_1_general}). Elementary linear algebra: no topology on Grassmannians and no Noetherian argument is used. Routine.'''
sketch = '''
For a finite-dimensional $Z \subseteq Y$ let $I(Z)$ be the intersection of all $\C$-subspaces $V$ with $\rho_Z(V) < B$. By Lemma~\ref{lem:fv_rho_sInf}, $\rho_Z(I(Z)) \leq nB$, so $N(Z) = (nB + 1)\dim I(Z) + \rho_Z(I(Z))$ is bounded by $(nB + 1)n + nB$; let $Y_0$ maximise it. Lemma~\ref{lem:fv_rho_excess} (monotonicity) makes $I$ monotone: $Z \subseteq Z'$ gives $I(Z) \subseteq I(Z')$. Write $I = I(Y_0)$. For finite-dimensional $Z' \supseteq Y_0$ in $Y$, maximality of $N(Y_0)$ forces $\dim I(Z') = \dim I$, hence $I(Z') = I$, and then $\rho_{Z'}(I) \leq \rho_{Y_0}(I)$, so $\rho_{Z'}(I) = \rho_{Y_0}(I)$ by monotonicity. Now let $V$ and $Y_1$ be given. If $V \not\supseteq I$, then $\rho_{Y_0}(V) \geq B$ by the definition of $I$. If $V \supseteq I$, put $Z' = Y_0 + Y_1$; Lemma~\ref{lem:fv_rho_excess} for $Y_0 \subseteq Z'$ and $I \subseteq V$ gives $\rho_{Z'}(V) + \rho_{Y_0}(I) \leq \rho_{Y_0}(V) + \rho_{Z'}(I)$, so $\rho_{Z'}(V) \leq \rho_{Y_0}(V)$, and monotonicity gives $\rho_{Y_1}(V) \leq \rho_{Z'}(V)$.
'''

[[node]]
platform = "DiazModulus.fv_theorem_2_1_general"
env = "theorem"
title = '''Waldschmidt, \emph{Further variations}, Theorem 2.1, with finite-dimensional witnesses'''
statement = '''
With the notation of Lemma~\ref{lem:fv_dot_orthogonal} ($u \cdot v$ the bilinear dot product, $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and the logarithms of algebraic numbers) and of Lemma~\ref{lem:fv_rho_excess}: let $X, Y \subseteq \C^{n}$ be $\Qbar$-subspaces, $X$ finite-dimensional with $d = \dim_{\Qbar} X > n$, and $Y$ of any dimension. Assume that for every $\C$-subspace $V \neq \C^{n}$ there is a finite-dimensional $\Qbar$-subspace $Y_0 \subseteq Y$, which may depend on $V$, with
\[ d\,(n - \dim V) < (d - n)\,\rho_{Y_0}(V). \]
Then $x \cdot y \notin \widetilde{\mathcal L}$ for some $x \in X$ and $y \in Y$.

The hypothesis is $\mu(Y, \C^{n}) > d/(d - n)$, for the least value $\mu(Y, \C^{n})$ of $\dim_{\Qbar}\bigl(Y/(Y \cap V)\bigr)/(n - \dim V)$ over the $\C$-subspaces $V \neq \C^{n}$, an infinite dimension giving the value $\infty$: at each $V$ a witness $Y_0$ exists exactly when that ratio exceeds $d/(d - n)$. Theorem~\ref{thm:fv_theorem_2_1_rank} states it in that form.
'''
source = '''\cite[Th.~2.1]{Wal05b} (p.~5), for every $\Qbar$-subspace $Y$ as printed, with the hypothesis $\mu(Y, \C^{n}) > d/(d - n)$ written through finite-dimensional witnesses. The printed proof (pp.~5--6) writes $Y = \Qbar y_1 + \dots + \Qbar y_{\ell}$ and covers finite-dimensional $Y$ only (Theorem~\ref{thm:fv_theorem_2_1}); the general case is reduced to it here by Proposition~\ref{prop:fv_finite_approx}, which gives one finite-dimensional $Y_0 \subseteq Y$ that works for every $V$ at once. No correction of this point was found in the sources consulted.'''
sketch = '''
Let $Y_0$ be given by Proposition~\ref{prop:fv_finite_approx} for $Y$ and $B = dn + 1$; Theorem~\ref{thm:fv_theorem_2_1} will apply to $X$ and $Y_0$. Let $V \neq \C^{n}$, put $c = n - \dim V \leq n$, and let $Y_1$ be the witness at $V$, so that $dc < (d - n)\rho_{Y_1}(V)$. If $\rho_{Y_1}(V) \leq B$, then $\rho_{Y_0}(V) \geq \rho_{Y_1}(V)$ and the inequality passes to $Y_0$. Otherwise $\rho_{Y_0}(V) \geq B = dn + 1$, and $(d - n)\rho_{Y_0}(V) \geq dn + 1 > dc$ since $d - n \geq 1$. So Theorem~\ref{thm:fv_theorem_2_1} gives $x \in X$ and $y \in Y_0 \subseteq Y$ with $x \cdot y \notin \widetilde{\mathcal L}$.
'''

[[node]]
platform = "DiazModulus.fv_rank_quot_witness"
env = "lemma"
title = "Finite-dimensional witnesses for a large quotient"
statement = '''
With the notation of Lemma~\ref{lem:fv_rho_excess}: let $Y \subseteq \C^{n}$ be a $\Qbar$-subspace, $V \subseteq \C^{n}$ a $\C$-subspace, and $N$ a natural number with $N \leq \dim_{\Qbar}\bigl(Y/(Y \cap V)\bigr)$, a dimension that may be an infinite cardinal. Then there is a finite-dimensional $\Qbar$-subspace $Y_0 \subseteq Y$ with
\[ N \leq \rho_{Y_0}(V). \]
'''
source = '''Classical linear algebra; a step of the proof of Theorem~\ref{thm:fv_theorem_2_1_rank}. Routine.'''
sketch = '''
Choose $N$ linearly independent classes $[y_1], \dots, [y_N]$ in $Y/(Y \cap V)$, with $y_i \in Y$, and let $Y_0$ be the $\Qbar$-span of $y_1, \dots, y_N$. If $\sum_i a_i y_i \in V$ with algebraic $a_i$, then $\sum_i a_i y_i \in Y \cap V$, so $\sum_i a_i [y_i] = 0$ and every $a_i = 0$. Hence $\dim_{\Qbar} Y_0 = N$ and $Y_0 \cap V = 0$, so $\rho_{Y_0}(V) = N$.
'''

[[node]]
platform = "DiazModulus.fv_theorem_2_1_rank"
root = true
env = "theorem"
title = '''Waldschmidt, \emph{Further variations}, Theorem 2.1'''
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. For $u, v \in \C^{n}$, $u \cdot v = \sum_k u_k v_k$ is the bilinear dot product. Dimensions over $\Qbar$ are cardinals, possibly infinite; dimensions of $\C$-subspaces are over $\C$.

Let $X, Y \subseteq \C^{n}$ be $\Qbar$-subspaces, $X$ finite-dimensional with $d = \dim_{\Qbar} X > n$, and $Y$ of any dimension. Assume that for every $\C$-subspace $V \neq \C^{n}$
\[ d\,(n - \dim V) < (d - n) \dim_{\Qbar}\bigl(Y/(Y \cap V)\bigr) \]
in cardinal arithmetic; that is, $\mu(Y, \C^{n}) > d/(d - n)$, where $\mu(Y, \C^{n})$ is the least value of $\dim_{\Qbar}\bigl(Y/(Y \cap V)\bigr)/(n - \dim V)$ over the $\C$-subspaces $V \neq \C^{n}$. Then $x \cdot y \notin \widetilde{\mathcal L}$ for some $x \in X$ and $y \in Y$.
'''
source = '''\cite[Th.~2.1]{Wal05b} (p.~5), as printed: $Y$ is any $\Qbar$-subspace of $\C^{n}$, and $\mu(Y, \C^{n})$ is that of \cite[p.~4]{Wal05b}, with $\dim_{\Qbar}(Y/(Y \cap V))$ a cardinal. The printed proof (pp.~5--6) covers finite-dimensional $Y$ only (Theorem~\ref{thm:fv_theorem_2_1}); the general case comes from Theorem~\ref{thm:fv_theorem_2_1_general}, whose proof reduces it to one finite-dimensional subspace of $Y$ (Proposition~\ref{prop:fv_finite_approx}). Every application in \cite{Wal05b} (Th.~1.2, Cor.~1.4) has $\dim Y = 5$.'''
sketch = '''
By Theorem~\ref{thm:fv_theorem_2_1_general} it suffices to find, for each $\C$-subspace $V \neq \C^{n}$, a finite-dimensional $Y_0 \subseteq Y$ with $dc < (d - n)\rho_{Y_0}(V)$, where $c = n - \dim V$. Let $\kappa = \dim_{\Qbar}(Y/(Y \cap V))$. If $\kappa$ is finite, the hypothesis is the inequality $dc < (d - n)\kappa$ between natural numbers, and Lemma~\ref{lem:fv_rank_quot_witness} with $N = \kappa$ gives $Y_0$ with $\rho_{Y_0}(V) \geq \kappa$. If $\kappa$ is infinite, the same lemma with $N = dc + 1$ gives $\rho_{Y_0}(V) \geq dc + 1$, and $(d - n)(dc + 1) > dc$ since $d - n \geq 1$.
'''

# --- The closed form of Roy's bound, and DALAG's table ----------
[[node]]
platform = "DiazModulus.roy_phi_closed_form_superadd"
section = "The closed form of Roy's bound, and DALAG's table"
env = "lemma"
title = "The closed form bounds one part and is superadditive"
statement = '''
For natural numbers $0 < n < d$ put
\[ F(n, d) = \begin{cases} \dfrac{nd}{d - n} & \text{if } n = 1 \text{ or } d - n = 1, \\[1ex] \dfrac{d - n}{d - n - 1} + (n - 1)\,n & \text{otherwise,} \end{cases} \]
a rational number. Then
\[ \frac{ax}{x - a} \leq F(a, x) \qquad\text{and}\qquad F(a, x) + F(b, y) \leq F(a + b, x + y) \]
for all natural numbers $0 < a < x$ and $0 < b < y$.
'''
source = '''The closed form of \cite[Lemma, p.~40]{Roy92}. When neither $n = 1$ nor $d - n = 1$, $F(n, d) = F(1, d - n) + F(n - 1, n)$, Roy's recursion with both values evaluated. The left inequality is, after subtracting $a$, the relation $a^{2}/\delta \leq (a - 1)^{2} + 1/(\delta - 1)$ ($a, \delta \geq 2$) of Roy's proof (pp.~40--41); superadditivity is the route taken here to Roy's Lemma (Lemma~\ref{lem:roy_lemma_phi}) in place of his exchange argument. Routine.'''
sketch = '''
Write $\delta = x - a$. Then $ax/(x - a) = a + a^{2}/\delta$, while $F(a, x) - a$ is $a^{2}/\delta$ if $a = 1$ or $\delta = 1$, and $(a - 1)^{2} + 1/(\delta - 1)$ if $a, \delta \geq 2$. The left inequality is an equality in the former case; in the latter the difference is $\bigl((a - 1)(\delta - 1) - 1\bigr)^{2}/\bigl(\delta(\delta - 1)\bigr) \geq 0$. For the right inequality put $\delta_1 = x - a$ and $\delta_2 = y - b$. Since $a + b \geq 2$ and $\delta_1 + \delta_2 \geq 2$, $F(a + b, x + y) - (a + b) = (a + b - 1)^{2} + 1/(\delta_1 + \delta_2 - 1)$. Sort each of $(a, \delta_1)$ and $(b, \delta_2)$ into three kinds: entry $1$ on the left; left entry at least $2$ and right entry $1$; both entries at least $2$. Up to exchanging the two pairs there are six combinations, each an elementary inequality between rational numbers; for instance, for $a = 1$ and $\delta_2 = 1$ the two sides are equal, and for $a, b \geq 2$ and $\delta_1 = \delta_2 = 1$ the difference is $2(a - 1)(b - 1)$.
'''

[[node]]
platform = "DiazModulus.roy_lemma_phi"
root = true
env = "lemma"
title = '''Roy's Lemma: the closed form of $\varphi(n, d)$'''
statement = '''
Decompositions are as in Theorem~\ref{thm:roy_theorem_five}: lists $(n_1, d_1), \dots, (n_k, d_k)$ of pairs of natural numbers with $0 < n_i < d_i$, $\sum_i n_i = n$ and $\sum_i d_i = d$.

Let $0 < n < d$. Among the values of $\sum_i n_i d_i/(d_i - n_i)$ over the decompositions of $(n, d)$, the largest is
\[ \varphi(n, d) = \begin{cases} \dfrac{nd}{d - n} & \text{if } n = 1 \text{ or } d - n = 1, \\[1ex] \dfrac{d - n}{d - n - 1} + (n - 1)\,n & \text{otherwise:} \end{cases} \]
some decomposition of $(n, d)$ attains it, and none exceeds it. This is Roy's $\varphi(n, d)$; in the second case it equals $\varphi(1, d - n) + \varphi(n - 1, n)$, the form in which Roy states it.
'''
source = '''\cite[Lemma, p.~40]{Roy92}, which states the second case as $\varphi(n, d) = \varphi(1, d - n) + \varphi(n - 1, n)$; the closed form follows from the case $n = 1$ or $d - n = 1$ at $(1, d - n)$ and $(n - 1, n)$. Roy's proof (pp.~40--41) maximises $\sum_i n_i^{2}/(d_i - n_i)$ by exchanges and concludes that a maximiser has two parts, a step that its two exclusions do not give, since they leave parts with $n_i = d_i - n_i = 1$ free: for $(n, d) = (3, 7)$ the decomposition $(1, 3), (1, 2), (1, 2)$ meets every condition stated there and has three parts. One exchange on three parts repairs it (ERRATA.md), and the Lemma is correct as printed. The proof here uses no exchanges: it goes through the superadditivity of the closed form (Lemma~\ref{lem:roy_phi_closed_form_superadd}).'''
sketch = '''
Let $F$ be the closed form of Lemma~\ref{lem:roy_phi_closed_form_superadd}, and $\varphi_D$ the sum of a decomposition $D$ of $(n, d)$. By induction on the number of parts, $\varphi_D \leq F(n, d)$: for one part this is the left inequality of Lemma~\ref{lem:roy_phi_closed_form_superadd}; for $D = (a, x), D'$ with $D'$ non-empty, $D'$ decomposes $(n - a, d - x)$, so $0 < n - a < d - x$, and $\varphi_D = ax/(x - a) + \varphi_{D'} \leq F(a, x) + F(n - a, d - x) \leq F(n, d)$. The bound is attained: by $D = (n, d)$ if $n = 1$ or $d - n = 1$, and otherwise by $D = (1, d - n), (n - 1, n)$, whose sum is $(d - n)/(d - n - 1) + (n - 1)n$.
'''

[[node]]
platform = "DiazModulus.dalag_psi_floor_roy_phi"
env = "lemma"
title = '''DALAG's table $\Psi$ is the integer part of $\varphi$'''
statement = '''
Decompositions are as in Theorem~\ref{thm:roy_theorem_five}. Let $\Psi$ be the table of \cite[p.~394]{Wal00}: $\Psi(0, d) = 0$, and for $0 < n < d$
\[ \Psi(n, d) = \begin{cases} 1 & \text{if } n = 1 \text{ and } d \geq 3, \\ n(n - 1) + 1 & \text{if } 2 \leq n \leq d - 3, \\ n(n - 1) + 2 & \text{if } 2 \leq n = d - 2, \\ n(n + 1) & \text{if } n = d - 1. \end{cases} \]
Let $0 < n < d$. Then every decomposition of $(n, d)$ has $\sum_i n_i d_i/(d_i - n_i) < \Psi(n, d) + 1$, and some decomposition of $(n, d)$ has $\sum_i n_i d_i/(d_i - n_i) \geq \Psi(n, d)$. So $\Psi(n, d) = \lfloor \varphi(n, d) \rfloor$, with $\varphi$ as in Lemma~\ref{lem:roy_lemma_phi}.
'''
source = '''The table is \cite[p.~394]{Wal00} (\S11.5, before Cor.~11.10), where it is introduced by its values; \cite{Wal00} does not compare it with Roy's $\varphi$, and its Exercise~11.4 proves Lemma~11.11 there by a case analysis of the table. The comparison is a computation from Roy's Lemma (Lemma~\ref{lem:roy_lemma_phi}), row by row. Routine.'''
sketch = '''
By Lemma~\ref{lem:roy_lemma_phi} both claims reduce to $\Psi(n, d) \leq F(n, d) < \Psi(n, d) + 1$ for the closed form $F$ of Lemma~\ref{lem:roy_phi_closed_form_superadd}. Put $\delta = d - n$. For $n = 1$ and $d = 2$, $F = 2 = \Psi$. For $n = 1$ and $d \geq 3$, $F = 1 + 1/(d - 1)$ lies in $(1, 3/2]$ and $\Psi = 1$. For $n \geq 2$ and $\delta = 1$, $F = n(n + 1) = \Psi$. For $n \geq 2$ and $\delta = 2$, $F = 2 + n(n - 1) = \Psi$. For $n \geq 2$ and $\delta \geq 3$, $F = n(n - 1) + 1 + 1/(\delta - 1)$ with $0 < 1/(\delta - 1) \leq 1/2$, and $\Psi = n(n - 1) + 1$.
'''

[[node]]
platform = "DiazModulus.dalag_cor_11_15_psi"
root = true
env = "corollary"
title = '''DALAG Corollary 11.15 for $\Qbar$ and $\widetilde{\mathcal L}$, with the table $\Psi$'''
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\widetilde{\mathcal L}$ the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. A subspace of $\C^{d}$ is \emph{rational} if it is spanned by vectors with algebraic coordinates. $\Psi$ is the table of Lemma~\ref{lem:dalag_psi_floor_roy_phi}, with $\Psi(0, d) = 0$ for every $d \geq 0$.

Let $V \subseteq \C^{d}$ be a subspace that contains no non-zero vector with algebraic coordinates, and let $S_0 \supseteq V$ be a rational subspace of least dimension among the rational subspaces containing $V$; write $n = \dim V$ and $d_{\min} = \dim S_0$. Then $n < d_{\min}$ if $n > 0$, the $\Qbar$-vector space $V \cap \widetilde{\mathcal L}^{d}$ is finite-dimensional, and
\[ \dim_{\Qbar}\bigl(V \cap \widetilde{\mathcal L}^{d}\bigr) \leq \Psi(n, d_{\min}). \]
'''
source = '''\cite[Cor.~11.15]{Wal00} (p.~398) for $(\Qbar, \widetilde{\mathcal L})$, with the bound $\Psi(\dim V, d_{\min})$ as printed; for $d_{\min} = d$ it is \cite[Th.~5]{Roy92} (p.~39) with Roy's $\varphi$ replaced by its integer part. The table of p.~394 gives $\Psi(0, d)$ for $d > 0$ only, while the corollary allows $V = 0$, where $d_{\min} = 0$; the value $\Psi(0, 0) = 0$ is the one the bound needs. The proof follows \cite[Th.~5]{Roy92} through Corollary~\ref{cor:roy_theorem_five_dmin}, not DALAG's argument for Cor.~11.15.'''
sketch = '''
Corollary~\ref{cor:roy_theorem_five_dmin} gives the finiteness and a decomposition $D$ of $(n, d_{\min})$ with $\ell = \dim_{\Qbar}(V \cap \widetilde{\mathcal L}^{d}) \leq \varphi_D$, the sum of $D$. If $n = 0$, $D$ is empty, since every part has $n_i \geq 1$, so $\ell \leq 0 = \Psi(0, d_{\min})$. If $n > 0$, $D$ is non-empty, and adding up $n_i < d_i$ gives $n < d_{\min}$. Lemma~\ref{lem:dalag_psi_floor_roy_phi} then gives $\varphi_D < \Psi(n, d_{\min}) + 1$, and since $\ell$ and $\Psi(n, d_{\min})$ are integers, $\ell \leq \Psi(n, d_{\min})$.
'''

# --- Two lemmas for DALAG Corollary 12.23 ----------
[[node]]
platform = "DiazModulus.logAlg_exists_rat_basis"
section = "Two lemmas for DALAG Corollary 12.23"
env = "lemma"
title = "A rational basis among finitely many logarithms"
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic). Let $\lambda_1, \dots, \lambda_m \in \mathcal{L}$. Then there are $\mu_1, \dots, \mu_s \in \mathcal{L}$, linearly independent over $\Q$, and rational numbers $c_{kt}$ such that
\[ \lambda_k = \sum_{t=1}^{s} c_{kt}\,\mu_t \qquad (k = 1, \dots, m). \]
'''
source = '''Classical linear algebra: a $\Q$-basis of the $\Q$-span of $\lambda_1, \dots, \lambda_m$ chosen among them. A step of the argument of \cite[p.~435]{Wal00} for \cite[Cor.~12.23]{Wal00} (Corollary~\ref{cor:dalag_cor_12_23}). Routine.'''
sketch = '''
Take a maximal subfamily of $\lambda_1, \dots, \lambda_m$ that is linearly independent over $\Q$. Its members lie in $\mathcal{L}$, and by maximality every $\lambda_k$ lies in its $\Q$-span.
'''

[[node]]
platform = "DiazModulus.matrix_rank_map_field"
env = "lemma"
title = "A homomorphism of fields preserves the rank of a matrix"
statement = '''
Let $f : K \to L$ be a homomorphism of fields and $A$ a $d \times \ell$ matrix with entries in $K$, and let $f(A)$ be the matrix obtained by applying $f$ to every entry. Then
\[ \operatorname{rank}_{L} f(A) = \operatorname{rank}_{K} A. \]
'''
source = '''Classical linear algebra; a step of the proof of Corollary~\ref{cor:dalag_cor_12_23}, where it compares ranks over $\Q(X_1, \dots, X_m)$ and $\Qbar(X_1, \dots, X_m)$. Routine.'''
sketch = '''
The homomorphism $f$ is injective, and $L$ is a $K$-vector space through $f$. Choose rows of $A$ forming a $K$-basis of its row space. Their images are linearly independent over $L$, since vectors of $K^{\ell}$ that are linearly independent over $K$ stay so over $L$; and every row of $f(A)$ is the image of a $K$-combination of the chosen rows, hence an $L$-combination of their images. So the images form an $L$-basis of the row space of $f(A)$.
'''

# --- DALAG Corollary 11.15 over the rationals, by Roy's route ----------
[[node]]
platform = "DiazModulus.ratLogAlg_mem_iff"
section = "DALAG Corollary 11.15 over the rationals, by Roy's route"
env = "lemma"
title = '''The $\Q$-span of $1$ and $\mathcal{L}$ is $\Q + \mathcal{L}$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic).

Let $x \in \C$. Then $x$ lies in the $\Q$-vector space spanned by $1$ and $\mathcal{L}$ if and only if $x - q \in \mathcal{L}$ for some $q \in \Q$. So this space is $\Q + \mathcal{L} = \{q + \lambda : q \in \Q,\ \lambda \in \mathcal{L}\}$.
'''
source = '''Classical: the space $\Q + \mathcal{L}$ of \cite[p.~398]{Wal00}, the case $(\Q, \Q + \mathcal{L})$ of Cor.~11.15 there, written as the $\Q$-span of $1$ and $\mathcal{L}$. A step of the proof of that corollary, at the end of this section. Routine.'''
sketch = '''
First, $\mathcal{L}$ is a $\Q$-vector subspace of $\C$: $e^{0} = 1$, $e^{u + v} = e^{u}e^{v}$, and $e^{mu} = (e^{u})^{m}$ is algebraic for every integer $m$, since $e^{u} \neq 0$; for $N \geq 1$ the number $y = e^{u/N}$ satisfies $y^{N} = e^{u}$, so $y$ is algebraic and $u/N \in \mathcal{L}$. Hence every element of the $\Q$-span of $1$ and $\mathcal{L}$ is $q \cdot 1 + \lambda$ with $q \in \Q$ and $\lambda \in \mathcal{L}$: the generators have this form, and it is stable under sums and rational multiples. Conversely, if $x - q \in \mathcal{L}$, then $x = q \cdot 1 + (x - q)$ lies in the span. The rational $q$ is unique, by the Hermite--Lindemann theorem, but this is not used.
'''

[[node]]
platform = "DiazModulus.roy_rat_adapted_basis"
env = "lemma"
title = '''Coordinates adapted to a subspace rational over $\Q$'''
statement = '''
A vector of $\C^{d}$ is \emph{rational} if its coordinates are rational numbers, and a subspace $S \subseteq \C^{d}$ is \emph{rational over $\Q$} if it is spanned by its rational vectors.

Let $S \subseteq \C^{d}$ be rational over $\Q$. Then there is a linear automorphism $g$ of $\C^{d}$ such that, for every $\Q$-vector subspace $M \subseteq \C$, both $g$ and $g^{-1}$ map $M^{d}$ into $M^{d}$, and $v \in S$ if and only if $(gv)_i = 0$ for every index $i \geq \dim S$ (the indices run over $0, \dots, d - 1$). With $M = \Q$ and $M = \Q + \mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}), $g$ and $g^{-1}$ preserve rational vectors and vectors with coordinates in $\Q + \mathcal{L}$.
'''
source = '''Classical linear algebra over $\Q \subseteq \C$; the analogue over $\Q$ of Lemma~\ref{lem:roy_rational_adapted_basis}. Routine.'''
sketch = '''
The rational vectors of $S$ form a $\Q$-subspace $W$ of $\Q^{d}$. Complete a $\Q$-basis of $W$, of $k$ vectors, to a basis $b_0, \dots, b_{d-1}$ of $\Q^{d}$, let $P$ be the matrix with these columns, and let $g$ be the inverse of $P$, both read as complex matrices. Each coordinate of $gv$ and of $g^{-1}v$ is a $\Q$-linear combination of the coordinates of $v$, so both maps preserve $M^{d}$ for every $\Q$-subspace $M$ of $\C$. Every $v$ is $\sum_j (gv)_j b_j$, so $v \in S$ when the coordinates of $gv$ of index $\geq k$ vanish; conversely $g$ maps each $w \in W$ to its coordinate vector, whose coordinates of index $\geq k$ vanish, and these $w$ span $S$ over $\C$. The columns of $P$ are linearly independent over $\C$ and the first $k$ of them span $S$, so $k = \dim S$.
'''

[[node]]
platform = "DiazModulus.roy_rat_relation_rank_le"
env = "lemma"
title = '''The rank of the relations, over $\Q$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic). Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}.

Let $z_1, \dots, z_{\ell} \in \C^{d}$ be linearly independent over $\Q$, with $z_j = b_j + \lambda_j$, $b_j \in \Q^{d}$ and $\lambda_j \in \mathcal{L}^{d}$. Let $V' \subseteq \C^{d}$ be a subspace and $L_1$ the common kernel of linear forms $\varphi_1, \dots, \varphi_q$ on $\C^{d}$ with integer coefficients. Let $\rho$ be the dimension of the $\Q$-span of the integer vectors $s \in \Z^{\ell}$ with $\sum_j s_j b_j \in V'$ and $\prod_i \bigl(\prod_j e^{s_j \lambda_{j,i}}\bigr)^{\varphi_{k,i}} = 1$ for every $k$ (the relations of Theorem~\ref{thm:linear_subgroup_transcendence} at the lifts $(b_j, \lambda_j)$). With $T = \mathrm{span}_{\C}(V' \cap \Q^{d}) + L_1$,
\[ \rho \leq \dim_{\Q}\Bigl(\mathrm{span}_{\Q}(z) \cap \mathrm{span}_{\Q}\{\tau + 2\pi i\,\kappa : \tau \in T,\ \kappa \in \Q^{d}\}\Bigr). \]
'''
source = '''A step of the proof of \cite[Th.~4]{Roy92} over $F = \Q$ (Remark~(i), p.~37, with $\Q + \mathcal{L}$ in place of $\widetilde{\mathcal L}$), in the setting of \cite[\S11.6.2]{Wal00} with $m = 1$; the analogue over $\Q$ of Lemma~\ref{lem:roy_relation_rank_le}, without its factor $m$. Routine.'''
sketch = '''
For a relation $s$ put $x_s = \sum_j s_j b_j$ and $y_s = \sum_j s_j \lambda_j$, so that $\sum_j s_j z_j = x_s + y_s$. The vector $x_s$ lies in $V'$ and is rational, so it lies in $\mathrm{span}_{\C}(V' \cap \Q^{d}) \subseteq T$. The exponential condition says $\sum_i \varphi_{k,i}\, y_{s,i} \in 2\pi i\,\Z$ for every $k$; a $\Q$-linear projection $\C \to \Q$ fixing $1$, applied to the coordinates of $y_s/2\pi i$, gives $r \in \Q^{d}$ with $\varphi_k(r) = \varphi_k(y_s)/2\pi i$ for every $k$, so $y_s - 2\pi i\,r \in L_1$. Hence $\sum_j s_j z_j = (x_s + y_s - 2\pi i\,r) + 2\pi i\,r$ lies in the space on the right. The map $c \mapsto \sum_j c_j z_j$ on $\Q^{\ell}$ is injective, since $z$ is $\Q$-free, and it maps the $\Q$-span of the relations into that space; an injective linear map does not lower the dimension.
'''

[[node]]
platform = "DiazModulus.roy_rat_period_space"
env = "lemma"
title = '''The space of periods, over $\Q$'''
statement = '''
Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}.

Let $c \neq 0$, let $T, U \subseteq \C^{d}$ be subspaces with $T$ rational over $\Q$, and let $F$ be a finite-dimensional $\Q$-subspace of $U$ every element of which is $\tau + c\kappa$ with $\tau \in T$ and $\kappa \in \Q^{d}$. Then $R = T + \mathrm{span}_{\C} F$ is rational over $\Q$,
\[ \dim_{\Q} F + \dim T \leq \dim_{\Q}(F \cap T) + \dim R, \quad\text{and}\quad \dim(U \cap R) + \dim T = \dim(U \cap T) + \dim R. \]
'''
source = '''Linear algebra; a step of the proof of \cite[Th.~4]{Roy92} over $F = \Q$ (Remark~(i), p.~37), on the route of Lemma~\ref{lem:roy_rat_relation_rank_le}; the analogue over $\Q$ of Lemma~\ref{lem:roy_period_space}. Routine.'''
sketch = '''
Every $x \in F$ is $\tau + c\kappa$ with $\tau \in T$ and $\kappa$ rational, and then $\kappa = c^{-1}(x - \tau) \in R$; so $R$ is spanned by the rational vectors of $T$ and these $\kappa$, and is rational over $\Q$. The $\Q$-space $P$ of pairs $(x, \kappa)$ with $x \in F$, $\kappa \in \Q^{d}$ and $x - c\kappa \in T$ is finite-dimensional. Its first projection is onto $F$, with kernel the pairs $(0, \kappa)$ with $\kappa$ a rational vector of $T$, of $\Q$-dimension at least $\dim T$ because $T$ is rational over $\Q$. Its second projection has a kernel that embeds in $F \cap T$ and an image of rational vectors of $R$; rational vectors that are linearly independent over $\Q$ are linearly independent over $\C$, so the image has $\Q$-dimension at most $\dim R$. Rank--nullity twice gives $\dim_{\Q} F + \dim T \leq \dim_{\Q} P \leq \dim_{\Q}(F \cap T) + \dim R$. Finally $\mathrm{span}_{\C} F \subseteq U$, so $U + R = U + T$, and the dimension formula for $U, R$ and for $U, T$ gives the identity.
'''

[[node]]
platform = "DiazModulus.roy_rat_semistable_node"
env = "proposition"
title = '''Roy's Theorem 4 over $\Q$, the semistable case'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers, and $\Q + \mathcal{L}$ the $\Q$-vector space spanned by $1$ and $\mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}.

Assume \texttt{hME} (the hypothesis of Theorem~\ref{thm:linear_subgroup_transcendence}; Theorem~\ref{thm:multiplicityEstimateElem} proves it). Assume also, for every $t < d$: whenever $U' \subseteq \C^{t}$ is a subspace, $a < b$ are natural numbers with $b \dim(U' \cap S) \leq a \dim S$ for every subspace $S \subseteq \C^{t}$ rational over $\Q$, and $z'_1, \dots, z'_{\ell'} \in U' \cap (\Q + \mathcal{L})^{t}$ are linearly independent over $\Q$, then $(b - a)\,\ell' \leq b \dim U'$. Let $U \subseteq \C^{d}$ with $n = \dim U < d$ and $d \dim(U \cap S) \leq n \dim S$ for every subspace $S \subseteq \C^{d}$ rational over $\Q$, and let $z_1, \dots, z_{\ell} \in U \cap (\Q + \mathcal{L})^{d}$ be linearly independent over $\Q$. Then
\[ (d - n)\,\ell \leq dn. \]
The second hypothesis is the slope bound over $\Q$ in every dimension below $d$; the next proposition proves it by induction on $d$, with this one as the step.
'''
source = '''\cite[Th.~4]{Roy92} (p.~34), semistable case, over $F = \Q$ (Remark~(i), p.~37, with $\Q + \mathcal{L}$ in place of $\widetilde{\mathcal L}$); \cite[Prop.~11.19]{Wal00} (p.~402) for $(\Q, \Q + \mathcal{L})$ in the same case, whose printed proof has a gap for $\Q$ (ERRATA.md, B9) and is not used. The route is that of Proposition~\ref{prop:roy_semistable_node}, over $\Q$ and with $m = 1$: \cite[Th.~11.21]{Wal00} (Theorem~\ref{thm:linear_subgroup_transcendence}) is applied once, the additive part of its obstruction is replaced by the span of its rational vectors (ERRATA.md, B3, repair (b), with $\Q$ for $\Qbar$), and no subgroup has to be selected.'''
sketch = '''
Write $z_j = b_j + \lambda_j$ with $b_j \in \Q^{d}$ and $\lambda_j \in \mathcal{L}^{d}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). The map $\Upsilon(x, y) = x + y$ on $\C^{d} \times \C^{d}$ is onto, with kernel spanned by the vectors $(e_h, -e_h)$, so $V = \Upsilon^{-1}(U)$ has dimension $n + d$. Theorem~\ref{thm:linear_subgroup_transcendence} at $V$, with that algebraic spanning family of $\ker\Upsilon$ and the lifts $(b_j, \lambda_j)$, returns $V'$, integer forms with common kernel $L_1$, and an integer $\ell_T$. Put $T = \mathrm{span}_{\C}(V' \cap \Q^{d}) + L_1$: it is rational over $\Q$ (the kernel of an integer matrix is spanned by rational vectors), of dimension $t < d$, and a dimension count turns the inequality of the theorem into $(\ell - \rho)(d - n) \leq n(d - t)$. Lemma~\ref{lem:roy_rat_relation_rank_le} bounds $\rho$ by $\dim_{\Q} F$, where $F = \mathrm{span}_{\Q}(z) \cap (T + 2\pi i\,\Q^{d})$. Lemma~\ref{lem:roy_rat_period_space} makes $R = T + \mathrm{span}_{\C} F$ rational over $\Q$, with $\dim_{\Q} F + t \leq \dim_{\Q}(F \cap T) + \dim R$ and $\dim(U \cap R) + t = \dim(U \cap T) + \dim R$, and the hypothesis on $U$ at $R$ bounds $\dim(U \cap R)$. The second hypothesis at $t$, moved to $\C^{t}$ by Lemma~\ref{lem:roy_rat_adapted_basis}, gives $(d - n)\dim_{\Q}(\mathrm{span}_{\Q}(z) \cap T) \leq d \dim(U \cap T)$. Adding these inequalities gives $(d - n)\ell \leq dn$.
'''

[[node]]
platform = "DiazModulus.roy_rat_slope_bound"
env = "proposition"
title = '''The slope bound over $\Q$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers, and $\Q + \mathcal{L}$ the $\Q$-vector space spanned by $1$ and $\mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}.

Assume \texttt{hME} (Theorem~\ref{thm:multiplicityEstimateElem} proves it). Let $U \subseteq \C^{d}$ be a subspace and $a < b$ natural numbers with $b \dim(U \cap S) \leq a \dim S$ for every subspace $S \subseteq \C^{d}$ rational over $\Q$, and let $z_1, \dots, z_{\ell} \in U \cap (\Q + \mathcal{L})^{d}$ be linearly independent over $\Q$. Then
\[ (b - a)\,\ell \leq b \dim U. \]
With $(a, b) = (\dim U, d)$ this is the semistable case of Roy's Theorem~4 over $\Q$: $\ell/(d + \ell) \leq n/d$, where $n = \dim U$.
'''
source = '''\cite[Th.~4]{Roy92} (p.~34), semistable case, over $F = \Q$ (Remark~(i), p.~37, with $\Q + \mathcal{L}$ in place of $\widetilde{\mathcal L}$), in a form that passes to subspaces and quotients; \cite[Prop.~11.19]{Wal00} for $(\Q, \Q + \mathcal{L})$ in the same case. The analogue over $\Q$ of Proposition~\ref{prop:roy_slope_bound}, by the same induction on $d$ along a subspace of maximal slope.'''
sketch = '''
Strong induction on $d$; for $d = 0$ the family is empty, and so it is when $U = 0$. Let $n = \dim U$. If $d \dim(U \cap S) \leq n \dim S$ for every $S$ rational over $\Q$, the hypothesis at $S = \C^{d}$ gives $bn \leq ad$, hence $n < d$, and Proposition~\ref{prop:roy_rat_semistable_node}, with the induction hypothesis, gives $(d - n)\ell \leq dn$, which implies the claim. Otherwise a subspace $S_1 \neq 0$, rational over $\Q$, of maximal slope $\dim(U \cap S)/\dim S$ (the slopes take finitely many values) has $0 < s_1 = \dim S_1 < d$, and $u_1 = \dim(U \cap S_1) < s_1$ by the hypothesis at $S_1$. Coordinates adapted to $S_1$ (Lemma~\ref{lem:roy_rat_adapted_basis}) have a rational matrix, so they preserve vectors with coordinates in $\Q + \mathcal{L}$; they identify $S_1$ with $\C^{s_1}$ and give a projection $\pi : \C^{d} \to \C^{d - s_1}$ with kernel $S_1$ and a rational section. By maximality, $U \cap S_1$ and $\pi(U)$ satisfy the hypothesis with $(a, b) = (u_1, s_1)$; for the quotient, $\dim(\pi(U) \cap S'') = \dim(U \cap \pi^{-1}S'') - u_1$. The $\Q$-span $Z$ of $z$ splits into $Z \cap S_1$ and $\pi(Z)$, of total dimension $\ell$, and the induction hypothesis on both pieces adds up to $(s_1 - u_1)\ell \leq s_1 n$; then $bu_1 \leq as_1$ turns this into $(b - a)\ell \leq bn$.
'''

[[node]]
platform = "DiazModulus.roy_rat_theorem_five"
env = "theorem"
title = '''Roy's Theorem 5 over $\Q$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers, and $\Q + \mathcal{L}$ the $\Q$-vector space spanned by $1$ and $\mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}, and decompositions as in Theorem~\ref{thm:roy_theorem_five}: lists $(n_1, d_1), \dots, (n_k, d_k)$ with $0 < n_i < d_i$, $\sum_i n_i = n$ and $\sum_i d_i = d$, the empty list decomposing $(0, 0)$ only.

Let $U \subseteq \C^{d}$ be a subspace that contains no non-zero rational vector, and let $z_1, \dots, z_{\ell} \in U \cap (\Q + \mathcal{L})^{d}$ be linearly independent over $\Q$. Then there are a subspace $S \supseteq U$ of $\C^{d}$, rational over $\Q$, and a decomposition $(n_1, d_1), \dots, (n_k, d_k)$ of $(\dim U, \dim S)$ with
\[ \ell \leq \sum_{i=1}^{k} \frac{n_i d_i}{d_i - n_i}. \]
So $\ell \leq \varphi(\dim U, \dim S)$, where Roy's $\varphi(n, d)$ is the largest value of this sum over the decompositions of $(n, d)$ (Lemma~\ref{lem:roy_lemma_phi}). It holds with no hypothesis.
'''
source = '''\cite[Th.~5]{Roy92} (p.~39) over $F = \Q$, with $\Q + \mathcal{L}$ in place of $\widetilde{\mathcal L}$: Roy's Remark~(i) (p.~37) states his Th.~4 for every subfield $F$ of $\Qbar$, and Th.~5 follows from Th.~4 by his induction on $d$ (pp.~39--40). Here in decomposition form, with a subspace $S \supseteq U$ rational over $\Q$ in place of Roy's hypothesis that $\C^{d}$ is the least one. The induction splits along a subspace of maximal slope, with Proposition~\ref{prop:roy_rat_slope_bound} on the subspace and the induction hypothesis on the quotient, so that no transport to a hull (Lemma~\ref{lem:roy_hull_transport} over $\Qbar$) is needed; \texttt{hME} is discharged by Theorem~\ref{thm:multiplicityEstimateElem}.'''
sketch = '''
Strong induction on $d$, for all $U$ and $z$. If $U = 0$, then $\ell = 0$, and $S = 0$ with the empty decomposition will do. Otherwise let $S_1 \neq 0$, rational over $\Q$, have maximal slope $u_1/s_1$, where $u_1 = \dim(U \cap S_1)$ and $s_1 = \dim S_1$. Then $u_1 \geq 1$, by comparison with $\C^{d}$, and $u_1 < s_1$, for otherwise $S_1 \subseteq U$ and $U$ would contain a non-zero rational vector. Coordinates adapted to $S_1$ (Lemma~\ref{lem:roy_rat_adapted_basis}) identify $S_1$ with $\C^{s_1}$ and give a projection $\pi : \C^{d} \to \C^{d - s_1}$ with kernel $S_1$ and a rational section. By maximality, $U \cap S_1$, moved to $\C^{s_1}$, satisfies the hypothesis of Proposition~\ref{prop:roy_rat_slope_bound} with $(a, b) = (u_1, s_1)$, which, with Theorem~\ref{thm:multiplicityEstimateElem}, gives $\dim_{\Q}(Z \cap S_1) \leq u_1 s_1/(s_1 - u_1)$ for the $\Q$-span $Z$ of $z$. Maximality also gives $s_1 \dim(\pi(U) \cap S') \leq u_1 \dim S'$ for every $S'$ rational over $\Q$, so $\pi(U)$ contains no non-zero rational vector, and the induction hypothesis, applied to a $\Q$-basis of $\pi(Z)$, gives $S'$ and a decomposition $D'$. Then $S = \pi^{-1}(S')$ is rational over $\Q$, contains $U$ and has dimension $s_1 + \dim S'$, and $(u_1, s_1)$ followed by $D'$ is a decomposition of $(\dim U, \dim S)$ whose sum bounds $\ell = \dim_{\Q}(Z \cap S_1) + \dim_{\Q} \pi(Z)$.
'''

[[node]]
platform = "DiazModulus.dalag_cor_11_15_rat"
root = true
env = "corollary"
title = '''DALAG Corollary 11.15 for $\Q$ and $\Q + \mathcal{L}$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^{z}$ algebraic), and $\Q + \mathcal{L}$ the $\Q$-vector space spanned by $1$ and $\mathcal{L}$, the set of the $q + \lambda$ with $q \in \Q$ and $\lambda \in \mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). A vector of $\C^{d}$ is \emph{rational} if its coordinates are rational numbers, and a subspace of $\C^{d}$ is \emph{rational over $\Q$} if it is spanned by its rational vectors. $\Psi$ is the table of Lemma~\ref{lem:dalag_psi_floor_roy_phi}, with $\Psi(0, d) = 0$ for every $d \geq 0$.

Let $V \subseteq \C^{d}$ be a subspace that contains no non-zero rational vector, and let $S_0 \supseteq V$ be a subspace rational over $\Q$ of least dimension among the subspaces rational over $\Q$ that contain $V$; write $n = \dim V$ and $d_{\min} = \dim S_0$. Then $n < d_{\min}$ if $n > 0$, the $\Q$-vector space $V \cap (\Q + \mathcal{L})^{d}$ is finite-dimensional, and
\[ \dim_{\Q}\bigl(V \cap (\Q + \mathcal{L})^{d}\bigr) \leq \Psi(n, d_{\min}). \]
'''
source = '''\cite[Cor.~11.15]{Wal00} (p.~398) for $(\Q, \Q + \mathcal{L})$, with the bound $\Psi(\dim V, d_{\min})$ as printed and $\Psi(0, d) = 0$ for every $d$ (ERRATA.md, C9), as in Corollary~\ref{cor:dalag_cor_11_15_psi}. The proof is Roy's route over $\Q$: \cite[Th.~4]{Roy92} for a subfield $F$ of $\Qbar$ by his Remark~(i) (p.~37), with $F = \Q$ (Proposition~\ref{prop:roy_rat_slope_bound}); \cite[Th.~5]{Roy92} by an induction on $d$ (p.~39; Theorem~\ref{thm:roy_rat_theorem_five}); and Roy's Lemma (p.~40) through Lemma~\ref{lem:dalag_psi_floor_roy_phi}. DALAG proves the corollary (p.~403) from Prop.~11.19 (p.~402), whose printed proof has a gap in this case: Th.~11.5\,(3$'$) need not select the trivial subgroup (ERRATA.md, B9; the false clause of Lemma~11.18\,(2) behind it is A4). Prop.~11.19 is not used here.'''
sketch = '''
If $n > 0$, then $n \leq d_{\min}$, and $n = d_{\min}$ would make $V = S_0$ a non-zero subspace rational over $\Q$, which contains a non-zero rational vector; so $n < d_{\min}$. Let $W = V \cap (\Q + \mathcal{L})^{d}$. For a $\Q$-free family of $\ell$ vectors of $W$, Theorem~\ref{thm:roy_rat_theorem_five} gives $S \supseteq V$ rational over $\Q$ and a decomposition $D$ of $(n, \dim S)$ with $\ell \leq \sum_i n_i d_i/(d_i - n_i)$; each term is at most $n_i d$, since $d_i \leq d$ and $d_i - n_i \geq 1$, so $\ell \leq nd$, and $W$ is finite-dimensional. Apply this to a $\Q$-basis of $W$. If $n = 0$, $D$ is empty and $\dim_{\Q} W = 0$. If $n > 0$, $D$ is non-empty, so $n < \dim S$, and $d_{\min} \leq \dim S$ by minimality. Lemma~\ref{lem:dalag_psi_floor_roy_phi} at $(n, \dim S)$ bounds the sum of $D$ below $\Psi(n, \dim S) + 1$, so $\dim_{\Q} W \leq \Psi(n, \dim S)$, both being integers. Finally $\Psi(n, \cdot)$ does not increase on the integers $> n$: its values are $2$, then $1$, for $n = 1$, and $n(n + 1)$, $n(n - 1) + 2$, then $n(n - 1) + 1$, for $n \geq 2$. As $n < d_{\min} \leq \dim S$, $\Psi(n, \dim S) \leq \Psi(n, d_{\min})$.
'''

# --- Roy's Theorem 4 and DALAG Proposition 11.19 over the rationals ----------
[[node]]
platform = "DiazModulus.roy_rat_theorem_four"
section = "Roy's Theorem 4 and DALAG Proposition 11.19 over the rationals"
env = "theorem"
title = '''Roy's Theorem 4 over $\Q$'''
statement = '''
Here $\mathcal{L}$ is the set of logarithms of algebraic numbers, and $\Q + \mathcal{L}$ the $\Q$-vector space spanned by $1$ and $\mathcal{L}$ (Lemma~\ref{lem:ratLogAlg_mem_iff}). Rational vectors and subspaces rational over $\Q$ are as in Lemma~\ref{lem:roy_rat_adapted_basis}.

Let $U \subseteq \C^{d}$ be a subspace, $n = \dim U$, and let $z_1, \dots, z_{\ell} \in U \cap (\Q + \mathcal{L})^{d}$ be linearly independent over $\Q$, spanning $Z$ over $\Q$. Let $S \neq \C^{d}$ be a subspace rational over $\Q$ that minimises $(n - \dim(U \cap S))/(d - \dim S)$ among the subspaces $\neq \C^{d}$ rational over $\Q$. With $d' = d - \dim S$, $n' = n - \dim(U \cap S)$ and $\ell' = \ell - \dim_{\Q}(Z \cap S)$,
\[ \ell' d' \leq n' (d' + \ell') \quad\text{and}\quad n' d \leq n d', \]
that is, $\ell'/(d' + \ell') \leq n'/d' \leq n/d$. It holds with no hypothesis.
'''
source = '''\cite[Th.~4]{Roy92} (p.~34) over $F = \Q$ (Remark~(i), p.~37, with $\Q + \mathcal{L}$ in place of $\widetilde{\mathcal L}$), in its minimal-ratio form; the analogue over $\Q$ of Theorem~\ref{thm:roy_theorem_four}. Roy's Remark~(i) says that the proof is the same over $F$. That holds for the proof of Th.~4 and for the deduction of his Th.~2 from his Th.~1, but Th.~1 is quoted over $\Qbar$, and its form over $F$ needs a short argument (ERRATA.md, B10). The proof here does not go through Roy's Th.~2: it rests on Proposition~\ref{prop:roy_rat_slope_bound}, and \texttt{hME} is discharged by Theorem~\ref{thm:multiplicityEstimateElem}. Routine.'''
sketch = '''
The second inequality is the minimality at $S' = 0$, which is rational over $\Q$ and $\neq \C^{d}$, since $d \geq 1$. For the first, coordinates adapted to $S$ (Lemma~\ref{lem:roy_rat_adapted_basis}) give a projection $\pi : \C^{d} \to \C^{d'}$ with kernel $S$ and a section $\sigma$, both with rational matrices; so $\pi$ and $\sigma$ map rational vectors to rational vectors, and $\pi$ maps $(\Q + \mathcal{L})^{d}$ into $(\Q + \mathcal{L})^{d'}$. By rank--nullity $\pi(U)$ has dimension $n'$ and $\pi(Z)$ has $\Q$-dimension $\ell'$, and a $\Q$-basis of $\pi(Z)$ is a $\Q$-free family in $\pi(U) \cap (\Q + \mathcal{L})^{d'}$. A subspace $R \subseteq \C^{d'}$ rational over $\Q$ pulls back to $\pi^{-1}(R) = S + \sigma(R)$, rational over $\Q$, of dimension $\dim S + \dim R$, with $\dim(U \cap \pi^{-1}(R)) = \dim(\pi(U) \cap R) + \dim(U \cap S)$; for $R \neq \C^{d'}$ the minimality of $S$ at $\pi^{-1}(R)$ gives $d' \dim(\pi(U) \cap R) \leq n' \dim R$, and for $R = \C^{d'}$ this is an equality. If $n' < d'$, Proposition~\ref{prop:roy_rat_slope_bound} in $\C^{d'}$ with $(a, b) = (n', d')$, with \texttt{hME} from Theorem~\ref{thm:multiplicityEstimateElem}, gives $(d' - n')\ell' \leq d'n'$, which is the claim; if $n' \geq d'$ the claim is clear.
'''

[[node]]
platform = "DiazModulus.dalag_prop_11_19_rat"
root = true
env = "proposition"
title = '''DALAG Proposition 11.19 for $\Q$ and $\Q + \mathcal{L}$'''
statement = '''
Here $\mathcal{L}$, $\Q + \mathcal{L}$, rational vectors and subspaces rational over $\Q$ are as in Theorem~\ref{thm:roy_rat_theorem_four}.

Let $U \subseteq \C^{d}$ be a subspace with $n = \dim U < d$, and let $T \neq \C^{d}$ be a subspace rational over $\Q$ that minimises $(n - \dim(U \cap T))/(d - \dim T)$ among the subspaces $\neq \C^{d}$ rational over $\Q$; put $n' = n - \dim(U \cap T)$ and $d' = d - \dim T$. Let $W = U \cap (\Q + \mathcal{L})^{d}$, a $\Q$-vector space. Then the quotient $W/(W \cap T)$ is finite-dimensional over $\Q$, and its dimension $\ell'$ satisfies
\[ \ell' d' \leq n' (d' + \ell') \quad\text{and}\quad n' d \leq n d', \]
that is, $\ell'/(d' + \ell') \leq n'/d' \leq n/d$.
'''
source = '''\cite[Prop.~11.19]{Wal00} (p.~402) for $\Q$ and $\Q + \mathcal{L}$, as printed, with the selection over all subspaces $T \neq \C^{d}$ of $\C^{d}$ rational over $\Q$ (ERRATA.md, C2); \cite[Th.~4]{Roy92} over $F = \Q$ (Remark~(i), p.~37). DALAG's printed proof of this case reads Th.~11.5\,(3$'$) at the trivial subgroup, which (3$'$) need not select (ERRATA.md, B9); the proof here follows the repair (a) there, through Theorem~\ref{thm:roy_rat_theorem_four}, with the finiteness argument of Corollary~\ref{cor:dalag_cor_11_15_rat}. DALAG's hypothesis $n < d$ is needed for the finiteness: for $U = \C^{d}$, $T = 0$ is a minimiser and the quotient is $(\Q + \mathcal{L})^{d}$. Routine.'''
sketch = '''
The second inequality is the minimality at $T' = 0$; with $n < d$ it gives $n'd \leq nd' < dd'$, so $n' < d'$. Let $q_1, \dots, q_k$ be linearly independent over $\Q$ in $W/(W \cap T)$, and lift them to $w_1, \dots, w_k \in W$. The $w_i$ lie in $U \cap (\Q + \mathcal{L})^{d}$ and are linearly independent over $\Q$, and their $\Q$-span meets $T$ only in $0$: a combination lying in $T$ maps to the same combination of the $q_i$, which then vanishes. Theorem~\ref{thm:roy_rat_theorem_four} at $T$, for the $w_i$, gives $kd' \leq n'(d' + k)$, hence $k \leq n'd'$, since $d' - n' \geq 1$. So every $\Q$-free family in the quotient has at most $n'd'$ elements: the quotient is finite-dimensional, and the same inequality for a $\Q$-basis of it, of $\ell'$ elements, is the first claim.
'''

# --- DALAG Lemma 12.9: the structural rank through affine forms ----------
[[node]]
platform = "DiazModulus.dalag_lemma_12_9_dehomog"
section = "DALAG Lemma 12.9: the structural rank through affine forms"
env = "lemma"
title = "Dehomogenisation keeps the rank"
statement = '''
Let $k$ be a field and $N_0, N_1, \dots, N_m$ matrices of size $d \times \ell$ with entries in $k$. Then
\[ \operatorname{rank}_{k(X_1, \dots, X_m)} \Bigl(N_0 + \sum_{i=1}^{m} X_i N_i\Bigr) = \operatorname{rank}_{k(Y_0, \dots, Y_m)} \sum_{i=0}^{m} Y_i N_i, \]
the ranks being taken over the fields of rational functions in $X_1, \dots, X_m$ and in $Y_0, \dots, Y_m$. Every matrix whose entries are affine forms $a_0 + a_1X_1 + \dots + a_mX_m$ with $a_i \in k$ is such an $N_0 + \sum_i X_i N_i$, and $\sum_{i=0}^{m} Y_i N_i$ is its homogenisation.
'''
source = '''A step of the proof of \cite[Lemma~12.9]{Wal00} (p.~427; proof p.~428): the passage from the homogenised matrix back to the affine one, which the printed proof leaves implicit (ERRATA.md, B7, step (1)); the remark before the lemma (p.~427), that the determinant of a matrix of linear forms is homogeneous, points to it. The substitution here is $Y_i \mapsto Y_0 Y_i$ rather than $X_i \mapsto Y_i/Y_0$. Routine.'''
sketch = '''
Write $A = N_0 + \sum_{i=1}^{m} X_i N_i$ and $B = \sum_{i=0}^{m} Y_i N_i$. The $k$-algebra endomorphism $\theta_0$ of $k[Y_0, \dots, Y_m]$ with $Y_0 \mapsto Y_0$ and $Y_i \mapsto Y_0 Y_i$ ($i \geq 1$) has the left inverse $Y_0 \mapsto Y_0$, $Y_i \mapsto Y_i/Y_0$ into $k(Y_0, \dots, Y_m)$, so it is injective and extends to a homomorphism $\theta$ of $k(Y_0, \dots, Y_m)$ into itself. The renaming $X_i \mapsto Y_i$ extends likewise to a homomorphism of fields $\iota : k(X_1, \dots, X_m) \to k(Y_0, \dots, Y_m)$. Entry by entry, $\theta(B) = Y_0\,\iota(A)$. By Lemma~\ref{lem:matrix_rank_map_field} a homomorphism of fields does not change the rank of a matrix, nor does the non-zero scalar $Y_0$, so $\operatorname{rank} B = \operatorname{rank} \theta(B) = \operatorname{rank} \iota(A) = \operatorname{rank} A$.
'''

[[node]]
platform = "DiazModulus.dalag_lemma_12_8_linear"
env = "lemma"
title = "DALAG Lemma 12.8 for any injective map into linear forms"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), let $M$ be a $d \times \ell$ matrix with entries in $K$, and suppose that $M = \sum_{j=1}^{m} e_j N_j$ with $e_1, \dots, e_m \in K$ linearly independent over $k$ and $N_1, \dots, N_m$ matrices of size $d \times \ell$ with entries in $k$. Let $\varphi : K \to k^{n}$ be $k$-linear and injective on the $k$-span of $e_1, \dots, e_m$, and let $\varphi(M)$ be the matrix whose $(a, b)$ entry is the linear form $\sum_{i=1}^{n} \varphi(M_{ab})_i X_i$. Then
\[ \operatorname{rank}_{k(X_1, \dots, X_n)} \varphi(M) = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j. \]
The right-hand side is the structural rank of $M$ over $k$ (DALAG \S12.1.4), computed from the presentation $M = \sum_j e_j N_j$ as in Corollary~\ref{cor:dalag_cor_12_22}. Applied to two bases of the $k$-span of the entries of $M$, it gives DALAG Lemma~12.8: the rank does not depend on the basis.
'''
source = '''\cite[Lemma~12.8]{Wal00} (p.~426; proof p.~427) in the generality of its proof: stated there for a map given by a basis, here for every $k$-linear map into $kX_1 + \dots + kX_n$ that is injective on the span of the $e_j$, which is how the proof of \cite[Lemma~12.9]{Wal00} (p.~428) uses it (ERRATA.md, B7, step (2)). It is also the independence of the choice of the map asserted in \S12.1.4 (p.~426). Routine.'''
sketch = '''
The vectors $c_j = \varphi(e_j) \in k^{n}$ are linearly independent over $k$: a relation among them is the image of an element of the span of the $e_j$ that $\varphi$ sends to $0 = \varphi(0)$. So $v \mapsto \sum_j v_j c_j$ is injective on $k^{m}$, and it has a $k$-linear left inverse $G$. The $k$-algebra map $\Lambda_0 : k[Z_1, \dots, Z_m] \to k[X_1, \dots, X_n]$ with $Z_j \mapsto \sum_i (c_j)_i X_i$ has the left inverse $X_i \mapsto \sum_q G(\varepsilon_i)_q Z_q$, where $\varepsilon_1, \dots, \varepsilon_n$ are the unit vectors, so it is injective (linear forms that are linearly independent over $k$ are algebraically independent) and extends to a homomorphism of fields $\Lambda : k(Z_1, \dots, Z_m) \to k(X_1, \dots, X_n)$. Since $\varphi(M_{ab}) = \sum_j (N_j)_{ab}\, c_j$, $\Lambda$ maps $\sum_j Z_j N_j$ to $\varphi(M)$, and Lemma~\ref{lem:matrix_rank_map_field} gives the equality.
'''

[[node]]
platform = "DiazModulus.dalag_lemma_12_9"
root = true
env = "lemma"
title = "DALAG Lemma 12.9"
statement = '''
Let $k$, $K$ and $M = \sum_{j=1}^{m} e_j N_j$ be as in Lemma~\ref{lem:dalag_lemma_12_8_linear}: $e_1, \dots, e_m \in K$ are linearly independent over $k$ and $N_1, \dots, N_m$ have entries in $k$. Let $\varphi : K \to k^{n+1}$ be $k$-linear and injective on the $k$-span of $e_1, \dots, e_m$, read as a map into the affine forms $k + kX_1 + \dots + kX_n$, and let $\varphi(M)$ be the matrix whose $(a, b)$ entry is $\varphi(M_{ab})_0 + \sum_{i=1}^{n} \varphi(M_{ab})_i X_i$. Then
\[ \operatorname{rank}_{k(X_1, \dots, X_n)} \varphi(M) = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j, \]
the structural rank of $M$ over $k$ (DALAG \S12.1.4), computed from the presentation $M = \sum_j e_j N_j$.
'''
source = '''\cite[Lemma~12.9]{Wal00} (p.~427; proof p.~428), in presentation form, for any field $k$ and any $k$-linear map into $k + kX_1 + \dots + kX_n$ that is injective on the span of the $e_j$. DALAG asks the map to be injective on the span $E$ of the entries of $M$; a presentation by a basis of $E$, with the map extended from $E$ to $K$, gives that form. The printed proof composes the map with $a_0 + \sum_i a_i X_i \mapsto a_0 Y_0 + \sum_i a_i Y_i$ and applies Lemma~12.8; the two steps it leaves implicit are Lemma~\ref{lem:dalag_lemma_12_9_dehomog} and Lemma~\ref{lem:dalag_lemma_12_8_linear} (ERRATA.md, B7). The repair of a step in the proof of \cite[Prop.~12.13]{Wal00}, (iv)$\Rightarrow$(iii) (p.~430), is a case of this lemma (ERRATA.md, B8); that implication is formalised later in this chapter through Lemma~\ref{lem:dalag_lemma_12_9_dehomog} directly (Proposition~\ref{prop:dalag_prop_12_13_iv_iii}), and this lemma gives the implication (ii)$\Rightarrow$(iv) of Prop.~12.13 (Proposition~\ref{prop:dalag_prop_12_13_ii_iv}).'''
sketch = '''
Put $N'_i = \bigl(\varphi(M_{ab})_i\bigr)_{a,b}$ for $i = 0, \dots, n$, matrices with entries in $k$. Entry by entry, $\varphi(M) = N'_0 + \sum_{i=1}^{n} X_i N'_i$, and its homogenisation $\sum_{i=0}^{n} Y_i N'_i$ is the matrix of linear forms $\sum_{i=0}^{n} \varphi(M_{ab})_i Y_i$: the image of $M$ under the same $\varphi$, read as a map into $kY_0 + \dots + kY_n$. Lemma~\ref{lem:dalag_lemma_12_9_dehomog} gives $\operatorname{rank} \varphi(M) = \operatorname{rank} \sum_{i=0}^{n} Y_i N'_i$, and Lemma~\ref{lem:dalag_lemma_12_8_linear}, with $n + 1$ variables, gives $\operatorname{rank} \sum_{i=0}^{n} Y_i N'_i = \operatorname{rank} \sum_j Z_j N_j$.
'''

# --- DALAG Proposition 12.7: the block property (A B; C 0) ----------
[[node]]
platform = "DiazModulus.dalag_prop_12_7_step"
section = "DALAG Proposition 12.7: the block property (A B; C 0)"
env = "lemma"
title = "The inductive step of DALAG Proposition 12.7"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$). A $k$-vector subspace $E$ of $K$ has \emph{Property (A B; C 0)} \cite[\S12.1.3]{Wal00} if every non-zero matrix $M$ with entries in $E$ is $k$-equivalent to a block matrix
\[ \begin{pmatrix} A & B \\ C & 0 \end{pmatrix} \]
with $A$ a regular square matrix: there are invertible matrices $P$, $Q$ with entries in $k$ and an integer $r \geq 1$ such that the entries of $PMQ$ that lie neither in its first $r$ rows nor in its first $r$ columns vanish, and the upper left $r \times r$ block of $PMQ$ is invertible. A vector of $K^{d}$ is \emph{$k$-rational} if its coordinates lie in $k$.

Let $E \subseteq K$ be a $k$-vector subspace with Property (A B; C 0), let $V \subseteq K^{d}$ be a $K$-vector subspace that contains no non-zero $k$-rational vector, and let $v_1, \dots, v_{\ell} \in V \cap E^{d}$, with $\ell \geq 1$, be linearly independent over $k$. Then there are natural numbers $r$ and $\ell_1$ with $r + \ell_1 = \ell$, $r \leq \dim_K V$ and $r < d$, a $K$-vector subspace $V_1 \subseteq K^{r}$ that contains no non-zero $k$-rational vector, and $w_1, \dots, w_{\ell_1} \in V_1 \cap E^{r}$ linearly independent over $k$.
'''
source = '''A step of the proof of \cite[Prop.~12.7]{Wal00} (p.~426): the inductive step, with $V_1$ a $K$-vector subspace built from $P \cdot V$, where $P$ is the left factor of the $k$-equivalence. The printed text says ``$k$-vector subspace'' in the two places where a $K$-vector subspace is needed, and its claim that $V$ contains $V_1 \times \{0\}^{d - r}$ holds for $P \cdot V$ (ERRATA.md, C10). Routine.'''
sketch = '''
Let $M$ be the $d \times \ell$ matrix whose columns are $v_1, \dots, v_{\ell}$: its entries lie in $E$, and $M \neq 0$, since $v_1 \neq 0$. The Property gives $P$, $Q$ and $r$ such that $N = PMQ$ has the block form. Then $r \leq \operatorname{rank} N = \operatorname{rank} M \leq \dim V$, and $\dim V < d$, since otherwise $V = K^{d}$ would contain the first unit vector. Let $V_1 \subseteq K^{r}$ be the space of the $u$ whose extension by $d - r$ zeros lies in $P \cdot V$; it contains no non-zero $k$-rational vector, because $P^{-1}$ has entries in $k$. With $\ell_1 = \ell - r$, let $w_j$ be the first $r$ entries of column $r + j$ of $N$. The zero block makes the extension of $w_j$ by zeros equal to that column, which is $P$ times $\sum_t Q_{t, r + j} v_t \in V$; so $w_j \in V_1$. The entries of $N$ are $k$-linear combinations of entries of $M$, so they lie in $E$. Finally the columns of $N$ are linearly independent over $k$, since a relation among them gives one among the $v_t$ through the invertible $P$ and $Q$; hence so are the $w_j$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_7"
root = true
env = "proposition"
title = "DALAG Proposition 12.7"
statement = '''
Let $k$, $K$, Property (A B; C 0) and $k$-rational vectors be as in Lemma~\ref{lem:dalag_prop_12_7_step}. Let $E \subseteq K$ be a $k$-vector subspace with Property (A B; C 0), and let $V \subseteq K^{d}$ be a $K$-vector subspace of dimension $n$ that contains no non-zero $k$-rational vector. Then $V \cap E^{d}$ is a finite-dimensional $k$-vector space, and
\[ \dim_k (V \cap E^{d}) \leq \frac{n(n + 1)}{2}. \]
'''
source = '''\cite[Prop.~12.7]{Wal00} (p.~426), with the Property of \cite[\S12.1.3]{Wal00} (p.~424). The printed induction carries the bound $r(r - 1)/2$ for $k$-vector subspaces $V_1 \subseteq K^{r}$; $K$-vector subspaces are meant (ERRATA.md, C10), and the induction here carries the Proposition itself, from which that bound follows. Routine.'''
sketch = '''
By strong induction on $d$: for every $K$-subspace $V \subseteq K^{d}$ with no non-zero $k$-rational vector and every $k$-free family $v_1, \dots, v_{\ell}$ in $V \cap E^{d}$, $2\ell \leq n(n + 1)$, where $n = \dim_K V$. If $\ell = 0$ there is nothing to prove. Otherwise Lemma~\ref{lem:dalag_prop_12_7_step} gives $r \leq n$, $r < d$, $\ell_1 = \ell - r$, a $K$-subspace $V_1 \subseteq K^{r}$ and a $k$-free family of $\ell_1$ vectors in $V_1 \cap E^{r}$, and the induction hypothesis at $r$ gives $2\ell_1 \leq n_1(n_1 + 1)$, where $n_1 = \dim_K V_1$. If $r \geq 1$, then $V_1 \neq K^{r}$, since the first unit vector is $k$-rational, so $n_1 \leq r - 1$; if $r = 0$, then $n_1 = 0$. Either way $2\ell = 2r + 2\ell_1 \leq r(r + 1) \leq n(n + 1)$. So every $k$-free family in $V \cap E^{d}$ has at most $n(n + 1)/2$ elements, and $V \cap E^{d}$ is finite-dimensional, of dimension at most $n(n + 1)/2$.
'''

# --- DALAG Propositions 12.10 and 12.13: polynomials as determinants ----------
[[node]]
platform = "DiazModulus.dalag_prop_12_10"
section = "DALAG Propositions 12.10 and 12.13: polynomials as determinants"
root = true
env = "proposition"
title = "DALAG Proposition 12.10: every polynomial is a determinant"
statement = '''
Let $k$ be a commutative ring and $P \in k[X_1, \dots, X_n]$. Then there are a natural number $s$ and $s \times s$ matrices $A_0, A_1, \dots, A_n$ with entries in $k$ such that
\[ \det(A_0 + X_1 A_1 + \dots + X_n A_n) = P. \]
A square matrix with entries in $k + kX_1 + \dots + kX_n$ is such an $A_0 + \sum_i X_i A_i$.
'''
source = '''\cite[Prop.~12.10]{Wal00} (p.~428; proof pp.~428--429), in coefficient form and over any commutative ring, where DALAG takes a field. DALAG says of its \S12.1.5 that ``the results of this section are due to D.~Roy'' (p.~428), citing D.~Roy, \emph{Matrices dont les coefficients sont des formes lin\'eaires} (1990). The proof is the printed one, with the factors in the order of the construction in the proof of \cite[Lemma~12.11]{Wal00}, where the block count is misprinted (ERRATA.md, C13). Routine.'''
sketch = '''
Write $x_0 = 1$ and $x_i = X_i$ for $1 \leq i \leq n$. First, every polynomial of total degree at most $m + 1$ is $\sum_t x_t g_t$ with every $g_t$ of degree at most $m$: a constant goes to $g_0$, and any other monomial is some $X_i$ times a monomial of one degree less. Next, let $M$ be a square matrix of size $s$ with entries of degree at most $m + 1$, where $m \geq 1$. Decomposing every entry gives $M = \sum_t x_t G_t$ with matrices $G_t$ of degree at most $m$, so $M = AB$ with $A = (x_0 I_s, x_1 I_s, \dots, x_n I_s)$ and $B$ the $(n + 1)s \times s$ matrix with the blocks $G_0, \dots, G_n$ one below the other (the construction in the proof of \cite[Lemma~12.11]{Wal00}). By \cite[Lemma~12.12]{Wal00}, a Schur complement,
\[ \det \begin{pmatrix} I & B \\ -A & 0 \end{pmatrix} = \det(AB) = \det M, \]
and this matrix has entries of degree at most $m$. Starting from the $1 \times 1$ matrix $(P)$ and repeating this step gives a square matrix with entries of degree at most $1$ and determinant $P$. Decomposing each of its entries with $m = 0$ gives constant $g_t$, so this matrix is $A_0 + \sum_i X_i A_i$ with all $A_i$ over $k$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13_iv_iii"
root = true
env = "proposition"
title = '''DALAG Proposition 12.13, (iv)$\Rightarrow$(iii)'''
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace with the following property, condition (iv) of \cite[Prop.~12.13]{Wal00} in presentation form: whenever $e_1, \dots, e_m \in E$ are linearly independent over $k$, $N_1, \dots, N_m$ are matrices of the same size with entries in $k$, and $M = \sum_j e_j N_j$, the rank of $M$ equals the rank of $\sum_j Z_j N_j$ over $k(Z_1, \dots, Z_m)$, the structural rank of $M$ over $k$ (as in Lemma~\ref{lem:dalag_lemma_12_8_linear}).

Let $x_0, \dots, x_n \in E$ be linearly independent over $k$, and let $P \in k[X_0, \dots, X_n]$ be a non-zero homogeneous polynomial. Then $P(x_0, \dots, x_n) \neq 0$. That is condition (iii) of \cite[Prop.~12.13]{Wal00}: $x_1/x_0, \dots, x_n/x_0$ are algebraically independent over $k$.
'''
source = '''\cite[Prop.~12.13]{Wal00}, the implication (iv)$\Rightarrow$(iii) (p.~430), with (iv) in presentation form, which is equivalent to (iv) by Lemma~12.8 there, and without the hypothesis $k \subseteq E$, which this implication does not use. The printed proof applies (iv) to a matrix whose entries need not lie in $E$; here it is applied to that matrix times $x_0$, whose entries do (ERRATA.md, B8). The other implications of Prop.~12.13, and the equivalence, are in the next section (Proposition~\ref{prop:dalag_prop_12_13}). Routine.'''
sketch = '''
Suppose that $P(x) = 0$, and let $p = P(1, X_1, \dots, X_n)$. Since $P$ is homogeneous, of degree $D$ say, $P(z) = z_0^{D}\, p(z_1/z_0, \dots, z_n/z_0)$ whenever $z_0 \neq 0$. At $z = x$, where $x_0 \neq 0$, this gives $p(y) = 0$ for $y_i = x_i/x_0$; at the generic point $(X_0, \dots, X_n)$ of the field of rational functions it gives $p \neq 0$, since $P \neq 0$. By Proposition~\ref{prop:dalag_prop_12_10}, $p = \det(N_0 + \sum_i X_i N_i)$ for square matrices $N_0, \dots, N_n$ over $k$, of size $s$. Let $M = \sum_{j=0}^{n} x_j N_j$, a matrix with entries in $E$ presented by $x_0, \dots, x_n$. By (iv) its rank is that of $\sum_j Y_j N_j$ over $k(Y_0, \dots, Y_n)$, which by Lemma~\ref{lem:dalag_lemma_12_9_dehomog} is the rank of $N_0 + \sum_i X_i N_i$ over $k(X_1, \dots, X_n)$, namely $s$, since its determinant is $p \neq 0$. But $M = x_0 (N_0 + \sum_i y_i N_i)$ has determinant $x_0^{s}\, p(y) = 0$, so its rank is less than $s$: a contradiction.
'''

# --- DALAG Proposition 12.13 and Corollary 12.14 ----------
[[node]]
platform = "DiazModulus.dalag_prop_12_13_i_ii_span"
section = "DALAG Proposition 12.13 and Corollary 12.14: algebraic independence and the structural rank"
env = "lemma"
title = '''DALAG Proposition 12.13, (i)$\Rightarrow$(ii), in span form'''
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$). Let $(b_j)_{j \in J}$ be a family of elements of $K$, indexed by any set $J$ (finite or not), algebraically independent over $k$. Let $x_1, \dots, x_n$ ($n \geq 0$) be elements of the $k$-vector space spanned by $1$ and the $b_j$, such that $1, x_1, \dots, x_n$ are linearly independent over $k$. Then $x_1, \dots, x_n$ are algebraically independent over $k$.
'''
source = '''A step of the proof of \cite[Prop.~12.13]{Wal00} (pp.~429--430): the implication (i)$\Rightarrow$(ii) for the span of $1$ and any algebraically independent family, which also gives the translation $x_i = c_i + e_i$ used for \cite[Cor.~12.14]{Wal00}; the printed proof reaches (ii) from (i) through (iv) and (iii). The nearest printed argument is \cite[Lemma~12.3]{Wal00}, (i)$\Rightarrow$(ii) (p.~420), by transcendence degrees; here an affine change of variables with an explicit left inverse. Routine.'''
sketch = '''
Write $x_i = c_i + z_i$ with $c_i \in k$ and $z_i = \sum_j f_{ij} b_j$ in the $k$-span of the $b_j$, each row $f_i$ finitely supported. As $1, x_1, \dots, x_n$ are linearly independent over $k$, so are the $z_i$, hence so are the rows $f_i$; extending the coordinate forms of the basis $(f_i)$ of their span gives linear forms $\varphi_l$ with $\varphi_l(f_i) = \delta_{il}$. The affine substitution $\sigma : k[X_1, \dots, X_n] \to k[Y_j : j \in J]$, $X_i \mapsto c_i + \sum_j f_{ij} Y_j$, has the left inverse $Y_j \mapsto \sum_l \varphi_l(\varepsilon_j)(X_l - c_l)$, where $\varepsilon_j$ is the $j$-th unit vector, so $\sigma$ is injective. Evaluation at $x$ is evaluation at $b$ composed with $\sigma$, and evaluation at $b$ is injective, since $b$ is algebraically independent; so evaluation at $x$ is injective, that is, $x$ is algebraically independent over $k$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13_i_ii"
env = "proposition"
title = '''DALAG Proposition 12.13, (i)$\Rightarrow$(ii)'''
statement = '''
Let $k$ and $K$ be as in Lemma~\ref{lem:dalag_prop_12_13_i_ii_span}, and let $E \subseteq K$ be a $k$-vector subspace satisfying condition (i) of \cite[Prop.~12.13]{Wal00}: $E$ has a basis $(b_i)_{i \in I}$ over $k$, the index set $I$ being any set, with an index $i_0 \in I$ such that $b_{i_0} = 1$ and the family $(b_i)_{i \in I,\, i \neq i_0}$ is algebraically independent over $k$.

Let $x_1, \dots, x_n \in E$ be such that $1, x_1, \dots, x_n$ are linearly independent over $k$. Then $x_1, \dots, x_n$ are algebraically independent over $k$. That is condition (ii) of \cite[Prop.~12.13]{Wal00}.
'''
source = '''\cite[Prop.~12.13]{Wal00}, the implication (i)$\Rightarrow$(ii) (pp.~429--430), which the printed proof obtains through (iv) and (iii); here directly, from Lemma~\ref{lem:dalag_prop_12_13_i_ii_span}. Routine.'''
sketch = '''
Every element of $E$ is a $k$-linear combination of the $b_i$, and $b_{i_0} = 1$, so $E$ lies in the $k$-span of $1$ and the $b_i$ with $i \neq i_0$. Lemma~\ref{lem:dalag_prop_12_13_i_ii_span}, for that algebraically independent family, gives the claim.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13_ii_iv"
env = "proposition"
title = '''DALAG Proposition 12.13, (ii)$\Rightarrow$(iv)'''
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace with $1 \in E$ satisfying condition (ii) of \cite[Prop.~12.13]{Wal00}: whenever $x_1, \dots, x_n \in E$ ($n \geq 0$) and $1, x_1, \dots, x_n$ are linearly independent over $k$, the elements $x_1, \dots, x_n$ are algebraically independent over $k$.

Let $e_1, \dots, e_m \in E$ be linearly independent over $k$, let $N_1, \dots, N_m$ be $s \times t$ matrices with entries in $k$, and let $M = \sum_{j=1}^{m} e_j N_j$. Then
\[ \operatorname{rank}_K M = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j, \]
the structural rank of $M$ over $k$ (DALAG \S12.1.4), computed from the presentation $M = \sum_j e_j N_j$ as in Lemma~\ref{lem:dalag_lemma_12_8_linear}. That is condition (iv) of \cite[Prop.~12.13]{Wal00}, in presentation form (as in Proposition~\ref{prop:dalag_prop_12_13_iv_iii}).
'''
source = '''\cite[Prop.~12.13]{Wal00} (pp.~429--430): the implication (ii)$\Rightarrow$(iv), with (iv) in presentation form, in place of the printed (i)$\Rightarrow$(iv), which follows from Lemma~12.9 (p.~430); so no basis of $E$ is indexed. The hypothesis $1 \in E$ is kept, although the proof does not need it. Routine.'''
sketch = '''
Extend $\{1\}$ to a $k$-basis of $k \cdot 1 + \operatorname{span}_k(e_1, \dots, e_m)$ chosen inside $\{1, e_1, \dots, e_m\}$, and list its members other than $1$ as $y_1, \dots, y_q$. They lie in $E$ and are linearly independent over $k$ together with $1$, so by (ii) they are algebraically independent over $k$. The coordinates in the basis $1, y_1, \dots, y_q$, extended to a $k$-linear map $\varphi : K \to k^{q+1}$, are injective on the span of the $e_j$, and every $w$ in that span is $\varphi(w)_0 + \sum_i \varphi(w)_i y_i$. By Lemma~\ref{lem:dalag_lemma_12_9}, the matrix $\varphi(M)$ of affine forms in $X_1, \dots, X_q$ has, over $k(X_1, \dots, X_q)$, the rank of $\sum_j Z_j N_j$. As the $y_i$ are algebraically independent, evaluation at $y$ extends to a homomorphism of fields $k(X_1, \dots, X_q) \to K$, which maps $\varphi(M)$ to $M$ entry by entry; by Lemma~\ref{lem:matrix_rank_map_field} it keeps the rank.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13_iii_ii"
env = "proposition"
title = '''DALAG Proposition 12.13, (iii)$\Rightarrow$(ii)'''
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace with $1 \in E$ satisfying condition (iii) of \cite[Prop.~12.13]{Wal00}: whenever $x_0, \dots, x_n \in E$ are linearly independent over $k$ and $P \in k[X_0, \dots, X_n]$ is a non-zero homogeneous polynomial, $P(x_0, \dots, x_n) \neq 0$.

Let $x_1, \dots, x_n \in E$ be such that $1, x_1, \dots, x_n$ are linearly independent over $k$. Then $x_1, \dots, x_n$ are algebraically independent over $k$. That is condition (ii) of \cite[Prop.~12.13]{Wal00} (as in Proposition~\ref{prop:dalag_prop_12_13_ii_iv}).
'''
source = '''\cite[Prop.~12.13]{Wal00}, the implication (iii)$\Rightarrow$(ii) (p.~430), ``easy (take $x_0 = 1$)'' in print; the homogenisation that this leaves implicit is supplied. Routine.'''
sketch = '''
Let $p \in k[X_1, \dots, X_n]$ vanish at $x$, and suppose $p \neq 0$. With $D$ the total degree of $p$ and $p_d$ its homogeneous component of degree $d$, the homogenisation $H = \sum_{d \leq D} Y_0^{D - d} p_d(Y_1, \dots, Y_n)$ is homogeneous of degree $D$, and $H(1, z) = p(z)$ for every tuple $z$ in every $k$-algebra. At the generic point $z = (X_1, \dots, X_n)$ this gives $H \neq 0$. The tuple $(1, x_1, \dots, x_n)$ lies in $E$, as $1 \in E$, and is linearly independent over $k$, so (iii) gives $H(1, x) \neq 0$; but $H(1, x) = p(x) = 0$, a contradiction.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13_ii_i"
env = "proposition"
title = '''DALAG Proposition 12.13, (ii)$\Rightarrow$(i)'''
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace with $1 \in E$ satisfying condition (ii) of \cite[Prop.~12.13]{Wal00} (as in Proposition~\ref{prop:dalag_prop_12_13_ii_iv}).

Then $E$ has a basis $(b_i)_{i \in I}$ over $k$ with an index $i_0 \in I$ such that $b_{i_0} = 1$ and the family $(b_i)_{i \in I,\, i \neq i_0}$ is algebraically independent over $k$. That is condition (i) of \cite[Prop.~12.13]{Wal00} (as in Proposition~\ref{prop:dalag_prop_12_13_i_ii}). The index set $I$ is a type in the universe of $K$; this is no restriction, since a basis of $E$ can be indexed by a subset of $E$. $E$ may be infinite-dimensional.
'''
source = '''\cite[Prop.~12.13]{Wal00}, the implication (ii)$\Rightarrow$(i) (p.~430), ``plain'' in print. The basis extends $\{1\}$; algebraic independence is checked on finite subfamilies, so $E$ may be infinite-dimensional. Routine.'''
sketch = '''
As $1 \in E$ is non-zero, $\{1\}$ is a linearly independent subset of the $k$-vector space $E$, and it extends to a basis of $E$, indexed by a subset $I$ of $E$, with $1 \in I$ the distinguished index $i_0$. A family is algebraically independent as soon as each of its finite subfamilies is. A finite set of indices other than $i_0$, listed as $y_1, \dots, y_m$, gives elements of $E$ such that $1, y_1, \dots, y_m$ are distinct members of the basis, hence linearly independent over $k$; by (ii), $y_1, \dots, y_m$ are algebraically independent over $k$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_13"
root = true
env = "proposition"
title = "DALAG Proposition 12.13"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace with $1 \in E$, that is, containing $k$. The following four conditions are equivalent.

(i) $E$ has a basis $(b_i)_{i \in I}$ over $k$ with an index $i_0 \in I$ such that $b_{i_0} = 1$ and the family $(b_i)_{i \in I,\, i \neq i_0}$ is algebraically independent over $k$.

(ii) Whenever $x_1, \dots, x_n \in E$ ($n \geq 0$) and $1, x_1, \dots, x_n$ are linearly independent over $k$, the elements $x_1, \dots, x_n$ are algebraically independent over $k$.

(iii) Whenever $x_0, \dots, x_n \in E$ are linearly independent over $k$ and $P \in k[X_0, \dots, X_n]$ is a non-zero homogeneous polynomial, $P(x_0, \dots, x_n) \neq 0$.

(iv) Whenever $e_1, \dots, e_m \in E$ are linearly independent over $k$ and $N_1, \dots, N_m$ are $s \times t$ matrices with entries in $k$, the matrix $M = \sum_{j=1}^{m} e_j N_j$ satisfies
\[ \operatorname{rank}_K M = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j. \]

In (i), the index set $I$ is a type in the universe of $K$, which is no restriction (Proposition~\ref{prop:dalag_prop_12_13_ii_i}), and $E$ may be infinite-dimensional. In (iv), the right-hand side is the structural rank of $M$ over $k$ (DALAG \S12.1.4).
'''
source = '''\cite[Prop.~12.13]{Wal00} (pp.~429--430), for a subspace $E$ containing $k$, written $1 \in E$, with (iv) in presentation form. The equivalence is proved along the cycle (i)$\Rightarrow$(ii)$\Rightarrow$(iv)$\Rightarrow$(iii)$\Rightarrow$(ii)$\Rightarrow$(i), with (ii)$\Rightarrow$(iv) in place of the printed (i)$\Rightarrow$(iv) through Lemma~12.9. The printed proof of (iv)$\Rightarrow$(iii) needs a small correction (ERRATA.md, B8). Routine.'''
sketch = '''
(i)$\Rightarrow$(ii) is Proposition~\ref{prop:dalag_prop_12_13_i_ii}, (ii)$\Rightarrow$(iv) is Proposition~\ref{prop:dalag_prop_12_13_ii_iv}, (iv)$\Rightarrow$(iii) is Proposition~\ref{prop:dalag_prop_12_13_iv_iii}, (iii)$\Rightarrow$(ii) is Proposition~\ref{prop:dalag_prop_12_13_iii_ii}, and (ii)$\Rightarrow$(i) is Proposition~\ref{prop:dalag_prop_12_13_ii_i}.
'''

[[node]]
platform = "DiazModulus.dalag_cor_12_14"
root = true
env = "corollary"
title = "DALAG Corollary 12.14"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$). Let $E_0 \subseteq K$ be a $k$-vector subspace with $E_0 \cap k = \{0\}$: if $c \in k$ and $c \cdot 1 \in E_0$, then $c = 0$. Write $k + E_0$ for the $k$-vector space spanned by $1$ and $E_0$. The following are equivalent.

(i) Whenever $x_1, \dots, x_n \in E_0$ are linearly independent over $k$, they are algebraically independent over $k$.

(ii) Whenever $e_1, \dots, e_m \in k + E_0$ are linearly independent over $k$ and $N_1, \dots, N_m$ are $s \times t$ matrices with entries in $k$, the matrix $M = \sum_{j=1}^{m} e_j N_j$ satisfies
\[ \operatorname{rank}_K M = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j. \]

So (ii) says that every matrix with entries in $k + E_0$ has rank equal to its structural rank over $k$, in presentation form.
'''
source = '''\cite[Cor.~12.14]{Wal00} (p.~430), with (ii) in presentation form. No proof is printed; the text applies Prop.~12.13 to $k + E_0$. The implication (i)$\Rightarrow$(ii) holds without the hypothesis $E_0 \cap k = \{0\}$, which is used only for (ii)$\Rightarrow$(i). Routine.'''
sketch = '''
Both directions go through the conditions of Proposition~\ref{prop:dalag_prop_12_13} for $E = k + E_0$, which contains $1$. ($\Rightarrow$) Let $x_1, \dots, x_n \in E$ be such that $1, x_1, \dots, x_n$ are linearly independent over $k$, and write $x_i = c_i + y_i$ with $c_i \in k$ and $y_i \in E_0$. The $y_i$ are linearly independent over $k$: a relation $\sum_i \lambda_i y_i = 0$ gives $\sum_i \lambda_i x_i - (\sum_i \lambda_i c_i) \cdot 1 = 0$, so every $\lambda_i = 0$. By (i) they are algebraically independent, and the $x_i$ lie in the span of $1$ and the $y_i$, so Lemma~\ref{lem:dalag_prop_12_13_i_ii_span} makes $x$ algebraically independent. So $E$ satisfies condition (ii) of Prop.~12.13, and Proposition~\ref{prop:dalag_prop_12_13_ii_iv} gives (ii) here. ($\Leftarrow$) Condition (ii) here is (iv) for $E$, and Propositions~\ref{prop:dalag_prop_12_13_iv_iii} and~\ref{prop:dalag_prop_12_13_iii_ii} give (ii) for $E$. If $x_1, \dots, x_n \in E_0$ are linearly independent over $k$, a relation $c \cdot 1 + \sum_i \lambda_i x_i = 0$ puts $c \cdot 1$ in $E_0$, so $c = 0$ and then every $\lambda_i = 0$; so $1, x_1, \dots, x_n$ are linearly independent over $k$, and (ii) for $E$ makes $x$ algebraically independent.
'''

# --- DALAG Propositions 12.2 and 12.6 ----------
[[node]]
platform = "DiazModulus.matrix_exists_rank_normal_form"
section = "DALAG Propositions 12.2 and 12.6: the block form (A B; C 0)"
env = "lemma"
title = "The rank normal form of a matrix"
statement = '''
Let $k$ be a field and $N$ an $s \times t$ matrix with entries in $k$. Then there are a natural number $r \leq \min(s, t)$ and invertible matrices $P \in \mathrm{GL}_s(k)$ and $Q \in \mathrm{GL}_t(k)$ such that
\[ PNQ = \begin{pmatrix} I_r & 0 \\ 0 & 0 \end{pmatrix}, \]
that is, $(PNQ)_{ij} = 1$ if $i = j \leq r$ and $(PNQ)_{ij} = 0$ otherwise. The statement does not record that $r$ is the rank of $N$.
'''
source = '''Classical linear algebra, used without proof in the proof of \cite[Prop.~12.2]{Wal00} (pp.~420--421), for rectangular matrices. Proved by elimination, by induction on the number of rows. Routine.'''
sketch = '''
By strong induction on $s$. If $N = 0$, take $r = 0$ and $P = Q = 1$. Otherwise swap two rows and two columns to bring a non-zero entry $a$ to the upper left corner, and write the result in blocks $\begin{pmatrix} a & B \\ C & D \end{pmatrix}$. Elimination of the first column and of the first row, by block triangular matrices with unit determinants, and division of the first row by $a$ leave $\begin{pmatrix} 1 & 0 \\ 0 & S \end{pmatrix}$, where $S = D - Ca^{-1}B$, the Schur complement, has one row fewer. The induction hypothesis puts $S$ in normal form, with $r'$ say, and $r = r' + 1$; the products of the transforming matrices, swaps included, are invertible.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_2_det"
env = "lemma"
title = "A transcendental shift keeps a block matrix regular"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), let $L$ be an intermediate field, $k \subseteq L \subseteq K$, and let $x \in K$ be transcendental over $L$. Let $A$, $B$, $C$, $D$ be matrices with entries in $L$, of sizes $r \times r$, $r \times r'$, $r' \times r$ and $r' \times r'$, with $\det D \neq 0$. Then
\[ \det \begin{pmatrix} x I_r + A & B \\ C & D \end{pmatrix} \neq 0. \]
'''
source = '''A step of the proof of \cite[Prop.~12.2]{Wal00} (p.~419; proof pp.~420--422): the closing argument of p.~422, that the determinant is a polynomial in $x$ with leading term $x^{r} \det A'$, hence non-zero as $x$ is transcendental; here through the Schur complement and a characteristic polynomial, which is monic. Routine.'''
sketch = '''
As $\det D \neq 0$, $D$ is invertible, with inverse over $L$, and the Schur complement gives
\[ \det \begin{pmatrix} x I_r + A & B \\ C & D \end{pmatrix} = \det D \cdot \det\bigl(x I_r + A - BD^{-1}C\bigr). \]
The second factor is $\det(x I_r - Z)$ for the matrix $Z = -(A - BD^{-1}C)$ over $L$: the characteristic polynomial of $Z$, a monic polynomial over $L$, evaluated at $x$. As $x$ is transcendental over $L$, it does not vanish, and neither does $\det D$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_2_split"
env = "lemma"
title = "Splitting off a transcendental direction"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$), and let $E \subseteq K$ be a $k$-vector subspace satisfying condition (ii) of \cite[Prop.~12.13]{Wal00} (as in Proposition~\ref{prop:dalag_prop_12_13_ii_iv}; here $1 \in E$ is not assumed).

Let $F \subseteq E$ be a non-zero finite-dimensional $k$-vector subspace. Then there are $x \in F$ with $x \neq 0$ and a $k$-vector subspace $F_1 \subsetneq F$ such that every $f \in F$ satisfies $f - cx \in F_1$ for some $c \in k$ (so $F = F_1 \oplus kx$), and either $F_1 = \{0\}$ or $x$ is transcendental over the field $k(F_1)$ generated over $k$ by $F_1$.
'''
source = '''A step of the proof of \cite[Prop.~12.2]{Wal00} (p.~419; proof pp.~420--422): the choice of $x$ and of $E_1$ with $E_0 = E_1 \oplus kx$ (p.~421), and the analogue of \cite[Lemma~12.3]{Wal00}, (ii)$\Rightarrow$(iii) (p.~420), which makes $x$ transcendental over $k(E_1)$ (p.~422). Here $E$ is any subspace with condition (ii) of Prop.~12.13, and $x$ is a member other than $1$ of a $k$-basis of $k \cdot 1 + F$ that contains $1$, so that $F_1$ contains $1$ when $1 \in F$ and $F \neq k \cdot 1$. For $k + E_0$ the printed step ``$x \notin E_1$, hence $x$ is transcendental over $k(E_1)$'' fails whenever $1$ lies in the span of the entries but not in $E_1$ (ERRATA.md, B11). Routine.'''
sketch = '''
Extend $\{1\}$ to a $k$-basis $\beta$ of $k \cdot 1 + F$ inside $\{1\} \cup F$, and let $T = \beta \setminus \{1\}$. Then $T \subseteq F$, and $1$ together with any finite subset of $T$ is linearly independent over $k$, so by (ii) the family $T$ is algebraically independent over $k$. If $T$ is empty, then $F \subseteq k \cdot 1$, and $F \neq 0$ gives $1 \in F$: take $x = 1$ and $F_1 = 0$. Otherwise pick $x \in T$ and put $F_1 = F \cap \operatorname{span}_k(\beta \setminus \{x\})$. Then $x \in F$, $x \neq 0$ and $x \notin F_1$, so $F_1 \subsetneq F$. Every $f \in F$ is $cx + z$ with $c \in k$ and $z \in \operatorname{span}_k(\beta \setminus \{x\})$, and $z = f - cx \in F$, so $z \in F_1$. Finally $x$ is transcendental over the field $k(T \setminus \{x\})$, since $T$ is algebraically independent, and that field contains $\operatorname{span}_k(\beta \setminus \{x\}) \supseteq F_1$, hence $k(F_1)$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_2_step"
env = "lemma"
title = "The inductive step of DALAG Proposition 12.2"
statement = '''
Let $k$ and $K$ be fields with $K$ a $k$-algebra (for example $k \subseteq K$). A matrix $M$ with $s$ rows, $t$ columns and entries in $K$ \emph{has the block form (A B; C 0) over $k$} if there are a natural number $r \leq \min(s, t)$ and invertible matrices $P \in \mathrm{GL}_s(k)$, $Q \in \mathrm{GL}_t(k)$ such that, with $P$ and $Q$ read in $K$, the entries $(PMQ)_{ij}$ with $i > r$ and $j > r$ vanish and the upper left $r \times r$ block of $PMQ$ is invertible:
\[ PMQ = \begin{pmatrix} A & B \\ C & 0 \end{pmatrix} \]
with $A$ regular, or empty when $r = 0$.

Let $F_1 \subseteq K$ be a $k$-vector subspace such that every matrix with entries in $F_1$ (of any size, the zero matrix included) has the block form (A B; C 0) over $k$. Let $x \in K$ with $x \neq 0$, and assume that $F_1 = \{0\}$ or $x$ is transcendental over the field $k(F_1)$ generated over $k$ by $F_1$. Let $M$ be an $s \times t$ matrix with entries in $K$ and $N$ an $s \times t$ matrix with entries in $k$ such that every entry of $M - xN$ lies in $F_1$. Then $M$ has the block form (A B; C 0) over $k$.
'''
source = '''A step of the proof of \cite[Prop.~12.2]{Wal00} (p.~419; proof pp.~420--422): the induction step (pp.~421--422), with $E_1$ written $F_1$; the case $F_1 = 0$ is the case $n = 1$ of p.~420. Routine.'''
sketch = '''
Lemma~\ref{lem:matrix_exists_rank_normal_form} gives $P_0$, $Q_0$ invertible over $k$ with $P_0 N Q_0 = \begin{pmatrix} I_{r_0} & 0 \\ 0 & 0 \end{pmatrix}$. As $P_0$ and $Q_0$ have entries in $k$ and $F_1$ is a $k$-vector space, $\tilde M = P_0 M Q_0$ is $x$ times this matrix plus a matrix over $F_1$. If $F_1 = 0$, the leading block of $\tilde M$ is $x I_{r_0}$, of determinant $x^{r_0} \neq 0$. Otherwise write $\tilde M = \begin{pmatrix} x I + A & B \\ C & D \end{pmatrix}$ with $A$, $B$, $C$, $D$ over $F_1$. The hypothesis on $F_1$, applied to $D$, gives $P'$, $Q'$ invertible over $k$ and $r'$ such that $P'DQ'$ vanishes where both indices exceed $r'$ and has a regular leading block $D'$. Multiplying $\tilde M$ by $\operatorname{diag}(I, P')$ on the left and by $\operatorname{diag}(I, Q')$ on the right gives a matrix whose entries with both indices beyond $r_0 + r'$ vanish, and whose leading block of size $r_0 + r'$ is $\begin{pmatrix} x I + A & B' \\ C' & D' \end{pmatrix}$ with $A$, $B'$, $C'$, $D'$ over $F_1 \subseteq k(F_1)$. By Lemma~\ref{lem:dalag_prop_12_2_det}, with $L = k(F_1)$, that block is regular. So $r = r_0 + r'$, $P = \operatorname{diag}(I, P') P_0$ and $Q = Q_0 \operatorname{diag}(I, Q')$ work.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_2_ii"
root = true
env = "proposition"
title = "DALAG Proposition 12.2 for every subspace with condition (ii) of Proposition 12.13"
statement = '''
Let $k$, $K$ and the block form (A B; C 0) over $k$ be as in Lemma~\ref{lem:dalag_prop_12_2_step}. Let $E \subseteq K$ be a $k$-vector subspace satisfying condition (ii) of \cite[Prop.~12.13]{Wal00}: whenever $x_1, \dots, x_n \in E$ ($n \geq 0$) and $1, x_1, \dots, x_n$ are linearly independent over $k$, the elements $x_1, \dots, x_n$ are algebraically independent over $k$.

Then every matrix with entries in $E$, the zero matrix included, has the block form (A B; C 0) over $k$. No hypothesis on $k$ is made, and $1 \in E$ is not assumed.
'''
source = '''\cite[Prop.~12.2]{Wal00} (p.~419), by its first proof (pp.~420--422), which needs no hypothesis on $k$, run for any subspace $E$ with condition (ii) of Prop.~12.13 in place of a span of algebraically independent elements. DALAG remarks (p.~422) that this proof yields a more general result, where the $x_i$ are not assumed algebraically independent, and cites D.~Roy (1989) for it; this is such a generalisation. The hyperplane $E_1$ of the induction on the dimension of the span of the entries is chosen to contain $1$ when possible (Lemma~\ref{lem:dalag_prop_12_2_split}). Routine.'''
sketch = '''
By strong induction on the dimension of the $k$-span $F$ of the entries of $M$. If $F = 0$, then $M = 0$, and $r = 0$, $P = Q = 1$ work. Otherwise $F$ is a non-zero finite-dimensional subspace of $E$, and Lemma~\ref{lem:dalag_prop_12_2_split} gives $x \in F$ with $x \neq 0$ and $F_1 \subsetneq F$ such that every $f \in F$ is congruent to some $cx$, $c \in k$, modulo $F_1$, and either $F_1 = 0$ or $x$ is transcendental over $k(F_1)$. Choosing these $c$ entry by entry gives a matrix $N$ over $k$ with $M - xN$ over $F_1$. Every matrix over $F_1$ has the block form by the induction hypothesis, since its entries span a subspace of $F_1 \subseteq E$, of dimension less than $\dim F$, and Lemma~\ref{lem:dalag_prop_12_2_step} gives the block form for $M$.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_2"
root = true
env = "proposition"
title = "DALAG Proposition 12.2"
statement = '''
Let $k$, $K$ and the block form (A B; C 0) over $k$ be as in Lemma~\ref{lem:dalag_prop_12_2_step}. Let $(b_j)_{j \in J}$ be a family of elements of $K$, indexed by any set $J$ (finite or not), algebraically independent over $k$, and let $E$ be the $k$-vector space it spans. Then every matrix with entries in $E$, the zero matrix included, has the block form (A B; C 0) over $k$. No hypothesis on $k$ is made.
'''
source = '''\cite[Prop.~12.2]{Wal00} (p.~419), which DALAG credits to D.~Roy (1990, Proposition~1), for any field $k$, by the proof of pp.~420--422; the other proof (p.~424) assumes $k$ infinite and is not used. The empty $A$ of the statement is $r = 0$. In the Remark after Prop.~12.2 (p.~419) the sizes printed for the second and third examples are slips (ERRATA.md, C16); every $r \leq \min(s, t)$ is allowed here, so the three shapes are covered. Routine.'''
sketch = '''
By Proposition~\ref{prop:dalag_prop_12_2_ii} it suffices that $E$ satisfies condition (ii) of Prop.~12.13. If $x_1, \dots, x_n \in E$ and $1, x_1, \dots, x_n$ are linearly independent over $k$, the $x_i$ lie in the larger span of $1$ and the $b_j$, and Lemma~\ref{lem:dalag_prop_12_13_i_ii_span} makes them algebraically independent over $k$.
'''

[[node]]
platform = "DiazModulus.dalag_remark_12_1_3"
root = true
env = "proposition"
title = '''The Remark of DALAG \S12.1.3 (p.~424)'''
statement = '''
Let $k$, $K$ and the block form (A B; C 0) over $k$ be as in Lemma~\ref{lem:dalag_prop_12_2_step}. A $k$-vector subspace $E$ of $K$ has \emph{Property (A B; C 0)} \cite[\S12.1.3]{Wal00} if every non-zero matrix with entries in $E$ has the block form (A B; C 0) over $k$, necessarily with $r \geq 1$, as in Lemma~\ref{lem:dalag_prop_12_7_step}.

Let $(b_j)_{j \in J}$ be a family of elements of $K$, indexed by any set $J$ (finite or not), algebraically independent over $k$. Let $E_0$ be the $k$-vector space it spans, and $k + E_0$ the $k$-vector space spanned by $1$ and $E_0$. Then $k + E_0$ has Property (A B; C 0). No hypothesis on $k$ is made, and the printed hypothesis $E_0 \cap k = \{0\}$ is not assumed: it follows from the algebraic independence of the $b_j$.
'''
source = '''The Remark in \cite[\S12.1.3]{Wal00} (p.~424), for any field $k$ and without the hypothesis $E_0 \cap k = \{0\}$, which follows from the algebraic independence: a non-zero $c \in E_0 \cap k$ would be a non-zero polynomial relation of degree at most $1$. The statement of the Remark is correct, but its printed reason has a gap: Property (A B; C 0) is a property of the triple $(k, K, E)$, not of the $k$-vector space $E$, so the $k$-linear isomorphism of $k + E_0$ with $kX + E_0$ in $K(X)$ does not carry it (ERRATA.md, B11). The proof here does not pass through $K(X)$: the first proof of Prop.~12.2 is run on $k + E_0$ directly (Proposition~\ref{prop:dalag_prop_12_2_ii}), with the hyperplane $E_1$ of its induction chosen to contain $1$. Routine.'''
sketch = '''
The elements of $k + E_0$ lie in the $k$-span of $1$ and the $b_j$, so by Lemma~\ref{lem:dalag_prop_12_13_i_ii_span} the space $k + E_0$ satisfies condition (ii) of Prop.~12.13, and Proposition~\ref{prop:dalag_prop_12_2_ii} gives the block form for every matrix over $k + E_0$; the hypothesis $M \neq 0$ is not needed.
'''

[[node]]
platform = "DiazModulus.dalag_prop_12_6"
root = true
env = "proposition"
title = "DALAG Proposition 12.6"
statement = '''
Let $k$, $K$ and Property (A B; C 0) be as in Proposition~\ref{prop:dalag_remark_12_1_3}. Let $E \subseteq K$ be a $k$-vector subspace with Property (A B; C 0). Let $V \subseteq K^{d}$ be a $K$-vector subspace, $n = \dim_K V$, and let $Y \subseteq V \cap E^{d}$ be a finite-dimensional $k$-vector subspace. Then there is a $K$-vector subspace $S \subseteq K^{d}$, rational over $k$ (spanned over $K$ by the vectors of $S$ whose coordinates all lie in $k$), such that, with $d' = \dim_K(K^{d}/S)$ and $\ell' = \dim_k\bigl(Y/(Y \cap S)\bigr)$,
\[ \ell' \leq d - d' \leq n. \]
No hypothesis $n < d$ is made.
'''
source = '''\cite[Prop.~12.6]{Wal00} (p.~425), in the integer form $\ell' \leq d - d' \leq n$; the equivalent printed form with ratios is not stated. The printed hypothesis $n < d$ is not used by the proof (``$1 \leq r \leq n < d$'' only records it) and is dropped; for $n = d$ the conclusion holds anyway with $S = K^{d}$. The space $S$, printed as an intersection of hyperplanes, is taken as the span of the first $r$ columns of $P^{-1}$, which is the same space. Routine.'''
sketch = '''
Let $\eta_1, \dots, \eta_\ell$ be a $k$-basis of $Y$ and $M$ the $d \times \ell$ matrix with columns $\eta_j$; its entries lie in $E$. If $M \neq 0$, Property (A B; C 0) gives $r$ and $P \in \mathrm{GL}_d(k)$, $Q \in \mathrm{GL}_\ell(k)$ such that $N = PMQ$ vanishes where both indices exceed $r$ and has a regular upper left $r \times r$ block; if $M = 0$, that is, $Y = 0$, the same holds with $r = 0$ and $P = Q = 1$. Then $r \leq \operatorname{rank} N = \operatorname{rank} M \leq n$, since the columns of $M$ lie in $V$. Let $S$ be the $K$-span of the first $r$ columns of $P^{-1}$: it is rational over $k$ and has dimension $r$, so $d - d' = r \leq n$. A vector $z$ lies in $S$ if and only if $(Pz)_s = 0$ for every $s > r$, which are the printed hyperplanes. For $t > r$, the vector $\theta_t = \sum_j Q_{jt}\eta_j$ of $Y$ has $(P\theta_t)_s = N_{st} = 0$ for $s > r$, so $\theta_t \in S$. The $\theta_t$ are linearly independent over $k$, as $Q$ is invertible, so $\dim_k(Y \cap S) \geq \ell - r$, and $\ell' \leq r = d - d'$.
'''

[[node]]
platform = "DiazModulus.dalag_conclusion_12_1_6"
root = true
env = "proposition"
title = '''DALAG \S12.1.6: rank equal to structural rank gives Property (A B; C 0)'''
statement = '''
Let $k$, $K$ and Property (A B; C 0) be as in Proposition~\ref{prop:dalag_remark_12_1_3}. Let $E \subseteq K$ be a $k$-vector subspace with $1 \in E$ satisfying condition (iv) of \cite[Prop.~12.13]{Wal00}, in presentation form (Proposition~\ref{prop:dalag_prop_12_13}): whenever $e_1, \dots, e_m \in E$ are linearly independent over $k$ and $N_1, \dots, N_m$ are $s \times t$ matrices with entries in $k$, the matrix $M = \sum_{j=1}^{m} e_j N_j$ satisfies $\operatorname{rank}_K M = \operatorname{rank}_{k(Z_1, \dots, Z_m)} \sum_{j=1}^{m} Z_j N_j$, its structural rank over $k$. Then $E$ has Property (A B; C 0).
'''
source = '''\cite[\S12.1.6]{Wal00} (p.~431), that Property (A B; C 0) is a consequence of $r = r_{\mathrm{str}}$, said there for $E = k + E_0$ with $E_0 \cap k = \{0\}$; any $E$ containing $1$ is of this form ($E_0$ a complement of $k \cdot 1$ in $E$), so $E_0$ does not appear. In the same sentence, ``as pointed out in \S12.1.5'' refers to the boxed statement of p.~427, which is in \S12.1.4 (ERRATA.md, C15). Routine.'''
sketch = '''
By Proposition~\ref{prop:dalag_prop_12_13_iv_iii}, no non-zero homogeneous polynomial over $k$ vanishes at elements of $E$ that are linearly independent over $k$; by Proposition~\ref{prop:dalag_prop_12_13_iii_ii}, which uses $1 \in E$, every family $x$ in $E$ such that $1, x$ are linearly independent over $k$ is algebraically independent over $k$. Proposition~\ref{prop:dalag_prop_12_2_ii} then puts every matrix over $E$ in the block form (A B; C 0); the hypothesis $M \neq 0$ is not needed.
'''
