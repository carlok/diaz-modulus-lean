# Chapter 5. Read by scripts/gen_blueprint.py; see its docstring for the format.

[chapter]
title = "The six exponentials theorem"
text = '''
Schneider's method in the form of Lang and Ramachandra, relativised to a fixed number field: an auxiliary function built by Siegel's lemma, a descent that extends its zeros over a lattice, and a zero estimate.

In this chapter $x=(x_1,\dots,x_d)$ and $y=(y_1,\dots,y_l)$ are families of complex numbers, each linearly independent over $\Q$. For $\lambda\in\N^{d}$ and $m\in\N^{l}$ write $\langle\lambda,x\rangle=\sum_i\lambda_ix_i$ and $\langle m,y\rangle=\sum_jm_jy_j$. For $L\in\N$ and integers $p_\lambda$ the auxiliary function is
\[ F_p(z)=\sum_{\lambda\in\{0,\dots,L-1\}^{d}}p_\lambda\,e^{\langle\lambda,x\rangle z}. \]
A number field $K$ is a subfield of $\C$ of finite degree over $\Q$.

Three sections prove Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}, \cite[Corollary 11.16]{Wal00} (Theorem~\ref{thm:strong_six_exponentials}): if $x_1,x_2$ are linearly independent over $\Qbar$ and $y_1,y_2,y_3$ are linearly independent over $\Qbar$, at least one of the six products $x_iy_j$ lies outside $\widetilde{\mathcal L}$, the $\Qbar$-span of $1$ and the logarithms of algebraic numbers. The theorem is classical, and the proof follows Waldschmidt's book \cite{Wal00}, called DALAG in the statements: the interpolation determinant, the linear subgroup theorem \cite[Theorem 11.21]{Wal00} (Theorem~\ref{thm:linear_subgroup_transcendence}), and Roy's map $\Upsilon$ \cite[\S11.6.2]{Wal00}. It is proved from one explicit hypothesis, \texttt{hME} (the Lean proposition \texttt{Diaz.MultiplicityEstimateElem}): the case $G^-=\{e\}$ of the multiplicity estimate \cite[Theorem 8.1]{Wal00}, after Philippon \cite{Phi86}, for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$, written in coordinates. The hypothesis is stated in full in Theorem~\ref{thm:linear_subgroup_transcendence}. The last five sections prove it (Theorem~\ref{thm:multiplicityEstimateElem}), so Roy's theorem holds with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}). In the library, \texttt{Diaz.strongSixExponentials\_of\_multiplicityEstimateElem} restates the conclusion of Theorem~\ref{thm:strong_six_exponentials} as the proposition \texttt{Diaz.StrongSixExponentials}, and \texttt{Diaz.strongSixExponentials} proves that proposition with no hypothesis, so that every result that takes Roy's theorem as a hypothesis holds without it (Chapter~\ref{chap:10-rank-one-configurations} has many).

The next three sections prove the Hilbert-function half of \texttt{hME}, at finite level: inequalities between dimensions of boxes of polynomials, with no Hilbert polynomials. They follow \cite[Chapters 5 and 8]{Wal00} (Chapter 8 is by D.~Roy): the Hilbert function $h_I(T)$ of a filtration (DALAG's $H(I;T)$), the chain bound \cite[Theorems 8.4 and 8.8]{Wal00} at finite level (Proposition~\ref{prop:boxHilb_le_of_height}), the model of $\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ inside $K[X,Y,Z]$, and the Hilbert side of the proof of \cite[Theorem 8.1]{Wal00} for $G^-=\{e\}$ on the boxes of \texttt{hME} (Theorem~\ref{thm:torus_hilbert_side}). The names \texttt{boxHilb}, \texttt{blockBox}, \texttt{torusBox}, \texttt{torusIdeal}, \texttt{torusList}, \texttt{torusReduced}, \texttt{boxD}, \texttt{torusCoeffPoly}, \texttt{torusPoint} and \texttt{UnmixedHeight} in the statements are those of the library file \texttt{Diaz/HilbertBox.lean} (on Prove2Me, the published definition \texttt{DiazHilbertBox}). The chain bound and the Hilbert side take one explicit hypothesis, \texttt{hU : UnmixedHeight}: Macaulay's unmixedness, in the form that for every weakly regular sequence $r_1,\dots,r_k$ of the ring, every associated prime of the quotient by $(r_1,\dots,r_k)$ has height at most $k$ \cite[\S8.2.1]{Wal00}. The last section proves it for polynomial rings over an algebraically closed field (Theorem~\ref{thm:unmixedHeight_mvPolynomial}), so over $\C$ the Hilbert side holds without \texttt{hU}: the library theorem \texttt{Diaz.torus\_hilbert\_side\_complex} passes the one to the other. The multiplicity side of \texttt{hME} and its assembly are the last five sections. These results are routine finite-level forms of the book's.

The last section proves the inequality half of Macaulay's unmixedness theorem \cite{Mac16} for $K[X_\sigma]$, $K$ algebraically closed and $\sigma$ finite, in the form \texttt{UnmixedHeight} (Theorem~\ref{thm:unmixedHeight_mvPolynomial}); the reverse inequality is not stated. The route is local and goes through regular sequences only: a weakly regular sequence in the maximal ideal of a Noetherian local ring is no longer than the dimension of $A/\mathfrak{p}$ for any associated prime $\mathfrak{p}$ \cite[Th.~17.2]{Mat86}; Rees' characterisation of regular sequences through Ext, already in Mathlib, shortens a long regular sequence by at most the length of a weakly regular one; together they give unmixedness for a local ring with a regular sequence as long as its dimension \cite[Th.~2.1.6]{BH93}; and at a maximal ideal of $K[X_\sigma]$, which by the Nullstellensatz is the ideal of a point $a$, the $X_i - a_i$ are such a sequence. These are classical results, formalised routinely.

The last five sections prove \texttt{hME}: the multiplicity estimate \cite[Theorem 8.1]{Wal00} in the case $G^-=\{e\}$, $G^+=G$, for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ over $\C$, written in coordinates (Theorem~\ref{thm:multiplicityEstimateElem}). For $G^-=\{e\}$ and finite $\Sigma$ the book notes that Theorem 8.1 is a special case of \cite[Theorem 2.1]{Phi86}. The proof is that of \cite[\S8.4]{Wal00} (Chapter 8 is by D.~Roy), at finite level and through elementary arguments: zero sets and heights on the torus, characters and subgroups, the invariant derivations of $G$, the tangent duals of Lemmas 8.14 and 8.15 with W\"ustholz's argument (8.20) and Lemma 8.16, and the descent of \S8.4.1 to an obstruction subgroup, whose Hilbert function is bounded below and compared with the Hilbert side above. The names \texttt{TorusGroup}, \texttt{torusPt}, \texttt{torusDeriv}, \texttt{torusDerivList}, \texttt{torusTransl}, \texttt{torusVanishing}, \texttt{torusZero}, \texttt{torusStab}, \texttt{torusMono}, \texttt{linForm}, \texttt{standardSet}, \texttt{sectionIdeal}, \texttt{vanishOrd}, \texttt{hmePoint} and \texttt{obstructionSpan} in the statements are those of the library file \texttt{Diaz/Multiplicity.lean} (on Prove2Me, the published definition \texttt{DiazMultiplicity}). The last theorem applies Theorem~\ref{thm:strong_six_exponentials} to it: Roy's strong six exponentials theorem with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}). In the library the results that took Roy's theorem as a hypothesis have corollaries without it, in \texttt{Diaz/RoyUnconditional.lean}. The theorems are classical, and this is a routine formalisation of their known proofs.
'''

[[node]]
platform = "SX.exists_aux_expSum"
title = "The auxiliary function"
statement = '''
Let $d+l<dl$, and let $K$ be a number field containing every $e^{x_iy_j}$. There is $c>0$ such that for every large $M$ there are an integer $L\ge1$ with $L^{d}\le cM^{l}$ and integers $p_\lambda$ with $|p_\lambda|\le e^{cLM}$, not all zero for $\lambda\in\{0,\dots,L-1\}^{d}$, such that $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with $m_j<M$ for all $j$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
At the lattice points the exponentials are products of powers of the $e^{x_iy_j}$, so the conditions form a linear system over $K$: $M^{l}$ conditions on $L^{d}$ unknowns, and $d+l<dl$ leaves room for Siegel's lemma (Lemma~\ref{lem:siegel_entrywise}), with the denominators and houses of Lemma~\ref{lem:exists_denom_house_monomial_le}.
'''

[[node]]
platform = "SX.descent_step"
title = "The descent step"
statement = '''
Let $d+l<dl$, let $K$ be a number field containing every $e^{x_iy_j}$, and let $c>0$. There is $M_0$ such that for all $M\ge M_0$, all $L\ge1$ with $L^{d}\le cM^{l}$, all integers $p_\lambda$ with $|p_\lambda|\le e^{cLM}$ and all $N\ge M$: if $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with all $m_j<N$, then $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$ with all $m_j<N+1$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
At a new lattice point $F_p$ is small, by Lemma~\ref{lem:expPoly_grid_estimate} applied to the zeros already known. Its value there is an element of $K$ with controlled denominator and house (Lemma~\ref{lem:exists_denom_house_monomial_le}), so if it were non-zero Lemma~\ref{lem:liouville_house} would bound it from below. The two bounds are incompatible because $dl>d+l$.
'''

[[node]]
platform = "SX.eq_zero_of_expSum_vanishes"
title = "Vanishing on the whole lattice"
statement = '''
Let $l\ge2$, $L\in\N$ and $p_\lambda$ integers. If $F_p(\langle m,y\rangle)=0$ for every $m\in\N^{l}$, then $p_\lambda=0$ for every $\lambda\in\{0,\dots,L-1\}^{d}$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[\S3.4]{Wal09}.'''
sketch = '''
The exponents $\langle\lambda,x\rangle$ are pairwise distinct, and as $l\ge2$ and the $y_j$ are independent, $\lambda\mapsto(e^{\langle\lambda,x\rangle y_j})_j$ is injective; Dedekind's independence of characters concludes.
'''

[[node]]
platform = "SX.six_exponentials_of_numberField"
env = "theorem"
title = "Six exponentials over a number field"
statement = '''
Let $d,l\in\N$ with $d+l<dl$, let $x_1,\dots,x_d$ and $y_1,\dots,y_l$ be complex numbers, each family linearly independent over $\Q$, and let $K$ be a number field. Then some $e^{x_iy_j}$ does not lie in $K$.
'''
source = '''\cite[Ch.~II]{Lang66}, \cite{Ram68}; see \cite[Theorem 1.12]{Wal00}.'''
sketch = '''
Otherwise Lemma~\ref{lem:exists_aux_expSum} gives an auxiliary function, Lemma~\ref{lem:descent_step} makes it vanish on the whole lattice by induction, and Lemma~\ref{lem:eq_zero_of_expSum_vanishes} makes all its coefficients zero ($d+l<dl$ forces $l\ge2$), a contradiction.
'''

[[node]]
platform = "DiazModulus.six_exponentials"
root = true
env = "theorem"
title = "The six exponentials theorem"
statement = '''
Let $x_1,x_2$ be complex numbers linearly independent over $\Q$, and let $y_1,y_2,y_3$ be complex numbers linearly independent over $\Q$. Then at least one of the six numbers $e^{x_iy_j}$ ($i=1,2$, $j=1,2,3$) is transcendental.
'''
source = '''Lang \cite[Ch.~II]{Lang66}, Ramachandra \cite{Ram68}; see \cite[\S1.3, Theorem 1.12]{Wal00}.'''
sketch = '''
Finitely many algebraic numbers lie in one number field; apply Theorem~\ref{thm:six_exponentials_of_numberField} with $(d,l)=(2,3)$.
'''

[[node]]
platform = "Schanuel.six_exponentials"
root = true
same_as = "DiazModulus.six_exponentials"

# --- Roy's strong six exponentials theorem from a multiplicity estimate (C1.4, 29 October 2026) --------

# --- the interpolation determinant ----------------------------------------
[[node]]
platform = "DiazModulus.thetaN_ge_mul_sub"
section = "Roy's theorem from a multiplicity estimate: the interpolation determinant"
env = "lemma"
title = 'A lower bound for $\Theta_n(L)$'
statement = '''
Let $n \geq 1$ and $L, A \in \N$. Then $A\,(L - A^n) \leq \Theta_n(L)$, where $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map), and $L - A^n$ is truncated at $0$.
'''
source = '''The function $\Theta_n(L)$ is that of \cite[\S6.2.2]{Wal00}; compare Lemma 6.5 (\S6.2.3) there. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
For $n \geq 1$ the map $l \mapsto (l, \dots, l)$ is injective, so it suffices to bound every admissible sum from below. Fix an injective $\kappa'$. At most $A^n$ indices $l$ have $\kappa'(l)$ in the box $\{0, \dots, A - 1\}^n$, as $\kappa'$ maps them injectively into it; every other $l$ has a coordinate $\geq A$, hence degree $\geq A$. So the total degree is at least $A$ times the number of indices outside the box, which is at least $L - A^n$.
'''

[[node]]
platform = "DiazModulus.iteratedDeriv_det_eq_sum"
env = "lemma"
title = 'The Leibniz rule for a determinant'
statement = '''
Let $g_{l\mu}$ ($l, \mu \in \{1, \dots, L\}$) be entire functions, $j \in \N$ and $z \in \C$. Then the $j$-th derivative of $x \mapsto \det(g_{l\mu}(x))$ at $z$ is $\sum_q \frac{j!}{\prod_\mu q_\mu!} \det(g_{l\mu}^{(q_\mu)}(z))$, the sum over the $q \in \N^L$ with $\sum_\mu q_\mu = j$: column $\mu$ is differentiated $q_\mu$ times.
'''
source = '''Classical (the Leibniz rule for products). Used for \cite[Lemma 9.2.]{Wal00}'''
sketch = '''
Expand the determinant over permutations. By linearity it suffices to differentiate a product $\prod_\mu h_\mu$ of entire functions; the general Leibniz rule $(\prod_\mu h_\mu)^{(j)} = \sum_{\sum q = j} \binom{j}{q} \prod_\mu h_\mu^{(q_\mu)}$ is proved by induction on $L$, splitting off the factor $\mu = 0$, applying the binomial Leibniz rule and the induction hypothesis, and reindexing the double sum through $q \mapsto (q_0, (q_1, \dots))$, with $\binom{j}{(i, q')} = \binom{i + |q'|}{i}\binom{|q'|}{q'}$. Exchanging the sums over permutations and over $q$ gives the statement.
'''

[[node]]
platform = "DiazModulus.iteratedDeriv_iteratedFDeriv_line"
env = "lemma"
title = 'Derivatives along a line'
statement = '''
Let $f$ be an entire function on $\C^n$, $\zeta \in \C^n$, $\sigma, q \in \N$ and $v_1, \dots, v_\sigma \in \C^n$. Then the $q$-th derivative at $z = 0$ of $z \mapsto D^\sigma f(z\zeta)(v_1, \dots, v_\sigma)$ is $D^{\sigma + q} f(0)(v_1, \dots, v_\sigma, \zeta, \dots, \zeta)$, with $q$ copies of $\zeta$.
'''
source = '''Classical (chain rule and symmetry of derivatives). Used for \cite[Lemma 9.2.]{Wal00}'''
sketch = '''
The identity holds at every $z$. For one derivative, the chain rule for $z \mapsto z\zeta$, whose derivative is $\zeta$, gives $D^{N+1} f(z\zeta)(\zeta, w)$, since evaluation at a fixed tuple is a continuous linear map. Induction on $q$ puts each further $\zeta$ in front of the arguments, while the statement has it at the end; the two agree by the symmetry of iterated derivatives of a smooth function.
'''

[[node]]
platform = "DiazModulus.interpolation_det_order"
env = "lemma"
title = 'The order of an interpolation determinant at the origin'
statement = '''
Let $f_1, \dots, f_L$ be entire functions on $\C^n$, and for $\mu = 1, \dots, L$ let $\zeta_\mu \in \C^n$, $\sigma_\mu \in \N$ and $v_\mu \in (\C^n)^{\sigma_\mu}$. Then $\Delta(z) = \det(D^{\sigma_\mu} f_l(z\zeta_\mu)(v_\mu))_{l,\mu}$ vanishes at $z = 0$ to order at least $\Theta_n(L) - \sum_\mu \sigma_\mu$; precisely, $\Theta_n(L) \leq \mathrm{ord}_0 \Delta + \sum_\mu \sigma_\mu$ in $\N \cup \{\infty\}$. Here $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map).
'''
source = '''\cite[Lemma 9.2.]{Wal00}'''
sketch = '''
$\Delta$ is entire, so it suffices that $\Delta^{(j)}(0) = 0$ when $j + \sum_\mu \sigma_\mu < \Theta_n(L)$. By the Leibniz rule for determinants (Lemma~\ref{lem:iteratedDeriv_det_eq_sum}) $\Delta^{(j)}(0)$ is a combination of determinants whose column $\mu$ is differentiated $q_\mu$ times, $\sum q_\mu = j$, and by Lemma~\ref{lem:iteratedDeriv_iteratedFDeriv_line} each entry is $D^{m_\mu} f_l(0)$ at a tuple of vectors, with $m_\mu = \sigma_\mu + q_\mu$ and $\sum m_\mu < \Theta_n(L)$. Expanding the vectors in the standard basis and using multilinearity, the determinant is a sum of determinants indexed by choices of basis vectors; for each choice let $\kappa'(\mu)$ count how often each basis vector occurs in column $\mu$, a multi-index of degree $m_\mu$. If $\kappa'$ is injective then $\Theta_n(L) \leq \sum m_\mu$, which is excluded; otherwise two columns are equal, by the symmetry of iterated derivatives, and the determinant vanishes.
'''

[[node]]
platform = "DiazModulus.schwarz_order_at_zero"
env = "lemma"
title = 'A Schwarz lemma at one zero'
statement = '''
Let $F$ be an entire function with a zero of order at least $T$ at $0$, let $R \geq 1$, and suppose $|F(z)| \leq B$ whenever $|z| = R$. Then $|F(1)| \leq R^{-T} B$.
'''
source = '''Schwarz's lemma: \cite[Lemma 2.4.]{Wal00}'''
sketch = '''
Write $F(z) = z^T g(z)$ near $0$ with $g$ analytic there. Then $G(z) = F(z)/z^T$, extended by $g(0)$ at $0$, is entire, and $|G(z)| \leq B/R^T$ on $|z| = R$. The maximum modulus principle on the disc $|z| \leq R$ gives $|G(1)| \leq B/R^T$, as $R \geq 1$, and $G(1) = F(1)$.
'''

[[node]]
platform = "DiazModulus.iteratedFDeriv_expMono_eq_op"
env = "lemma"
title = 'Derivatives of exponential monomials'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). Let $\tau \in \N^{\iota_0}$, $t \in \Z^{\iota_1}$, $p$ a point, and $f(z) = z'^\tau e^{\langle t, z'' \rangle}$, where $z'^\tau = \prod_h z_h'^{\tau_h}$ and $\langle t, z'' \rangle = \sum_i t_i z''_i$. Then for $k_1, \dots, k_r \in \kappa_0$, $D^r f(p)(w_{k_1}, \dots, w_{k_r}) = (\mathrm{Op}^t_{w,k} X^\tau)(p')\, e^{\langle t, p'' \rangle}$.
'''
source = '''Classical; the invariant derivations $D_w$ of \cite[\S8.1]{Wal00} and \S8.3.2 (Lemma 8.11), as used in Step 3 of the proof of Th. 11.21 (\S11.7.1).'''
sketch = '''
For a polynomial $Q$ put $G_Q(z) = Q(z') e^{\langle t, z'' \rangle}$. The product rule and the derivative of polynomial evaluation (by induction on $Q$) give $DG_Q(z)\,v = G_{\mathrm{Op}^t_v Q}(z)$. Then induct on $r$ for all $Q$ at once: the $(r+1)$-st derivative is the $r$-th derivative of $DG_Q$ evaluated at the last direction, and evaluation at a fixed vector commutes with iterated derivatives, which gives the $r$-th derivative of $G_{\mathrm{Op}^t_{w_{k_{r+1}}} Q}$. Take $Q = X^\tau$.
'''

[[node]]
platform = "DiazModulus.op_monomial_eval_norm_le"
env = "lemma"
title = 'A size bound for the derivation operators'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). Here the weights $t \in \C^{\iota_1}$ may be complex. Suppose every coordinate of every $w_k$ has absolute value at most $H$, with $H \geq 0$; every coordinate of $p \in \C^{\iota_0}$ has absolute value at most $P$, with $P \geq 1$; and $\sum_i |t_i| \leq t_b$. Then for $r \in \N$, $k_1, \dots, k_r \in \kappa_0$ and $\tau \in \N^{\iota_0}$, $|(\mathrm{Op}^t_{w,k} X^\tau)(p)| \leq (H(|\tau| + t_b + 1))^r P^{|\tau|}$, where $|\tau| = \sum_h \tau_h$.
'''
source = '''An elementary estimate for Step 4 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
By induction on $r$, for all exponents at once, peeling off the last operator. One operator sends $X^s$ to $\sum_h w'_h s_h X^{s - e_h} + c X^s$ with $|c| = |\sum_i w''_i t_i| \leq H t_b$. The remaining operators are linear, so the induction hypothesis bounds each term; $s - e_h$ lies below $s$, and $P \geq 1$, $H \geq 0$ make the bound increase with $|s|$. Summing gives $H(|s| + t_b)B \leq H(|s| + t_b + 1)B$. The base case is $|p^s| \leq P^{|s|}$.
'''

[[node]]
platform = "DiazModulus.op_entry_denom_house"
env = "lemma"
title = 'Denominators and houses of the interpolation entries'
statement = '''
Let $K$ be a number field, $\iota_0, \iota_1, \kappa_0, \kappa_1$ finite, $w_k \in K^{\iota_0} \times K^{\iota_1}$ ($k \in \kappa_0$), $u_j \in K^{\iota_0}$ and $a_{ji} \in K$ ($j \in \kappa_1$, $i \in \iota_1$), and define $\mathrm{Op}^t_{w,k}$ as for complex points. There are a non-zero algebraic integer $b \in K$ and $H \geq 1$ such that for all $r$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$, $\tau \in \N^{\iota_0}$ and $t \in \Z^{\iota_1}$, with $E = r + |\tau| + (\sum_i |t_i|)(\sum_j |s_j|)$ and $e = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$, the number $b^E e$ is an algebraic integer whose house (the largest absolute value of a conjugate) is at most $H^E (|\tau| + \sum_i |t_i| + 1)^r (\sum_j |s_j| + 1)^{|\tau|}$.
'''
source = '''Bookkeeping for Liouville's inequality in Step 5 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Liouville's inequality: \cite[\S3.5]{Wal00} (cf. Exercise 3.8, Prop. 13.8, cited in Step 5). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The data (the coordinates of the $w_k$ and $u_j$, the $a_{ji}$ and their inverses) form one finite family, and Lemma~\ref{lem:exists_denom_house_monomial_le} gives a common denominator $b$ and a bound $H_0$ for their houses. Say $x$ has property $Q(n, B)$ if $b^n x$ is integral of house at most $H_0^n B$; it is stable under sums, products (adding the $n$), integer multiples and raising $n$. By induction on the operators, every coefficient of $\mathrm{Op}^t_{w,k} X^\tau$ has $Q(r, ((|\iota_0| + 1)(|\tau| + |t| + 1))^r)$, with support below $\tau$; evaluation at $\sum_j s_j u_j$ costs $(|s| + 1)$ per degree, over at most $2^{|\tau|}$ monomials; and the product of the $a_{ji}^{s_j t_i}$ has $Q(|t||s|, 1)$. The constants are absorbed into $H = 2H_0(|\iota_0| + 1)$.
'''

[[node]]
platform = "DiazModulus.interp_det_upper"
env = "proposition"
title = 'The interpolation determinant: the analytic upper bound'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n$ containing every $w_k$ ($k \in \kappa_0$) and every $\eta_j$ ($j \in \kappa_1$). Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$, and for every choice of $L$ row data $(r_\lambda, k_\lambda, s_\lambda)$, one for each column $\lambda$, with $r_\lambda \leq N_0$ and $|s_{\lambda,j}| \leq N_1$, the determinant $\Delta$ of the $L \times L$ matrix $(E_{(r_\lambda, k_\lambda, s_\lambda), \lambda'})_{\lambda, \lambda'}$ satisfies $|\Delta| \leq \exp(-(\Theta_n(L) - L N_0) + C L \Xi)$, with $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$ and $\Theta_n(L)$ is the least value of $\sum_l |\kappa'(l)|$ over the injective maps $\kappa' : \{1, \dots, L\} \to \N^n$, with $|\cdot|$ the total degree of a multi-index ($0$ if there is no such map).
'''
source = '''Step 4 (upper bound) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1); compare Lemma 9.2; Schwarz's lemma is Lemma 2.4.'''
sketch = '''
Fix a basis of $V$ and let $\psi : \C^n \to V$ be the coordinate map. Each column gives the entire function $f_\lambda \circ \psi$, $f_\lambda(z) = z'^\tau e^{\langle t, z'' \rangle}$, and each row the point $\psi^{-1}(\sum_j s_j \eta_j)$ and the directions $\psi^{-1}(w_k)$. By Lemma~\ref{lem:iteratedFDeriv_expMono_eq_op} the entries of $F(z) = \det(D^{r}(f \circ \psi)(z\zeta)(v))$ are the polynomial parts at $zp'$ times $e^{z\langle t, p'' \rangle}$, so $F(1) = \Delta$ up to transposition. Lemma~\ref{lem:interpolation_det_order} (DALAG Lemma 9.2) gives $\mathrm{ord}_0 F \geq \Theta_n(L) - L N_0$, and Lemma~\ref{lem:schwarz_order_at_zero} (Schwarz) with $R = e$ gives $|\Delta| \leq e^{-\mathrm{ord}} \sup_{|z| = e} |F|$. On $|z| = e$ each entry is at most $e^\beta$, by Lemma~\ref{lem:op_monomial_eval_norm_le} for the polynomial part and $|e^u| \leq e^{|u|}$, so $|F| \leq L!\, e^{L\beta}$; finally $\log L + \beta \leq K\Xi$ is elementary.
'''

[[node]]
platform = "DiazModulus.interp_det_liouville"
env = "proposition"
title = "The interpolation determinant: Liouville's lower bound"
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$, and for every choice of $L$ row data $(r_\lambda, k_\lambda, s_\lambda)$, one for each column $\lambda$, with $r_\lambda \leq N_0$ and $|s_{\lambda,j}| \leq N_1$, the determinant $\Delta$ of the $L \times L$ matrix $(E_{(r_\lambda, k_\lambda, s_\lambda), \lambda'})_{\lambda, \lambda'}$ satisfies $\log |\Delta| \geq -C L \Xi$ whenever $\Delta \neq 0$, with $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$.
'''
source = '''Step 5 (Liouville's inequality) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1). Liouville's inequality: \cite[\S3.5]{Wal00} (cf. Exercise 3.8, Prop. 13.8, cited in Step 5).'''
sketch = '''
All data are algebraic, so they lie in a number field $F \subseteq \C$, and $\Delta$ is the image of the determinant of the same matrix over $F$. Lemma~\ref{lem:op_entry_denom_house} gives $b$ and $H$; with a uniform exponent $E^* = N_0 + |\iota_0| T_0 + |\iota_1| T_1 |\kappa_1| N_1$ every entry of $b^{E^*} M_F$ is integral of bounded house, so $\alpha = \det(b^{E^*} M_F)$ is a non-zero algebraic integer of house at most $L!\, B^L$. Liouville's inequality (Lemma~\ref{lem:liouville_house}) gives $1 \leq H'^{E^* L} |\Delta| (L!\, B^L)^{[F:\Q] - 1}$; taking logarithms and using $\log L! \leq L \log L$ and elementary bounds gives $\log |\Delta| \geq -CL\Xi$.
'''

[[node]]
platform = "DiazModulus.exists_ne_zero_mulVec_eq_zero_of_minors"
env = "lemma"
title = 'A kernel vector from vanishing minors'
statement = '''
Let $M$ be a $\rho \times \gamma$ matrix over a field, with $\rho, \gamma$ finite. If every square minor $\det(M_{f(\mu), \mu'})_{\mu, \mu' \in \gamma}$, for $f : \gamma \to \rho$, is $0$, then $Mc = 0$ for some $c \neq 0$.
'''
source = '''Classical linear algebra.'''
sketch = '''
Otherwise $c \mapsto Mc$ is injective, so $M$ has rank $|\gamma|$ and its rows span a space of dimension $|\gamma|$. Some linearly independent family of rows has the same span, hence $|\gamma|$ members; indexing it by $\gamma$ gives $f$ whose square submatrix has independent rows, hence a non-zero determinant.
'''

[[node]]
platform = "DiazModulus.interp_kernel"
env = "proposition"
title = 'The interpolation matrix has a kernel vector'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$. In the entries, $u_j = \eta'_j$ and $a_{ji} = e^{\eta''_{j,i}}$, for points $\eta_j = (\eta'_j, \eta''_j)$. Let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n \geq 1$ containing every $w_k$ and every $\eta_j$, and suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Then there is $C > 0$ such that, for all $T_0, T_1 \geq 1$ and $N_0, N_1 \in \N$ with $C \Xi \leq L^{1/n}$, where $\Xi = N_0 \log(T_0 + T_1 + 2) + T_0 \log(N_1 + 2) + T_1(N_1 + 1)$, some non-zero vector $c$ on the columns satisfies $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq N_0$, every $k_1, \dots, k_r$ and every $s$ with $|s_j| \leq N_1$. This is the premise of the multiplicity estimate.
'''
source = '''Steps 3–5 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
Index the rows by the finite set of row data with $r \leq N_0$ and $|s_j| \leq N_1$. If some maximal minor $\Delta$ were non-zero, Proposition~\ref{prop:interp_det_liouville} would give $\log |\Delta| \geq -C_{10} L \Xi$ and Proposition~\ref{prop:interp_det_upper} $|\Delta| \leq \exp(-(\Theta_n(L) - LN_0) + C_9 L \Xi)$, so $\Theta_n(L) \leq LN_0 + (C_9 + C_{10}) L \Xi$. With $A = \lfloor L^{1/n}/2 \rfloor$, $2A^n \leq L$, and Lemma~\ref{lem:thetaN_ge_mul_sub} gives $AL \leq 2\Theta_n(L)$; as $1 \leq \Xi$ and $N_0 \leq \Xi$, the hypothesis with $C = 8 + 4(C_9 + C_{10})$ excludes this. So every maximal minor vanishes, and Lemma~\ref{lem:exists_ne_zero_mulVec_eq_zero_of_minors} gives the kernel vector.
'''

# --- the linear subgroup theorem ----------------------------------------
[[node]]
platform = "DiazModulus.exists_coord_complement"
section = "Roy's theorem from a multiplicity estimate: the linear subgroup theorem"
env = "lemma"
title = 'A coordinate complement of the span of integer vectors'
statement = '''
Let $N$ be a finite set and $A \subseteq \Z^N$, and let $S \subseteq \Q^N$ be the $\Q$-span of $A$. There is $J \subseteq N$ with $|J| + \dim_{\Q} S = |N|$ such that the only vector of $S$ vanishing outside $J$ is $0$.
'''
source = '''Classical linear algebra.'''
sketch = '''
The images of the standard basis vectors span $\Q^N / S$; some injectively indexed subfamily $e_j$, $j \in J$, maps to a basis, so $|J| = |N| - \dim S$. If $v \in S$ vanishes outside $J$, then $v = \sum_{j \in J} v_j e_j$ maps to $0$, so every $v_j$ is $0$ by independence.
'''

[[node]]
platform = "DiazModulus.obstruction_1123"
env = "proposition"
title = 'The obstruction given by the multiplicity estimate'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Let $w_k$ ($k \in \kappa_0$), $u_j \in \C^{\iota_0}$ and non-zero $a_{ji}$ ($j \in \kappa_1$) be given, $T_0, T_1 \geq 1$, $S_0, S_1 \in \N$, $d = |\iota_0| + |\iota_1|$, and $c \neq 0$ a vector on the columns with $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dS_0$, every $k$ and every $s$ with $|s_j| \leq dS_1$. Assume \texttt{hME}. Then there are $V \subseteq \C^{\iota_0}$, $\varphi_1, \dots, \varphi_q \in \Z^{\iota_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$ ($W$ the span of the $w_k$) and $\dim V + \dim L_1 < d$, such that $(S_0 + 1)^\ell (2S_1 + 1)^{\lambda'} T_0^{\dim V} T_1^{\dim L_1} \leq \ell!\, K_d\, T_0^{|\iota_0|} T_1^{|\iota_1|}$, where $\lambda' = |\kappa_1| - \rho$, the relation rank $\rho$ is the dimension of the $\Q$-span of the set of $s \in \Z^{\kappa_1}$ congruent to $0$ modulo $(V, \varphi)$, two vectors $s, s' \in \Z^{\kappa_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$, and $K_d$ is as in \texttt{hME} with $A_0 = \iota_0$, $A_1 = \iota_1$.
'''
source = '''Step 6 of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1), with the multiplicity estimate (\cite[Th.~8.1]{Wal00}; \cite{Phi86}) carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}.'''
sketch = '''
Apply \texttt{hME} to $c$ at $(D_0, D_1, M_0, M_1) = (T_0, T_1, S_0, S_1)$; its premise is the hypothesis on $c$. It gives $(V, \varphi, L_1, \ell)$ and a bound for every set $R$ of pairwise incongruent vectors in the box $|s_j| \leq S_1$. By Lemma~\ref{lem:exists_coord_complement} the $\Q$-span of the vectors congruent to $0$ has a coordinate complement $J$ with $|J| = |\kappa_1| - \rho$. Take for $R$ the box on $J$ (zero off $J$): it has $(2S_1 + 1)^{|J|}$ points, and two of its points that are congruent differ by a vector of that span supported on $J$, hence are equal. Finally $(S_0 + 1)^\ell \leq \ell! \binom{S_0 + \ell}{\ell}$, and multiplying the bound by $\ell!$ concludes.
'''

[[node]]
platform = "DiazModulus.params_1122_eventually"
env = "lemma"
title = 'The parameters satisfy the constraint for large $S_1$'
statement = '''
Let $d_0, d_1, n \in \N$ with $1 \leq n < d = d_0 + d_1$ and $d_0 \leq n$, let $C > 0$ and $\nu > (d_0 + n)/(d - n)$. For $S_1 \in \N$ put $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0 / \log S_1 \rfloor$ and $T_1 = \lfloor S_0 / S_1 \rfloor$. Then for all large $S_1$: $T_0 \geq 2$, $T_1 \geq 2$, and $C(S_0 \log(T_0 + T_1 + 2) + T_0 \log(S_1 + 2) + T_1(S_1 + 1)) \leq ((T_0 + 1)^{d_0} (2T_1 + 1)^{d_1})^{1/n}$.
'''
source = '''Step 7 (choice of parameters, condition (11.22)) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
Write $x = S_1$, $\Lambda = \log x$, $e = d_1/(d - n) \geq 1$ and $F = x^e \Lambda^\nu$. As $\nu > 0$ and $e \geq 1$, $F/x \geq \Lambda^\nu \to \infty$, so the floors give $T_0 \geq F/(2\Lambda)$, $T_1 \geq F/(2x)$, both $\geq 2$, and $T_0 \leq F/\Lambda$, $T_1 \leq F/x$. The left side is at most $K F \Lambda$ with $K = C(6 + e + \nu)$, and the right side at least $((F/(2\Lambda))^{d_0} (F/x)^{d_1})^{1/n}$. Comparing logarithms, with $\log F = e\Lambda + \nu \log\Lambda$, the coefficient of $\Lambda$ is $(e(d - n) - d_1)/n = 0$ and that of $\log\Lambda$ is $((d - n)\nu - d_0 - n)/n > 0$, so the inequality holds once $\log\log x$ is large.
'''

[[node]]
platform = "DiazModulus.params_exponents"
env = "lemma"
title = 'The exponents of the obstruction'
statement = '''
Let $d_0, d_1, n \in \N$ with $n < d = d_0 + d_1$ and $d_0 \leq n$, let $\nu > 0$, $c_8 \in \R$, and $a, b, c_0, c_1 \in \N$ with $c_0 + c_1 \geq 1$ and $a \leq c_0 + c_1$. For $S_1 \in \N$ put $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0 / \log S_1 \rfloor$ and $T_1 = \lfloor S_0 / S_1 \rfloor$. Suppose that for infinitely many $S_1$, $\lfloor S_0/d \rfloor^a \lfloor S_1/d \rfloor^b \leq c_8 T_0^{c_0} T_1^{c_1}$ (an inequality of the shape (11.23)). Then $a < c_0 + c_1$ and $(b + c_1)(d - n) \leq d_1(c_0 + c_1 - a)$.
'''
source = '''Step 7 (from (11.23) to the conclusion) of the proof of \cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1).'''
sketch = '''
With $x = S_1$, $\Lambda = \log x$, $e = d_1/(d - n)$ and $F = x^e\Lambda^\nu$, for large $x$ the left side is at least $(F/(2d))^a (x/(2d))^b$ and the right side at most $\max(c_8, 1) (F/\Lambda)^{c_0} (F/x)^{c_1}$. The logarithm of their ratio is $-g\Lambda - h\log\Lambda - \mathrm{const}$ with $g = e(c_0 + c_1 - a) - c_1 - b$ and $h = \nu(c_0 + c_1 - a) - c_0$. If the conclusion fails, then $g < 0$, or $g = 0$ and $h = -c_0 < 0$ (when $a = c_0 + c_1$ and $b = c_1 = 0$). In both cases the left side exceeds the right side for all large $S_1$, against the hypothesis.
'''

[[node]]
platform = "DiazModulus.linear_subgroup_transcendence"
root = true
env = "theorem"
title = 'The linear subgroup theorem, from the multiplicity estimate'
statement = '''
Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Let $d_0 = |\iota_0|$, $d_1 = |\iota_1|$, $d = d_0 + d_1$, and let $V \subseteq \C^{\iota_0} \times \C^{\iota_1}$ be a subspace of dimension $n$ with $1 \leq n < d$ and $d_0 \leq n$. Let $w_k \in V$ ($k \in \kappa_0$) and $\eta_j \in V$ ($j \in \kappa_1$), and suppose the coordinates of the $w_k$ and of the $\eta'_j$ are algebraic and every $\eta''_{j,i}$ lies in $\mathcal{L}$. Assume \texttt{hME}. Then there are a subspace $V' \subseteq \C^{\iota_0}$, $\varphi_1, \dots, \varphi_q \in \Z^{\iota_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V' \times L_1)) = \dim W$, $W$ the span of the $w_k$, such that $\ell < d'$ and $(\lambda' + d'_1)(d - n) \leq d_1(d' - \ell)$. Here $d'_0 = d_0 - \dim V'$, $d'_1 = d_1 - \dim L_1$, $d' = d'_0 + d'_1$, $\lambda' = |\kappa_1| - \rho$, and $\rho$ is the dimension of the $\Q$-span of the set of $s \in \Z^{\kappa_1}$ with $\sum_j s_j \eta'_j \in V'$ and $\prod_i (\prod_j e^{s_j \eta''_{j,i}})^{\varphi_{k,i}} = 1$ for every $k$.

This is DALAG Th. 11.21 in the case $d_0 \leq n$, with $W$ the span of algebraic vectors and the obstruction subgroup recorded as $(V', \varphi)$.
'''
source = '''\cite[Th.~11.21]{Wal00} (the linear subgroup theorem; proof in \S11.7.1), case $d_0\leq n$, Steps 2–7; the multiplicity estimate (\cite[Th.~8.1]{Wal00}; \cite{Phi86}) is carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}.'''
sketch = '''
Proposition~\ref{prop:interp_kernel} gives a constant $C$. Fix $\nu = (d_0 + n)/(d - n) + 1$ and the curve of Lemma~\ref{lem:params_1122_eventually}: $S_0 = \lfloor S_1^{d_1/(d - n)} (\log S_1)^\nu \rfloor$, $T_0 = \lfloor S_0/\log S_1 \rfloor$, $T_1 = \lfloor S_0/S_1 \rfloor$. For all large $S_1$, Lemma~\ref{lem:params_1122_eventually} gives $T_0, T_1 \geq 2$ and the constraint of Proposition~\ref{prop:interp_kernel} at $(N_0, N_1) = (S_0, S_1)$, so Proposition~\ref{prop:interp_kernel} yields $c \neq 0$ whose vanishing covers the premise of Proposition~\ref{prop:obstruction_1123} at $(\lfloor S_0/d \rfloor, \lfloor S_1/d \rfloor)$. Proposition~\ref{prop:obstruction_1123} returns $(V', \varphi, L_1, \ell)$ with $(\lfloor S_0/d \rfloor + 1)^\ell (2\lfloor S_1/d \rfloor + 1)^{\lambda'} T_0^{\dim V'} T_1^{\dim L_1} \leq \ell!\, K_d\, T_0^{d_0} T_1^{d_1}$; cancelling gives (11.23) with exponents $(\ell, \lambda', d'_0, d'_1)$, and $\ell \leq d'$. These four numbers range over a finite set, so one tuple occurs for infinitely many $S_1$, and Lemma~\ref{lem:params_exponents} applied to it gives $\ell < d'$ and $(\lambda' + d'_1)(d - n) \leq d_1(d' - \ell)$.
'''

# --- Roy's argument ----------------------------------------
[[node]]
platform = "DiazModulus.exists_sse_lifts"
section = "Roy's theorem from a multiplicity estimate: Roy's argument"
env = "lemma"
title = 'Restriction of scalars'
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ is the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $x \in \C^2$ and $y \in \C^3$ with $x_i y_j \in \widetilde{\mathcal L}$ for all $i, j$. Then there are $m \geq 1$, $\omega_1, \dots, \omega_m \in \Qbar$ linearly independent over $\Q$, and $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \Qbar^2 \times \mathcal{L}^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$.
'''
source = '''\cite[\S11.6.2]{Wal00} (the map $\Upsilon$ and the basis $\omega$ of a number field), after \cite{Roy92}.'''
sketch = '''
Write each $x_i y_j$ as a finite sum $\sum_l f_l g_l$ with $f_l \in \Qbar$ and $g_l \in \{1\} \cup \mathcal{L}$. Let $K = \Q(\text{all } f_l)$, a number field, and $\omega$ a $\Q$-basis of $K$. For $c \in K$ and $g \in \{1\} \cup \mathcal{L}$, $cg$ has the shape $u + \sum_k \omega_k v_k$ with $u \in \Qbar$, $v_k \in \mathcal{L}$: take $u = c$ if $g = 1$, and otherwise $c = \sum_k r_k\omega_k$ with $r_k \in \Q$ and $v_k = r_k g \in \mathcal{L}$ (Lemma~\ref{lem:exp_ratMul_isAlgebraic}). As $\mathcal{L}$ contains $0$ and is closed under addition, the shape survives finite sums; applied to $\omega_a x_i y_j$ it gives $\eta_{a,j}$.
'''

[[node]]
platform = "DiazModulus.sse_independence_facts"
env = "lemma"
title = 'Two independence facts'
statement = '''
Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, and let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$ (the algebraic numbers). Then:

- if $s \in \Z^{m \times 3}$ and $\sum_{a,j} s_{a,j}\,\omega_a y_j = 0$, then $s = 0$;
- if $\beta \neq 0$, $v \in \Qbar^2$, $c \in \C$ and $c x_i = \beta v_i$ for $i = 1, 2$, then $c = 0$.
'''
source = '''Elementary. Part (1) is used where \cite[\S11.6.2]{Wal00}, appeals to Baker's theorem (Lemma 11.18 (4)). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
(1) Group the sum by $j$: the coefficient $\sum_a s_{a,j}\omega_a$ of $y_j$ is algebraic, so the $\Qbar$-independence of $y$ makes it $0$, and the $\Q$-independence of $\omega$ makes every $s_{a,j}$ zero. (2) If $c \neq 0$, multiplying $v_2 x_1 - v_1 x_2$ by $c$ gives $0$, so $v_2 x_1 - v_1 x_2 = 0$ and the $\Qbar$-independence of $x$ forces $v = 0$; then $cx_1 = 0$, so $x_1 = 0$, which an independent family excludes.
'''

[[node]]
platform = "DiazModulus.intMatrix_ker_facts"
env = "lemma"
title = 'Integer matrices with no rational kernel'
statement = '''
Let $\iota$ be finite and $\varphi_1, \dots, \varphi_q \in \Z^\iota$, and suppose the only $v \in \Q^\iota$ with $\langle \varphi_k, v \rangle = 0$ for all $k$ is $0$. Then the only such $v \in \C^\iota$ is $0$; and if $z \in \C^\iota$ has $\langle \varphi_k, z \rangle \in 2\pi i \Z$ for every $k$, then $z \in 2\pi i\,\Q^\iota$.
'''
source = '''Classical linear algebra.'''
sketch = '''
The map $v \mapsto (\langle \varphi_k, v \rangle)_k$ from $\Q^\iota$ to $\Q^q$ is injective, so it has a rational left inverse $B$, with $\sum_k B_{ik}\varphi_{k,j} = \delta_{ij}$; the identity persists over $\C$. So $w_i = \sum_k B_{ik} \langle \varphi_k, w \rangle$ for every complex $w$: this gives $w = 0$ when every $\langle \varphi_k, w \rangle$ is $0$, and $z_i = 2\pi i \sum_k B_{ik} e_k$ with $e_k \in \Z$ when $\langle \varphi_k, z \rangle = 2\pi i e_k$.
'''

[[node]]
platform = "DiazModulus.rank_le_of_injOn_lattice"
env = "lemma"
title = 'The rank of a lattice on which a linear map is injective'
statement = '''
Let $N$ be finite, $\Psi : \C^N \to \C^q$ a $\C$-linear map, and $A \subseteq \Z^N$ a subgroup with $\Psi(A) \subseteq 2\pi i\,\Z^q$ and $\Psi(s) \neq 0$ for every non-zero $s \in A$. Then the dimension of the $\Q$-span of $A$ is at most the dimension of the range of $\Psi$.
'''
source = '''Elementary. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Pick a $\Q$-basis of the span of $A$ inside $A$, elements $s_b$, with $\Psi(s_b) = 2\pi i e_b$, $e_b \in \Z^q$. It suffices that the $\Psi(s_b)$ are $\C$-independent. A complex relation among them is a complex kernel vector of the integer matrix $(e_b)$, and such a matrix has none once it has no rational one (the left-inverse argument of Lemma~\ref{lem:intMatrix_ker_facts}). A rational kernel vector $c$, cleared of denominators to $Dc_b \in \Z$, gives $s = \sum_b Dc_b s_b \in A$ with $\Psi(s) = 0$, so $s = 0$, and the independence of the basis gives $c = 0$.
'''

[[node]]
platform = "DiazModulus.sse_setup"
env = "lemma"
title = "Roy's map: the subspace and its kernel"
statement = '''
Let $m \in \N$, $\omega \in \C^m$ and $x \in \C^2$ with $x \neq 0$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Then $\Upsilon^{-1}(\mathbb{C}x)$ has dimension $2m + 1$, and $\ker\Upsilon$ is spanned by the vectors $b_{k,i} = (-\omega_k e_i, e_{k,i})$ ($k \leq m$, $i = 1, 2$), where $e_i$ and $e_{k,i}$ are standard basis vectors.
'''
source = '''\cite[\S11.6.2]{Wal00}, Lemma 11.18 (1)–(2), after \cite{Roy92}.'''
sketch = '''
$\Upsilon$ is surjective, as $\Upsilon(u, 0) = u$. Composed with the quotient map $\C^2 \to \C^2/\mathbb{C}x$, of dimension $1$ as $x \neq 0$, it is a surjection with kernel $\Upsilon^{-1}(\mathbb{C}x)$, and rank–nullity on a domain of dimension $2 + 2m$ gives $2m + 1$. Each $b_{k,i}$ lies in $\ker\Upsilon$, and every $z \in \ker\Upsilon$ equals $\sum_p z''_p b_p$, since $z'_i = -\sum_k \omega_k z''_{k,i}$ on the kernel.
'''

[[node]]
platform = "DiazModulus.sse_tangent_count"
env = "lemma"
title = 'The tangent count'
statement = '''
Let $m \in \N$ and $\omega \in \C^m$. Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $V' \subseteq \C^2$ and $L_1 \subseteq \C^{m \times 2}$ be subspaces, $T = \Upsilon(V' \times L_1)$, and $\ell \in \N$ with $\ell + \dim(\ker\Upsilon \cap (V' \times L_1)) = \dim\ker\Upsilon$. Then $\dim\ker\Upsilon = 2m$, $\ell + (2 - \dim T) = (2 - \dim V') + (2m - \dim L_1)$, and $\dim V' \leq \dim T$.
'''
source = '''A dimension count in the setting of \cite[\S11.6.2]{Wal00} (compare Lemma 11.18 (3)). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\Upsilon$ is surjective, so $\dim\ker\Upsilon = 2m$. Rank–nullity for $\Upsilon$ restricted to $P = V' \times L_1$ gives $\dim V' + \dim L_1 = \dim T + \dim(\ker\Upsilon \cap P)$, and the identity follows by integer arithmetic from the hypothesis and $\dim T, \dim V' \leq 2$, $\dim L_1 \leq 2m$. Finally $V' \subseteq T$, since $\Upsilon(u, 0) = u$ and $(u, 0) \in P$ for $u \in V'$.
'''

[[node]]
platform = "DiazModulus.sse_relRank_generic"
env = "lemma"
title = 'The relation rank when the tangent space meets the line only in zero'
statement = '''
Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$, and let $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \C^2 \times \C^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$. Let $V' \subseteq \C^2$ be a subspace, $\varphi_1, \dots, \varphi_q \in \Z^{m \times 2}$ with common complex kernel $L_1$, and $T = \Upsilon(V' \times L_1)$. Let $\rho$ be the dimension of the $\Q$-span of the set of $s \in \Z^{m \times 3}$ with $\sum_p s_p \eta'_p \in V'$ and $\prod_i (\prod_p e^{s_p \eta''_{p,i}})^{\varphi_{k,i}} = 1$ for every $k$. Suppose $T \cap \mathbb{C}x = \{0\}$. Then $\rho \leq 2m - \dim L_1$.
'''
source = '''The setting of \cite[\S11.6.2]{Wal00}, after \cite{Roy92}. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The multiplicative condition reads $e^{\Psi(s)_k} = 1$ for the $\C$-linear map $\Psi$ with $\Psi(z)_k = \sum_i \varphi_{k,i} \sum_p z_p \eta''_{p,i}$, so the relation set is a subgroup $A \subseteq \Z^{m \times 3}$ with $\Psi(A) \subseteq 2\pi i\,\Z^q$. $\Psi$ is injective on $A$: if $\Psi(s) = 0$ then $\zeta = \sum_p s_p \eta_p \in V' \times L_1$, and $\Upsilon(\zeta) = (\sum_{a,j} s_{a,j}\omega_a y_j)\,x$ lies in $T \cap \mathbb{C}x = \{0\}$; as $x \neq 0$ the coefficient vanishes, and $s = 0$ by Lemma~\ref{lem:sse_independence_facts}. Then Lemma~\ref{lem:rank_le_of_injOn_lattice} bounds $\rho$ by $\dim\mathrm{range}\,\Psi \leq \dim\mathrm{range}\,\Phi = 2m - \dim L_1$, where $\Phi(v)_k = \sum_i \varphi_{k,i} v_i$ has kernel $L_1$.
'''

[[node]]
platform = "DiazModulus.sse_relRank_rational"
env = "lemma"
title = 'The relation rank when the tangent space lies in the line'
statement = '''
Let $\Upsilon : \C^2 \times \C^{m \times 2} \to \C^2$ be the linear map $\Upsilon(u, v)_i = u_i + \sum_{k=1}^m \omega_k v_{k,i}$ (Roy's map, DALAG \S11.6.2). Let $\omega_1, \dots, \omega_m \in \Qbar$ be linearly independent over $\Q$, let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$, and let $\eta_{a,j} = (\eta'_{a,j}, \eta''_{a,j}) \in \C^2 \times \C^{m \times 2}$ ($a \leq m$, $j \leq 3$) with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$. Suppose moreover $\eta'_{a,j} \in \Qbar^2$ for all $a, j$. Let $V' \subseteq \C^2$ be a subspace, $\varphi_1, \dots, \varphi_q \in \Z^{m \times 2}$ with common complex kernel $L_1$, and $T = \Upsilon(V' \times L_1)$. Let $\rho$ be the dimension of the $\Q$-span of the set of $s \in \Z^{m \times 3}$ with $\sum_p s_p \eta'_p \in V'$ and $\prod_i (\prod_p e^{s_p \eta''_{p,i}})^{\varphi_{k,i}} = 1$ for every $k$. Suppose $T \subseteq \mathbb{C}x$. Then $L_1 = \{0\}$ and $\rho = 0$.

$V'$ is any subspace; it need not be defined over $\Qbar$.
'''
source = '''The setting of \cite[\S11.6.2]{Wal00}, after \cite{Roy92}. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$L_1 = 0$: if $v \in \Q^{m \times 2}$ has $\langle \varphi_k, v \rangle = 0$ for all $k$, then $\Upsilon(0, v) \in T \subseteq \mathbb{C}x$ is algebraic, so it is $0$ by Lemma~\ref{lem:sse_independence_facts} (with $\beta = 1$), and $\sum_k \omega_k v_{k,i} = 0$ gives $v = 0$. So $\varphi$ has no rational kernel, hence no complex kernel (Lemma~\ref{lem:intMatrix_ker_facts}). Next, for $s$ in the relation set, $z = \sum_p s_p \eta''_p$ has $\langle \varphi_k, z \rangle \in 2\pi i\,\Z$, so $z = 2\pi i\,r$ with $r$ rational (Lemma~\ref{lem:intMatrix_ker_facts}). The vector $\sum_p s_p \eta'_p$ lies in $V' \subseteq T \subseteq \mathbb{C}x$ and is algebraic, so it is $0$. Then $(\sum_{a,j} s_{a,j}\omega_a y_j)\,x = \Upsilon(\sum_p s_p\eta_p) = 2\pi i\,(\sum_k \omega_k r_{k,i})_i$, an algebraic vector times $2\pi i \neq 0$, so the coefficient is $0$ and $s = 0$ (Lemma~\ref{lem:sse_independence_facts}). The relation set is $\{0\}$.
'''

[[node]]
platform = "DiazModulus.strong_six_exponentials"
root = true
env = "theorem"
title = "Roy's strong six exponentials theorem, from the multiplicity estimate"
statement = '''
Here $\Qbar$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal L}$ is the $\Qbar$-vector space spanned by $1$ and $\mathcal{L}$.

Points are $p = (p', p'') \in \C^{\iota_0} \times \C^{\iota_1}$ for finite index sets $\iota_0, \iota_1$. For $w = (w', w'')$ and a weight vector $t$ on $\iota_1$, $\mathrm{Op}^t_w$ is the operator $\sum_{h \in \iota_0} w'_h\,\partial/\partial X_h + \sum_{i \in \iota_1} w''_i t_i$ on polynomials in the $X_h$ ($h \in \iota_0$), and for vectors $w_k$ ($k \in \kappa_0$) and $k_1, \dots, k_r \in \kappa_0$, $\mathrm{Op}^t_{w,k} = \mathrm{Op}^t_{w_{k_1}} \cdots \mathrm{Op}^t_{w_{k_r}}$ (the factors commute). For $T_0, T_1 \geq 1$ the columns are the $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, T_0\}^{\iota_0}$ and $t \in \{-T_1, \dots, T_1\}^{\iota_1}$; there are $L = (T_0 + 1)^{|\iota_0|}(2T_1 + 1)^{|\iota_1|}$ of them. Given $u_j \in \C^{\iota_0}$ and $a_{ji} \in \C$ ($j \in \kappa_1$, $i \in \iota_1$), the entry at a row datum $(r, k, s)$ ($r \in \N$, $k_1, \dots, k_r \in \kappa_0$, $s \in \Z^{\kappa_1}$) and a column $(\tau, t)$ is $E_{(r,k,s),(\tau,t)} = (\mathrm{Op}^t_{w,k} X^\tau)(\sum_j s_j u_j) \cdot \prod_i (\prod_j a_{ji}^{s_j})^{t_i}$.

The hypothesis \texttt{hME} is the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library (on Prove2Me, the published definition \texttt{MultiplicityEstimateElem}), a proposition that is assumed here; Theorem~\ref{thm:multiplicityEstimateElem} proves it. It is an elementary form of Philippon's multiplicity estimate: the case $G^- = \{e\}$, $G^+ = G$ of DALAG Th. 8.1 (\S8.1) for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$, written in coordinates. It says: let $A_0, A_1, B_0, B_1$ be finite, $d = |A_0| + |A_1|$, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$), $u_j \in \C^{A_0}$ and non-zero $a_{ji} \in \C$ ($j \in B_1$, $i \in A_1$), $D_0, D_1 \geq 1$, $M_0, M_1 \in \N$, and $c \neq 0$ a vector on the box of the $(\tau, t)$ with $\tau_h \leq D_0$ and $|t_i| \leq D_1$. If $\sum_\lambda c_\lambda E_{(r,k,s),\lambda} = 0$ for every $r \leq dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s$ with $|s_j| \leq dM_1$ (the entries $E$ are those defined above, with $A_0, A_1, B_0, B_1$ for $\iota_0, \iota_1, \kappa_0, \kappa_1$ and $D_0, D_1$ for $T_0, T_1$), then there are a subspace $V \subseteq \C^{A_0}$, integer vectors $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L_1$, and $\ell$ with $\ell + \dim(W \cap (V \times L_1)) = \dim W$, $W$ the span of the $w_b$, such that $\dim V + \dim L_1 < d$ and every set $R$ of vectors $s$ with $|s_j| \leq M_1$, pairwise incongruent modulo $(V, \varphi)$, has $\binom{M_0 + \ell}{\ell}\, |R|\, D_0^{\dim V} D_1^{\dim L_1} \leq K_d\, D_0^{|A_0|} D_1^{|A_1|}$, with $K_d = 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|}$; two vectors $s, s' \in \Z^{B_1}$ are congruent modulo $(V, \varphi)$ when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\varphi_{k,i}} = 1$ for every $k$.

Assume \texttt{hME}. Let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\Qbar$. Then $x_i y_j \notin \widetilde{\mathcal L}$ for some $i, j$.

This is Roy's strong six exponentials theorem, the case $d = 2$, $\ell = 3$ of DALAG Cor. 11.16 (\S11.6.1), conditional on \texttt{hME}. \texttt{hME} is carried as an explicit hypothesis here. It is the case $G^- = \{e\}$ of DALAG Th. 8.1 (Philippon's multiplicity estimate), and Theorem~\ref{thm:multiplicityEstimateElem} proves it, so Theorem~\ref{thm:strong_six_exponentials_unconditional} holds with no hypothesis.
'''
source = '''Roy's strong six exponentials theorem: \cite{Roy92}, Cor. 2; \cite[Cor.~11.16]{Wal00} (\S11.6.1; this node is its case $d=2$, $\ell=3$), through Th. 11.21 (\S11.7.1). The multiplicity estimate (\cite[Th.~8.1]{Wal00}, \S8.1; \cite{Phi86}) is carried as the explicit hypothesis \texttt{hME}, the definition \texttt{MultiplicityEstimateElem}; Theorem~\ref{thm:multiplicityEstimateElem} proves it.'''
sketch = '''
Suppose $x_i y_j \in \widetilde{\mathcal L}$ for all $i, j$. Lemma~\ref{lem:exists_sse_lifts} gives $m \geq 1$, a $\Q$-free algebraic $\omega$ and lifts $\eta_{a,j} \in \Qbar^2 \times \mathcal{L}^{m \times 2}$ with $\Upsilon(\eta_{a,j}) = \omega_a y_j x$, where $\Upsilon(u, v)_i = u_i + \sum_k \omega_k v_{k,i}$. Apply Theorem~\ref{thm:linear_subgroup_transcendence} (DALAG Th. 11.21) in $G = \mathbb{G}_a^2 \times \mathbb{G}_m^{2m}$ with $V = \Upsilon^{-1}(\mathbb{C}x)$, of dimension $2m + 1$ by Lemma~\ref{lem:sse_setup} (so $d - n = 1$), the algebraic spanning family $(-\omega_k e_i, e_{k,i})$ of $\ker\Upsilon$ (Lemma~\ref{lem:sse_setup}) and the lifts $\eta$. It returns $(V', \varphi, L_1, \ell)$ with $\ell < d'$ and $3m - \rho + d'_1 \leq 2m(d' - \ell)$. By Lemma~\ref{lem:sse_tangent_count}, $d' - \ell = \delta = 2 - \dim T$ for $T = \Upsilon(V' \times L_1)$, so $\delta \geq 1$. If $T \subseteq \mathbb{C}x$, Lemma~\ref{lem:sse_relRank_rational} gives $L_1 = 0$ and $\rho = 0$, so $5m \leq 2m\delta \leq 4m$. Otherwise $\dim T = 1$ and $T \cap \mathbb{C}x = 0$, and Lemma~\ref{lem:sse_relRank_generic} gives $\rho \leq 2m - \dim L_1$, so $3m \leq 2m$. Both contradict $m \geq 1$.
'''

# --- The Hilbert side of the multiplicity estimate (C1.1, 29 October 2026) ----------------------------

# --- Hilbert functions of filtrations ----------------------------------------
[[node]]
platform = "DiazModulus.boxHilb_add_finrank_inf"
section = "Towards the multiplicity estimate: Hilbert functions of filtrations"
env = "lemma"
title = 'Rank–nullity for the Hilbert function'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and every $T \in \N^B$, $h_I(T) + \dim_K (F_T \cap I) = \dim_K F_T$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra (rank–nullity). The Hilbert function $H(I; T)$ is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy), here for an abstract filtration and at finite level.'''
sketch = '''
Restrict the quotient map $q : S \to S/I$, as a $K$-linear map, to $F_T$. Its range is $q(F_T)$, of dimension $h_I(T)$, and its kernel is $F_T \cap I$; rank–nullity gives the identity.
'''

[[node]]
platform = "DiazModulus.boxHilb_mono"
env = "lemma"
title = 'The Hilbert function is monotone in the degree'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$) and that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and all $T \le T'$ in $\N^B$ (coordinatewise), $h_I(T) \le h_I(T')$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. The Hilbert function is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
$F_T \subseteq F_{T'}$, so the image of $F_T$ in $S/I$ lies in the image of $F_{T'}$, which is finite-dimensional; dimension is monotone on subspaces of a finite-dimensional space.
'''

[[node]]
platform = "DiazModulus.boxHilb_anti"
env = "lemma"
title = 'The Hilbert function is antitone in the ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for all ideals $I \subseteq J$ of $S$ and every $T \in \N^B$, $h_J(T) \le h_I(T)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Compare \cite[Exercise 8.3]{Wal00} (p. 248; Chapter 8 is by D. Roy), the corresponding inequality for the normalised leading coefficient of ideals of the same rank.'''
sketch = '''
Since $I \subseteq J$, the quotient map $S \to S/J$ factors through $S/I$, so the image of $F_T$ in $S/J$ is the image under a linear map of its image in $S/I$, which is finite-dimensional; a linear map does not raise dimension.
'''

[[node]]
platform = "DiazModulus.card_le_boxHilb_of_linearIndependent"
env = "lemma"
title = 'Families independent modulo an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $T \in \N^B$, and let $e_i$ ($i \in \iota$, $\iota$ finite) be elements of $F_T$ whose classes in $S/I$ are linearly independent over $K$. Then $|\iota| \le h_I(T)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. The Hilbert function is that of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
The classes of the $e_i$ lie in the image $W$ of $F_T$ in $S/I$ and are independent there; $W$ is finite-dimensional of dimension $h_I(T)$, and an independent family in it has at most $\dim W$ members.
'''

[[node]]
platform = "DiazModulus.exists_boxHilb_family"
root = true
env = "lemma"
title = 'A basis of the image modulo an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that every $F_T$ is finite-dimensional. Then for every ideal $I$ of $S$ and every $T \in \N^B$ there are $N = h_I(T)$ elements $e_1, \dots, e_N$ of $F_T$ whose classes in $S/I$ are linearly independent over $K$, such that every $x \in F_T$ is congruent modulo $I$ to an element of the $K$-span of $e_1, \dots, e_N$ (for $N = 0$ the family is empty and $F_T \subseteq I$). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Compare the subspace E of dimension $H(J; D_0, D)$ in the proof of \cite[Th.~8.18]{Wal00} (\S8.3.3, p. 245; Chapter 8 is by D. Roy).'''
sketch = '''
Take a basis $b_1, \dots, b_N$ of the image $W$ of $F_T$ in $S/I$ and lift each $b_i$ to some $e_i \in F_T$. The classes of the $e_i$ are the $b_i$, hence independent, and the image of the span of the $e_i$ is the span of the $b_i$, which is $W$; so each $x \in F_T$ has the class of some $y$ in that span, that is, $x - y \in I$.
'''

[[node]]
platform = "DiazModulus.boxHilb_map_algEquiv"
env = "lemma"
title = 'Automorphisms that preserve the filtration'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Let $\sigma$ be a $K$-algebra automorphism of $S$, $I$ an ideal of $S$ and $T \in \N^B$ with $\sigma(F_T) = F_T$. Then $h_{\sigma(I)}(T) = h_I(T)$, where $\sigma(I)$ is the image ideal. No finiteness hypothesis is needed (a \texttt{Module.finrank} of an infinite-dimensional space is $0$ on both sides). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Linear algebra. Used for translates as in \cite[\S5.3.2]{Wal00} (Chapter 5 is by D. Roy), at finite level.'''
sketch = '''
$\sigma$ induces a $K$-algebra isomorphism $\varphi : S/I \to S/\sigma(I)$ with $\varphi \circ q_I = q_{\sigma(I)} \circ \sigma$. Since $\sigma(F_T) = F_T$, the image of $F_T$ in $S/\sigma(I)$ is $\varphi$ of its image in $S/I$, and a linear isomorphism preserves the dimension of a subspace.
'''

[[node]]
platform = "DiazModulus.sum_boxHilb_le_boxHilb_iInf"
env = "lemma"
title = 'Separators and the Hilbert function of an intersection'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $\iota$ be a finite type, and for $i \in \iota$ let $I_i$ be an ideal of $S$ and $P_i \in S$; let $C, T \in \N^B$. Assume that $P_i \in F_C$, that $P_i \in I_j$ whenever $j \ne i$, and that $a P_i \in I_i$ implies $a \in I_i$ for every $a \in S$. Then $\sum_i h_{I_i}(T) \le h_{\bigcap_i I_i}(T + C)$ (for $\iota$ empty the intersection is $S$ and both sides are $0$). For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''\cite[Exercise 8.5(a)]{Wal00} (pp. 248–249; Chapter 8 is by D. Roy), the injective map $A\mapsto\sum_i A_iP_i$, here for an abstract filtration and with the separators as hypotheses.'''
sketch = '''
For each $i$ lift a basis of the image of $F_T$ in $S/I_i$ to elements $e_{i,k} \in F_T$, $k < h_{I_i}(T)$. The products $e_{i,k} P_i$ lie in $F_{T+C}$ and are independent modulo $\bigcap_j I_j$: if $\sum g_{i,k} e_{i,k} P_i \in \bigcap_j I_j$, then for each $j$ the terms with $i \ne j$ lie in $I_j$, so $(\sum_k g_{j,k} e_{j,k}) P_j \in I_j$, hence $\sum_k g_{j,k} e_{j,k} \in I_j$ and all $g_{j,k} = 0$. There are $\sum_i h_{I_i}(T)$ of them, and Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} concludes.
'''

[[node]]
platform = "DiazModulus.exists_card_mul_boxHilb_le_translates"
root = true
env = "proposition"
title = 'Comaximal translates of an ideal'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$), that every $F_T$ is finite-dimensional and that $F$ is exhaustive (every element of $S$ lies in some $F_T$). Let $\iota$ be a finite type with $N$ elements, $H$ an ideal of $S$ and $\sigma_i$ ($i \in \iota$) $K$-algebra automorphisms of $S$ with $\sigma_i(F_T) = F_T$ for every $i$ and every $T$, such that $\sigma_i(H) + \sigma_j(H) = S$ whenever $i \ne j$. Then there is $C \in \N^B$ such that $N\,h_H(T) \le h_{\bigcap_i \sigma_i(H)}(T + C)$ for every $T \in \N^B$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Finite-level form of one inequality of \cite[Lemma 5.10]{Wal00} (\S5.3.2, p. 160; Chapter 5 is by D. Roy), as used in \S8.4.1 (pp. 245–247; Chapter 8 is by D. Roy); the separators are the Chinese remainder theorem. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write $J_i = \sigma_i(H)$. For $i \ne j$, comaximality gives $x + y = 1$ with $x \in J_i$, $y \in J_j$, so $q_{ij} = y \in J_j$ is $\equiv 1$ modulo $J_i$; then $P_i = \prod_{j \ne i} q_{ij}$ lies in every $J_j$ with $j \ne i$ and is $\equiv 1$ modulo $J_i$, so $a P_i \in J_i$ forces $a \in J_i$. Each $P_i$ lies in some $F_{T_i}$ (exhaustion), hence in $F_C$ with $C = \sum_i T_i$. Lemma~\ref{lem:sum_boxHilb_le_boxHilb_iInf} gives $\sum_i h_{J_i}(T) \le h_{\bigcap J_i}(T + C)$, and $h_{J_i}(T) = h_H(T)$ by Lemma~\ref{lem:boxHilb_map_algEquiv}. The shift $C$ depends only on the separators.
'''

# --- the chain bound under unmixedness ----------------------------------------
[[node]]
platform = "DiazModulus.boxHilb_sup_span_add_le"
section = "Towards the multiplicity estimate: the chain bound under unmixedness"
env = "lemma"
title = 'Cutting by a regular element'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $D, T \in \N^B$, and $P \in F_D$ a nonzerodivisor on $S/I$ (multiplication by $P$ on $S/I$ is injective). Then $h_{I+(P)}(T+D) + h_I(T) \le h_I(T+D)$, where $I + (P)$ is the ideal generated by $I$ and $P$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''DALAG, the proof of Lemma 8.5 (\S8.2.3, pp. 236–237; Chapter 8 is by D. Roy), the inequality before the passage to the limit; compare the proof of Lemma 5.4 (\S5.2.4, p. 154; Chapter 5 is by D. Roy).'''
sketch = '''
Work in $S/I$. Let $W$ be the image of $F_{T+D}$ (dimension $h_I(T+D)$) and $W_T$ that of $F_T$ (dimension $h_I(T)$). The image of $F_{T+D}$ in $S/(I+(P))$ is the image of $W$ under the factor map $g$. Multiplication by $P$ is injective on $S/I$, so $P\,W_T$ has dimension $h_I(T)$; it lies in $W$ because $F_T F_D \subseteq F_{T+D}$, and $g$ kills it. Rank–nullity for $g$ on $W$ gives $\dim g(W) + \dim P\,W_T \le \dim W$.
'''

[[node]]
platform = "DiazModulus.nat_telescope_step"
env = "lemma"
title = 'One telescoping step'
statement = '''
Let $f, g : \N \to \N$ with $g$ monotone and $g(v+1) + f(v) \le f(v+1)$ for every $v \in \N$. Then $u\,g(u) \le f(2u)$ for every $u \in \N$.
'''
source = '''Elementary. It replaces the limit argument at the end of the proof of \cite[Lemma 5.4]{Wal00} (\S5.2.4, pp. 154–155; Chapter 5 is by D. Roy), which the proof of Lemma 8.5 repeats. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
By induction on $k$, $f(u) + k\,g(u) \le f(u+k)$: each step adds $g(u+k+1) \ge g(u)$. Take $k = u$.
'''

[[node]]
platform = "DiazModulus.nat_telescope_iter"
env = "lemma"
title = 'Iterated telescoping'
statement = '''
Let $f_0, f_1, f_2, \dots$ be functions $\N \to \N$ and $j \in \N$. Assume that for every $k < j$ the function $f_{k+1}$ is monotone and $f_{k+1}(v+1) + f_k(v) \le f_k(v+1)$ for every $v \in \N$. Then $2^{j(j-1)/2} u^j f_j(u) \le f_0(2^j u)$ for every $u \in \N$ (the exponent $j(j-1)/2$ is an integer, and $0$ for $j = 0$).
'''
source = '''Elementary. A finite-level replacement for the limits in the proofs of \cite[Lemma 5.4]{Wal00} (\S5.2.4; Chapter 5 is by D. Roy) and Th. 8.4 (\S8.2.3, pp. 236–238; Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Induction on $j$, for all $u$ at once; for $j = 0$ both sides are $f_0(u)$. For $j + 1$, Lemma~\ref{lem:nat_telescope_step} with $f = f_j$, $g = f_{j+1}$ gives $u\,f_{j+1}(u) \le f_j(2u)$, and the induction hypothesis at $2u$ gives $2^{j(j-1)/2} (2u)^j f_j(2u) \le f_0(2^{j+1} u)$. Multiply the step by $2^{j(j-1)/2} 2^j u^j$ and use $j(j-1)/2 + j = (j+1)j/2$.
'''

[[node]]
platform = "DiazModulus.exists_mem_forall_notMem_of_not_subset"
env = "lemma"
title = 'Prime avoidance for subspaces'
statement = '''
Let $K$ be an infinite field, $S$ a commutative $K$-algebra, $V$ a $K$-subspace of $S$ and $\mathcal{P}$ a finite set of ideals of $S$ (not necessarily prime) such that $V \not\subseteq p$ for every $p \in \mathcal{P}$. Then some $x \in V$ lies in no $p \in \mathcal{P}$.
'''
source = '''Classical (avoidance over an infinite field). Compare the choice of $P_{k+1}$ in the proof of \cite[Th.~8.4]{Wal00} (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy).'''
sketch = '''
For each $p \in \mathcal{P}$, $V \cap p$ is a $K$-subspace of $V$, proper since $V \not\subseteq p$. A vector space over an infinite field is not a finite union of proper subspaces, so some $x \in V$ lies in no $V \cap p$.
'''

[[node]]
platform = "DiazModulus.exists_mem_isSMulRegular_of_associatedPrimes"
env = "lemma"
title = 'A regular element in a subspace'
statement = '''
Let $K$ be an infinite field, $S$ a commutative Noetherian $K$-algebra, $M$ a finitely generated $S$-module and $V$ a $K$-subspace of $S$ contained in no associated prime of $M$. Then $V$ contains an element $x$ that is regular on $M$ (multiplication by $x$ on $M$ is injective).
'''
source = '''Classical commutative algebra (associated primes and zero divisors). Used as in the proof of \cite[Th.~8.4]{Wal00} (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy).'''
sketch = '''
$M$ has finitely many associated primes, so Lemma~\ref{lem:exists_mem_forall_notMem_of_not_subset} gives $x \in V$ outside all of them. Over a Noetherian ring the union of the associated primes of $M$ is the set of non-regular elements on $M$, so $x$ is $M$-regular.
'''

[[node]]
platform = "DiazModulus.isSMulRegular_quotient_of_isWeaklyRegular_append"
env = "lemma"
title = 'Regular sequences, read in turn'
statement = '''
Let $S$ be a commutative ring, $ps_0$ a finite list of elements of $S$ and $P_0, \dots, P_{r-1} \in S$, and assume that the list $ps_0$ followed by $P_0, \dots, P_{r-1}$ is weakly regular on $S$. Then for every $k < r$, $P_k$ is a nonzerodivisor on $S/((ps_0) + (P_j : j < k))$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length.
'''
source = '''Classical commutative algebra (regular sequences); a reformulation of the definition.'''
sketch = '''
This is the definition of weak regularity read at the position $|ps_0| + k$: the entry there is $P_k$, and the ideal generated by the earlier entries is $(ps_0) + (P_j : j < k)$. Mathlib states regularity on the quotient module $S/(I \cdot S)$, and $I \cdot S = I$ for an ideal.
'''

[[node]]
platform = "DiazModulus.exists_isWeaklyRegular_append_of_height"
env = "lemma"
title = 'Extending a regular sequence under unmixedness'
statement = '''
Let $K$ be an infinite field and $S$ a commutative Noetherian $K$-algebra with \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $V$ a $K$-subspace of $S$ and $r \in \N$, and assume that every prime ideal $p$ of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$ (a vacuous hypothesis when $(ps_0) + (V) = S$). Then there is a list $rs$ of $r$ elements of $V$ such that $ps_0$ followed by $rs$ is weakly regular on $S$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''DALAG, the proof of Th. 8.4 (\S8.2.3, pp. 237–238; Chapter 8 is by D. Roy), with Macaulay's unmixedness theorem (\S8.2.1, p. 235) taken as the hypothesis UnmixedHeight.'''
sketch = '''
Induction on the length $m \le r$ of $rs$. Let $L = ps_0$ followed by $rs$ be weakly regular, with $m < r$. Every associated prime $p$ of $S/(L)$ contains $(L) \supseteq (ps_0)$, and \texttt{hU} bounds its height by $|ps_0| + m$; if $V \subseteq p$, the height hypothesis would give $|ps_0| + r \le |ps_0| + m$, so $V \not\subseteq p$. Lemma~\ref{lem:exists_mem_isSMulRegular_of_associatedPrimes}, applied to the finite module $S/(L)$, gives $x \in V$ regular on $S/(L)$, and $L$ followed by $x$ is weakly regular. If $S/(L) = 0$ there is no associated prime and the step is the same.
'''

[[node]]
platform = "DiazModulus.boxHilb_chain_bound"
env = "proposition"
title = 'The regular chain bound'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), that $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and that every $F_T$ is finite-dimensional. Let $I$ be an ideal of $S$, $D \in \N^B$, $r \in \N$ and $P_0, \dots, P_{r-1} \in F_D$ such that each $P_k$ is a nonzerodivisor on $S/(I + (P_j : j < k))$. Then for every $u \in \N$, $2^{r(r-1)/2} u^r h_{I + (P_0, \dots, P_{r-1})}(uD) \le h_I(2^r u D)$, where $uD$ is the coordinatewise multiple. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$).
'''
source = '''Finite-level form of \cite[Th.~8.4]{Wal00} and its proof through Lemma 8.5 (\S8.2.3, pp. 236–238; Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Put $I_k = I + (P_j : j < k)$ and $f_k(v) = h_{I_k}(vD)$. Each $f_{k+1}$ is monotone (Lemma~\ref{lem:boxHilb_mono}), and for $k < r$, Lemma~\ref{lem:boxHilb_sup_span_add_le} with $T = vD$ gives $f_{k+1}(v+1) + f_k(v) \le f_k(v+1)$, since $(v+1)D = vD + D$. The iterated telescope Lemma~\ref{lem:nat_telescope_iter} with $j = r$ gives $2^{r(r-1)/2} u^r f_r(u) \le f_0(2^r u)$, which is the claim.
'''

[[node]]
platform = "DiazModulus.boxHilb_le_of_height"
env = "proposition"
title = 'The chain bound from heights, under unmixedness'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $K$ is infinite, $S$ is Noetherian, $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and every $F_T$ is finite-dimensional, and let \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $D \in \N^B$, $V$ a $K$-subspace of $S$ with $V \subseteq F_D$, and $r \in \N$, and assume that every prime ideal of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$. Then for every $u \in \N$, $2^{r(r-1)/2} u^r h_{(ps_0)+(V)}(uD) \le h_{(ps_0)}(2^r u D)$. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$). A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of \cite[Th.~8.8]{Wal00} (\S8.3.1, p. 239) and Th. 8.4 (\S8.2.3, p. 236), the step that gives (8.21) in \S8.4.1 (p. 246); Chapter 8 is by D. Roy. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:exists_isWeaklyRegular_append_of_height} gives $r$ elements $P_0, \dots, P_{r-1}$ of $V$ such that $ps_0$ followed by them is weakly regular, and Lemma~\ref{lem:isSMulRegular_quotient_of_isWeaklyRegular_append} turns this into the chain condition: $P_k$ is regular on $S/((ps_0) + (P_j : j < k))$. Each $P_k \in V \subseteq F_D$, so Proposition~\ref{prop:boxHilb_chain_bound} gives $2^{r(r-1)/2} u^r h_{(ps_0)+(P)}(uD) \le h_{(ps_0)}(2^r uD)$. Finally $(ps_0) + (P) \subseteq (ps_0) + (V)$, and the Hilbert function is antitone in the ideal (Lemma~\ref{lem:boxHilb_anti}).
'''

# --- the torus model and the Hilbert side ----------------------------------------
[[node]]
platform = "DiazModulus.restrictSupport_block_filtration"
section = "Towards the multiplicity estimate: the torus model and the Hilbert side"
env = "lemma"
title = 'Block boxes form a filtration'
statement = '''
Let $K$ be a field, $\sigma$ a finite type, $\iota$ a type and $\beta : \sigma \to \iota$ a map grouping the variables of $K[X_s : s \in \sigma]$ into blocks. For $T \in \N^\iota$ let $B_T$ be \texttt{blockBox K $\beta$ T}, the span of the monomials $X^m$ whose degree in each block, $\sum_{\beta(s) = b} m_s$, is at most $T_b$. Then (i) $fg \in B_{T+T'}$ whenever $f \in B_T$ and $g \in B_{T'}$; (ii) every $B_T$ is finite-dimensional over $K$; (iii) every polynomial lies in some $B_T$.
'''
source = '''Classical. The multidegree filtration of \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy), for an arbitrary partition of the variables.'''
sketch = '''
(i) The exponents of $fg$ are sums of exponents of $f$ and of $g$, and block degrees add. (ii) Every exponent $m$ of $B_T$ has $m_s \le T_{\beta(s)}$, so the admissible exponents form a finite set, and the monomials are a basis. (iii) Take $T_b$ to be the sum over the exponents of $f$ of their degrees in block $b$.
'''

[[node]]
platform = "DiazModulus.torus_reduce_mem_restrictSupport"
env = "lemma"
title = 'Reduction modulo the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Then for every $T \in \N^{A_0 \sqcup A_1}$ and every $f$ in the box $T$ there is a $K$-linear combination $g$ of reduced monomials, also in the box $T$, with $f - g \in J_0$.
'''
source = '''Classical (normal forms modulo $YZ-1$). The ring $K[X, Y, Z]$ and its ideal are those of \cite[\S8.3.1]{Wal00} (Chapter 8 is by D. Roy), for K[G].'''
sketch = '''
The reduced form of $X^a Y^b Z^c$ replaces each pair $(b_i, c_i)$ by $(\max(b_i - c_i, 0), \max(c_i - b_i, 0))$; it is reduced, it is coordinatewise below the original exponent, so it stays in the box, and it does not change when $b_i$ and $c_i$ both go up by one. By strong induction on the degree every monomial is congruent to its reduced form modulo $J_0$, since $X^{m'} Y_i Z_i - X^{m'} = X^{m'} (Y_i Z_i - 1)$. Take for $g$ the image of $f$ under $X^m \mapsto X^{\mathrm{red}(m)}$.
'''

[[node]]
platform = "DiazModulus.torus_reduced_inf_eq_bot"
env = "lemma"
title = 'Reduced monomials are independent modulo the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Then the $K$-span of the reduced monomials meets $J_0$ only in $0$. No hypothesis on $K$ is needed.
'''
source = '''Classical (normal forms modulo $YZ-1$). The ring $K[X, Y, Z]$ and its ideal are those of \cite[\S8.3.1]{Wal00} (Chapter 8 is by D. Roy), for K[G].'''
sketch = '''
Let $\rho$ be the $K$-linear map $X^m \mapsto X^{\mathrm{red}(m)}$, with the reduced form of the previous node. Since $\mathrm{red}$ does not change when $b_i$ and $c_i$ both go up by one, $\rho(q\,Y_i Z_i) = \rho(q)$ for every $q$, so $\rho$ vanishes on $J_0$; and $\rho$ is the identity on combinations of reduced monomials. So a reduced combination in $J_0$ equals its image under $\rho$, which is $0$.
'''

[[node]]
platform = "DiazModulus.boxHilb_torusIdeal"
env = "proposition"
title = 'The Hilbert function of the torus ideal'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_0$ and $A_1$ are finite. Then for every $T \in \N^{A_0 \sqcup A_1}$, $h_{J_0}(T) = \prod_{h \in A_0} (T_h + 1) \cdot \prod_{i \in A_1} (2T_i + 1)$, where $h_{J_0}(T)$ is \texttt{boxHilb (torusBox K A$_0$ A$_1$) (torusIdeal K A$_0$ A$_1$) T}, the dimension of the image of the box $T$ in $K[X, Y, Z]/J_0$.
'''
source = '''Compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy), the case G* = G, there with the total degree in the additive variables; the passage to $K[X, Y, Z]$ is that of \S8.3.1 (Chapter 8 is by D. Roy). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Let $\mathcal{B}$ be the box (finite-dimensional by Lemma~\ref{lem:restrictSupport_block_filtration}) and $R$ the span of the reduced monomials. By Lemma~\ref{lem:torus_reduce_mem_restrictSupport}, $\mathcal{B} = (\mathcal{B} \cap R) + (\mathcal{B} \cap J_0)$, and by Lemma~\ref{lem:torus_reduced_inf_eq_bot} the two pieces meet in $0$; with Lemma~\ref{lem:boxHilb_add_finrank_inf}, $h_{J_0}(T) = \dim (\mathcal{B} \cap R)$, the number of reduced exponents in the box. These are $X^a Y^b Z^c$ with $a_h \le T_h$, $b_i + c_i \le T_i$ and $\min(b_i, c_i) = 0$, and $(b_i, c_i) \mapsto T_i + b_i - c_i$ is a bijection onto $\{0, \dots, 2T_i\}$.
'''

[[node]]
platform = "DiazModulus.isWeaklyRegular_torusList"
env = "lemma"
title = 'The torus generators form a regular sequence'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_1$ is finite. Then the list \texttt{torusList K A$_0$ A$_1$} of the generators $Y_i Z_i - 1$ of $J_0$, one for each $i \in A_1$, is a weakly regular sequence in $K[X, Y, Z]$. A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length.
'''
source = '''Classical commutative algebra. Compare \cite[Lemma 8.7]{Wal00} (\S8.3.1; Chapter 8 is by D. Roy), which shows that the ideals of algebraic subgroups in $K[X, Y, Z]$ are complete intersections.'''
sketch = '''
It suffices that $f_j = Y_j Z_j - 1$ is a nonzerodivisor modulo $I = (f_i : i \in s)$ for every $j$ and every set $s$ of indices not containing $j$. Separating the variables $Y_j, Z_j$ from the others writes $K[X, Y, Z]$ as $S[Y_j, Z_j]$, with $I = I_0 \cdot S[Y_j, Z_j]$ for an ideal $I_0$ of $S$, so the quotient is $(S/I_0)[Y_j, Z_j]$. There $Y_j Z_j - 1$ has constant coefficient $-1$, a unit, so it is a unit of the power series ring and hence a nonzerodivisor of the polynomial ring.
'''

[[node]]
platform = "DiazModulus.exists_translation_algEquiv"
root = true
env = "lemma"
title = 'Translations act by automorphisms'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Let $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$. Then there is a $K$-algebra automorphism $e$ of $K[X, Y, Z]$ with $e(X_h) = X_h + x_h$, $e(Y_i) = y_i Y_i$ and $e(Z_i) = y_i^{-1} Z_i$, which maps every per-coordinate box onto itself and maps $J_0$ onto itself ($e(J_0) = J_0$).
'''
source = '''Classical. Translations of \cite[\S5.3.2]{Wal00} (Chapter 5 is by D. Roy), written on $K[X, Y, Z]$ as in \S8.3.1 (Chapter 8 is by D. Roy).'''
sketch = '''
Define $e$ on the variables and its inverse by $X_h \mapsto X_h - x_h$, $Y_i \mapsto y_i^{-1} Y_i$, $Z_i \mapsto y_i Z_i$. Each sends a monomial $X^m$ into the span of the monomials with exponent $\le m$; every box is a lower set of exponents, so it is mapped into itself by both, hence onto itself. Finally $e(Y_i Z_i - 1) = y_i y_i^{-1} Y_i Z_i - 1 = Y_i Z_i - 1$.
'''

[[node]]
platform = "DiazModulus.torus_coeff_poly"
root = true
env = "lemma"
title = 'The polynomial of a coefficient vector'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $A_0$ and $A_1$ are finite, let $D_0, D_1 \in \N$, and let $c$ be a family of elements of $K$ indexed by the pairs $(\tau, s)$ with $\tau \in \{0, \dots, D_0\}^{A_0}$ and $s \in \{0, \dots, 2D_1\}^{A_1}$. Let $P_c$ be \texttt{torusCoeffPoly D$_0$ D$_1$ c}, that is $P_c = \sum_{\tau, s} c_{\tau,s}\, X^\tau \prod_i Y_i^{(s_i - D_1)_+} Z_i^{(D_1 - s_i)_+}$, with $(\cdot)_+$ the positive part. Then (i) $P_c$ lies in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} ($X_h$-degree at most $D_0$, $\deg_{Y_i} + \deg_{Z_i}$ at most $D_1$); (ii) if $c \ne 0$ then $P_c \notin J_0$; (iii) for every $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$, the value of $P_c$ at the point \texttt{torusPoint x y} $= (x, y, y^{-1})$ is $\sum_{\tau, s} c_{\tau,s} \prod_h x_h^{\tau_h} \prod_i y_i^{s_i - D_1}$, with the integer exponents $s_i - D_1 \in \{-D_1, \dots, D_1\}$.
'''
source = '''The polynomials $P=\sum c\,X^\tau Y^t$ of \cite[Th.~8.1]{Wal00} (\S8.1, p. 232; Chapter 8 is by D. Roy), for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$, written in $K[X, Y, Z]$ as in \S8.3.1. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
(i) Each monomial of $P_c$ has $X_h$-degree $\tau_h \le D_0$ and $(Y_i, Z_i)$-degree $(s_i - D_1)_+ + (D_1 - s_i)_+ = |s_i - D_1| \le D_1$. (ii) The monomials of $P_c$ are reduced, since one of the two positive parts vanishes, and distinct $(\tau, s)$ give distinct monomials, since $s_i = D_1 + (s_i - D_1)_+ - (D_1 - s_i)_+$; so if $P_c \in J_0$, Lemma~\ref{lem:torus_reduced_inf_eq_bot} gives $P_c = 0$ and every $c_{\tau,s}$, a coefficient of $P_c$, is $0$. (iii) Evaluation is a ring map, and $y_i^{(s_i - D_1)_+} (y_i^{-1})^{(D_1 - s_i)_+} = y_i^{s_i - D_1}$.
'''

[[node]]
platform = "DiazModulus.le_of_forall_mul_pow_le"
env = "lemma"
title = 'Extracting a leading coefficient'
statement = '''
Let $a, b, c, n \in \N$. If $a u^n \le b (u + c)^n$ for every integer $u \ge 1$, then $a \le b$.
'''
source = '''Elementary. A replacement for the limits defining the normalised leading coefficient in \cite[\S8.2.2]{Wal00} (p. 235; Chapter 8 is by D. Roy).'''
sketch = '''
Dividing by $u^n$ gives $a \le b (1 + c/u)^n$ for every $u \ge 1$; as $u \to \infty$ the right side tends to $b$, and a bound that holds eventually passes to the limit.
'''

[[node]]
platform = "DiazModulus.box_ray_upper_bound"
env = "lemma"
title = 'Box counts along a ray: an upper bound'
statement = '''
Let $A_0, A_1$ be finite types with $d_0$ and $d_1$ elements, $D_0, D_1 \ge 1$ and $v \in \N$. Then $(vD_0 + 1)^{d_0} (2vD_1 + 1)^{d_1} \le (v+1)^{d_0+d_1} D_0^{d_0} (2D_1)^{d_1}$ (the left side is written in Lean as a product of constant factors over $A_0$ and over $A_1$).
'''
source = '''Elementary. The number of monomials of the box $(vD_0; vD_1)$, compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy).'''
sketch = '''
Since $D_0, D_1 \ge 1$, $vD_0 + 1 \le (v+1) D_0$ and $2vD_1 + 1 \le (v+1)(2D_1)$; take powers and regroup the factors $v + 1$.
'''

[[node]]
platform = "DiazModulus.box_ray_lower_bound"
root = true
env = "lemma"
title = 'Box counts along a ray: a lower bound'
statement = '''
Let $H$ and $J$ be finite sets (of elements of arbitrary types) and $D_0, D_1, u \in \N$. Then $u^{|H|+|J|} D_0^{|H|} D_1^{|J|} \le (uD_0 + 1)^{|H|} (2uD_1 + 1)^{|J|}$ (the right side is written in Lean as a product of constant factors over $H$ and over $J$). No hypothesis is needed.
'''
source = '''Elementary. A partial count of the box $(uD_0; uD_1)$, compare \cite[Prop.~5.7]{Wal00} (\S5.3.1, p. 159; Chapter 5 is by D. Roy).'''
sketch = '''
The left side is $(uD_0)^{|H|} (uD_1)^{|J|}$, and $uD_0 \le uD_0 + 1$, $uD_1 \le 2uD_1 + 1$; take powers and multiply.
'''

[[node]]
platform = "DiazModulus.boxHilb_hilbert_side"
env = "proposition"
title = 'The Hilbert side, abstract form'
statement = '''
Let $K$ be a field, $S$ a commutative $K$-algebra, $B$ a type, and $F$ a family of $K$-subspaces $F_T$ of $S$ indexed by $T \in \N^B$ (a filtration, on which only the hypotheses listed are assumed). Assume that $K$ is infinite, $S$ is Noetherian, $B$ is finite, $F$ is monotone ($T \le T'$ coordinatewise implies $F_T \subseteq F_{T'}$), $F$ is multiplicative ($a \in F_T$ and $b \in F_U$ imply $ab \in F_{T+U}$) and every $F_T$ is finite-dimensional, and let \texttt{hU : UnmixedHeight S}. Let $ps_0$ be a weakly regular list on $S$, $D \in \N^B$ with $D_b \ge 1$ for every $b$, $V$ a $K$-subspace of $S$ with $V \subseteq F_D$, and $r, n \in \N$; assume that every prime ideal of $S$ containing $(ps_0) + (V)$ has height at least $|ps_0| + r$. Let $\kappa \in \N$ with $h_{(ps_0)}(vD) \le \kappa (v+1)^n$ for every $v \in \N$, and let $\lambda \in \N$ and $C \in \N^B$ with $\lambda u^{n-r} \le h_{(ps_0)+(V)}(uD + C)$ for every integer $u \ge 1$, where $n - r$ is truncated at $0$. Then $\lambda\, 2^{r(r-1)/2} \le \kappa\, 2^{rn}$. No condition $r \le n$ is assumed. For an ideal $I$ of $S$, $h_I(T)$ is \texttt{boxHilb F I T}, the dimension over $K$ of the image of $F_T$ in $S/I$ (DALAG's $H(I; T)$). A list is weakly regular on $S$ when each entry is a nonzerodivisor on the quotient of $S$ by the ideal generated by the earlier entries (Mathlib's \texttt{IsWeaklyRegular}; the final quotient may be zero). For a list $ps_0$, $(ps_0)$ is the ideal generated by its entries and $|ps_0|$ its length. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight S} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of the comparison of Hilbert functions in \cite[\S8.4.1]{Wal00} (pp. 245–247; Chapter 8 is by D. Roy), the proof of Th. 8.1 for $G^-=\{e\}$, through (8.21). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Let $I = (ps_0)$, $I' = (ps_0) + (V)$ and $j = \max_b C_b$. Since $D \ge 1$, $uD + C \le wD$ with $w = u + j$, so by Lemma~\ref{lem:boxHilb_mono} $\lambda u^{n-r} \le h_{I'}(wD)$. Proposition~\ref{prop:boxHilb_le_of_height} at $w$ and the upper bound give $2^{r(r-1)/2} w^r h_{I'}(wD) \le h_I(2^r w D) \le \kappa (2^r w + 1)^n$. For $u \ge 1$, $u^n \le u^{n-r} w^r$ for every $r$ (if $r > n$ then $u^{n-r} = 1$ and $u^n \le u^r$), and $2^r w + 1 \le 2^r (w + 1)$, so $\lambda\, 2^{r(r-1)/2} u^n \le \kappa\, 2^{rn} (u + j + 1)^n$ for all $u \ge 1$, and Lemma~\ref{lem:le_of_forall_mul_pow_le} concludes.
'''

[[node]]
platform = "DiazModulus.torus_hilbert_side"
root = true
env = "theorem"
title = 'The Hilbert side of the multiplicity estimate'
statement = '''
Let $K$ be a field and $A_0, A_1$ types, and let $K[X, Y, Z]$ be the polynomial ring over $K$ in the variables $X_h$ ($h \in A_0$) and $Y_i, Z_i$ ($i \in A_1$). The per-coordinate box \texttt{torusBox K A$_0$ A$_1$ T}, for $T \in \N^{A_0 \sqcup A_1}$, is the span of the monomials $X^a Y^b Z^c$ with $a_h \le T_h$ for every $h$ and $b_i + c_i \le T_i$ for every $i$; $J_0 = (Y_i Z_i - 1)_{i \in A_1}$ is the torus ideal \texttt{torusIdeal K A$_0$ A$_1$}, the kernel of $K[X, Y, Z] \to K[\mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}]$; a monomial $X^a Y^b Z^c$ is reduced when $\min(b_i, c_i) = 0$ for every $i$ (\texttt{torusReduced}). Assume that $K$ is infinite and that $A_0, A_1$ are finite, with $d_0$ and $d_1$ elements, and put $d = d_0 + d_1$; let \texttt{hU : UnmixedHeight K[X, Y, Z]}. Let $D_0, D_1 \ge 1$, let $V$ be a $K$-subspace of the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} ($X_h$-degree at most $D_0$, $\deg_{Y_i} + \deg_{Z_i}$ at most $D_1$), and $r \in \N$; assume that every prime ideal of $K[X, Y, Z]$ containing $J_0 + (V)$ has height at least $d_1 + r$. Let $\lambda \in \N$ and $C \in \N^{A_0 \sqcup A_1}$ with $\lambda u^{d-r} \le h_{J_0 + (V)}(uD + C)$ for every integer $u \ge 1$, where $D$ is the multidegree equal to $D_0$ on $A_0$ and $D_1$ on $A_1$, $h$ is the Hilbert function of the per-coordinate boxes and $d - r$ is truncated at $0$. Then $\lambda\, 2^{r(r-1)/2} \le 2^{rd} D_0^{d_0} (2D_1)^{d_1}$. No condition $r \le d$ is assumed. Heights of prime ideals are taken in $\N \cup \{\infty\}$, and $(V)$ is the ideal generated by $V$. The hypothesis \texttt{hU : UnmixedHeight K[X, Y, Z]} is assumed here: it says that for every weakly regular sequence $r_1, \dots, r_k$ of the ring, every associated prime of the quotient by $(r_1, \dots, r_k)$ has height at most $k$. For polynomial rings over a field it follows from Macaulay's unmixedness theorem (DALAG \S8.2.1); Theorem~\ref{thm:unmixedHeight_mvPolynomial} proves it for polynomial rings over an algebraically closed field.
'''
source = '''Finite-level form of the comparison of Hilbert functions in \cite[\S8.4.1]{Wal00} (pp. 245–247; Chapter 8 is by D. Roy), for $G=\mathbb{G}_a^{A_0}\times\mathbb{G}_m^{A_1}$ through $K[X, Y, Z]$ (\S8.3.1). Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Apply Proposition~\ref{prop:boxHilb_hilbert_side} to $S = K[X, Y, Z]$ with the boxes as filtration (monotone by \texttt{Diaz.blockBox\_mono}, multiplicative and finite-dimensional by Lemma~\ref{lem:restrictSupport_block_filtration}), the base list of the generators $Y_i Z_i - 1$ (weakly regular by Lemma~\ref{lem:isWeaklyRegular_torusList}, of length $d_1$, generating $J_0$), the ray $D \ge 1$ and $n = d$. The upper count $h_{J_0}(vD) = (vD_0 + 1)^{d_0} (2vD_1 + 1)^{d_1}$ is Proposition~\ref{prop:boxHilb_torusIdeal}, and Lemma~\ref{lem:box_ray_upper_bound} bounds it by $\kappa (v+1)^d$ with $\kappa = D_0^{d_0} (2D_1)^{d_1}$.
'''

[[node]]
platform = "DiazModulus.le_hME_constant"
root = true
env = "lemma"
title = 'The constant of the multiplicity estimate'
statement = '''
Let $\lambda, r, d_0, d_1, D_0, D_1 \in \N$ and $d = d_0 + d_1$. If $\lambda\, 2^{r(r-1)/2} \le 2^{rd} D_0^{d_0} (2D_1)^{d_1}$, then $\lambda \le 2^{d(d+1)/2}\, d!\, 2^{d_1} d_0^{d_0} \cdot D_0^{d_0} D_1^{d_1}$, with $0^0 = 1$ (the exponents $r(r-1)/2$ and $d(d+1)/2$ are integers). For $d_0 = |A_0|$ and $d_1 = |A_1|$ the factor $2^{d(d+1)/2}\, d!\, 2^{d_1} d_0^{d_0}$ is the constant $K_d$ of the hypothesis \texttt{hME} (the proposition \texttt{Diaz.MultiplicityEstimateElem} of the library), the elementary multiplicity estimate.
'''
source = '''Elementary. The constant is that of the elementary multiplicity estimate, the case $G^-=\{e\}$ of \cite[Th.~8.1]{Wal00} (\S8.1, p. 232; Chapter 8 is by D. Roy), in coordinates. Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
For every $r$, $rd \le d(d+1)/2 + r(r-1)/2$, since $d(d+1) + r(r-1) - 2rd = (d - r)(d - r + 1) \ge 0$. So $2^{rd} \le 2^{d(d+1)/2} 2^{r(r-1)/2}$, and cancelling $2^{r(r-1)/2}$ gives $\lambda \le 2^{d(d+1)/2} 2^{d_1} D_0^{d_0} D_1^{d_1}$; the factors $d!$ and $d_0^{d_0}$ are at least $1$.
'''

# --- Macaulay's unmixedness for polynomial rings (C1.2, 29 October 2026) --------------------------------

# --- Macaulay's unmixedness for polynomial rings ----------------------------------------
[[node]]
platform = "DiazModulus.length_le_ringKrullDim_quotient_of_mem_associatedPrimes"
section = "Towards the multiplicity estimate: Macaulay's unmixedness for polynomial rings"
env = "lemma"
title = 'Regular sequences and the dimension of an associated prime'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, $M$ a finitely generated $A$-module and $rs = (r_1, \dots, r_n)$ a weakly $M$-regular sequence of elements of $\mathfrak{m}$. Then $n \le \dim A/\mathfrak{p}$ for every associated prime $\mathfrak{p}$ of $M$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $M$-regular when each $r_i$ is a nonzerodivisor on $M/(r_1, \dots, r_{i-1})M$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $M$-regular (\texttt{IsRegular}) when moreover $M/(r_1, \dots, r_n)M \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights of prime ideals in $\N \cup \{\infty\}$.
'''
source = '''\cite[Th.~17.2]{Mat86}, in the form of regular sequences; compare \cite[Th.~2.1.2(a)]{BH93}, the equality for Cohen--Macaulay modules. Classical.'''
sketch = '''
Induction on $n$; for $n = 0$, $A/\mathfrak{p}$ is a nonzero ring, of dimension at least $0$. Let $x = r_1$ and write $\mathfrak{p} = \operatorname{ann}(m)$ with $m \ne 0$. By Krull's intersection theorem there is a largest $j$ with $m \in x^j M$; writing $m = x^j m'$ gives $m' \notin xM$, and $\operatorname{ann}(m') = \mathfrak{p}$ because $x$ is $M$-regular. The class of $m'$ in $M/xM$ is nonzero, so it lies under an associated prime $\mathfrak{q}$ of $M/xM$, with $\mathfrak{p} + (x) \subseteq \mathfrak{q}$, while $x \notin \mathfrak{p}$. Since $x$ is a nonzerodivisor of the domain $A/\mathfrak{p}$ and $A/\mathfrak{q}$ is a quotient of $(A/\mathfrak{p})/(x)$, $\dim A/\mathfrak{q} + 1 \le \dim A/\mathfrak{p}$; the induction hypothesis for $M/xM$, $r_2, \dots, r_n$ and $\mathfrak{q}$ gives $n - 1 \le \dim A/\mathfrak{q}$.
'''

[[node]]
platform = "DiazModulus.exists_isRegular_quotient_ofList"
env = "lemma"
title = 'Regular sequences after cutting by a weakly regular one'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, and $M$ a nonzero finitely generated $A$-module (in the universe of $A$, as Mathlib's $\mathrm{Ext}$ requires). Let $ps$ be a weakly $M$-regular sequence of elements of $\mathfrak{m}$ and $zs$ an $M$-regular sequence of elements of $\mathfrak{m}$. Then there is an $M/(ps)M$-regular sequence $ts$ of elements of $\mathfrak{m}$ with $|zs| \le |ts| + |ps|$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $M$-regular when each $r_i$ is a nonzerodivisor on $M/(r_1, \dots, r_{i-1})M$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $M$-regular (\texttt{IsRegular}) when moreover $M/(r_1, \dots, r_n)M \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length.
'''
source = '''Rees' characterisation of regular sequences through Ext, and the long exact Ext sequence of multiplication by a regular element; see \cite[\S1.2]{BH93}. Classical.'''
sketch = '''
Induction on $ps$, one element $p \in \mathfrak{m}$ at a time, replacing $M$ by $M/pM$, which is finitely generated and, by Nakayama's lemma, nonzero. The step: if $M$ has a regular sequence of length $n + 1$ in $\mathfrak{m}$ and $p \in \mathfrak{m}$ is $M$-regular, then $M/pM$ has one of length $n$. By Rees' theorem (Mathlib's \texttt{ModuleCat.exists\_isRegular\_tfae}), the hypothesis gives $\mathrm{Ext}^i_A(A/\mathfrak{m}, M) = 0$ for $i \le n$; the long exact $\mathrm{Ext}$ sequence of $0 \to M \stackrel{p}{\to} M \to M/pM \to 0$ gives $\mathrm{Ext}^i_A(A/\mathfrak{m}, M/pM) = 0$ for $i < n$, and Rees' theorem turns this back into a regular sequence of length $n$ in $\mathfrak{m}$ on $M/pM$. Finally $M/(p, ps')M \cong (M/pM)/(ps')(M/pM)$, and regularity is carried by linear isomorphisms.
'''

[[node]]
platform = "DiazModulus.height_le_length_of_mem_associatedPrimes"
env = "proposition"
title = 'Unmixedness for a local ring with a long regular sequence'
statement = '''
Let $A$ be a commutative Noetherian local ring with maximal ideal $\mathfrak{m}$, and assume that $A$ has an $A$-regular sequence $zs$ of elements of $\mathfrak{m}$ with $\dim A \le |zs|$ (so $A$ is Cohen–Macaulay). Let $ps$ be a weakly $A$-regular sequence of elements of $\mathfrak{m}$. Then every associated prime $\mathfrak{p}$ of the $A$-module $A/(ps)$ has height at most $|ps|$. A list $r_1, \dots, r_n$ of elements of $A$ is weakly $A$-regular when each $r_i$ is a nonzerodivisor on $A/(r_1, \dots, r_{i-1})A$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero), and $A$-regular (\texttt{IsRegular}) when moreover $A/(r_1, \dots, r_n)A \ne 0$. For a list $ps$, $(ps)$ is the ideal generated by its entries and $|ps|$ its length. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights of prime ideals in $\N \cup \{\infty\}$.
'''
source = '''The local form of Macaulay's unmixedness theorem: \cite[Th.~2.1.6 and Th.~2.1.2]{BH93}; \cite[\S17]{Mat86}. Classical.'''
sketch = '''
$A/(ps)$ is nonzero, since it has an associated prime. Lemma~\ref{lem:exists_isRegular_quotient_ofList}, with $M = A$, gives an $A/(ps)$-regular sequence $ts$ in $\mathfrak{m}$ with $|zs| \le |ts| + |ps|$, and Lemma~\ref{lem:length_le_ringKrullDim_quotient_of_mem_associatedPrimes} gives $|ts| \le \dim A/\mathfrak{p}$. In any commutative ring, $\operatorname{ht} \mathfrak{p} + \dim A/\mathfrak{p} \le \dim A$: in the prime spectrum the height of $\mathfrak{p}$ is its order height, $\dim A/\mathfrak{p}$ its coheight, and the Krull dimension is the supremum of height plus coheight. Since $\dim A \le |zs|$, all these numbers are finite, and $\operatorname{ht} \mathfrak{p} \le |zs| - \dim A/\mathfrak{p} \le |zs| - |ts| \le |ps|$.
'''

[[node]]
platform = "DiazModulus.exists_isWeaklyRegular_vanishing"
env = "lemma"
title = 'The variables minus a point form a regular sequence'
statement = '''
Let $R$ be a commutative ring, $\sigma$ a finite type and $a \in R^\sigma$. Then there is a list of $|\sigma|$ polynomials in $R[X_\sigma]$ (\texttt{MvPolynomial $\sigma$ R}), each vanishing at $a$, which is a weakly regular sequence on $R[X_\sigma]$: the $X_i - a_i$, $i \in \sigma$, in some order. A list $r_1, \dots, r_n$ of elements of a commutative ring $S$ is weakly regular on $S$ when each $r_i$ is a nonzerodivisor on $S/(r_1, \dots, r_{i-1})$ (Mathlib's \texttt{IsWeaklyRegular}; the last quotient may be zero).
'''
source = '''Classical: the variables minus the coordinates of a point form a regular sequence in a polynomial ring.'''
sketch = '''
For one variable: $X - b$ is monic, hence a nonzerodivisor of $R[X]$, and $R[X]/(X - b) \cong R$ as $R$-modules, so $X - b$ followed by the constants of a weakly $R$-regular sequence is weakly regular on $R[X]$. Induction on $n$ through $R[X_0, \dots, X_n] \cong R[X_1, \dots, X_n][X_0]$ shows that $X_0 - a_0, \dots, X_{n-1} - a_{n-1}$ is weakly regular on $R[X_0, \dots, X_{n-1}]$. Renaming the variables along a bijection between $\sigma$ and $\{0, \dots, |\sigma| - 1\}$ gives the statement, since ring isomorphisms carry weakly regular sequences.
'''

[[node]]
platform = "DiazModulus.unmixedHeight_mvPolynomial"
root = true
env = "theorem"
title = "Macaulay's unmixedness for polynomial rings"
statement = '''
Let $K$ be an algebraically closed field and $\sigma$ a finite type. Then \texttt{UnmixedHeight (MvPolynomial $\sigma$ K)} holds: for every weakly regular sequence $r_1, \dots, r_k$ of the polynomial ring $K[X_\sigma]$, every associated prime of $K[X_\sigma]/(r_1, \dots, r_k)$ has height at most $k$. This is the inequality half of Macaulay's unmixedness theorem for $K[X_\sigma]$; the reverse inequality is not part of the statement. A sequence is weakly regular when each entry is a nonzerodivisor modulo the ideal generated by the earlier ones (Mathlib's \texttt{IsWeaklyRegular}), and heights are taken in $\N \cup \{\infty\}$. The proposition \texttt{UnmixedHeight} is that of the library file \texttt{Diaz/HilbertBox.lean} (on Prove2Me, the published definition \texttt{DiazHilbertBox}). It is the hypothesis \texttt{hU} of Lemma~\ref{lem:exists_isWeaklyRegular_append_of_height}, Proposition~\ref{prop:boxHilb_le_of_height}, Proposition~\ref{prop:boxHilb_hilbert_side} and Theorem~\ref{thm:torus_hilbert_side}. For Theorem~\ref{thm:torus_hilbert_side} the ring is the polynomial ring $K[X, Y, Z]$, so for $K$ algebraically closed, for instance $K = \C$, this theorem supplies that hypothesis.
'''
source = '''Macaulay's unmixedness theorem \cite{Mac16} for polynomial rings over a field, which are Cohen--Macaulay; in this form \cite[Th.~2.1.6]{BH93} and \cite[\S17]{Mat86}. The sections above carry it as the hypothesis \texttt{UnmixedHeight}, in place of Macaulay's theorem as quoted in \cite[\S8.2.1]{Wal00} (p. 235; Chapter 8 is by D. Roy). Classical; only the inequality half, and only over an algebraically closed field.'''
sketch = '''
Let $S = K[X_\sigma]$ and let $\mathfrak{p}$ be an associated prime of $S/(rs)$; it contains $rs$. Choose a maximal ideal $\mathfrak{m} \supseteq \mathfrak{p}$ and let $A = S_{\mathfrak{m}}$, a Noetherian local ring. By the Nullstellensatz $\mathfrak{m}$ is the ideal of a point $a$, so Lemma~\ref{lem:exists_isWeaklyRegular_vanishing} gives a weakly regular sequence of $|\sigma|$ elements of $\mathfrak{m}$; localised, it is a regular sequence in the maximal ideal of $A$, and $\dim A = \operatorname{ht} \mathfrak{m} \le \dim S = |\sigma|$. The sequence $rs$ localises in the same way to a regular sequence in the maximal ideal of $A$, and $\mathfrak{p}A$ is an associated prime of $A/(rs)A$ with the height of $\mathfrak{p}$. Proposition~\ref{prop:height_le_length_of_mem_associatedPrimes} then gives $\operatorname{ht} \mathfrak{p} = \operatorname{ht} \mathfrak{p}A \le |rs|$.
'''

# --- The multiplicity estimate (C1.3, 30 October 2026) --------------------------------------------------

# --- zero sets and heights on the torus ----------------------------------------
[[node]]
platform = "DiazModulus.isPrime_iInf_ker_eval_of_analytic"
section = "The multiplicity estimate: zero sets and heights on the torus"
env = "lemma"
title = 'Zero sets of analytic images are prime'
statement = '''
Let $E$ be a normed space over $\C$, $\sigma$ a type and $F : E \to \C^\sigma$ a map each of whose coordinates $e \mapsto F(e)_i$ is analytic on all of $E$. Then the polynomials of $\C[X_\sigma]$ vanishing at every point $F(e)$, $e \in E$ (the ideal $\bigcap_{e} \ker \mathrm{eval}_{F(e)}$), form a prime ideal.
'''
source = '''Classical complex analysis: the identity theorem for analytic functions on a connected normed space.'''
sketch = '''
The ideal does not contain $1$. If $fg$ vanishes on the image while $f(F(e_0)) \ne 0$, then $g \circ F$ vanishes near $e_0$, and the identity theorem on the connected space $E$ makes it vanish everywhere.
'''

[[node]]
platform = "DiazModulus.le_height_torusVanishing"
env = "lemma"
title = 'The torus points have codimension at least the rank'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). The ideal of the polynomials vanishing at every point $(x, y, y^{-1})$ (\texttt{torusPoint x y}), $x \in \C^{A_0}$, $y \in (\C^\times)^{A_1}$, has height at least $|A_1|$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical dimension theory: the torus $\mathbb{G}_m^{A_1}$ has codimension $|A_1|$ in $\mathbb{A}^{2|A_1|}$.'''
sketch = '''
A chain of $|A_1| + 1$ primes below that ideal: the $k$-th member is the ideal of the image of the analytic map setting $(Y_i, Z_i) = (e^{u_i}, e^{-u_i})$ for the indices numbered below $k$ and leaving the others free; each is prime by Lemma~\ref{lem:isPrime_iInf_ker_eval_of_analytic}, and $Y_iZ_i - 1$ separates consecutive members.
'''

[[node]]
platform = "DiazModulus.torusVanishing_univ"
env = "proposition"
title = 'The ideal of the torus'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. Then $I(G) = J_0$, $J_0$ is prime, and $\operatorname{ht} J_0 \ge |A_1|$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical: the ideal of the torus $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$ in its coordinate ring.'''
sketch = '''
If $f$ vanishes on $G$, shifting exponents gives a polynomial $q$ with $q \prod_i Y_i$ vanishing everywhere, so $q = 0$, and $f \equiv \prod_i Z_i^N q = 0$ modulo $J_0$. $I(G)$ is the ideal of the image of $(x, u) \mapsto (x, e^u, e^{-u})$, prime by Lemma~\ref{lem:isPrime_iInf_ker_eval_of_analytic}; the height is Lemma~\ref{lem:le_height_torusVanishing}.
'''

[[node]]
platform = "DiazModulus.torusVanishing_torusZero"
env = "lemma"
title = 'The Nullstellensatz on the torus'
statement = '''
Let $K$ be an algebraically closed field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For every ideal $\mathfrak{b} \supseteq J_0$ of $R$, $I(Z_G(\mathfrak{b})) = \sqrt{\mathfrak{b}}$, and $Z_G(\mathfrak{b}) = \emptyset$ implies $\mathfrak{b} = R$.
'''
source = '''Classical: Hilbert's Nullstellensatz, on the torus $K^{A_0} \times (K^\times)^{A_1}$.'''
sketch = '''
A zero of $\mathfrak{b} \supseteq J_0$ in $K^{A_0} \times K^{A_1} \times K^{A_1}$ has $Y_i Z_i = 1$, so it is the point of some $g \in G$; Hilbert's Nullstellensatz for the affine zero locus gives the radical.
'''

[[node]]
platform = "DiazModulus.torusTransl_algEquiv"
env = "lemma"
title = 'Translations of the torus'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the $K$-algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. Then for $g \in G$ there is a $K$-algebra automorphism $e$ of $R$ with $e(f) = \sigma_g f$ for every $f$, which maps every box \texttt{torusBox K A$_0$ A$_1$ T} onto itself and $J_0$ onto $J_0$, with $e(I(S)) = I(\{z : zg \in S\})$ for every $S \subseteq G$ and $Z_G(e(\mathfrak{b})) = \{z : zg \in Z_G(\mathfrak{b})\}$ for every ideal $\mathfrak{b}$. Moreover $\sigma_g \circ \sigma_h = \sigma_{gh}$ and $\sigma_1$ is the identity.
'''
source = '''Classical: translations of $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$; compare \cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.3.'''
sketch = '''
Lemma~\ref{lem:exists_translation_algEquiv} gives an automorphism with the same values on the variables, preserving boxes and $J_0$; it equals $\sigma_g$. The rest follows from $(\sigma_g f)(z) = f(zg)$ and is checked on the variables.
'''

[[node]]
platform = "DiazModulus.ringKrullDim_quotient_sectionIdeal_le"
env = "lemma"
title = 'The dimension of a section ideal'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). \texttt{sectionIdeal $\ell$ $\psi$} is the ideal $J_0 + (\sum_{h'} \ell_{k,h'} X_{h'})_k + (Y^{\psi_k^+} Z^{\psi_k^-} - 1)_k$ of $R$. Let $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in K^{A_0}$ and $\psi_i \in \Z^{A_1}$ (all $h \in A_0$, $i \in A_1$), with the forms normalised off $H$ ($\ell_{h,h} = 1$, $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$) and the rows triangular off $J$ ($\psi_{i,i} \ne 0$, $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$). Then $\dim R/\mathfrak{a} \le |H| + |J|$ for $\mathfrak{a}$ = \texttt{sectionIdeal $\ell$ $\psi$}. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical commutative algebra: dimension does not grow along an integral extension.'''
sketch = '''
$R/\mathfrak{a}$ is integral over $K[t_H, s_J]$, $t_h \mapsto X_h$, $s_j \mapsto Y_j + Z_j$: $X_h$ by $\ell_h$ for $h \notin H$; $Y_j, Z_j$ are roots of $T^2 - (Y_j + Z_j)T + 1$; and for $i \notin J$, a power $Y_i^{\pm\psi_{i,i}}$ is a Laurent monomial in the $Y_j$, $j \in J$. Integral extensions do not raise the dimension.
'''

[[node]]
platform = "DiazModulus.card_le_height_add_of_ringKrullDim_quotient_le"
env = "proposition"
title = 'Height plus dimension in a polynomial ring'
statement = '''
Let $K$ be an algebraically closed field, $\sigma$ a finite type and $\mathfrak{p}$ a prime ideal of $K[X_\sigma]$ (\texttt{MvPolynomial $\sigma$ K}) with $\dim K[X_\sigma]/\mathfrak{p} \le e$ for some $e \in \N$. Then $|\sigma| \le \operatorname{ht}\mathfrak{p} + e$. Krull dimensions take values in $\{-\infty\} \cup \N \cup \{\infty\}$ and heights in $\N \cup \{\infty\}$.
'''
source = '''Classical dimension theory of polynomial rings over a field: $\operatorname{ht}\mathfrak{p} + \dim K[X_\sigma]/\mathfrak{p} = |\sigma|$; compare \cite[\S17]{Mat86}.'''
sketch = '''
Localise at a maximal ideal $\mathfrak{m} = (X - a) \supseteq \mathfrak{p}$, where Lemma~\ref{lem:exists_isWeaklyRegular_vanishing} gives a regular sequence of length $|\sigma|$. A maximal weakly regular list $ps$ inside $\mathfrak{p}$ has length at most $\operatorname{ht}\mathfrak{p}$ and $\mathfrak{p}$ lies in an associated prime $\mathfrak{q}$ of the quotient by $ps$; then Lemma~\ref{lem:exists_isRegular_quotient_ofList} and Lemma~\ref{lem:length_le_ringKrullDim_quotient_of_mem_associatedPrimes} give $|\sigma| \le |ps| + \dim A/\mathfrak{q} \le \operatorname{ht}\mathfrak{p} + e$.
'''

# --- characters and subgroups of the torus ----------------------------------------
[[node]]
platform = "DiazModulus.eval_eq_zero_of_sum_mul_char"
section = "The multiplicity estimate: characters and subgroups of the torus"
env = "lemma"
title = "Dedekind's lemma with polynomial coefficients"
statement = '''
Let $\Gamma$ be a commutative group, $A_0$ a type, $\iota$ a finite type, $\rho$ a homomorphism from $\Gamma$ to the additive group $\C^{A_0}$ (\texttt{$\Gamma$ $\to$* Multiplicative (A$_0$ $\to$ $\C$)}), $\chi_c : \Gamma \to \C^\times$ ($c \in \iota$) pairwise distinct characters, and $F_c \in \C[X_{A_0}]$. If $\sum_c F_c(\rho(g))\,\chi_c(g) = 0$ for every $g \in \Gamma$, then $F_c(\rho(g)) = 0$ for every $c$ and every $g$.
'''
source = '''Classical: Dedekind's (Artin's) lemma on the linear independence of characters, here with coefficients that are polynomials along an additive homomorphism.'''
sketch = '''
By finite differences: $g \mapsto F(\rho(g))$ has finite difference degree, while a non-zero multiple of a non-trivial character has none. Induction on the set of characters and, inside it, on the degree of one coefficient, applied to the translated relation.
'''

[[node]]
platform = "DiazModulus.eval_eq_zero_on_span_of_addSubgroup"
env = "lemma"
title = 'Vanishing on an additive subgroup and its span'
statement = '''
Let $A_0$ be a type, $\Lambda$ an additive subgroup of $\C^{A_0}$ and $F \in \C[X_{A_0}]$ a polynomial vanishing at every point of $\Lambda$. Then $F$ vanishes at every point of the complex span of $\Lambda$.
'''
source = '''Classical: a polynomial vanishing on infinitely many points of a line vanishes on the line.'''
sketch = '''
For $z = \sum_{i < n} c_i x_i$ with $x_i \in \Lambda$, induction on $n$ for every base point $y \in \Lambda$: the one-variable polynomial $t \mapsto F(y + r + t x_0)$ vanishes at every integer, hence identically.
'''

[[node]]
platform = "DiazModulus.exists_coordinate_section_add"
env = "lemma"
title = 'Coordinate sections of a subspace'
statement = '''
Let $K$ be a field, $A_0$ a finite type and $V$ a subspace of $K^{A_0}$. Then there are $H \subseteq A_0$ and vectors $\ell_h \in K^{A_0}$ ($h \in A_0$) with $\ell_h = 0$ for $h \in H$, normalised off $H$ ($\ell_{h,h} = 1$ and $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$), such that $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \text{ for every } h\}$, every $x \in K^{A_0}$ agrees on $H$ with some element of $V$, and $\dim V = |H|$.
'''
source = '''Classical linear algebra: a subspace as a graph over a coordinate subspace (reduced row echelon form).'''
sketch = '''
Take $H$ of largest size with $V \to K^H$ onto; maximality makes it injective. With $e_{h'}$ the lift of the indicator of $h'$, put $\ell_h = X_h - \sum_{h' \in H} (e_{h'})_h X_{h'}$ for $h \notin H$.
'''

[[node]]
platform = "DiazModulus.exists_coordinate_section_mul"
env = "lemma"
title = 'Coordinate sections of a lattice'
statement = '''
Let $A_1$ be a finite type and $\Phi$ a subgroup of $\Z^{A_1}$. Then there are $J \subseteq A_1$ and $\psi_i \in \Phi$ ($i \in A_1$) such that the only element of $\Phi$ vanishing off $J$ is $0$, $\psi_i = 0$ for $i \in J$, $\psi_{i,i} \ne 0$ and $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$, and every complex subspace $L \subseteq \C^{A_1}$ with $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \text{ for every } i\}$ has $\dim L = |J|$.
'''
source = '''Classical: a maximal coordinate set avoiding a lattice, and the triangular system it gives.'''
sketch = '''
Take $J$ of largest size with $\Phi \cap \Z^J = 0$. For $i \notin J$ maximality gives a non-zero $\psi_i \in \Phi$ supported on $J \cup \{i\}$, with $\psi_{i,i} \ne 0$. The system is triangular off $J$, so restriction to $J$ is a linear bijection from $L$ onto $\C^J$.
'''

[[node]]
platform = "DiazModulus.linearIndependent_on_subgroup"
env = "proposition"
title = 'Independence on a subgroup with coordinate sections'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). Let $\Gamma$ be a subgroup of $G$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Let $f \in R$ be reduced (no monomial of $f$ is divisible by any $Y_iZ_i$; \texttt{torusReduced}), with every monomial in the variables $X_h$ ($h \in H$), $Y_j$, $Z_j$ ($j \in J$) only. If $f$ vanishes at every $g \in \Gamma$, then $f = 0$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1; the classical independence of characters (Dedekind), applied to the stabiliser.'''
sketch = '''
On $\Gamma$, $f = \sum_\lambda F_\lambda(x_g)\,y_g^\lambda$ with distinct characters $y^\lambda$ ($\lambda \in \Z^J$). Lemma~\ref{lem:eval_eq_zero_of_sum_mul_char} gives $F_\lambda(x_g) = 0$ on $\Gamma$, Lemma~\ref{lem:eval_eq_zero_on_span_of_addSubgroup} on the span of the $x_g$, and the section $H$ gives $F_\lambda = 0$.
'''

[[node]]
platform = "DiazModulus.torusStab_subgroup"
env = "lemma"
title = 'The stabiliser of a zero set'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. Let $\mathfrak{p} \supseteq J_0$ be a prime of $R$. Then there is a subgroup $\Gamma$ of $G$ with underlying set \texttt{torusStab $\mathfrak{p}$} such that for every $g$ the coset $\Gamma g^{-1} = \{z : zg \in \Gamma\}$ satisfies $Z_G(I(\Gamma g^{-1})) = \Gamma g^{-1}$, and $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the stabiliser of the zero set of $\mathfrak{p}$).'''
sketch = '''
Inverses: for $g \in \Gamma$, $\sigma_g\mathfrak{p}$ is a prime with $Z(\sigma_g\mathfrak{p}) = Z(\mathfrak{p}) g^{-1} \supseteq Z(\mathfrak{p})$, so $\sigma_g\mathfrak{p} \subseteq \mathfrak{p}$ by Lemma~\ref{lem:torusVanishing_torusZero}, with equality since the heights agree (Lemma~\ref{lem:torusTransl_algEquiv}). A coset is the common zero set of translates of $\mathfrak{p}$; distinct cosets have no common zero, so their ideals are comaximal by the torus Nullstellensatz.
'''

# --- invariant derivations ----------------------------------------
[[node]]
platform = "DiazModulus.torusDeriv_mem_torusBox"
section = "The multiplicity estimate: invariant derivations"
env = "lemma"
title = 'Invariant derivations preserve the boxes'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. Let $w \in K^{A_0} \times K^{A_1}$. Then $D_w$ maps every box \texttt{torusBox K A$_0$ A$_1$ T} (the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$) into itself, and maps $J_0$ into itself.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.11 (the invariant derivations of $\mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$).'''
sketch = '''
$D_w$ sends a monomial to a combination of the monomial itself (from $Y_i$, $Z_i$, which are eigenvectors) and of monomials with one $X_h$ fewer, so boxes are stable. $D_w(Y_iZ_i - 1) = 0$, and the Leibniz rule keeps the ideal generated by these elements stable.
'''

[[node]]
platform = "DiazModulus.torusDeriv_torusTransl"
env = "lemma"
title = 'Invariant derivations commute with translations'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the $K$-algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. Then $D_w(\sigma_g f) = \sigma_g(D_w f)$ for every $w$, every $g \in G$ and every $f \in R$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.11 and (8.10): $D(P) \circ \tau_g = D(P \circ \tau_g)$.'''
sketch = '''
Induction on $f$: both sides are additive and kill constants, and the Leibniz rule reduces the claim to the variables, where $D_w(X_h + x_h) = \xi_h$, $D_w(y_iY_i) = y_i\eta_iY_i$ and $D_w(y_i^{-1}Z_i) = -y_i^{-1}\eta_iZ_i$.
'''

[[node]]
platform = "DiazModulus.eval_torusDerivList_torusCoeffPoly"
env = "lemma"
title = 'Derivatives at a torus point'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. Let $D_0, D_1 \in \N$, let $c$ be a family of coefficients in $K$ indexed by the pairs $\lambda = (\tau, t)$ with $\tau \in \{0, \dots, D_0\}^{A_0}$ and $t \in \{0, \dots, 2D_1\}^{A_1}$, and $P_c$ = \texttt{torusCoeffPoly D$_0$ D$_1$ c} $= \sum_\lambda c_\lambda X^\tau \prod_i Y_i^{(t_i - D_1)_+} Z_i^{(D_1 - t_i)_+}$. For $w = (\xi, \eta)$ and $\lambda$ let $\mathrm{Op}^\lambda_w = \sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (t_i - D_1)$, a linear operator on $K[X_{A_0}]$. Then for $w_1, \dots, w_r$, $x \in K^{A_0}$ and $y \in (K^\times)^{A_1}$, the value of $D_{w_1} \cdots D_{w_r} P_c$ at $(x, y, y^{-1})$ is $\sum_\lambda c_\lambda\, (\mathrm{Op}^\lambda_{w_1} \cdots \mathrm{Op}^\lambda_{w_r} X^\tau)(x)\, \prod_i y_i^{t_i - D_1}$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.1 and Lemma 8.11: the derivatives $D_{w_1} \cdots D_{w_r} P$ of the premise of Th. 8.1.'''
sketch = '''
$D_w$ acts on $X$-polynomials as $\sum_h \xi_h \partial/\partial X_h$, and each Laurent monomial of the box, $\prod_i Y_i^{(t_i - D_1)_+} Z_i^{(D_1 - t_i)_+}$, is an eigenvector of $D_w$ with eigenvalue $\sum_i \eta_i (t_i - D_1)$; Leibniz and induction on the list, then evaluation.
'''

[[node]]
platform = "DiazModulus.eval_torusDerivList_eq_zero"
env = "lemma"
title = 'The premise of the multiplicity estimate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). Let $B_0$ be a type, $w_b \in \C^{A_0} \times \C^{A_1}$ ($b \in B_0$) with span $W$, $D_0, D_1, M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, coefficients $c$ and $P_c$ as in \texttt{torusCoeffPoly}, and assume the premise of the Definition \texttt{MultiplicityEstimateElem} for the complex numbers $a_{ji}$: for every $r \le dM_0$, every $k_1, \dots, k_r \in B_0$ and every $s \in \Z^{B_1}$ with $|s_j| \le dM_1$, $\sum_\lambda c_\lambda (\mathrm{Op}^\lambda_{w_{k_1}} \cdots \mathrm{Op}^\lambda_{w_{k_r}} X^\tau)(\sum_j s_j u_j) \prod_i (\prod_j a_{ji}^{s_j})^{t_i - D_1} = 0$, with $\mathrm{Op}^\lambda_w$ as in Lemma~\ref{lem:eval_torusDerivList_torusCoeffPoly}. Then $D_l P_c$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $dM_0$ and every $s$ with $|s_j| \le dM_1$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Th. 8.1 (\S8.1): the vanishing hypothesis, for $G = \mathbb{G}_a^{d_0} \times \mathbb{G}_m^{d_1}$.'''
sketch = '''
By Lemma~\ref{lem:eval_torusDerivList_torusCoeffPoly} the premise says that evaluation at $g_s$ kills $D_{w_{k_1}} \cdots D_{w_{k_n}} P_c$ for $n \le dM_0$, hence the span $V_n$ of these. Since $w \mapsto D_w$ is linear, $D_w V_n \subseteq V_{n+1}$ for $w \in W$, so $D_l P_c \in V_{|l|}$.
'''

[[node]]
platform = "DiazModulus.vanishOrd_ideal"
env = "lemma"
title = 'Vanishing to an order is an ideal'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). Then \texttt{vanishOrd J W t} is the underlying set of an ideal $I$ of $R$, and $J_0 \subseteq J$ implies $J_0 \subseteq I$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (vanishing to a given order along $W$ on a finite set).'''
sketch = '''
Each $D_l$ is linear. Stability under multiplication goes by induction on the length bound, writing a list as $L$ followed by $b$ and using Leibniz for $D_b$. If $J_0 \subseteq J$, then $J_0$ is stable under every $D_w$ (Lemma~\ref{lem:torusDeriv_mem_torusBox}), hence under every $D_l$.
'''

# --- tangent duals and multiplicities ----------------------------------------
[[node]]
platform = "DiazModulus.exists_tangent_dual"
section = "The multiplicity estimate: tangent duals and multiplicities"
env = "lemma"
title = 'Dual derivations on a standard set'
statement = '''
Let $K$ be a field. Let $A_0, A_1$ be finite types and $R = K[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) K} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $K^{A_0}$, $y \in (K^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in K^{A_0} \times K^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $\ell_h \in K^{A_0}$ ($h \in A_0$), $\psi_i \in \Z^{A_1}$ ($i \in A_1$), $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \text{ for every } h\}$, $L = \{v \in K^{A_1} : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \text{ for every } i\}$, $W$ a subspace of $K^{A_0} \times K^{A_1}$ and $S \subseteq V \times T_\psi$. Then there are $n \in \N$, $w_1, \dots, w_n \in W$ and $P_1, \dots, P_n \in I(S)$ with $n + \dim(W \cap (V \times L)) = \dim W$ and $D_{w_i} P_j - \delta_{ij} \in I(S)$ for all $i, j$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.14.'''
sketch = '''
Let $\beta(\xi, \eta) = ((\sum_{h'} \ell_{h,h'}\xi_{h'})_h, (\sum_{i'} \psi_{i,i'}\eta_{i'})_i)$, whose kernel is $V \times L$. On the span of the forms $\sum_{h'} \ell_{h,h'} X_{h'}$ and the $Y^{\psi_k^+}Z^{\psi_k^-} - 1$, which vanish on $S$, $D_w$ acts modulo $I(S)$ by the constants of $\beta(w)$. Dual bases of $\beta(W)$ give the $w_i$ and $P_j$, and rank--nullity gives $n$.
'''

[[node]]
platform = "DiazModulus.exists_tangent_dual_cosets"
env = "lemma"
title = 'Dual derivations on a union of cosets'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. Let $\Gamma$ be a subgroup of $G$. The cosets of $\Gamma$ are comaximal: $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$, where $\Gamma g^{-1} = \{z : zg \in \Gamma\}$. $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. Let $M_1 \in \N$, $w_1, \dots, w_n \in \C^{A_0} \times \C^{A_1}$ and $P_1, \dots, P_n \in I(\Gamma)$ with $D_{w_i} P_j - \delta_{ij} \in I(\Gamma)$. Then there are $Q_1, \dots, Q_n$ and $C_Q \in \N^{A_0 \sqcup A_1}$ with every $Q_j$ in the box $C_Q$, $Q_j \in I(\Sigma \cdot \Gamma)$ and $D_{w_i} Q_j - \delta_{ij} \in I(\Sigma \cdot \Gamma)$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.15.'''
sketch = '''
$\Sigma \cdot \Gamma$ lies in finitely many cosets of $\Gamma$, whose ideals are pairwise comaximal; the Chinese remainder theorem gives $B_c \equiv 1$ on the coset $c$ and $B_c = 0$ on the others. Put $Q_j = \sum_c B_c^2\,\sigma_{r_c} P_j$; Leibniz and Lemma~\ref{lem:torusDeriv_torusTransl} give the congruences, and Lemma~\ref{lem:restrictSupport_block_filtration} a box.
'''

[[node]]
platform = "DiazModulus.derivation_pow_mul_mem"
env = "lemma"
title = 'Derivatives of a product along dual derivations'
statement = '''
Let $R$, $S$ be commutative rings with $S$ an $R$-algebra, $D_1, \dots, D_n$ $R$-derivations of $S$, $J$ an ideal of $S$ and $Q_1, \dots, Q_n \in J$ with $D_i Q_j - \delta_{ij} \in J$. Let $P \in S$, $\alpha \in \N^n$ and $k = (k_1, \dots, k_m)$ a list of indices with $m \le \alpha_1 + \cdots + \alpha_n$. Then $D_{k_1} \circ \cdots \circ D_{k_m} (P \prod_j Q_j^{\alpha_j}) - c \in J$, where $c = (\prod_i \alpha_i!)\,P$ if every index $i$ occurs exactly $\alpha_i$ times in $k$, and $c = 0$ otherwise.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), Lemma 8.16.'''
sketch = '''
Induction on the list, peeling off the innermost derivation, computing in $S/J$: Leibniz writes $D_k(P Q^\alpha)$ as $D_kP\,Q^\alpha + \sum_j \alpha_j D_kQ_j\,P Q^{\alpha - e_j}$, and $D_kQ_j \equiv \delta_{kj}$. No commutation of the derivations is needed.
'''

[[node]]
platform = "DiazModulus.card_multiIndex"
env = "lemma"
title = 'Counting multi-indices'
statement = '''
For $n, S \in \N$, the number of $\alpha : \{1, \dots, n\} \to \{0, \dots, S\}$ with $\alpha_1 + \cdots + \alpha_n \le S$ is $\binom{S + n}{n}$.
'''
source = '''Classical combinatorics: stars and bars.'''
sketch = '''
Adding the slack $S - \sum_i \alpha_i$ as an extra entry is a bijection onto the tuples in $\N^{n+1}$ of sum $S$, counted by stars and bars.
'''

[[node]]
platform = "DiazModulus.wustholz_le_boxHilb"
env = "proposition"
title = 'An inequality of W\"ustholz at finite level'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). Let $J$, $A$ be ideals of $R$, $W$ a subspace of $\C^{A_0} \times \C^{A_1}$ and $S_0 \in \N$ with $A \subseteq$ \texttt{vanishOrd J W S$_0$}; let $w_1, \dots, w_n \in W$ and $Q_1, \dots, Q_n \in J$ in a box $C_Q$ with $D_{w_i} Q_j - \delta_{ij} \in J$. Then $\binom{S_0 + n}{n}\, h_J(T) \le h_A(T + S_0 C_Q)$ for every $T$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), (8.20) (W\"ustholz's argument) with Lemmas 8.15 and 8.16.'''
sketch = '''
With $e_1, \dots, e_h$ in the box $T$ independent modulo $J$, $h = h_J(T)$ (Lemma~\ref{lem:exists_boxHilb_family}), the products $e_i Q^\alpha$, $|\alpha| \le S_0$ (Lemma~\ref{lem:card_multiIndex} counts them), lie in the box $T + S_0 C_Q$ and are independent modulo $A$: applying $D^\beta$ to a relation and Lemma~\ref{lem:derivation_pow_mul_mem} isolate the coefficients of length $|\beta|$, by induction on $|\beta|$. Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} concludes.
'''

# --- the obstruction, and Roy's theorem with no hypothesis ----------------------------------------
[[node]]
platform = "DiazModulus.exists_chain_prime"
section = "The multiplicity estimate: the obstruction, and Roy's theorem with no hypothesis"
env = "lemma"
title = 'The descent to a prime'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. Let $P \in R$, $W \subseteq \C^{A_0} \times \C^{A_1}$ a subspace, $M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, and assume that $D_l P$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $d M_0$ and every $s$ with $|s_j| \le d M_1$. Assume moreover $P \notin J_0$. Then there are $r < d$ and a prime $\mathfrak{p} \supseteq J_0$ with $P \in \mathfrak{p}$ such that (b) $\sigma_{g_s}(D_l P) \in \mathfrak{p}$ for $|s_j| \le (r+1) M_1$ and every list $l$ of elements of $W$ of length at most $(r+1) M_0$; (c) for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the chain of ideals and the choice of $\mathfrak{p}$).'''
sketch = '''
The heights of $I_0 \subseteq \cdots \subseteq I_d$ satisfy $\operatorname{ht} I_0 \ge |A_1| + 1$ ($P \notin J_0$, $J_0$ prime of height $\ge |A_1|$, Proposition~\ref{prop:torusVanishing_univ}) and $\operatorname{ht} I_d \le |A_0| + 2|A_1|$ ($I_d$ vanishes at the point of $1$). So the height stops growing at some $r < d$; a prime $\mathfrak{p} \supseteq I_{r+1}$ of that height gives (b), and (c) follows since $\sigma_z$ preserves heights (Lemma~\ref{lem:torusTransl_algEquiv}).
'''

[[node]]
platform = "DiazModulus.obstructionSpan_vanishOrd"
env = "lemma"
title = 'The obstruction ideal'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. Let $D_0, D_1 \in \N$, $P$ in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} (degree at most $D_0$ in each $X_h$ and at most $D_1$ in each pair $Y_i, Z_i$), $r, M_0, M_1 \in \N$, and $\mathfrak{p}$ an ideal such that $\sigma_{g_s}(D_l P) \in \mathfrak{p}$ for $|s_j| \le (r+1) M_1$ and every list $l$ of elements of $W$ of length at most $(r+1) M_0$. Let $S \subseteq G$ with $v\gamma \in Z_G(\mathfrak{p})$ for $v \in Z_G(\mathfrak{p})$, $\gamma \in S$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Then $F_{\mathfrak{p}}$ lies in that box and $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ S)) W M$_0$}.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the ideal generated by the translates of the derivatives of $P$).'''
sketch = '''
A generator $\sigma_{g_s v}(D_l P)$ stays in the box (Lemma~\ref{lem:torusDeriv_mem_torusBox}, Lemma~\ref{lem:torusTransl_algEquiv}). For a $W$-list $l'$ of length $\le M_0$, $D_{l'}\sigma_{g_s v} D_l P = \sigma_{g_s v} D_{l' + l} P$ (Lemma~\ref{lem:torusDeriv_torusTransl}), whose value at $g_{s'}\gamma$ is that of $\sigma_{g_{s+s'}} D_{l'+l} P \in \mathfrak{p}$ at $v\gamma \in Z_G(\mathfrak{p})$, i.e. $0$; Lemma~\ref{lem:vanishOrd_ideal} passes to the ideal.
'''

[[node]]
platform = "DiazModulus.exists_le_translate_of_le_torusVanishing"
env = "lemma"
title = 'Primes over the obstruction ideal contain a translate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. Let $r \in \N$ and $\mathfrak{p} \supseteq J_0$ a prime such that for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Let $\mathfrak{a} \subseteq I(\text{torusStab}\,\mathfrak{p})$ be an ideal and $\mathfrak{q} \supseteq A$ a prime. Then $\mathfrak{a} \subseteq \sigma_g^{-1}(\mathfrak{q})$ for some $g \in G$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the zero set of $A$ meets finitely many cosets of the stabiliser).'''
sketch = '''
For $z \in Z_G(A)$, $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ (Lemma~\ref{lem:torusVanishing_torusZero}, Lemma~\ref{lem:torusTransl_algEquiv}), one of the finitely many minimal primes of $I_r$; points giving the same prime differ by the stabiliser. So finitely many translates of $\mathfrak{a}$ have their intersection in $\sqrt{A} \subseteq \mathfrak{q}$, and prime avoidance picks one.
'''

[[node]]
platform = "DiazModulus.le_height_obstruction"
env = "lemma"
title = 'The height of the obstruction ideal'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. \texttt{torusStab $\mathfrak{p}$} is the stabiliser $\{g \in G : Z_G(\mathfrak{p})\,g \subseteq Z_G(\mathfrak{p})\}$. \texttt{sectionIdeal $\ell$ $\psi$} is the ideal $J_0 + (\sum_{h'} \ell_{k,h'} X_{h'})_k + (Y^{\psi_k^+} Z^{\psi_k^-} - 1)_k$ of $R$. Let $r \in \N$, $d = |A_0| + |A_1|$, $\mathfrak{p} \supseteq J_0$ a prime such that for every $z \in G$, if $I_r \subseteq \sigma_z^{-1}(\mathfrak{p})$ then $\sigma_z^{-1}(\mathfrak{p})$ (\texttt{$\mathfrak{p}$.comap (torusTransl z)}) is a minimal prime of $I_r$. For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. Let $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$. The forms are normalised off $H$: $\ell_{h,h} = 1$ and $\ell_{h,h'} = 0$ for $h, h' \notin H$, $h' \ne h$; the rows are triangular off $J$: $\psi_{i,i} \ne 0$ and $\psi_{i,i'} = 0$ for $i, i' \notin J$, $i' \ne i$. If \texttt{sectionIdeal $\ell$ $\psi$} $\subseteq I(\text{torusStab}\,\mathfrak{p})$, then every prime $\mathfrak{q} \supseteq A$ has $\operatorname{ht}\mathfrak{q} \ge |A_1| + (d - (|H| + |J|))$ (truncated subtraction).
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the height of the primes over $A$).'''
sketch = '''
By Lemma~\ref{lem:exists_le_translate_of_le_torusVanishing}, $\mathfrak{a} = $ \texttt{sectionIdeal $\ell$ $\psi$} lies in some $\sigma_g^{-1}(\mathfrak{q})$, whose quotient has dimension at most $\dim R/\mathfrak{a} \le |H| + |J|$ (Lemma~\ref{lem:ringKrullDim_quotient_sectionIdeal_le}); Proposition~\ref{prop:card_le_height_add_of_ringKrullDim_quotient_le} gives $|A_0| + 2|A_1| \le \operatorname{ht} + |H| + |J|$, and $\sigma_g$ keeps heights (Lemma~\ref{lem:torusTransl_algEquiv}).
'''

[[node]]
platform = "DiazModulus.le_boxHilb_torusVanishing_subgroup"
env = "proposition"
title = 'A lower bound for the Hilbert function of a subgroup'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$. Let $\Gamma$ be a subgroup of $G$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Then $\prod_{h \in H} (T_h + 1) \prod_{j \in J} (2T_j + 1) \le h_{I(\Gamma)}(T)$ for every $T$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the Hilbert function of the obstruction subgroup, bounded below).'''
sketch = '''
The monomials $X_H^a Y_J^{\lambda^+} Z_J^{\lambda^-}$ with $a_h \le T_h$ and $|\lambda_j| \le T_j$ lie in the box and are linearly independent modulo $I(\Gamma)$ by Proposition~\ref{prop:linearIndependent_on_subgroup}; Lemma~\ref{lem:card_le_boxHilb_of_linearIndependent} counts them.
'''

[[node]]
platform = "DiazModulus.hlow_le_boxHilb"
env = "proposition"
title = 'The lower side of the multiplicity estimate'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $\Gamma$ be a subgroup of $G$. The cosets of $\Gamma$ are comaximal: $I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ whenever $g g'^{-1} \notin \Gamma$, where $\Gamma g^{-1} = \{z : zg \in \Gamma\}$. $\Gamma$ has coordinate sections $H \subseteq A_0$, $J \subseteq A_1$: every $x \in \C^{A_0}$ agrees on $H$ with some element of the complex span of $\{x_g : g \in \Gamma\}$, and the only $\varphi \in \Z^{A_1}$ vanishing off $J$ with $\prod_i y_{g,i}^{\varphi_i} = 1$ for every $g = (x_g, y_g) \in \Gamma$ is $\varphi = 0$. Let $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$, $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \ \forall h\}$, $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \ \forall i\}$, with $\Gamma \subseteq V \times T_\psi$, $\dim V = |H|$ and $\dim L = |J|$; let $W$ be a subspace and $n$ with $n + \dim(W \cap (V \times L)) = \dim W$; let $M_0, M_1 \in \N$ and $A$ an ideal with $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ $\Gamma$)) W M$_0$}. Let $D_0, D_1 \in \N$ and $R_e$ a finite set of $s \in \Z^{B_1}$ with $|s_j| \le M_1$, pairwise incongruent modulo $(V, \psi)$ ($s$, $s'$ are congruent when $\sum_j (s_j - s'_j) u_j \in V$ and $\prod_i (\prod_j a_{ji}^{s_j - s'_j})^{\psi_{k,i}} = 1$ for every $k$). Then there is $C \in \N^{A_0 \sqcup A_1}$ such that, with $d = |A_0| + |A_1|$ and $D$ = \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$}, $\binom{M_0 + n}{n} |R_e| D_0^{\dim V} D_1^{\dim L}\, t^{d - (d - (\dim V + \dim L))} \le h_A(tD + C)$ for every $t \ge 1$. For $T \in \N^{A_0 \sqcup A_1}$, \texttt{torusBox \_ A$_0$ A$_1$ T} is the span of the monomials of degree at most $T_h$ in $X_h$ and at most $T_i$ in the pair $Y_i, Z_i$, and $h_I(T)$ (\texttt{boxHilb (torusBox $\C$ A$_0$ A$_1$) I T}) is the dimension of the image of that box in $R/I$.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the lower bound for the Hilbert function of $A$), with (8.20) and Lemma 8.15.'''
sketch = '''
Lemma~\ref{lem:exists_tangent_dual} and Lemma~\ref{lem:exists_tangent_dual_cosets} give the dual pairs on $\Sigma \cdot \Gamma$, and Proposition~\ref{prop:wustholz_le_boxHilb} gives $\binom{M_0 + n}{n} h_{I(\Sigma \cdot \Gamma)}(T) \le h_A(T + M_0 C_Q)$. Incongruent $s \ne s'$ give distinct cosets $\Gamma g_s$, whose ideals $\sigma I(\Gamma)$ (Lemma~\ref{lem:torusTransl_algEquiv}) are comaximal: Proposition~\ref{prop:exists_card_mul_boxHilb_le_translates} and Lemma~\ref{lem:boxHilb_anti} bound $|R_e| h_{I(\Gamma)}$ by $h_{I(\Sigma \cdot \Gamma)}$. Finally Proposition~\ref{prop:le_boxHilb_torusVanishing_subgroup} and Lemma~\ref{lem:box_ray_lower_bound} bound $h_{I(\Gamma)}(tD)$ below.
'''

[[node]]
platform = "DiazModulus.exists_obstruction"
env = "proposition"
title = 'The obstruction subgroup'
statement = '''
Let $A_0, A_1$ be finite types and $R = \C[X, Y, Z]$ the polynomial ring \texttt{MvPolynomial (A$_0$ $\oplus$ (A$_1$ $\times$ Bool)) $\C$} in the variables $X_h$ ($h \in A_0$), $Y_i$ and $Z_i$ ($i \in A_1$), and $J_0 = (Y_iZ_i - 1)_{i \in A_1}$ its torus ideal (\texttt{torusIdeal}). Write $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ (\texttt{TorusGroup}: pairs $g = (x, y)$, $x$ in the additive group $\C^{A_0}$, $y \in (\C^\times)^{A_1}$, written multiplicatively), and say that a polynomial vanishes at $g$ when it vanishes at the point $(x, y, y^{-1})$ (\texttt{torusPt g}). For $w = (\xi, \eta) \in \C^{A_0} \times \C^{A_1}$, $D_w$ (\texttt{torusDeriv w}) is the invariant derivation $\sum_h \xi_h\,\partial/\partial X_h + \sum_i \eta_i (Y_i\,\partial/\partial Y_i - Z_i\,\partial/\partial Z_i)$ of $R$ (DALAG Lemma 8.11), and $D_l = D_{w_1} \circ \cdots \circ D_{w_t}$ (\texttt{torusDerivList l}) for a list $l = [w_1, \dots, w_t]$. For $g = (x, y) \in G$, $\sigma_g$ (\texttt{torusTransl g}) is the algebra map $X_h \mapsto X_h + x_h$, $Y_i \mapsto y_i Y_i$, $Z_i \mapsto y_i^{-1} Z_i$, so that $\sigma_g f$ takes at $z$ the value of $f$ at $zg$. For $S \subseteq G$, $I(S)$ (\texttt{torusVanishing S}) is the ideal of the polynomials vanishing at every point of $S$; for an ideal $\mathfrak{b}$, $Z_G(\mathfrak{b})$ (\texttt{torusZero $\mathfrak{b}$}) is the set of $g \in G$ at which every element of $\mathfrak{b}$ vanishes. For $u_j \in \C^{A_0}$, $a_{ji} \in \C^\times$ ($j \in B_1$, $i \in A_1$, $B_1$ finite) and $s \in \Z^{B_1}$, $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i) \in G$ (\texttt{hmePoint u a s}). For $P \in R$, a subspace $W \subseteq \C^{A_0} \times \C^{A_1}$, $m, n \in \N$ and $S \subseteq G$, \texttt{obstructionSpan P W u a m n S} is the span of the $\sigma_{g_s v}(D_l P)$ with $|s_j| \le m$, $v \in S$ and $l$ a list of elements of $W$ of length at most $n$. Put $I_r = J_0 + (\text{obstructionSpan}\,P\,W\,u\,a\,(rM_1)\,(rM_0)\,\{1\})$. For an ideal $J$ and a subspace $W$, \texttt{vanishOrd J W t} is the set of $Q$ with $D_l Q \in J$ for every list $l$ of elements of $W$ of length at most $t$ (vanishing to order $> t$ along $W$ relative to $J$). $\Sigma \cdot S = \{g_s \gamma : |s_j| \le M_1,\ \gamma \in S\}$ for $S \subseteq G$. For a subspace $V \subseteq K^{A_0}$ and integer rows $\psi_k \in \Z^{A_1}$, \texttt{standardSet V $\psi$} is $\{(x, y) \in G : x \in V,\ \prod_i y_i^{\psi_{k,i}} = 1 \text{ for every } k\}$, the subgroup $V \times T_\psi$. Let $P \in R$, $W \subseteq \C^{A_0} \times \C^{A_1}$ a subspace, $M_0, M_1 \in \N$, $d = |A_0| + |A_1|$, and assume that $D_l P$ vanishes at $g_s$ for every list $l$ of elements of $W$ of length at most $d M_0$ and every $s$ with $|s_j| \le d M_1$. Let $D_0, D_1 \in \N$, $P$ in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$} and $P \notin J_0$. Then there are $r \in \N$, an ideal $\mathfrak{p}$, a subgroup $\Gamma$ of $G$, $H \subseteq A_0$, $J \subseteq A_1$, $\ell_h \in \C^{A_0}$, $\psi_i \in \Z^{A_1}$ and subspaces $V \subseteq \C^{A_0}$, $L \subseteq \C^{A_1}$ such that: the cosets of $\Gamma$ are comaximal ($I(\Gamma g^{-1}) + I(\Gamma g'^{-1}) = R$ when $gg'^{-1} \notin \Gamma$); $H$, $J$ are coordinate sections of $\Gamma$ (as in Proposition~\ref{prop:linearIndependent_on_subgroup}); $V = \{v : \sum_{h'} \ell_{h,h'} v_{h'} = 0 \ \forall h\}$ and $L = \{v : \sum_{i'} \psi_{i,i'} v_{i'} = 0 \ \forall i\}$; $\Gamma \subseteq V \times T_\psi$; $\dim V = |H|$, $\dim L = |J|$ and $\dim V + \dim L < d$; and, with $A$ and $F_{\mathfrak{p}}$ as follows, For an ideal $\mathfrak{p}$, $F_{\mathfrak{p}}$ = \texttt{obstructionSpan P W u a (r M$_1$) (r M$_0$) (torusZero $\mathfrak{p}$)} and $A = J_0 + (F_{\mathfrak{p}})$. $F_{\mathfrak{p}}$ lies in the box \texttt{boxD A$_0$ A$_1$ D$_0$ D$_1$}, every prime $\mathfrak{q} \supseteq A$ has $\operatorname{ht}\mathfrak{q} \ge |A_1| + (d - (\dim V + \dim L))$, and $A \subseteq$ \texttt{vanishOrd (I($\Sigma$ $\cdot$ $\Gamma$)) W M$_0$}.
'''
source = '''\cite[Ch.~8]{Wal00} (Chapter~8 is by D.~Roy), \S8.4.1 (the obstruction subgroup and its ideal).'''
sketch = '''
Lemma~\ref{lem:exists_chain_prime} gives $r$ and $\mathfrak{p}$; $\Gamma$ is the stabiliser (Lemma~\ref{lem:torusStab_subgroup}), and Lemma~\ref{lem:exists_coordinate_section_add} and Lemma~\ref{lem:exists_coordinate_section_mul} give $(H, \ell, V)$ and $(J, \psi, L)$ with $\Gamma \subseteq V \times T_\psi$. The section ideal vanishes on $\Gamma$, so Lemma~\ref{lem:le_height_obstruction} gives the heights and Lemma~\ref{lem:obstructionSpan_vanishOrd} the box and the vanishing. Properness: if $H$ and $J$ were everything, the reduced form of $\sigma_v P$ ($v \in Z_G(\mathfrak{p})$, non-empty by Lemma~\ref{lem:torusVanishing_torusZero}; Lemma~\ref{lem:torus_reduce_mem_restrictSupport}, Lemma~\ref{lem:torusTransl_algEquiv}) would vanish on $\Gamma$, hence be $0$ by Proposition~\ref{prop:linearIndependent_on_subgroup}, forcing $P \in J_0$.
'''

[[node]]
platform = "DiazModulus.multiplicityEstimateElem"
root = true
env = "theorem"
title = 'The elementary multiplicity estimate'
statement = '''
The proposition \texttt{hME} holds. In the library it is \texttt{Diaz.MultiplicityEstimateElem}, and on Prove2Me the published definition \texttt{MultiplicityEstimateElem}. It is the elementary multiplicity estimate, DALAG Th. 8.1 in the case $G^- = \{e\}$ for $G = \mathbb{G}_a^{A_0} \times \mathbb{G}_m^{A_1}$ over $\C$, written in coordinates: for finite $A_0, A_1, B_0, B_1$, $d = |A_0| + |A_1|$, vectors $w_b \in \C^{A_0} \times \C^{A_1}$ with span $W$, $u_j \in \C^{A_0}$, non-zero $a_{ji}$, $D_0, D_1 \ge 1$, $M_0, M_1 \in \N$ and a non-zero coefficient vector $c$, if the polynomial $P_c$ and its derivatives $D_{w_{k_1}} \cdots D_{w_{k_r}} P_c$, $r \le dM_0$, vanish at the points $g_s = (\sum_j s_j u_j, (\prod_j a_{ji}^{s_j})_i)$, $|s_j| \le dM_1$, then there are a subspace $V \subseteq \C^{A_0}$, integer rows $\varphi_1, \dots, \varphi_q \in \Z^{A_1}$ with common complex kernel $L$ and $\ell$ with $\ell + \dim(W \cap (V \times L)) = \dim W$, such that $\dim V + \dim L < d$ and every set $R$ of $s$ with $|s_j| \le M_1$, pairwise incongruent modulo $(V, \varphi)$, satisfies $\binom{M_0 + \ell}{\ell} |R|\, D_0^{\dim V} D_1^{\dim L} \le 2^{d(d+1)/2}\, d!\, 2^{|A_1|}\, |A_0|^{|A_0|} D_0^{|A_0|} D_1^{|A_1|}$. With Theorem~\ref{thm:strong_six_exponentials} (Roy's strong six exponentials theorem under \texttt{hME}), it gives Roy's strong six exponentials theorem with no hypothesis (Theorem~\ref{thm:strong_six_exponentials_unconditional}).
'''
source = '''\cite[Th.~8.1]{Wal00} (\S8.1, p.~232; Chapter~8 is by D.~Roy), the case $G^-=\{e\}$, $G^+=G$, with the proof of \S8.4 (\S8.4.1, Lemmas 8.14--8.16, (8.20)) at finite level. For $G^-=\{e\}$ and finite $\Sigma$, the book notes that Theorem~8.1 is a special case of \cite[Th.~2.1]{Phi86}. Classical; routine formalisation.'''
sketch = '''
$P = P_c$ lies in the box and not in $J_0$ (Lemma~\ref{lem:torus_coeff_poly}), and Lemma~\ref{lem:eval_torusDerivList_eq_zero} turns the premise into the vanishing of $D_l P$ at the $g_s$. Proposition~\ref{prop:exists_obstruction} gives the obstruction subgroup $\Gamma$, its sections and $V \times L$ with $\dim V + \dim L < d$, and the ideal $A$. For each set $R$, Proposition~\ref{prop:hlow_le_boxHilb} bounds $h_A$ below on the rays $tD + C$; Theorem~\ref{thm:torus_hilbert_side}, with Macaulay's unmixedness Theorem~\ref{thm:unmixedHeight_mvPolynomial}, bounds it above, and Lemma~\ref{lem:le_hME_constant} turns the comparison into the stated constant. The conclusion takes $\varphi = \psi$ reindexed by an enumeration of $A_1$ and $\ell = \dim W - \dim(W \cap (V \times L))$.
'''

[[node]]
platform = "DiazModulus.strong_six_exponentials_unconditional"
root = true
env = "theorem"
title = "Roy's strong six exponentials theorem, with no hypothesis"
statement = '''
Here $\overline{\Q}$ is the field of algebraic numbers, $\mathcal{L}$ is the set of logarithms of algebraic numbers (the $z \in \C$ with $e^z$ algebraic), and $\widetilde{\mathcal{L}}$ is the $\overline{\Q}$-vector space spanned by $1$ and $\mathcal{L}$ (\texttt{Qbar} and \texttt{LogAlgTilde} of the library). Let $x \in \C^2$ and $y \in \C^3$ each be linearly independent over $\overline{\Q}$. Then $x_i y_j \notin \widetilde{\mathcal{L}}$ for some $i, j$. This is Roy's strong six exponentials theorem, with no hypothesis: Theorem~\ref{thm:strong_six_exponentials} proves it under the hypothesis \texttt{hME}, and Theorem~\ref{thm:multiplicityEstimateElem} proves that hypothesis.
'''
source = '''Roy's strong six exponentials theorem: \cite{Roy92}, Cor.~2; \cite[Cor.~11.16]{Wal00} (\S11.6.1; this node is its case $d=2$, $\ell=3$). Here from Theorem~\ref{thm:strong_six_exponentials} and the multiplicity estimate, \cite[Th.~8.1]{Wal00} in the case $G^-=\{e\}$ after \cite{Phi86}. Classical.'''
sketch = '''
Apply Theorem~\ref{thm:strong_six_exponentials} to Theorem~\ref{thm:multiplicityEstimateElem}.
'''
