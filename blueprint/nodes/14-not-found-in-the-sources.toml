# Chapter 14. Read by scripts/gen_blueprint.py; see its docstring for the format. A chapter of text only.

[chapter]
title = "Results not found in the sources read"
text = '''
This chapter lists the blueprint's results whose \emph{statements} were not found in the literature checked: about 120 local sources (the papers and books of Diaz, Roy, Waldschmidt and Brownawell, those they build on, and Bachoc, Serra and Z\'emor on products of spaces) as of 12 October 2026, and the works citing the key papers as of 5 October 2026. ``Not found'' never means ``new'': each claim can fall to a source not yet read, and three already have; their source lines say so.

\textbf{What is claimed, and what is not.} For each entry, only that the classification or bound it proves was not found in print. No entry is claimed to need a new idea: every proof is a printed method applied to the new statement, a substitution or a computation, and each entry names the method. Until 22 November 2026 entries~1--3 were ranked as having a step a specialist would not call routine. Two referees, independent Claude agents, re-examined them that day and judged every step routine, as Theorem~B had been judged on 8 November 2026.

\textbf{The order.} Entries 1--3 are ordered by the totals the two referees gave them on 22 November 2026, on a fixed rubric (distance from print, depth, reach, use in the library; each from $1$ to $3$, at most $12$). Entries 4--7 were scored only before that date and keep their earlier order. The groups after them are not ranked.

\begin{enumerate}
\item \textbf{Theorem~E}, totals $10$ and $10$ (Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}, Corollaries~\ref{cor:laurent_conj_hull_large_exponent_configuration_iff_real_pencil_class} and~\ref{cor:cubic_window_conj_hull_two_by_three_configuration_iff_criterion}). \emph{Statement:} for $z$ a polynomial in $u$ and $\bar u$, the hull $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ carries a $2\times3$ configuration exactly when it is five-dimensional and in one of three classes (P), (Q), (R); with an exponent of absolute value at least $4$ only (R) remains, and an explicit criterion decides the cubic window. \emph{Not found:} the classification and the criterion. \emph{Printed methods used:} the normal form of the pencil attached to a configuration, Gauss's lemma, \cite[Lemma 4 and \S7]{BSZ17}; the configurations themselves are \cite[Théorème 2]{Dia04} and \cite[Théorèmes 4(1) and 7(1)]{Dia07}.
\item \textbf{Theorem~F with Theorem~NF}, totals $9$ and $9$ (Theorems~\ref{thm:rational_conj_hull_two_by_three_configuration_iff}, \ref{thm:rational_space_two_by_three_configuration_iff} and~\ref{thm:degree_two_configuration_normal_form}). \emph{Statement:} for $z$ rational in $u$, the same hull carries a configuration exactly when it is four-dimensional with $z\in\Qbar+\Qbar u+\Qbar\bar u+\Qbar(u-a)^{-1}$, $a\bar a=u\bar u$, or five-dimensional of type (D1), two-orbit (D2a) or cyclic (D2b); the $\sigma$-free form says the same of every five-dimensional space of rational functions of $u$ containing $1$, $u$, $u^{-1}$. \emph{Not found:} the three types and the classification. \emph{Printed methods used:} the Weierstrass normal form of a regular $2\times2$ pencil, whose three forms are the three types; L\"uroth's degree formula; \cite[Lemma 4]{BSZ17}. Theorem~E's explicit criteria do not follow from Theorem~F, so Theorem~E keeps its own entry.
\item \textbf{Case~I}, totals $8$ and $8$ (Theorem~\ref{thm:progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space}, with Proposition~\ref{prop:quadratic_ratio_progression_space_eq_involution_pencil_space} and Theorems~\ref{thm:mobius_progression_space_contains_square_or_reciprocal} and~\ref{thm:involution_pencil_configuration_invisible_to_four_dimensional_extensions}). \emph{Statement:} a five-dimensional space containing a four-term progression with ratio rational in $u$ contains $u^{2}$, $u^{-2}$ or some $1/(u-b)$, or is an involution space, whose configuration no four-dimensional extension inside it carries. \emph{Not found:} the dichotomy. \emph{Printed methods used:} the degree formula and the tower law (Lemma~\ref{lem:progression_space_ratio_degree_le_two}), Riemann--Roch on $\mathbb P^{1}$, the progression of \cite[Lemma 6.1]{Fis01} (Proposition~\ref{prop:involution_pencil_space_carries_two_by_three_configuration}), a parity count (Lemma~\ref{lem:involution_pencil_space_excludes_squares_and_reciprocals}) and Theorem~B. It covers only ratios in $\Qbar(u)$.
\item \textbf{Theorem~B} (Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}). \emph{Statement:} the four-dimensional extensions $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z$ of a point of a circle that carry a configuration are exactly those containing $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$; every later invisibility result goes through it. \emph{Not found:} the classification in these terms. \emph{Printed methods used:} \cite[Lemma 4]{BSZ17} (Lemma~\ref{lem:two_by_three_configuration_forces_progression}) and the rank-three quadrics through a rational normal curve, \cite[Theorem 1.2(2)]{Par24}, \cite[Theorem 1.1]{PS25}, \cite[\S2]{AH81}.
\item \textbf{Laurent hulls} (Theorem~\ref{thm:laurent_hull_config_iff}). \emph{Statement:} the span of the powers $u^{s}$, $s\in S$, carries a $p\times q$ configuration exactly when $S$ contains a sumset $A+B$ with $|A|=p$, $|B|=q$. So through these hulls Roy's theorem excludes no single power beyond $u^{3}$ (Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}), and Propositions~\ref{prop:power_pair_hull_two_by_three_iff} and~\ref{prop:four_pow_hull_no_two_by_three} give the pairs of powers it does exclude. \emph{Printed method used:} the valuations of \cite[\S7]{BSZ17}.
\item \textbf{Separation} (Theorem~\ref{thm:rank_one_config_separation}). \emph{Statement:} over any subfield $K\subseteq F$, numbers algebraically independent over $F$ never enter a configuration in $V_0+Kw_1+\dots+Kw_m$, $V_0\subseteq F$. With Corollary~\ref{cor:generic_circle_point_config_is_two_by_two} it gives Theorem~A, no $2\times3$ configuration on generic data (Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration}), and it contains Theorem~\ref{thm:generic_period_never_enters}. \emph{Printed:} its case $V_0=K=\Qbar$ is \cite[Proposition 12.2 and the Remark on p.~424]{Wal00}, whose argument it extends.
\item \textbf{The $2\times2$ normal form} (Theorem~\ref{thm:circle_point_two_by_two_normal_form}). \emph{Statement:} the $2\times2$ configurations in $K+Ku+K\bar u$ form one orbit, that of $(1,u)\otimes(1,\bar u)$ under $\mathrm{GL}_2(K)\times\mathrm{GL}_2(K)$. Their constant terms are invertible (Corollary~\ref{cor:circle_point_config_constant_matrix_det_ne_zero}), at a candidate they are never matrices of logarithms (Corollary~\ref{cor:candidate_two_by_two_config_entry_not_mem_span_logAlg}), and Theorems~\ref{thm:generic_quadratic_relation_is_norm}, \ref{thm:no_vanishing_coeff} and~\ref{thm:det_pencil_eq_conic} are in substance its corollaries. \emph{Printed:} it extends \cite[Lemmas 4 and 5]{BSZ17}.
\end{enumerate}

\textbf{Not ranked.} The other statements not found in the sources read, by topic; each source line names what is printed nearby.

\emph{Near a point of a circle.}
\begin{itemize}
\item Invisible five-dimensional spaces, which carry a configuration that no four-dimensional extension inside them carries: Theorems~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions} ($z=u/(u^{2}-a)$ or $u/(u^{2}-a)^{2}$), \ref{thm:circle_point_two_pole_configuration_invisible_to_four_dimensional_extensions} (two poles), \ref{thm:real_pencil_quartic_configuration_invisible_to_four_dimensional_extensions}, \ref{thm:laurent_cubic_configuration_invisible_to_four_dimensional_extensions}, \ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions}, \ref{thm:conj_swapped_two_orbit_configuration_invisible_to_four_dimensional_extensions} and~\ref{thm:cyclic_pair_configuration_invisible_to_four_dimensional_extensions}; the conjugation-stable case of the first carries none (Proposition~\ref{prop:conj_stable_circle_point_extension_no_two_by_three_configuration}). Several of these configurations are printed, as \cite[Théorème 7(1)]{Dia07} (Proposition~\ref{prop:conj_stable_two_orbit_space}); what was not found is their invisibility. Consequences at a candidate are printed (Corollary~\ref{cor:candidate_div_sq_sub_not_mem_logAlgTilde}).
\item Structure of these spaces: the conjugation-stable degree-one spaces are the real pencil spaces (Theorem~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space}); no factor of degree one (Theorems~\ref{thm:laurent_cubic_space_no_mobius_ratio_configuration} and~\ref{thm:cyclic_pair_space_no_mobius_ratio_configuration}) and none of degree above two (Theorem~\ref{thm:progression_pair_span_ratio_degree_le_two}); which Laurent $f$ make $W(\lambda,f)$ visible (Theorem~\ref{thm:laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions}, Proposition~\ref{prop:laurent_real_pencil_space_contains_square_of_root}); and visibility criteria by degrees (Theorems~\ref{thm:degree_one_space_visible_to_four_dimensional_extensions_iff_cubic_over_quadratic} and~\ref{thm:rational_pencil_space_visible_to_four_dimensional_extensions_iff_natDegree_le}).
\item Polynomial hulls: $\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries a configuration exactly when $\deg P\in\{2,3\}$ (Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff}); real polynomials in $\operatorname{Re}u$ and $\operatorname{Im}u$ carry none (Corollary~\ref{cor:real_polynomial_hull_no_two_by_three_configuration}).
\item A barrier: Roy's theorem stays true when a point of a circle transcendental over the field of $\widetilde{\mathcal L}$ is adjoined (Theorem~\ref{thm:logAlgTilde_adjoin_circle_point_no_two_by_three_configuration}, Proposition~\ref{prop:rank_one_config_inverse_adjoin}), and Theorem~D (Theorem~\ref{thm:logAlg_adjoin_circle_point_theorem_D}, Proposition~\ref{prop:span_logAlg_theorem_D_properties}, Corollary~\ref{cor:theorem_D_barrier}): $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$ has the classical properties of $\mathcal L$ (Baker, Hermite--Lindemann, Gel'fond--Schneider, six and four exponentials, Roy; the six exponentials clause without Roy's theorem, Proposition~\ref{prop:logAlg_adjoin_circle_point_six_exponentials}) and contains $u$, so these properties alone cannot prove Diaz's conjecture.
\end{itemize}

\emph{Transcendence degree one.} Diaz's (Qr2) (Theorem~\ref{thm:diaz_2007_qr2_of_trdeg_one}) and pair rigidity (Theorem~\ref{thm:log_pair_rigid_of_trdeg_one}); $(\log2)^{2}+\pi^{2}$ and $(\log3)^{2}+\pi^{2}$ are not both rational (Corollaries~\ref{cor:torsion_rational_modulus_unique} and~\ref{cor:log_two_log_three_not_both_rational}); the two open boundary statements cannot both fail at rational data (Corollary~\ref{cor:recip_pi_log_of_torsion_rational_modulus}).

\emph{The dilogarithm at one half.} $\mathrm{Li}_2(1/2)$ is irrational, or $e^{i\gamma/\pi}$ is transcendental for every rational $\gamma\neq0$ (Corollary~\ref{cor:dilog_half_irrational_or_exp_i_div_pi_transcendental}); its general form (Proposition~\ref{prop:recip_pi_log_of_rational_quadratic_relation}) is Brownawell's Corollary~5 \cite{Bro74} with rational scaling.

\emph{Conditional reductions.} The strong five exponentials conjecture implies Diaz's (Theorem~\ref{thm:diaz_of_strong_five_exponentials}). Under the case $n=2$ of Kirby's weak Schanuel conjecture a candidate has $\operatorname{Im}u\in\pi\Q$ and Diaz's conjecture reduces to one relation (Proposition~\ref{prop:candidate_im_mem_pi_rat_of_weak_schanuel}, Corollary~\ref{cor:diaz_iff_single_relation_of_weak_schanuel}); with the case $n=1$ of Schanuel's conjecture over the kernel $2\pi i\Q$, it holds (Corollary~\ref{cor:diaz_of_weak_schanuel_and_kernel_schanuel}).

Not listed: twenty formalisation steps of classical proofs in Chapter~\ref{chap:05-six-exponentials}, whose source lines say they were not found in the form stated: eight of Roy's strong six exponentials theorem from a multiplicity estimate, ten of the Hilbert-function half of that estimate (finite forms of \cite[Chapter 8]{Wal00}, by D.~Roy), and two of the route to Roy's Corollary~1 (Lemmas~\ref{lem:roy_relation_rank_le} and~\ref{lem:roy_period_space}). All are routine, and the theorems are classical \cite{Roy92}. The companion note in the repository states and attributes everything in this chapter, with the passages read.
'''
