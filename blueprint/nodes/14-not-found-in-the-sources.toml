# Chapter 14. Read by scripts/gen_blueprint.py; see its docstring for the format. A chapter of text only.

[chapter]
title = "Results not found in the sources read"
text = '''
This chapter lists the blueprint's results that were not found in the literature checked. ``Not found'' means not found in about 120 local sources (the papers and books of Diaz, Roy, Waldschmidt and Brownawell, those they build on, and Bachoc, Serra and Z\'emor on products of spaces), as of 12 October 2026, nor in the works citing the key papers, as of 5 October 2026. It never means ``new'': each claim can fall to a source not yet read, and two already have, to sources read later; their source lines say so. A result is \emph{not routine} when its proof has a step that was not found in the sources and that a specialist would not call routine, whatever its length; the others are \emph{routine}: a substitution into a printed theorem, an immediate corollary, a direct computation, or a printed method applied to a new statement. The first list is ranked. The ranking is an editorial judgment, made on a fixed rubric (distance from print, depth, reach, and use in the library) with two independent referee reports, and each entry says why it stands where it does. The source line of each statement says what is printed nearby. In the dependency graph, the results of the first list have a double border.

\textbf{Not found, and not routine, in rank order.}
\begin{enumerate}
\item Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} (Theorem~B): the four-dimensional extensions $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z$ of a point of a circle that carry a $2\times3$ configuration are exactly those containing $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$. First, because it is the one complete classification here and every later invisibility result goes through it. Its key step, Lemma~\ref{lem:two_by_three_configuration_forces_progression}, is \cite[Lemma 4]{BSZ17}; what was not found is the converse classification, where a degree count forces $u$ to be a M\"obius function of the ratio.
\item Theorem~\ref{thm:progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space}, with Lemma~\ref{lem:progression_space_ratio_degree_le_two}, Proposition~\ref{prop:quadratic_ratio_progression_space_eq_involution_pencil_space} and Theorems~\ref{thm:mobius_progression_space_contains_square_or_reciprocal} and~\ref{thm:involution_pencil_configuration_invisible_to_four_dimensional_extensions}: a five-dimensional space containing a four-term progression with ratio rational in $u$ contains $u^{2}$, $u^{-2}$ or some $1/(u-b)$, or is one of the involution spaces, which carry a configuration that no four-dimensional extension inside them carries. Second, because its proof has several steps not found in the sources (the index bound through the degree formula of L\"uroth's theorem, the normal form for an involution's pencil, the invisibility of every involution space); it covers only ratios in $\Qbar(u)$, takes the progression as a hypothesis (\cite[Lemma 4]{BSZ17} supplies it), and excludes nothing new at a candidate.
\end{enumerate}

\textbf{Not found, but routine.} The first three are the strongest of them: complete answers to natural questions, whose proofs apply a printed method.
\begin{itemize}
\item Theorem~\ref{thm:laurent_hull_config_iff}: the span of the powers $u^{s}$, $s\in S$, carries a $p\times q$ configuration exactly when $S$ contains a sumset $A+B$ with $|A|=p$, $|B|=q$. It decides every such hull: in $\Qbar u^{-k}+\Qbar u^{-1}+\Qbar+\Qbar u+\Qbar u^{k}$ a configuration exists only for $k=2,3$ (Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}), so through these hulls Roy's theorem excludes no single power beyond $u^{3}$; Propositions~\ref{prop:power_pair_hull_two_by_three_iff} and~\ref{prop:four_pow_hull_no_two_by_three} give the pairs of powers it does exclude, and the powers $u^{4^j}$, which it cannot. The proof is the valuation method of \cite[\S7]{BSZ17}.
\item Theorem~\ref{thm:rank_one_config_separation} (separation): over any subfield $K\subseteq F$, numbers algebraically independent over $F$ never enter a configuration in $V_0+Kw_1+\dots+Kw_m$, $V_0\subseteq F$. With the bound $p+q\le4$ in the hull (Corollary~\ref{cor:generic_circle_point_config_is_two_by_two}) it gives Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration} (Theorem~A: no $2\times3$ configuration on generic data, whatever numbers are added; its case $m=0$ is Roy's), and it contains Theorem~\ref{thm:generic_period_never_enters}. Its case $V_0=K=\Qbar$ is \cite[Proposition 12.2 and the Remark on p.~424]{Wal00}, whose argument it extends.
\item Theorem~\ref{thm:circle_point_two_by_two_normal_form}: the $2\times2$ configurations in $K+Ku+K\bar u$ form one orbit, that of $(1,u)\otimes(1,\bar u)$ under $\mathrm{GL}_2(K)\times\mathrm{GL}_2(K)$. Their constant terms form an invertible matrix (Corollary~\ref{cor:circle_point_config_constant_matrix_det_ne_zero}), and at a candidate they are never matrices of logarithms (Corollary~\ref{cor:candidate_two_by_two_config_entry_not_mem_span_logAlg}). Theorems~\ref{thm:generic_quadratic_relation_is_norm}, \ref{thm:no_vanishing_coeff} and~\ref{thm:det_pencil_eq_conic} are, in substance, its corollaries: on generic data every quadratic relation is a multiple of the norm form, and the matrix a counterexample would give has no vanishing coefficient and only the norm form as singular pencil. It extends the two-dimensional critical-pair lemma of \cite[Lemmas 4 and 5]{BSZ17}.
\end{itemize}

\emph{Configurations near a point of a circle.}
\begin{itemize}
\item Theorem~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions}: five-dimensional spaces $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$, with $z=u/(u^{2}-a)$ or $u/(u^{2}-a)^{2}$, carry a configuration that no four-dimensional extension of $\Qbar+\Qbar u+\Qbar\bar u$ inside them carries; and Proposition~\ref{prop:conj_stable_circle_point_extension_no_two_by_three_configuration}, the conjugation-stable case, which carries none. Their consequences at a candidate are printed (Corollary~\ref{cor:candidate_div_sq_sub_not_mem_logAlgTilde}).
\item Theorem~\ref{thm:circle_point_two_pole_configuration_invisible_to_four_dimensional_extensions}: two poles carry a configuration invisible to four-dimensional extensions, with no conjugation condition.
\item Theorems~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space} and~\ref{thm:real_pencil_quartic_configuration_invisible_to_four_dimensional_extensions}: the conjugation-stable degree-one configuration spaces are the real pencil spaces, and one of them is invisible to four-dimensional extensions without containing a progression.
\item Theorems~\ref{thm:laurent_cubic_configuration_invisible_to_four_dimensional_extensions}, \ref{thm:laurent_cubic_space_no_mobius_ratio_configuration} and~\ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions}: conjugation-stable invisible spaces whose configuration has a factor of degree two and none of degree one. The configuration of the first is printed: it is that of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=u^{2}+su$, and what was not found is its invisibility. Theorem~\ref{thm:progression_pair_span_ratio_degree_le_two}: no factor of higher degree; Theorem~\ref{thm:laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions} and Proposition~\ref{prop:laurent_real_pencil_space_contains_square_of_root}: which Laurent $f$ make $W(\lambda,f)$ visible.
\item Theorem~\ref{thm:conj_swapped_two_orbit_configuration_invisible_to_four_dimensional_extensions}: two orbits of $u\mapsto-u$ exchanged by conjugation give conjugation-stable invisible spaces; Theorems~\ref{thm:cyclic_pair_configuration_invisible_to_four_dimensional_extensions} and~\ref{thm:cyclic_pair_space_no_mobius_ratio_configuration}: a conjugation-stable invisible space whose factor $(1,u^{2})$ acts as a Jordan block, with no factor of degree one. As for Theorem~\ref{thm:laurent_cubic_configuration_invisible_to_four_dimensional_extensions}, their configurations are printed: rescaled by $u^{\mp1}$, each is that of \cite[Théorème 7(1)]{Dia07} at $v=u$, and so is that of Theorem~\ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions} in the conjugation-stable case of Proposition~\ref{prop:conj_stable_two_orbit_space}; what was not found is their invisibility, and for the cyclic space the absence of a factor of degree one. With the previous item, each family of the research notes' classification of these spaces has a formal member; the classification, which the notes make for every involution of the $u$-line that commutes with conjugation, is not formalised.
\item Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff}: a polynomial hull $\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries a configuration exactly when $\deg P\in\{2,3\}$; the configurations are \cite[Théorème 7(1)]{Dia07}, the case $P=X^{k}$ is Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}, and the converse for $\deg P\geq4$ applies the valuation count of \cite[\S7]{BSZ17} at $0$ and $\infty$ together. Corollary~\ref{cor:real_polynomial_hull_no_two_by_three_configuration}: real polynomials in $\operatorname{Re}u$ and $\operatorname{Im}u$ carry none. Theorem~\ref{thm:logAlgTilde_adjoin_circle_point_no_two_by_three_configuration}, with Proposition~\ref{prop:rank_one_config_inverse_adjoin}: Roy's theorem stays true when a point of a circle transcendental over the field of $\widetilde{\mathcal L}$ is adjoined.
\end{itemize}

\emph{Transcendence degree one.}
\begin{itemize}
\item Theorem~\ref{thm:diaz_2007_qr2_of_trdeg_one}: Diaz's (Qr2) in transcendence degree one; and Theorem~\ref{thm:log_pair_rigid_of_trdeg_one}, pair rigidity in transcendence degree one.
\item Corollaries~\ref{cor:torsion_rational_modulus_unique} and~\ref{cor:log_two_log_three_not_both_rational}: $(\log2)^{2}+\pi^{2}$ and $(\log3)^{2}+\pi^{2}$ are not both rational; and Corollary~\ref{cor:recip_pi_log_of_torsion_rational_modulus}: the two open boundary statements cannot both fail at rational data.
\end{itemize}

\emph{The dilogarithm at one half.}
\begin{itemize}
\item Corollary~\ref{cor:dilog_half_irrational_or_exp_i_div_pi_transcendental}: $\mathrm{Li}_2(1/2)$ is irrational, or $e^{i\gamma/\pi}$ is transcendental for every rational $\gamma\neq0$; and its general form, Proposition~\ref{prop:recip_pi_log_of_rational_quadratic_relation}, which is Brownawell's Corollary~5 \cite{Bro74} with rational scaling.
\end{itemize}

\emph{Conditional reductions.}
\begin{itemize}
\item Theorem~\ref{thm:diaz_of_strong_five_exponentials}: the strong five exponentials conjecture implies Diaz's.
\item Proposition~\ref{prop:candidate_im_mem_pi_rat_of_weak_schanuel} and Corollary~\ref{cor:diaz_iff_single_relation_of_weak_schanuel}: under the case $n=2$ of Kirby's weak Schanuel conjecture, a candidate has $\operatorname{Im}u\in\pi\Q$, and Diaz's conjecture reduces to one relation; with the case $n=1$ of Schanuel's conjecture over the kernel $2\pi i\Q$, it holds (Corollary~\ref{cor:diaz_of_weak_schanuel_and_kernel_schanuel}).
\end{itemize}

The companion note in the repository states and attributes all of these, with the passages read.
'''
