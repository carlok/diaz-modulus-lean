statement = '''
Let $u\in\C\setminus\Qbar$, $c\neq0$, and suppose $1,u,u^{-1}$ lie in the $\Qbar$-span of $c,ch,ch^{2},ck,chk$. If $h=p(u)/q(u)$ with $p,q\in\Qbar[X]$ coprime and not both constant, then $\max(\deg p,\deg q)\leq2$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:quadratic_over_ratio_of_mem_progression_pair_span}; $[\Qbar(X):\Qbar(p/q)]=\max(\deg p,\deg q)$ (Mathlib, Lüroth's file) is at most $2$.
'''

[[node]]
platform = "DiazModulus.laurent_real_pencil_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'Laurent $f$: the exclusions'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $\lambda\in\Qbar$ with $|\lambda|=1$, $f=\sum_{|j|\le k}c_{j}(u/s)^{j}$ with $c_{j}\in\Qbar$, $c_{-j}=\bar c_{j}$, $c_{k}\neq0$, and $W(\lambda,f)=\Qbar+\Qbar u+\Qbar\bar u+\Qbar f+\Qbar f/(s+\lambda u)$. If the five numbers are free and $k\geq3$, or $k=2$ and $f(-\bar\lambda)\neq0$, $W(\lambda,f)$ contains none of $u^{2}$, $\bar u^{2}$, $1/(u-b)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Clear by $s\,v^{k}(1+\lambda v)$, $v=u/s$; degree, then the values at $0$ and $-\bar\lambda$.
'''

[[node]]
platform = "DiazModulus.laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'Laurent $f$: invisible'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $\lambda\in\Qbar$ with $|\lambda|=1$, $f=\sum_{|j|\le k}c_{j}(u/s)^{j}$ with $c_{j}\in\Qbar$, $c_{-j}=\bar c_{j}$, $c_{k}\neq0$, and $W(\lambda,f)=\Qbar+\Qbar u+\Qbar\bar u+\Qbar f+\Qbar f/(s+\lambda u)$. If the five numbers are free and $k\geq3$, or $k=2$ and $f(-\bar\lambda)\neq0$, $W(\lambda,f)$ is invisible to Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$f$ is real; Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}, Lemma~\ref{lem:laurent_real_pencil_space_excludes_squares_and_reciprocals}, Theorem B and exchange.
'''

[[node]]
platform = "DiazModulus.laurent_real_pencil_space_contains_square_of_root"
root = true
env = "proposition"
title = 'Laurent $f$: the visible case'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $\lambda\in\Qbar$ with $|\lambda|=1$, $f=\sum_{|j|\le k}c_{j}(u/s)^{j}$ with $c_{j}\in\Qbar$, $c_{-j}=\bar c_{j}$, $c_{k}\neq0$, and $W(\lambda,f)=\Qbar+\Qbar u+\Qbar\bar u+\Qbar f+\Qbar f/(s+\lambda u)$. If $k=2$ and $f(-\bar\lambda)=0$, then $u^{2},\bar u^{2}\in W(\lambda,f)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$v^{2}f$ is divisible by $1+\lambda v$, so $f/(s+\lambda u)$ is a Laurent polynomial with a $v^{-2}$ term.
'''

[[node]]
platform = "DiazModulus.conj_swapped_two_orbit_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'Two orbits exchanged by conjugation'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $a,a_{1},a_{2}\in\Qbar^{\times}$ with $a\bar a\neq s^{2}$ and $a_{1}\neq a_{2}$, $g=a_{1}/(u-a)+a_{2}/(u+a)$ and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g+\Qbar\bar g$. Then $W$ is stable under conjugation, the products of a configuration span it, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W$ with $w\notin \Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''The configuration is printed: rescaled by $u^{\mp1}$, it is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=ug$. That no four-dimensional extension inside $W$ carries a configuration was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Conjugation exchanges the orbits $\pm a$ and $\pm s^{2}/\bar a$ of $u\mapsto-u$; Proposition~\ref{prop:conj_stable_two_orbit_space} is the case where it fixes them.'''
sketch = '''
With $b=s^{2}/\bar a$, $\bar g$ is a constant plus $\gamma/(u-b)+\delta/(u+b)$, $\gamma,\delta\neq0$, and $a^{2}\neq b^{2}$ as $a\bar a+s^{2}>0$; Theorem~\ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions}.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'The cyclic space'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then $W$ is five-dimensional and contains none of $u^{2}$, $\bar u^{2}$, $1/(u-e)$ ($e\in\Qbar^{\times}$).
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$u(u^{2}-s^{2})^{2}w$ is a polynomial of degree $6$ in $u$; compare coefficients. An element of $W$ with a pole at $s$ has one at $-s$.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'The cyclic family: a spanning configuration, invisible'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then $W$ is stable under conjugation, the products of $(1,u^{2})$ and $(\bar u,G_{1},G_{2})$ span it, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W$ with $w\notin \Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''The configuration is printed: rescaled by $u^{\mp1}$, it is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=uG_{2}$. That no four-dimensional extension inside $W$ carries a configuration was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Modulo $\Qbar+\Qbar u+\Qbar\bar u$, the factor $(1,u^{2})$ acts on $G_{1},G_{2}$ as a Jordan block.'''
sketch = '''
$\bar G_{1}=1-G_{1}$, $\bar G_{2}=G_{2}$; $u^{2}G_{1}=3su-s^{2}+s^{2}G_{1}$, $u^{2}G_{2}=s^{2}G_{2}+3su-2s^{2}+2s^{2}G_{1}$; Lemma~\ref{lem:cyclic_pair_space_excludes_squares_and_reciprocals}; Theorem~B and exchange.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_space_no_mobius_ratio_configuration"
root = true
env = "theorem"
title = 'The cyclic family: no factor of degree one'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then no configuration in $W$ has ratio $x_{2}/x_{1}=(\alpha u+\beta)/(\gamma u+\delta)$ with $\alpha\delta-\beta\gamma\neq0$; so $W$ is none of the spaces of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$c=\alpha x_{1}-\gamma x_{2}$ gives $t_{j}=cy_{j}$ with $t_{j},ut_{j}\in W$; such $t$ lie in $\Qbar+\Qbar\bar u$, since multiplication by $u$ changes the sign of the ratio between the leading polar coefficients at $s$ and $-s$.
'''

# --- Polynomial hulls (R16) -------------------------------------------------------------------

[[node]]
platform = "DiazModulus.polynomial_submodule_degrees_card"
env = "lemma"
section = "Polynomial hulls"
title = 'Degrees of a space of polynomials'
statement = '''
Let $K$ be a field and $X\subseteq K[X]$ a finite-dimensional $K$-space. The degrees of the non-zero elements of $X$ take exactly $\dim X$ values.
'''
source = '''The degree form of Lemma~\ref{lem:polynomial_submodule_trailing_degrees_card}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Induction on $\dim X$: remove the largest degree $n_{0}$ through $X\cap\ker(f\mapsto f_{n_{0}})$.
'''

[[node]]
platform = "DiazModulus.five_point_sumset_rigid"
env = "lemma"
title = 'A rigid five-element set'
statement = '''
Let $k\geq4$, $2\leq m\leq k$, and $A,B\subseteq\Z$ with $|A|=2$, $|B|=3$ and $A+B\subseteq\{-k,-1,0,1,m\}$. Then $m=2$ and $A+B=\{-1,0,1,2\}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$A=\{a,a+d\}$: the difference $d$ occurs at three lower ends in $S$; only $d=1$ with $m=2$ does, at $-1,0,1$.
'''

[[node]]
platform = "DiazModulus.shifted_polynomial_hull_orders"
env = "lemma"
title = 'Orders and degrees of a shifted hull'
statement = '''
Let $2\leq m\leq k$, $Q_{1}\neq0$ with order $k+m$ at $0$ and degree $2k$, and $Q_{2}$ with $Q_{2}(0)\neq0$ and degree $k-m$. Every non-zero $f$ in the span of $X^{k-1},X^{k},X^{k+1},Q_{1},Q_{2}$ has order at $0$ in $\{0,k-1,k,k+1,k+m\}$ and degree in $\{k-m,k-1,k,k+1,2k\}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Read the coefficients: only $Q_{2}$ has a constant term, and only $Q_{1}$ reaches degree $2k$.
'''

[[node]]
platform = "DiazModulus.config_shifted_polynomial_spans"
env = "lemma"
title = 'A configuration as two spaces of polynomials'
statement = '''
Let $u\in\C\setminus\Qbar$, $H\subseteq\Qbar[X]$ a subspace and $N\geq0$. If a configuration $x\otimes y$ has $u^{N}x_{i}y_{j}=Q_{ij}(u)$ with $Q_{ij}\in H$, there are free $a_{1},a_{2}$, free $b_{1},b_{2},b_{3}$ and $P_{0}\neq0$ in $\Qbar[X]$ with $fg\in P_{0}H$ for $f$ in the span of the $a_{i}$ and $g$ in that of the $b_{j}$.
'''
source = '''Not found in the sources read in this form; it is the normalisation in the proof of Theorem~\ref{thm:laurent_hull_config_iff}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$a_{i}=Q_{i1}$, $b_{j}=Q_{1j}$, $P_{0}=Q_{11}$; both sides of $fg=P_{0}h$ agree at the transcendental $u$.
'''

[[node]]
platform = "DiazModulus.rank_one_polynomial_matrix_factor"
env = "lemma"
title = 'Rank-one polynomial matrices'
statement = '''
Let $F$ be a field and $P$ a $2\times3$ matrix over $F[X]$ with non-zero entries and vanishing $2\times2$ minors. Then $P_{ij}=a_{i}b_{j}$ with $a_{1},a_{2}$ coprime.
'''
source = '''Standard; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$a_{i}=P_{i1}/\gcd(P_{11},P_{21})$; coprimality gives $a_{1}\mid P_{1j}$.
'''

[[node]]
platform = "DiazModulus.polynomial_hull_no_two_by_three_configuration"
env = "theorem"
title = 'Polynomial hulls of degree at most one or at least four'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $P\in\Qbar[X]$ has degree at most $1$ or at least $4$, then $W_{P}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries no $2\times3$ configuration.
'''
source = '''For degree at most $1$, $W_{P}$ has dimension $3$ \cite[Theorem 3.4]{Roy95}. For degree at least $4$, not found in the sources read; the method is the valuation count of \cite[\S7]{BSZ17}, at $0$ and $\infty$ together; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The case $P=X^{k}$ is Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}.'''
sketch = '''
Lemma~\ref{lem:config_shifted_polynomial_spans} with $N=\deg P$; Lemmas~\ref{lem:polynomial_submodule_trailing_degrees_card}, \ref{lem:polynomial_submodule_degrees_card}, \ref{lem:shifted_polynomial_hull_orders} and~\ref{lem:five_point_sumset_rigid} make the order sums and the degree sums $\{-1,0,1,2\}$ and $\{-2,-1,0,1\}$ after shifting; a product of order sum $2$ would have its order above its degree.
'''

[[node]]
platform = "DiazModulus.polynomial_hull_two_by_three_configuration_iff"
root = true
env = "theorem"
title = 'Polynomial hulls'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. For $P\in\Qbar[X]$, $W_{P}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries a $2\times3$ configuration if and only if $\deg P\in\{2,3\}$. So at a candidate Roy's theorem excludes $P(u)$ from $\widetilde{\mathcal L}$ through its hull exactly in degrees $2$ and $3$.
'''
source = '''The configurations of degrees $2$ and $3$ are \cite[Théorème 7(1)]{Dia07} at $v=u$, and already \cite[Théorème 2]{Dia04}; the converse was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$(1,u)\otimes(\bar u,1,u)$ and $(1,u^{2})\otimes(\bar u,u+c,\bar Q)$, $Q=u^{3}+cu^{2}$; Theorem~\ref{thm:polynomial_hull_no_two_by_three_configuration}.
'''

[[node]]
platform = "DiazModulus.real_polynomial_hull_no_two_by_three_configuration"
root = true
env = "corollary"
title = 'Real polynomials in Re u and Im u'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $G\in\R[a,b]$ has algebraic coefficients and $z=G(\operatorname{Re}u,\operatorname{Im}u)$, then $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ carries no $2\times3$ configuration.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$z$ is real and a Laurent polynomial in $u$; Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}.
'''

[[node]]
platform = "DiazModulus.rank_one_config_inverse_adjoin"
env = "proposition"
title = 'Adjoining a generic point and its inverse'
statement = '''
Let $K\subseteq F$ be subfields of $\C$, $V_{0}\subseteq F$ a $K$-space and $u$ transcendental over $F$. Every $2\times3$ configuration over $K$ in $V_{0}+Ku+Ku^{-1}$ has its products in $V_{0}$.
'''
source = '''Not found in the sources read in this form; \cite[Proposition 12.2]{Wal00} treats $V_{0}=K$ without $u^{-1}$, and the factorisation is that of Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$ux_{i}y_{j}=P_{ij}(u)$ with $\deg P_{ij}\leq2$; Lemma~\ref{lem:rank_one_polynomial_matrix_factor}; the constant and $X^{2}$ coefficients lie in $K$, so a non-zero one makes $x$ or $y$ dependent; then swap $u$ and $u^{-1}$.
'''

[[node]]
platform = "DiazModulus.logAlgTilde_adjoin_circle_point_no_two_by_three_configuration"
root = true
env = "theorem"
title = "A barrier for Roy's theorem"
statement = '''
Assume Roy's theorem: there is no $2\times3$ configuration in $\widetilde{\mathcal L}$. If $u\bar u\in\Qbar$ and $u$ is transcendental over the field generated by $\widetilde{\mathcal L}$, there is none in $\widetilde{\mathcal L}+\Qbar u+\Qbar\bar u$ either.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\bar u=\rho u^{-1}$; Proposition~\ref{prop:rank_one_config_inverse_adjoin} with $K=\Qbar$ and $V_{0}=\widetilde{\mathcal L}$.
'''
