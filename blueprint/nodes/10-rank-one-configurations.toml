# Chapter 10. Read by scripts/gen_blueprint.py; see its docstring for the format.

[chapter]
title = "Rank-one configurations near a point of a circle"
text = '''
Results of the library's work on Diaz's conjecture, about the hypothesis that rank-one statements need. The six exponentials theorem (Chapter~\ref{chap:05-six-exponentials}) and Roy's strong six exponentials theorem \cite{Roy92} take as input a \emph{configuration}: $x_1,x_2$ linearly independent over $\Qbar$ and $y_1,y_2,y_3$ linearly independent over $\Qbar$, with all six products $x_iy_j$ in a given $\Qbar$-vector space. Near a point $u$ of a circle of algebraic radius, that is $u\neq0$ with $u\bar u$ algebraic, the chapter asks which spaces containing $H_0=\Qbar+\Qbar u+\Qbar\bar u$ carry one, and which of those Roy's theorem can use at a candidate. No statement here involves $e^{u}$, so all keep their content if Diaz's conjecture holds.

The first sections answer the question in small dimension. Generic data carry no configuration, whatever numbers are added (Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration}, called Theorem~A). The four-dimensional extensions $H_0+\Qbar z$ that carry one are exactly those containing $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$ (Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}, called Theorem~B; several titles below use that name). In the power hulls $\Qbar u^{-k}+\Qbar u^{-1}+\Qbar+\Qbar u+\Qbar u^{k}$ a configuration exists only for $k=2$ and $k=3$, so through these hulls Roy's theorem excludes no single power beyond $u^{3}$ at a candidate (Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}). The sections on separation and on Laurent hulls put these results into one mechanism over any field: separation (Theorem~\ref{thm:rank_one_config_separation}), the normal form of $2\times2$ configurations (Theorem~\ref{thm:circle_point_two_by_two_normal_form}) and configurations in Laurent hulls (Theorem~\ref{thm:laurent_hull_config_iff}).

The other sections are about five-dimensional spaces, where a configuration can escape the four-dimensional extensions. The section on five-dimensional extensions gives the first such spaces, $H_0+\Qbar z+\Qbar\bar z$ (Theorem~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions}). When the six products span only four dimensions (Case~I), the configuration is a geometric progression \cite[Lemma 4]{BSZ17}: two poles and every Möbius involution of the $u$-line give such spaces, and a progression whose ratio is rational in $u$ lies in a space that contains $u^{2}$, $u^{-2}$ or some $1/(u-b)$, or in an involution space (Theorem~\ref{thm:progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space}). When the products span the whole space (Case~II), the conjugation-stable spaces with a factor of degree one are the real pencil spaces (Theorem~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space}); the last section shows that a factor of degree two can occur without one of degree one (Theorems~\ref{thm:laurent_cubic_configuration_invisible_to_four_dimensional_extensions} and~\ref{thm:laurent_cubic_space_no_mobius_ratio_configuration}), that no factor of higher degree can (Theorem~\ref{thm:progression_pair_span_ratio_degree_le_two}), and which real pencil spaces with Laurent data the four-dimensional extensions see (Theorem~\ref{thm:laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions} and Proposition~\ref{prop:laurent_real_pencil_space_contains_square_of_root}). The section on Case II beyond degree one ends with a formal member of each of the three families of conjugation-stable invisible spaces with a factor of degree two that the research notes classify, for every involution of the $u$-line that commutes with conjugation: two orbits fixed by conjugation (Proposition~\ref{prop:conj_stable_two_orbit_space}), two orbits exchanged by it (Theorem~\ref{thm:laurent_cubic_configuration_invisible_to_four_dimensional_extensions}, where they are $0$ and $\infty$, and Theorem~\ref{thm:conj_swapped_two_orbit_configuration_invisible_to_four_dimensional_extensions}), and a cyclic family (Theorem~\ref{thm:cyclic_pair_configuration_invisible_to_four_dimensional_extensions}). All the members use the involution $u\mapsto-u$, their configurations are those of \cite[Théorème 7(1)]{Dia07} at $v=u$, and the classification itself is not formalised. The last section is about polynomial hulls: $\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries a configuration exactly when $\deg P\in\{2,3\}$ (Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff}), real polynomials in $\operatorname{Re}u$ and $\operatorname{Im}u$ carry none (Corollary~\ref{cor:real_polynomial_hull_no_two_by_three_configuration}), and adjoining to $\widetilde{\mathcal L}$ a point of a circle that is transcendental over its field keeps Roy's theorem true (Theorem~\ref{thm:logAlgTilde_adjoin_circle_point_no_two_by_three_configuration}). Chapter~\ref{chap:14-not-found-in-the-sources} says which of these results were not found in the sources read, and which are not routine.
'''

# --- Generic data ------------------------------------------------------------------------

[[node]]
platform = "DiazModulus.generic_circle_point_no_two_by_three_configuration"
root = true
env = "theorem"
section = "Generic data"
title = "No configuration on generic data"
statement = '''
Let $u\neq0$ with $u\bar u$ algebraic, and let $w_1,\dots,w_m\in\C$ be such that $u,w_1,\dots,w_m$ are algebraically independent over $\Qbar$. Then there are no $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $\Qbar+\Qbar u+\Qbar\bar u+\sum_j\Qbar w_j$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The case $m=0$ is \cite[Theorem 3.4]{Roy95} and \cite[Lemma 12.16 and Exercise 12.10]{Wal00}; see also \cite[\S3.2]{Roy95} and \cite[p.~186]{Fis01}. The general statement was not found in the sources read. It follows from Theorem~\ref{thm:rank_one_config_separation} and the bound $p+q\le4$ in the hull (Corollary~\ref{cor:generic_circle_point_config_is_two_by_two}).'''
sketch = '''
Multiply by $u$. Since $\bar u=\rho/u$ with $\rho$ algebraic, every element of the space times $u$ is the value at $(u,w)$ of a polynomial over $\Qbar$ of total degree at most two that is constant once its first variable $X_0$ is set to $0$, and evaluation at $(u,w)$ is injective. A configuration therefore gives a rank-one $2\times3$ matrix of such polynomials, which factors as $(h,g)\otimes(c_0,c_1,c_2)$ with both factors free. Total degrees add, and $X_0\mapsto0$ is a ring map; each case puts two free vectors in a line or three in a plane.
'''

# --- Four-dimensional extensions ---------------------------------------------------------

[[node]]
platform = "DiazModulus.two_by_three_configuration_forces_progression"
section = "Four-dimensional extensions"
title = "A configuration in dimension four is a progression"
statement = '''
Let $V\subseteq\C$ be a $\Qbar$-vector subspace of dimension at most $4$, and let $x_1,x_2$ and $y_1,y_2,y_3$ be linearly independent over $\Qbar$ with all six products $x_iy_j$ in $V$. Then
\[ V=\Qbar\,b+\Qbar\,bh+\Qbar\,bh^{2}+\Qbar\,bh^{3} \]
for some $b\neq0$ and $h\notin\Qbar$.
'''
source = '''In print: \cite[Lemma 4]{BSZ17}, over any field. The converse direction, that such a progression carries a configuration, is used in \cite[Lemma 6.1]{Fis01} and \cite[Théorème 7(2)]{Dia07}.'''
sketch = '''
Put $h=x_2/x_1$, which is not in $\Qbar$ and so is transcendental, and $B=x_1(\Qbar y_1+\Qbar y_2+\Qbar y_3)$. Both $B$ and $hB$ lie in $V$, so $W=B\cap hB$ has dimension at least $2$. The spaces $W$ and $h^{-1}W$ lie in $B$ and have dimension at least $2$, so they meet in some $c=hb\neq0$ with $b\in B$. Then $b,hb,h^{2}b\in B$ and $h^{3}b\in hB$: four free vectors in $V$.
'''

[[node]]
platform = "DiazModulus.cubic_product_eq_square_normal_form"
title = "A normal form for $P_1P_2=P_0^2$"
statement = '''
Let $K$ be a field and $P_0,P_1,P_2\in K[X]$ with $\deg P_1,\deg P_2\le3$, $P_1P_2=P_0^{2}$, and $P_0,P_1$ linearly independent over $K$. Then there are $Q_0,Q_1\in K[X]$ of degree at most $1$, linearly independent over $K$, and $a,b\in K$ such that, with $g=aQ_0+bQ_1$,
\[ P_0=g\,Q_0Q_1,\qquad P_1=g\,Q_1^{2},\qquad P_2=g\,Q_0^{2}. \]
'''
source = '''Elementary.'''
sketch = '''
Divide out a common factor: $P_0=dQ_0$ and $P_1=dQ_1$ with $Q_0,Q_1$ coprime. Then $Q_1P_2=dQ_0^{2}$, so $Q_1$ divides $d$, say $d=gQ_1$. Degrees add, so $\deg Q_i\le1$. A relation between $Q_0$ and $Q_1$ would be one between $P_0$ and $P_1$, so they are independent; one of them has degree $1$, hence $\deg g\le1$, and by Cramer's rule $g=aQ_0+bQ_1$.
'''

[[node]]
platform = "DiazModulus.circle_hull_progression_contains_square_or_reciprocal"
title = 'A progression through $1$, $u$ and $\bar u$'
statement = '''
Let $u\in\C\setminus\Qbar$ with $u\bar u$ algebraic, let $b\neq0$ and $h\notin\Qbar$, and suppose that $V=\Qbar\,b+\Qbar\,bh+\Qbar\,bh^{2}+\Qbar\,bh^{3}$ contains $1$, $u$ and $\bar u$. Then $V$ contains $u^{2}$, or $\bar u^{2}$, or $1/(u-a)$ for some $a\in\Qbar$, $a\neq0$.
'''
source = '''A step of Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}.'''
sketch = '''
Write $1=bP_0(h)$, $u=bP_1(h)$ and $u^{-1}=\bar u/(u\bar u)=bP_2(h)$ with $\deg P_i\le3$. As $h$ is transcendental, $P_1P_2=P_0^{2}$, and $P_0,P_1$ are independent because $u\notin\Qbar$. Lemma~\ref{lem:cubic_product_eq_square_normal_form} gives $g=aQ_0+cQ_1$ and $u=Q_1(h)/Q_0(h)$. If $c=0$, then $u^{2}=b\,aQ_1(h)^{3}$; if $a=0$, then $\bar u^{2}=b\,\rho^{2}c\,Q_0(h)^{3}$ with $\rho=u\bar u$; otherwise $1/(u+a/c)=b\,c\,Q_0(h)^{2}Q_1(h)$.
'''

[[node]]
platform = "DiazModulus.circle_point_extension_carries_two_by_three_configuration"
env = "proposition"
title = "Three spaces that carry a configuration"
statement = '''
Let $u\in\C\setminus\Qbar$ with $u\bar u$ algebraic, and let $w$ be $u^{2}$, $\bar u^{2}$, or $1/(u-a)$ with $a\in\Qbar$, $a\neq0$. Then there are $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w$.
'''
source = '''The configurations behind \cite[Corollaire 5(1) and 5(4)]{Dia07}, used there with Roy's strong six exponentials theorem \cite{Roy92}.'''
sketch = '''
Here $u^{-1}=\bar u/(u\bar u)$ lies in the space. Take $(1,u)\otimes(u^{-1},1,u)$ for $u^{2}$, $(1,u^{-1})\otimes(u,1,u^{-1})$ for $\bar u^{2}$, and $(u^{-1},(u-a)^{-1})\otimes(1,u,u^{2}-au)$ for $1/(u-a)$. The families are free because $u$ is transcendental; the last one uses $a\neq0$.
'''

[[node]]
platform = "DiazModulus.circle_point_extension_two_by_three_configuration_iff"
root = true
novelty = "not-routine"
env = "theorem"
title = "The four-dimensional extensions that carry a configuration"
statement = '''
Let $u\in\C\setminus\Qbar$ with $u\bar u$ algebraic, put $H_0=\Qbar+\Qbar u+\Qbar\bar u$, and let $z\notin H_0$. There are $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $H_0+\Qbar z$ if and only if $z\in H_0+\Qbar w$ for $w=u^{2}$, $w=\bar u^{2}$, or $w=1/(u-a)$ with $a\in\Qbar$, $a\neq0$.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). With Roy's strong six exponentials theorem \cite{Roy92}, the ``if'' direction gives at a candidate the exclusions of \cite[Corollaire 5(1) and 5(4)]{Dia07}; every configuration has the shape of \cite[Lemma 6.1]{Fis01} and \cite[Théorème 7(2)]{Dia07}. Its key step, Lemma~\ref{lem:two_by_three_configuration_forces_progression}, is \cite[Lemma 4]{BSZ17}.'''
sketch = '''
If $z\in H_0+\Qbar w$ and $z\notin H_0$, then $H_0+\Qbar z=H_0+\Qbar w$, which carries a configuration by Proposition~\ref{prop:circle_point_extension_carries_two_by_three_configuration}. Conversely, Lemma~\ref{lem:two_by_three_configuration_forces_progression} writes $H_0+\Qbar z$ as $b(\Qbar+\Qbar h+\Qbar h^{2}+\Qbar h^{3})$ with $h\notin\Qbar$, and Lemma~\ref{lem:circle_hull_progression_contains_square_or_reciprocal} puts $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$ in it. That element is not in $H_0$, since $u$ is transcendental, so $z\in H_0+\Qbar w$.

Since $\widetilde{\mathcal L}$, the $\Qbar$-span of $1$ and the logarithms of algebraic numbers, is closed under complex conjugation, a hypothesis $z\in\widetilde{\mathcal L}$ also brings $\bar z$; the five-dimensional spaces $H_0+\Qbar z+\Qbar\bar z$ are the subject of the next section.
'''

# --- Five-dimensional extensions ---------------------------------------------------------

[[node]]
platform = "DiazModulus.circle_point_conjugate_pair_extension_carries_two_by_three_configuration"
env = "proposition"
section = "Five-dimensional extensions"
title = "Two families of five-dimensional spaces that carry a configuration"
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u$ algebraic, let $a\in\Qbar$, $a\neq0$, and let $z=u/(u^{2}-a)$ if $a\bar a\neq\rho^{2}$, or $z=u/(u^{2}-a)^{2}$ if $a\bar a=\rho^{2}$. Then there are $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$.
'''
source = '''Rescaled, the configuration is the one in the proofs of \cite[Théorème 2]{Dia04} and \cite[Théorèmes 6(1) and 7(1)]{Dia07}, and the progression of \cite[Lemma 6.1]{Fis01}.'''
sketch = '''
In the first case put $a'=\rho^{2}/\bar a$, which differs from $a$; then $\bar z=-(\rho/\bar a)\,u/(u^{2}-a')$, and let $b=1/(u(u^{2}-a)(u^{2}-a'))$. In the second, $\bar z=(\rho/\bar a^{2})\,u^{3}/(u^{2}-a)^{2}$, and let $b=1/(u(u^{2}-a)^{2})$. Partial fractions in $u^{2}$, with $u^{-1}=\bar u/\rho$, put $b,bu^{2},bu^{4},bu^{6}$ in the space, so $(1,u^{2})\otimes(b,bu^{2},bu^{4})$ is a configuration, free because $u$ is transcendental.
'''

[[node]]
platform = "DiazModulus.circle_point_conjugate_pair_extension_excludes_squares_and_reciprocals"
title = "What these spaces do not contain"
statement = '''
With $u$, $a$ and $z$ as in Proposition~\ref{prop:circle_point_conjugate_pair_extension_carries_two_by_three_configuration}, the space $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ contains neither $u^{2}$ nor $\bar u^{2}$, nor $1/(u-b)$ for any $b\in\Qbar$, $b\neq0$.
'''
source = '''Elementary.'''
sketch = '''
Clearing denominators turns a membership into $A(u^{2})+u\,B(u^{2})=0$ with $A,B\in\Qbar[X]$. The same identity holds at $-u$, so $A=B=0$. For $u^{2}$ the odd part is not zero; for $\bar u^{2}=\rho^{2}/u^{2}$ the even part is not zero at $0$; for $1/(u-b)=(u+b)/(u^{2}-b^{2})$ the odd part is not zero at $b^{2}$.
'''

[[node]]
platform = "DiazModulus.circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = "Configurations invisible to the four-dimensional extensions"
statement = '''
With $u$, $a$ and $z$ as in Proposition~\ref{prop:circle_point_conjugate_pair_extension_carries_two_by_three_configuration}, put $H_0=\Qbar+\Qbar u+\Qbar\bar u$ and $W=H_0+\Qbar z+\Qbar\bar z$. Then $W$ carries a configuration, but for no $w\in W\setminus H_0$ does $H_0+\Qbar w$ carry one.
'''
source = '''Not found in the sources read, but routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The shape of the configuration is printed; see Proposition~\ref{prop:circle_point_conjugate_pair_extension_carries_two_by_three_configuration}.'''
sketch = '''
The configuration is Proposition~\ref{prop:circle_point_conjugate_pair_extension_carries_two_by_three_configuration}. If $H_0+\Qbar w$ carried one, Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} would give $w\in H_0+\Qbar t$ with $t$ one of $u^{2}$, $\bar u^{2}$, $1/(u-b)$. Since $w\notin H_0$, exchange puts $t$ in $H_0+\Qbar w\subseteq W$, against Lemma~\ref{lem:circle_point_conjugate_pair_extension_excludes_squares_and_reciprocals}. The configuration does not need all of $W$: its six products span the odd part $\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$.
'''

[[node]]
platform = "DiazModulus.conj_stable_circle_point_extension_no_two_by_three_configuration"
root = true
env = "proposition"
title = "The conjugation-stable case carries none"
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u$ algebraic, and let $a\in\Qbar$, $a\neq0$, with $a\bar a=\rho^{2}$. Then there are no $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $\Qbar+\Qbar u+\Qbar\bar u+\Qbar\,u/(u^{2}-a)$.
'''
source = '''A consequence of Theorem~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions}. It is where the hypotheses of \cite[Théorème 2]{Dia04} and of \cite[Corollaire 4(4) and Théorème 7(1)]{Dia07} fail for this family.'''
sketch = '''
Here $z=u/(u^{2}-a)$ has $\bar z=-(\rho/\bar a)z$, so the space is stable under conjugation. With $z_2=u/(u^{2}-a)^{2}$, the element $u/(u^{2}-a)=(\bar a^{2}/\rho)\bar z_2-az_2$ lies in $H_0+\Qbar z_2+\Qbar\bar z_2$ and not in $H_0$, so Theorem~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions} applies. When $a\bar a\neq\rho^{2}$, adding $\bar z$ gives a space that does carry a configuration.
'''

[[node]]
platform = "DiazModulus.logAlg_conj_stable"
title = "Conjugation keeps the logarithms"
statement = '''
If $\lambda$ is a logarithm of an algebraic number, so is $\bar\lambda$.
'''
source = '''Elementary.'''
sketch = '''
$e^{\bar\lambda}=\overline{e^{\lambda}}$, and the conjugate of an algebraic number is algebraic.
'''

[[node]]
platform = "DiazModulus.logAlgTilde_conj_stable"
title = 'Conjugation keeps $\widetilde{\mathcal L}$'
statement = '''
The $\Qbar$-vector space $\widetilde{\mathcal L}$ spanned by $1$ and the logarithms of algebraic numbers is closed under complex conjugation.
'''
source = '''Elementary; it is the stability that \cite[Théorème 2]{Dia04} uses.'''
sketch = '''
Conjugation fixes $1$, sends logarithms to logarithms (Lemma~\ref{lem:logAlg_conj_stable}), and $\overline{c\lambda}=\bar c\,\bar\lambda$ with $\bar c\in\Qbar$.
'''

[[node]]
platform = "DiazModulus.candidate_div_sq_sub_not_mem_logAlgTilde"
root = true
env = "corollary"
title = "Two exclusions at a candidate"
statement = '''
Assume Roy's strong six exponentials theorem, and let $u$ be a candidate: $u\neq0$, $|u|$ algebraic and $e^{u}$ algebraic. Let $a\in\Qbar$, $a\neq0$, and $\rho=u\bar u$. Then $u/(u^{2}-a)\notin\widetilde{\mathcal L}$ if $a\bar a\neq\rho^{2}$, and $u/(u^{2}-a)^{2}\notin\widetilde{\mathcal L}$ if $a\bar a=\rho^{2}$.
'''
source = '''One substitution in \cite[Théorème 2]{Dia04}, at $x=(u,\bar u)$ and $y=1/(u^{2}-a)$, and in \cite[Corollaire 4(4) and Théorème 7(1)]{Dia07}; the second part is \cite[Théorème 6(3)]{Dia07}. Roy's theorem is \cite{Roy92}.'''
sketch = '''
$\widetilde{\mathcal L}$ is closed under conjugation and contains $1$, $u$ and $\bar u$, so $z\in\widetilde{\mathcal L}$ would put the space of Proposition~\ref{prop:circle_point_conjugate_pair_extension_carries_two_by_three_configuration} in $\widetilde{\mathcal L}$, with its configuration, against Roy's theorem.
'''

# --- Power hulls ---------------------------------------------------------------------------

[[node]]
platform = "DiazModulus.power_hull_strong_six_exp_configuration_iff"
root = true
env = "theorem"
section = "Power hulls"
title = "Configurations in the power hulls"
statement = '''
Let $u\in\C\setminus\Qbar$ and $k\ge1$. There are $x_1,x_2$, linearly independent over $\Qbar$, and $y_1,y_2,y_3$, linearly independent over $\Qbar$, with all six products $x_iy_j$ in $\Qbar u^{-k}+\Qbar u^{-1}+\Qbar+\Qbar u+\Qbar u^{k}$ if and only if $k=2$ or $k=3$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). For $k=2,3$ the configurations are geometric progressions of four elements, which \cite[Théorème 7(2)]{Dia07} excludes from $\widetilde{\mathcal L}$ with Roy's theorem (\cite[Lemma 6.1]{Fis01} excludes them from $\mathcal L$ with the six exponentials theorem); at a candidate they give \cite[Corollaire 5(1) and 5(2)]{Dia07}. The direction ``only for $k=2,3$'' was not found; Diaz remarks that inside that theorem one cannot hope to go very far \cite[p.~390]{Dia07}. It is the case $S=\{0,\pm1,\pm k\}$ of Theorem~\ref{thm:laurent_hull_config_iff}; it concerns a single power $u^{k}$ through its hull, and Proposition~\ref{prop:power_pair_hull_two_by_three_iff} still excludes pairs of higher powers.'''
sketch = '''
For $k=2$ take $(1,u)\otimes(u^{-1},1,u)$, and for $k=3$ take $(u,u^{-1})\otimes(1,u^{-2},u^{2})$. Conversely, multiply by $u^{k}$: the products become polynomials in $u$ supported on $\{0,k-1,k,k+1,2k\}$, and since $u$ is transcendental a rank-one $2\times3$ matrix of them, with free rows and columns, has rows that differ by a fixed non-zero shift of the orders at $0$. For $k=1$ and for $k\ge4$ no shift keeps three exponents of that set inside it.
'''

# --- Separation and the normal form (R6) ---------------------------------------------------

[[node]]
platform = "DiazModulus.rank_one_config_separation_two"
env = "lemma"
section = "Separation and the normal form"
title = 'Separation for one number'
statement = '''
Let $K\subseteq F$ be subfields of $\C$, $V_0\subseteq F$ a $K$-space and $w$ transcendental over $F$. If $x_1,x_2$ and $y_1,y_2$ are each linearly independent over $K$ and every $x_iy_j$ lies in $V_0+Kw$, then every $x_iy_j$ lies in $V_0$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write $x_iy_j=c_{ij}+\ell_{ij}w$ with $c_{ij}\in V_0$, $\ell_{ij}\in K$. Since $w$ is transcendental over $F$ and $\det(C+wL)=0$, $\det L=0$. A non-zero column $j$ of $L$ gives $z=\ell_{2j}x_1-\ell_{1j}x_2\neq0$ with $zy_1,zy_2\in F$; comparing coefficients of $w$ in $(zy_1)(x_iy_2)=(zy_2)(x_iy_1)$ gives $z(\ell_{i2}y_1-\ell_{i1}y_2)=0$, so $L=0$ by the independence of $y$.
'''

[[node]]
platform = "DiazModulus.rank_one_config_separation"
root = true
env = "theorem"
title = 'Separation'
statement = '''
A $p\times q$ \emph{configuration over $K$} in a $K$-space $V\subseteq\C$ is a pair of families $x_1,\dots,x_p$ and $y_1,\dots,y_q$, each linearly independent over $K$, with every product $x_iy_j$ in $V$.

Let $K\subseteq F$ be subfields of $\C$, $V_0\subseteq F$ a $K$-space and $w_1,\dots,w_m$ algebraically independent over $F$. Every $p\times q$ configuration over $K$ with $p,q\ge2$ in $V_0+Kw_1+\dots+Kw_m$ lies in $V_0$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It contains the separation steps of Theorems~\ref{thm:generic_circle_point_no_two_by_three_configuration} and~\ref{thm:generic_period_never_enters}, which are over $\Qbar$. Its case $V_0=K=\Qbar$ follows from \cite[Proposition 12.2 and the Remark on p.~424]{Wal00}, whose argument it extends.'''
sketch = '''
Induction on $m$, over $F(w_1,\dots,w_{m-1})$: every entry lies in a $2\times2$ block, to which Lemma~\ref{lem:rank_one_config_separation_two} applies.
'''

[[node]]
platform = "DiazModulus.polynomial_submodule_trailing_degrees_card"
env = "lemma"
title = 'Orders at zero of a space of polynomials'
statement = '''
Let $K$ be a field and $X\subseteq K[X]$ a finite-dimensional $K$-space. The orders at $0$ of the non-zero elements of $X$ take exactly $\dim X$ values.
'''
source = '''Standard: the valuation argument of \cite[proof of Theorem 33]{BSZ17}.'''
sketch = '''
Induction on $\dim X$: if $n_0$ is the least order, attained by $f_0$, the elements with coefficient $0$ at $X^{n_0}$ form a complement of $Kf_0$ whose orders are the others.
'''

[[node]]
platform = "DiazModulus.polynomial_submodule_mul_finrank_ge"
env = "lemma"
title = 'Linear Cauchy--Davenport for polynomials'
statement = '''
For non-zero finite-dimensional $K$-spaces $X,Y\subseteq K[X]$, the span $XY$ of the products satisfies $\dim X+\dim Y\le\dim XY+1$.
'''
source = '''A case of the linear Cauchy--Davenport theorem of Eliahou and Lecouvey, as stated in \cite[Theorem 2]{BSZ17}.'''
sketch = '''
The order sets $A,B$ of $X,Y$ have $\dim X$ and $\dim Y$ elements (Lemma~\ref{lem:polynomial_submodule_trailing_degrees_card}), and $A+B$ lies in the order set of $XY$; Cauchy--Davenport in $\mathbb N$.
'''

[[node]]
platform = "DiazModulus.rank_one_config_card_le_finrank_add_one"
env = "proposition"
title = 'Configurations in a space of rational functions'
statement = '''
Let $u$ be transcendental over a subfield $K\subseteq\C$ and $V_0\subseteq K(u)$ a finite-dimensional $K$-space. Every $p\times q$ configuration over $K$ in $V_0$ has $p+q\le\dim V_0+1$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Clear denominators: $g(u)x_iy_j=A_{ij}(u)$ with $A_{i1}A_{1j}=A_{11}A_{ij}$ in $K[X]$; the spans of the $A_{i1}$ and of the $A_{1j}$ have dimensions $p$ and $q$, and Lemma~\ref{lem:polynomial_submodule_mul_finrank_ge} bounds the span of their products, which embeds in $V_0$.
'''

[[node]]
platform = "DiazModulus.circle_point_config_card_le_four"
env = "corollary"
title = 'At most $2\times2$ near a point of a circle'
statement = '''
Let $u$ be transcendental over a subfield $K\subseteq\C$ with $\rho=u\bar u\in K$. Every $p\times q$ configuration over $K$ in $K+Ku+K\bar u$ has $p+q\le4$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Over $\Qbar$ it is a case of a lemma of Roy, \cite[Lemma 12.16]{Wal00} (not the lemma of Chapter~\ref{chap:08-roy-lemma}).'''
sketch = '''
$K+Ku+K\bar u\subseteq K(u)$ has dimension $3$; Proposition~\ref{prop:rank_one_config_card_le_finrank_add_one}.
'''

[[node]]
platform = "DiazModulus.generic_circle_point_config_is_two_by_two"
env = "corollary"
title = 'Generic numbers never enter'
statement = '''
Let $u,w_1,\dots,w_m$ be algebraically independent over a subfield $K\subseteq\C$, with $\rho=u\bar u\in K$. Every $p\times q$ configuration over $K$ with $p,q\ge2$ in $K+Ku+K\bar u+Kw_1+\dots+Kw_m$ is $2\times2$ and lies in $K+Ku+K\bar u$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). For $K=\Qbar$ it contains Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration}.'''
sketch = '''
Theorem~\ref{thm:rank_one_config_separation} with $F=K(u)$, then Corollary~\ref{cor:circle_point_config_card_le_four}.
'''

[[node]]
platform = "DiazModulus.circle_point_two_by_two_normal_form"
root = true
env = "theorem"
title = 'The normal form'
statement = '''
Let $u$ be transcendental over a subfield $K\subseteq\C$ with $\rho=u\bar u\in K$. Then $x_1,x_2$ and $y_1,y_2$ form a $2\times2$ configuration over $K$ in $K+Ku+K\bar u$ if and only if $x_i=\mu(P_{i1}+P_{i2}u)$ and $y_j=\mu^{-1}(Q_{1j}+Q_{2j}\bar u)$ for some $\mu\neq0$ and invertible $P,Q\in K^{2\times2}$: the configurations form the orbit of $(1,u)\otimes(1,\bar u)$ under $\mathrm{GL}_2(K)\times\mathrm{GL}_2(K)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It extends the two-dimensional critical-pair lemma of \cite[Lemmas 4 and 5]{BSZ17}; the configuration $(1,u)\otimes(1,\bar u)$ itself is \cite[p.~431]{Wal00}.'''
sketch = '''
$ux_iy_j=A_{ij}(u)$ with $\deg A_{ij}\le2$, and the vanishing minor factors $A_{ij}=a_ib_j$ in $K[X]$ (extract a gcd). Neither the $a_i$ nor the $b_j$ are both constant, so all have degree at most $1$; then $x_i=\mu a_i(u)$ and $y_j=\mu^{-1}b_j(u)/u$, with $1/u=\bar u/\rho$.
'''

[[node]]
platform = "DiazModulus.circle_point_config_constant_matrix_det_ne_zero"
env = "corollary"
title = 'The constant terms form an invertible matrix'
statement = '''
In the setting of Corollary~\ref{cor:generic_circle_point_config_is_two_by_two}, for every $2\times2$ configuration there is an invertible $c\in K^{2\times2}$ with $x_iy_j-c_{ij}\in Ku+K\bar u$. In particular no $2\times2$ configuration lies in $Ku+K\bar u+Kw_1+\dots+Kw_m$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It sharpens \texttt{Diaz.generic\_qbar\_homogeneous\_four\_exp\_barrier}, the homogeneous barrier of the companion note.'''
sketch = '''
Corollary~\ref{cor:generic_circle_point_config_is_two_by_two}, then Theorem~\ref{thm:circle_point_two_by_two_normal_form}: $c=P\,\mathrm{diag}(1,\rho)\,Q$, of determinant $\rho\det P\det Q\neq0$.
'''

[[node]]
platform = "DiazModulus.two_by_two_config_critical_progression"
root = true
env = "lemma"
title = 'Three products: a progression'
statement = '''
Let $x_1,x_2$ and $y_1,y_2$ be pairs, each linearly independent over a subfield $K\subseteq\C$, whose four products span a $K$-space of dimension $3$. Then $\operatorname{span}(x_1,x_2)=Ka+Kah$ and $\operatorname{span}(y_1,y_2)=Kb+Kbh$ for some $h\notin K$ and $a,b\neq0$.
'''
source = '''The dimension-2 case of \cite[Lemmas 4--5]{BSZ17}, stated there for a base field algebraically closed in the extension; here over any subfield.'''
sketch = '''
A relation $x_1u'+x_2v=0$ with $u',v\in\operatorname{span}(y)$, $v\neq0$; take $h=x_2/x_1$, $a=x_1$, $b=v$, so that $bh=-u'$.
'''

[[node]]
platform = "DiazModulus.algebraic_mem_span_logAlg_eq_zero"
env = "lemma"
title = 'Baker: no algebraic number in $\Qbar\mathcal L$'
statement = '''
An algebraic number in the $\Qbar$-span of the logarithms of algebraic numbers is $0$.
'''
source = '''A consequence of Baker's theorem \cite{Bak66}.'''
sketch = '''
Choose a $\Q$-linearly independent family of logarithms with the same $\Q$-span, write $z$ on it with algebraic coefficients, and apply Theorem~\ref{thm:baker_linear_forms_in_logarithms} with constant term $-z$.
'''

[[node]]
platform = "DiazModulus.candidate_two_by_two_config_entry_not_mem_span_logAlg"
root = true
env = "corollary"
title = 'Not a matrix of logarithms'
statement = '''
Let $u$ be a candidate with $u,w_1,\dots,w_m$ algebraically independent over $\Qbar$. In every $2\times2$ configuration over $\Qbar$ in $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w_1+\dots+\Qbar w_m$, each row and each column has an entry outside $\Qbar\mathcal L$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Corollary~\ref{cor:circle_point_config_constant_matrix_det_ne_zero} with $K=\Qbar$: an entry with $c_{ij}\neq0$ in $\Qbar\mathcal L$ would put $c_{ij}$ in $\Qbar\mathcal L$, as $u,\bar u\in\mathcal L$; Lemma~\ref{lem:algebraic_mem_span_logAlg_eq_zero}.
'''

# --- Laurent hulls (R6) ----------------------------------------------------------------------

[[node]]
platform = "DiazModulus.two_sumset_iff_difference_count"
env = "lemma"
section = "Laurent hulls"
title = 'Sumsets with two summands'
statement = '''
A finite $S\subseteq\Z$ contains $A+B$ with $|A|=2$, $|B|=q$ if and only if some $d>0$ has $\#\{s\in S:s+d\in S\}\ge q$.
'''
source = '''Elementary.'''
sketch = '''
For $A=\{a,a+d\}$, $A+B\subseteq S$ says that $a+B$ lies in $\{s\in S:s+d\in S\}$.
'''

[[node]]
platform = "DiazModulus.laurent_hull_config_iff"
root = true
env = "theorem"
title = 'Configurations in Laurent hulls'
statement = '''
A $p\times q$ \emph{configuration over $K$} in a $K$-space $V\subseteq\C$ is a pair of families $x_1,\dots,x_p$ and $y_1,\dots,y_q$, each linearly independent over $K$, with every product $x_iy_j$ in $V$.

Let $u$ be transcendental over a subfield $K\subseteq\C$ and $S\subseteq\Z$ finite. The $K$-span of the $u^s$, $s\in S$, carries a $p\times q$ configuration ($p,q\ge1$) if and only if $A+B\subseteq S$ for some $|A|=p$, $|B|=q$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff} is the case $S=\{0,\pm1,\pm k\}$; the nearest printed result is \cite[Lemma 6.1]{Fis01}. Its proof is the valuation method of \cite[\S7]{BSZ17}.'''
sketch = '''
Distinct powers of $u$ are independent. Conversely, $P_{ij}(u)=u^Nx_iy_j$ with $P_{ij}$ supported on $S+N$; the spans of the $P_{i1}$ and the $P_{1j}$ have $p$ and $q$ orders at $0$ (Lemma~\ref{lem:polynomial_submodule_trailing_degrees_card}), and $fg=P_{11}h$ puts their sums, shifted, in $S$.
'''

[[node]]
platform = "DiazModulus.power_pair_difference_count_iff"
env = "lemma"
title = 'Three equal differences in $\{0,\pm1,\pm k,\pm l\}$'
statement = '''
For integers $4\le k<l$, some difference occurs three times in $\{0,\pm1,\pm k,\pm l\}$ if and only if $l\in\{k+1,k+2,2k-1,2k,2k+1,3k\}$.
'''
source = '''Elementary.'''
sketch = '''
The positive differences are $1,k-1,k,k+1,l-1,l,l+1,l-k,l+k$ twice each and $2,2k,2l$ once each; a third occurrence needs one of the six coincidences.
'''

[[node]]
platform = "DiazModulus.power_pair_hull_two_by_three_iff"
root = true
env = "proposition"
title = 'Pairs of powers'
statement = '''
Let $u$ be transcendental over a subfield $K\subseteq\C$ and $4\le k<l$. The span of the $u^s$, $s\in\{0,\pm1,\pm k,\pm l\}$, carries a $2\times3$ configuration if and only if $l\in\{k+1,k+2,2k-1,2k,2k+1,3k\}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The exclusions it gives at a candidate are substitutions in \cite{Dia07} (Corollary~\ref{cor:candidate_power_pair_not_both_mem_logAlgTilde}).'''
sketch = '''
Theorem~\ref{thm:laurent_hull_config_iff}, Lemma~\ref{lem:two_sumset_iff_difference_count} and Lemma~\ref{lem:power_pair_difference_count_iff}.
'''

[[node]]
platform = "DiazModulus.four_pow_hull_no_two_by_three"
root = true
env = "proposition"
title = 'The powers $u^{4^j}$'
statement = '''
Let $u$ be transcendental over a subfield $K\subseteq\C$. The span of the $u^s$, $s\in\{0,\pm1\}\cup\{\pm4^j:j\ge1\}$, carries no $2\times3$ configuration. So at a candidate, Roy's theorem used through Laurent hulls cannot exclude $u^{4^j}\in\widetilde{\mathcal L}$ for all $j$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Not in \cite{Dia07} (p.~390) nor \cite{Fis01}.'''
sketch = '''
Reduce to a finite part. For a pair $s<s+d$ with $M=\max(|s|,|s+d|)$, either $s=-M$, $d=2M$, or $|d-M|\le M/4$ and $s\in\{M-d,-M\}$; distinct non-zero absolute values differ by a factor at least $4$, so no difference occurs three times.
'''

[[node]]
platform = "DiazModulus.candidate_power_pair_not_both_mem_logAlgTilde"
root = true
env = "corollary"
title = 'Pairs of powers at a candidate'
statement = '''
Assume Roy's strong six exponentials theorem and let $u$ be a candidate. For $4\le k<l$ with $l\in\{k+1,k+2,2k-1,2k,2k+1,3k\}$, $u^k$ and $u^l$ are not both in $\widetilde{\mathcal L}$.
'''
source = '''Each case is one substitution in \cite{Dia07}: Corollaire 2(P)(1), Théorème 7(1), Corollaire 5(1)--(2), with $\bar u^{k}=\rho^{k}u^{-k}$.'''
sketch = '''
By conjugation $u^s\in\widetilde{\mathcal L}$ for $s\in\{0,\pm1,\pm k,\pm l\}$; in each case an explicit $(u^a)_{a\in A}\otimes(u^b)_{b\in B}$ with $A+B\subseteq\{0,\pm1,\pm k,\pm l\}$ contradicts Roy's theorem.
'''

# --- Two poles (R7) ----------------------------------------------------------------------------

[[node]]
platform = "DiazModulus.circle_point_two_pole_extension_carries_two_by_three_configuration"
env = "proposition"
section = "Two poles"
title = 'Two poles carry a configuration'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u$ algebraic, $a_1\neq a_2$ non-zero algebraic numbers, $z_i=u/(u^{2}-a_i)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z_1+\Qbar z_2$. Then $W$ carries a $2\times3$ configuration: $x=(1,u^{2})$, $y=(b,bu^{2},bu^{4})$ with $b=1/(u(u^{2}-a_1)(u^{2}-a_2))$.
'''
source = '''The progression of \cite[Lemma 6.1]{Fis01} and \cite[Théorème 7(2)]{Dia07}, with ratio $u^{2}$.'''
sketch = '''
Partial fractions: $bu^{2}=(z_1-z_2)/(a_1-a_2)$, $bu^{4}=(a_1z_1-a_2z_2)/(a_1-a_2)$, $bu^{6}=u+(a_1^{2}z_1-a_2^{2}z_2)/(a_1-a_2)$, and $b$ is a combination of $u^{-1}=\bar u/\rho$, $z_1$, $z_2$.
'''

[[node]]
platform = "DiazModulus.circle_point_two_pole_extension_excludes_squares_and_reciprocals"
env = "lemma"
title = 'What two poles do not contain'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u$ algebraic, $a_1\neq a_2$ non-zero algebraic numbers, $z_i=u/(u^{2}-a_i)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z_1+\Qbar z_2$. Then $W$ contains none of $u^{2}$, $\bar u^{2}$ and $1/(u-c)$ with $c\in\Qbar$ non-zero.
'''
source = '''Elementary.'''
sketch = '''
Every element of $W$ is a constant plus an odd function of $u$; clearing denominators gives $A(u^{2})+uB(u^{2})=0$, so $A=B=0$, and each of the three numbers has a non-zero part of the wrong parity.
'''

[[node]]
platform = "DiazModulus.circle_point_two_pole_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'Invisible to four-dimensional extensions'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u$ algebraic, $a_1\neq a_2$ non-zero algebraic numbers, $z_i=u/(u^{2}-a_i)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z_1+\Qbar z_2$. Then $W$ carries a $2\times3$ configuration, but no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w$ with $w\in W$ outside $\Qbar+\Qbar u+\Qbar\bar u$ does.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It drops the conjugation condition of Theorem~\ref{thm:circle_point_conjugate_pair_configuration_invisible_to_four_dimensional_extensions}.'''
sketch = '''
Proposition~\ref{prop:circle_point_two_pole_extension_carries_two_by_three_configuration}; for the second part, Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and exchange would put $u^{2}$, $\bar u^{2}$ or $1/(u-c)$ in $W$, against Lemma~\ref{lem:circle_point_two_pole_extension_excludes_squares_and_reciprocals}.
'''

[[node]]
platform = "DiazModulus.candidate_two_pole_not_both_mem_logAlgTilde"
env = "corollary"
title = 'Two poles at a candidate'
statement = '''
Assume Roy's strong six exponentials theorem and let $u$ be a candidate. For distinct non-zero algebraic $a_1,a_2$, the numbers $u/(u^{2}-a_1)$ and $u/(u^{2}-a_2)$ are not both in $\widetilde{\mathcal L}$.
'''
source = '''One substitution in \cite[Théorème 7(2)]{Dia07}, that is \cite[Lemma 6.1]{Fis01}.'''
sketch = '''
Both in $\widetilde{\mathcal L}$ would put $W$ in $\widetilde{\mathcal L}$ (Lemma~\ref{lem:logAlg_conj_stable}), with the configuration of Proposition~\ref{prop:circle_point_two_pole_extension_carries_two_by_three_configuration}.
'''

[[node]]
platform = "DiazModulus.candidate_sum_div_sq_sub_not_mem_logAlgTilde"
root = true
env = "corollary"
title = 'The third family at a candidate'
statement = '''
Assume Roy's strong six exponentials theorem, let $u$ be a candidate and $a_1\neq a_2$ algebraic with $a_i\bar a_i=|u|^{4}$. Then $u/(u^{2}-a_1)+u/(u^{2}-a_2)\notin\widetilde{\mathcal L}$.
'''
source = '''One line from a substitution in \cite[Théorème 7(2)]{Dia07}.'''
sketch = '''
$\bar z_i=-(\rho/\bar a_i)z_i$, so the sum and its conjugate (Lemma~\ref{lem:logAlgTilde_conj_stable}) give both $z_i$; Corollary~\ref{cor:candidate_two_pole_not_both_mem_logAlgTilde}.
'''

# --- Every involution (R9) ---------------------------------------------------------------------

[[node]]
platform = "DiazModulus.involution_pencil_space_carries_two_by_three_configuration"
env = "proposition"
section = "Every involution"
title = 'Every involution carries a configuration'
statement = '''
Let $u\in\C\setminus\Qbar$, let $q_1,q_2\in\Qbar[X]$ be coprime of degree at most $2$, one of degree exactly $2$ (so that $\Qbar q_1+\Qbar q_2$ is the pencil of quadratics vanishing on the orbits of a Möbius involution of the $u$-line), let $l_1,l_2$ be non-zero members of the pencil, and let $W$ be the span of $1,u,u^{-1}$ and of $q_1(u)^{i}q_2(u)^{3-i}/(u\,l_1(u)l_2(u))$, $i=0,\dots,3$. Then $W$ carries a $2\times3$ configuration: the progression $c,cr,cr^{2},cr^{3}$ with $r=q_1(u)/q_2(u)$.
'''
source = '''The progression of \cite[Lemma 6.1]{Fis01}; that a critical configuration is a progression is \cite[Lemma 4]{BSZ17}.'''
sketch = '''
$c=q_2(u)^{3}/(u\,l_1(u)l_2(u))$; $r$ is transcendental because $q_1,q_2$ are coprime.
'''

[[node]]
platform = "DiazModulus.involution_pencil_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'What the involution spaces do not contain'
statement = '''
Let $u\in\C\setminus\Qbar$, let $q_1,q_2\in\Qbar[X]$ be coprime of degree at most $2$, one of degree exactly $2$ (so that $\Qbar q_1+\Qbar q_2$ is the pencil of quadratics vanishing on the orbits of a Möbius involution of the $u$-line), let $l_1,l_2$ be non-zero members of the pencil, and let $W$ be the span of $1,u,u^{-1}$ and of $q_1(u)^{i}q_2(u)^{3-i}/(u\,l_1(u)l_2(u))$, $i=0,\dots,3$. Then $W$ contains none of $u^{2}$, $u^{-2}$ and $1/(u-b)$ with $b\in\Qbar$ non-zero.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
With $\tau(X)=(AX+B)/(\Gamma X-A)$, $D=A^{2}+B\Gamma\neq0$, a cleared membership $N(u)L(u)=(u-\beta)(QL+S)(u)$ also holds at $\tau(u)$; eliminating $S$ forces $\beta$ to be fixed by $\tau$ and then $D=0$.
'''

[[node]]
platform = "DiazModulus.involution_pencil_configuration_invisible_to_four_dimensional_extensions"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Every involution is invisible to four-dimensional extensions'
statement = '''
Let $u\in\C\setminus\Qbar$, let $q_1,q_2\in\Qbar[X]$ be coprime of degree at most $2$, one of degree exactly $2$ (so that $\Qbar q_1+\Qbar q_2$ is the pencil of quadratics vanishing on the orbits of a Möbius involution of the $u$-line), let $l_1,l_2$ be non-zero members of the pencil, and let $W$ be the span of $1,u,u^{-1}$ and of $q_1(u)^{i}q_2(u)^{3-i}/(u\,l_1(u)l_2(u))$, $i=0,\dots,3$. Suppose $u\bar u$ is algebraic. Then $W$ carries a $2\times3$ configuration, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w$ with $w\in W$ outside $\Qbar+\Qbar u+\Qbar\bar u$ does.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). For $q_1=X^{2}$, $q_2=1$ it is Theorem~\ref{thm:circle_point_two_pole_configuration_invisible_to_four_dimensional_extensions}. Conversely, every five-dimensional space containing a progression with ratio rational in $u$ and invisible to Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} is of this form (Theorem~\ref{thm:progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space}).'''
sketch = '''
Proposition~\ref{prop:involution_pencil_space_carries_two_by_three_configuration}; Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and exchange, against Lemma~\ref{lem:involution_pencil_space_excludes_squares_and_reciprocals}.
'''

[[node]]
platform = "DiazModulus.laurent_case_two_configuration_invisible"
root = true
env = "proposition"
title = 'A configuration that is not a progression'
statement = '''
Let $u\in\C\setminus\Qbar$. The products of $(1,u)$ and $(u^{-1},1,u^{3})$ span $\Qbar u^{-1}+\Qbar+\Qbar u+\Qbar u^{3}+\Qbar u^{4}$, which contains none of $u^{2}$, $u^{-2}$ and $1/(u-b)$ ($b\in\Qbar^{\times}$).
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The space is not stable under conjugation.'''
sketch = '''
Independence of distinct powers of $u$, and clearing denominators.
'''

# --- Conjugation-stable configurations (R11) ---------------------------------------------------

[[node]]
platform = "DiazModulus.conj_stable_real_pencil_space_carries_two_by_three_configuration"
env = "proposition"
section = "Conjugation-stable configurations"
title = 'The real pencil spaces'
statement = '''
Let $u\in\C\setminus\Qbar$, let $s\in\Qbar$ be real with $s^{2}=u\bar u$, let $\lambda\in\Qbar$ with $\lambda\bar\lambda=1$, let $f\in\C$ be real, $g=f/(s+\lambda u)$, and let $W$ be the span of $1,u,\bar u,f,g$. If these five numbers are free, then $W$ is stable under conjugation and carries the configuration $(1,u)\otimes(u^{-1},1,g)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\bar g=f/s-g$ and $ug=(f-sg)/\lambda$.
'''

[[node]]
platform = "DiazModulus.conj_equivariant_degree_one_space_eq_real_pencil_space"
root = true
env = "theorem"
title = 'Every conjugation-stable degree-one configuration'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. If $1,u,\bar u,g,ug$ are free and $\bar g\in\Qbar+\Qbar u+\Qbar ug$, then $\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar ug$ is a space of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Conjugating $\bar g=a+bu+c\,ug$ twice gives $|c|^{2}s^{2}=1$; after $g\mapsto g+q\bar u$, $\bar g=c\,ug$, and $f=g(s+\lambda u)$ with $\lambda=cs$ is real.
'''

[[node]]
platform = "DiazModulus.real_pencil_quartic_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'A real pencil space without Theorem B elements'
statement = '''
Let $u\in\C\setminus\Qbar$, let $s\in\Qbar$ be real with $s^{2}=u\bar u$, $f=u^{2}/s^{2}+s^{2}/u^{2}$, and let $W$ be the span of $1,u,\bar u,f,f/(s+u)$. Then the five numbers are free, and $W$ contains none of $u^{2}$, $\bar u^{2}$ and $1/(u-b)$ with $b\in\Qbar$ non-zero.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
With $v=u/s$, modulo $\Qbar+\Qbar v+\Qbar v^{-1}$ the last generator is $v^{-2}+2/(v+1)$; compare coefficients.
'''

[[node]]
platform = "DiazModulus.real_pencil_quartic_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'A conjugation-stable invisible space with no progression'
statement = '''
Let $u\in\C\setminus\Qbar$, let $s\in\Qbar$ be real with $s^{2}=u\bar u$, $f=u^{2}/s^{2}+s^{2}/u^{2}$, and let $W$ be the span of $1,u,\bar u,f,f/(s+u)$. Then $W$ is stable under conjugation and carries a $2\times3$ configuration, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w$ with $w\in W$ outside $\Qbar+\Qbar u+\Qbar\bar u$ does.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Its polar divisor has degree $5$, so $W$ contains no progression: the conjugation-stable analogue of Proposition~\ref{prop:laurent_case_two_configuration_invisible}. It is the case $k=2$, $\lambda=1$ of Theorem~\ref{thm:laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions}.'''
sketch = '''
Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}; Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and exchange, against Lemma~\ref{lem:real_pencil_quartic_space_excludes_squares_and_reciprocals}.
'''

[[node]]
platform = "DiazModulus.candidate_real_pencil_not_both_mem_logAlgTilde"
root = true
env = "corollary"
title = 'The real pencil at a candidate'
statement = '''
Assume Roy's strong six exponentials theorem. Let $u$ be a candidate, $\lambda\in\Qbar$ with $\lambda\bar\lambda=1$, and $f$ real with $1,u,\bar u,f,f/(|u|+\lambda u)$ free. Then $f$ and $f/(|u|+\lambda u)$ are not both in $\widetilde{\mathcal L}$.
'''
source = '''One substitution in \cite[Théorème 7(1)]{Dia07}, with $v_{0}=f/(|u|+\lambda u)$; also \cite[Théorème 2]{Dia04}.'''
sketch = '''
Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration} inside $\widetilde{\mathcal L}$.
'''

[[node]]
platform = "DiazModulus.mobius_progression_space_contains_square_or_reciprocal"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Index one is visible'
statement = '''
Let $u\in\C\setminus\Qbar$, $h=(\alpha u+\beta)/(\gamma u+\delta)$ with $\alpha,\beta,\gamma,\delta\in\Qbar$, $\alpha\delta-\beta\gamma\neq0$, and $c\neq0$. If $\Qbar+\Qbar u+\Qbar u^{-1}+\sum_{k\le3}\Qbar ch^{k}$ has dimension $5$, it contains $u^{2}$, $u^{-2}$ or some $1/(u-b)$ with $b\in\Qbar$ non-zero.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). With Lemma~\ref{lem:progression_space_ratio_degree_le_two} (the index is $1$ or $2$) and Proposition~\ref{prop:quadratic_ratio_progression_space_eq_involution_pencil_space} (index two) it gives Theorem~\ref{thm:progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space}.'''
sketch = '''
The progression spans $c'\,\Qbar[u]_{\le3}$, which meets $\Qbar+\Qbar u+\Qbar u^{-1}$: $c'u\,p(u)=r(u)$ with $\deg p\le3$, $\deg r\le2$. Induction on $\deg p$, cancelling common roots; a root $b$ of $p$ that $r$ does not share gives $1/(u-b)$, and a constant $p$ gives $u^{2}$ or $u^{-2}$.
'''

[[node]]
platform = "DiazModulus.progression_space_ratio_degree_le_two"
novelty = "not-routine"
env = "lemma"
title = 'The ratio has degree at most two'
statement = '''
Let $u\in\C\setminus\Qbar$, let $p,q\in\Qbar[X]$ be coprime, $h=p(u)/q(u)$, $c\neq0$, and suppose $W=\Qbar+\Qbar u+\Qbar u^{-1}+\sum_{k\le3}\Qbar ch^{k}$ has dimension $5$. If $\max(\deg p,\deg q)\geq1$, then $\max(\deg p,\deg q)\leq2$.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Two independent elements of $(\Qbar+\Qbar u+\Qbar u^{-1})\cap\sum_k\Qbar ch^{k}$ have a ratio of $u$-degree at most $2$ in $\Qbar(h)$; $[\Qbar(X):\Qbar(p/q)]=\max(\deg p,\deg q)$ (Mathlib, Lüroth's file) and the tower law.
'''

[[node]]
platform = "DiazModulus.quadratic_ratio_progression_space_eq_involution_pencil_space"
novelty = "not-routine"
env = "proposition"
title = 'Index two gives the involution spaces'
statement = '''
Let $u\in\C\setminus\Qbar$, let $p,q\in\Qbar[X]$ be coprime, $h=p(u)/q(u)$, $c\neq0$, and suppose $W=\Qbar+\Qbar u+\Qbar u^{-1}+\sum_{k\le3}\Qbar ch^{k}$ has dimension $5$. If $\max(\deg p,\deg q)=2$, then $W$ is the space of Theorem~\ref{thm:involution_pencil_configuration_invisible_to_four_dimensional_extensions} for the pencil $\Qbar p+\Qbar q$, for some non-zero $l_1,l_2$ in it.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$cu\,\varphi_i(h)=R_i(u)$ for two independent $\varphi_i$; removing their gcd, coprimality of the associated forms gives $cu\,g(h)=\kappa q(u)$ with $\deg g\le2$, and $g$ splits into $l_1l_2$.
'''

[[node]]
platform = "DiazModulus.progression_space_contains_square_or_reciprocal_or_eq_involution_pencil_space"
root = true
novelty = "not-routine"
env = "theorem"
title = 'The progression spaces, classified'
statement = '''
Let $u\in\C\setminus\Qbar$, let $p,q\in\Qbar[X]$ be coprime, $h=p(u)/q(u)$, $c\neq0$, and suppose $W=\Qbar+\Qbar u+\Qbar u^{-1}+\sum_{k\le3}\Qbar ch^{k}$ has dimension $5$. If $\max(\deg p,\deg q)\geq1$, then $W$ contains $u^{2}$, $u^{-2}$ or some $1/(u-b)$ with $b\in\Qbar$ non-zero, or $W$ is the space of Theorem~\ref{thm:involution_pencil_configuration_invisible_to_four_dimensional_extensions} for the pencil $\Qbar p+\Qbar q$.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). The progression step (a configuration spanning four dimensions is a progression) is \cite[Lemma 4]{BSZ17} and is not used: the progression is a hypothesis.'''
sketch = '''
Lemma~\ref{lem:progression_space_ratio_degree_le_two}; degree $1$ is Theorem~\ref{thm:mobius_progression_space_contains_square_or_reciprocal}, degree $2$ Proposition~\ref{prop:quadratic_ratio_progression_space_eq_involution_pencil_space}.
'''

# --- Case II beyond degree one (R14) ------------------------------------------------------------

[[node]]
platform = "DiazModulus.laurent_cubic_space_excludes_squares_and_reciprocals"
env = "lemma"
section = "Case II beyond degree one"
title = 'The Laurent cubic space'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $F=u^{3}/s^{3}+u^{2}/s^{2}$ and $W_{1}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar F+\Qbar\bar F$. Then $W_{1}$ is five-dimensional and contains none of $u^{2}$, $\bar u^{2}$, $1/(u-b)$ ($b\in\Qbar^{\times}$).
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$s^{3}u^{3}w$ is a polynomial of degree $6$ in $u$; compare coefficients.
'''

[[node]]
platform = "DiazModulus.laurent_cubic_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'A conjugation-stable Case II space invisible to Theorem B'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $F=u^{3}/s^{3}+u^{2}/s^{2}$ and $W_{1}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar F+\Qbar\bar F$. Then $W_{1}$ is stable under conjugation, the products of $(1,u^{2})$ and $(\bar u,u+s,\bar F)$ span it, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W_{1}$ with $w\notin\Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''The configuration is printed. Rescaled by $u^{\mp1}$, $(1,u^{2})\otimes(\bar u,u+s,\bar F)$ is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=u^{2}+su$. So its consequence at a candidate, $F\notin\widetilde{\mathcal L}$, is one substitution there; the same substitution with $w=u^{2}+cu$ excludes $u^{3}+cu^{2}$ for every algebraic $c$. That no four-dimensional extension inside $W_{1}$ carries a configuration was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:laurent_cubic_space_excludes_squares_and_reciprocals}; Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and exchange.
'''

[[node]]
platform = "DiazModulus.laurent_cubic_space_no_mobius_ratio_configuration"
root = true
env = "theorem"
title = 'No factor of degree one'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $F=u^{3}/s^{3}+u^{2}/s^{2}$ and $W_{1}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar F+\Qbar\bar F$. Then no configuration in $W_{1}$ has ratio $x_{2}/x_{1}=(\alpha u+\beta)/(\gamma u+\delta)$ with $\alpha\delta-\beta\gamma\neq0$; so $W_{1}$ is none of the spaces of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$c=\alpha x_{1}-\gamma x_{2}$ gives $t_{j}=cy_{j}$ with $t_{j},ut_{j}\in W_{1}$; such $t$ lie in $\Qbar+\Qbar\bar u$.
'''

[[node]]
platform = "DiazModulus.two_orbit_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'The two-orbit spaces'
statement = '''
Let $u\in\C\setminus\Qbar$, $a,b,\alpha,\beta,\gamma,\delta\in\Qbar^{\times}$ with $a^{2}\neq b^{2}$, $g_{1}=\alpha/(u-a)+\beta/(u+a)$, $g_{2}=\gamma/(u-b)+\delta/(u+b)$, and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_{1}+\Qbar g_{2}$. Then $W$ is five-dimensional and contains none of $u^{2}$, $u^{-2}$, $1/(u-c)$ ($c\in\Qbar^{\times}$).
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Residues at the five poles $0,\pm a,\pm b$.
'''

[[node]]
platform = "DiazModulus.two_orbit_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'Two orbits, a spanning configuration, invisible'
statement = '''
Let $u\in\C\setminus\Qbar$, $a,b,\alpha,\beta,\gamma,\delta\in\Qbar^{\times}$ with $a^{2}\neq b^{2}$, $g_{1}=\alpha/(u-a)+\beta/(u+a)$, $g_{2}=\gamma/(u-b)+\delta/(u+b)$, and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_{1}+\Qbar g_{2}$. If $\alpha\neq\beta$ or $\gamma\neq\delta$ and $u\bar u$ is algebraic, the products of $(1,u^{2})$ and $(u^{-1},g_{1},g_{2})$ span $W$, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W$ outside $\Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). With $\alpha=\beta$ and $\gamma=\delta$, which its hypothesis excludes, the space is that of Theorem~\ref{thm:circle_point_two_pole_configuration_invisible_to_four_dimensional_extensions}, whose configuration is a progression (Case~I).'''
sketch = '''
$u^{2}g_{1}=(\alpha+\beta)u+(\alpha-\beta)a+a^{2}g_{1}$; Lemma~\ref{lem:two_orbit_space_excludes_squares_and_reciprocals}; Theorem B and exchange.
'''

[[node]]
platform = "DiazModulus.conj_stable_two_orbit_space"
root = true
env = "proposition"
title = 'Two orbits on the circle'
statement = '''
Let $u\in\C\setminus\Qbar$, $a,b,\alpha,\beta,\gamma,\delta\in\Qbar^{\times}$ with $a^{2}\neq b^{2}$, $g_{1}=\alpha/(u-a)+\beta/(u+a)$, $g_{2}=\gamma/(u-b)+\delta/(u+b)$, and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_{1}+\Qbar g_{2}$. Let $s\in\Qbar$ with $s^{2}=u\bar u$. If $a\bar a=b\bar b=s^{2}$ and $\beta/\alpha$, $\delta/\gamma$ are real, $W$ is stable under conjugation.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). With it, the configuration of Theorem~\ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions} is printed: rescaled by $u^{\mp1}$, it is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, for any $w$ with $\Qbar+\Qbar w+\Qbar\bar w=u\,(\Qbar u^{-1}+\Qbar g_{1}+\Qbar g_{2})$.'''
sketch = '''
$\overline{1/(u\mp a)}=\mp1/\bar a-(a/\bar a)/(u\mp a)$.
'''

[[node]]
platform = "DiazModulus.quadratic_over_ratio_of_mem_progression_pair_span"
env = "lemma"
title = 'The quadratic relation'
statement = '''
Let $u\in\C\setminus\Qbar$, $c\neq0$, and suppose $1,u,u^{-1}$ lie in the $\Qbar$-span of $c,ch,ch^{2},ck,chk$. If $h\notin\Qbar$, then $A(h)u^{2}+B(h)u+C(h)=0$ for some $A,B,C\in\Qbar[X]$, not all zero.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Three vectors in the $\Qbar(h)$-span of $c,ck$; the $2\times2$ minors.
'''

