[[node]]
platform = "DiazModulus.conj_swapped_two_orbit_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'Two orbits exchanged by conjugation'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. Let $a,a_{1},a_{2}\in\Qbar^{\times}$ with $a\bar a\neq s^{2}$ and $a_{1}\neq a_{2}$, $g=a_{1}/(u-a)+a_{2}/(u+a)$ and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g+\Qbar\bar g$. Then $W$ is stable under conjugation, the products of a configuration span it, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W$ with $w\notin \Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''The configuration is printed: rescaled by $u^{\mp1}$, it is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=ug$. That no four-dimensional extension inside $W$ carries a configuration was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Conjugation exchanges the orbits $\pm a$ and $\pm s^{2}/\bar a$ of $u\mapsto-u$; Proposition~\ref{prop:conj_stable_two_orbit_space} is the case where it fixes them.'''
sketch = '''
With $b=s^{2}/\bar a$, $\bar g$ is a constant plus $\gamma/(u-b)+\delta/(u+b)$, $\gamma,\delta\neq0$, and $a^{2}\neq b^{2}$ as $a\bar a+s^{2}>0$; Theorem~\ref{thm:two_orbit_configuration_invisible_to_four_dimensional_extensions}.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_space_excludes_squares_and_reciprocals"
env = "lemma"
title = 'The cyclic space'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then $W$ is five-dimensional and contains none of $u^{2}$, $\bar u^{2}$, $1/(u-e)$ ($e\in\Qbar^{\times}$).
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$u(u^{2}-s^{2})^{2}w$ is a polynomial of degree $6$ in $u$; compare coefficients. An element of $W$ with a pole at $s$ has one at $-s$.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_configuration_invisible_to_four_dimensional_extensions"
root = true
env = "theorem"
title = 'The cyclic family: a spanning configuration, invisible'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then $W$ is stable under conjugation, the products of $(1,u^{2})$ and $(\bar u,G_{1},G_{2})$ span it, and no $\Qbar+\Qbar u+\Qbar\bar u+\Qbar w\subseteq W$ with $w\notin \Qbar+\Qbar u+\Qbar\bar u$ carries a configuration.
'''
source = '''The configuration is printed: rescaled by $u^{\mp1}$, it is the configuration $(v,\bar v)\otimes(1,w,\bar w)$ of \cite[Théorème 7(1)]{Dia07} at $v=u$, $w=uG_{2}$. That no four-dimensional extension inside $W$ carries a configuration was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Modulo $\Qbar+\Qbar u+\Qbar\bar u$, the factor $(1,u^{2})$ acts on $G_{1},G_{2}$ as a Jordan block.'''
sketch = '''
$\bar G_{1}=1-G_{1}$, $\bar G_{2}=G_{2}$; $u^{2}G_{1}=3su-s^{2}+s^{2}G_{1}$, $u^{2}G_{2}=s^{2}G_{2}+3su-2s^{2}+2s^{2}G_{1}$; Lemma~\ref{lem:cyclic_pair_space_excludes_squares_and_reciprocals}; Theorem~B and exchange.
'''

[[node]]
platform = "DiazModulus.cyclic_pair_space_no_mobius_ratio_configuration"
root = true
env = "theorem"
title = 'The cyclic family: no factor of degree one'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ real with $s^{2}=u\bar u$. With $v=u/s$, let $G_{1}=1/(v-1)+2/(v+1)$, $G_{2}=1/(v-1)^{2}+1/(v-1)-2/(v+1)^{2}+2/(v+1)$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar G_{1}+\Qbar G_{2}$. Then no configuration in $W$ has ratio $x_{2}/x_{1}=(\alpha u+\beta)/(\gamma u+\delta)$ with $\alpha\delta-\beta\gamma\neq0$; so $W$ is none of the spaces of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$c=\alpha x_{1}-\gamma x_{2}$ gives $t_{j}=cy_{j}$ with $t_{j},ut_{j}\in W$; such $t$ lie in $\Qbar+\Qbar\bar u$, since multiplication by $u$ changes the sign of the ratio between the leading polar coefficients at $s$ and $-s$.
'''

# --- Polynomial hulls (R16) -------------------------------------------------------------------

[[node]]
platform = "DiazModulus.polynomial_submodule_degrees_card"
env = "lemma"
section = "Polynomial hulls"
title = 'Degrees of a space of polynomials'
statement = '''
Let $K$ be a field and $X\subseteq K[X]$ a finite-dimensional $K$-space. The degrees of the non-zero elements of $X$ take exactly $\dim X$ values.
'''
source = '''The degree form of Lemma~\ref{lem:polynomial_submodule_trailing_degrees_card}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Induction on $\dim X$: remove the largest degree $n_{0}$ through $X\cap\ker(f\mapsto f_{n_{0}})$.
'''

[[node]]
platform = "DiazModulus.five_point_sumset_rigid"
env = "lemma"
title = 'A rigid five-element set'
statement = '''
Let $k\geq4$, $2\leq m\leq k$, and $A,B\subseteq\Z$ with $|A|=2$, $|B|=3$ and $A+B\subseteq\{-k,-1,0,1,m\}$. Then $m=2$ and $A+B=\{-1,0,1,2\}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$A=\{a,a+d\}$: the difference $d$ occurs at three lower ends in $S$; only $d=1$ with $m=2$ does, at $-1,0,1$.
'''

[[node]]
platform = "DiazModulus.shifted_polynomial_hull_orders"
env = "lemma"
title = 'Orders and degrees of a shifted hull'
statement = '''
Let $2\leq m\leq k$, $Q_{1}\neq0$ with order $k+m$ at $0$ and degree $2k$, and $Q_{2}$ with $Q_{2}(0)\neq0$ and degree $k-m$. Every non-zero $f$ in the span of $X^{k-1},X^{k},X^{k+1},Q_{1},Q_{2}$ has order at $0$ in $\{0,k-1,k,k+1,k+m\}$ and degree in $\{k-m,k-1,k,k+1,2k\}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Read the coefficients: only $Q_{2}$ has a constant term, and only $Q_{1}$ reaches degree $2k$.
'''

[[node]]
platform = "DiazModulus.config_shifted_polynomial_spans"
env = "lemma"
title = 'A configuration as two spaces of polynomials'
statement = '''
Let $u\in\C\setminus\Qbar$, $H\subseteq\Qbar[X]$ a subspace and $N\geq0$. If a configuration $x\otimes y$ has $u^{N}x_{i}y_{j}=Q_{ij}(u)$ with $Q_{ij}\in H$, there are free $a_{1},a_{2}$, free $b_{1},b_{2},b_{3}$ and $P_{0}\neq0$ in $\Qbar[X]$ with $fg\in P_{0}H$ for $f$ in the span of the $a_{i}$ and $g$ in that of the $b_{j}$.
'''
source = '''Not found in the sources read in this form; it is the normalisation in the proof of Theorem~\ref{thm:laurent_hull_config_iff}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$a_{i}=Q_{i1}$, $b_{j}=Q_{1j}$, $P_{0}=Q_{11}$; both sides of $fg=P_{0}h$ agree at the transcendental $u$.
'''

[[node]]
platform = "DiazModulus.rank_one_polynomial_matrix_factor"
env = "lemma"
title = 'Rank-one polynomial matrices'
statement = '''
Let $F$ be a field and $P$ a $2\times3$ matrix over $F[X]$ with non-zero entries and vanishing $2\times2$ minors. Then $P_{ij}=a_{i}b_{j}$ with $a_{1},a_{2}$ coprime.
'''
source = '''Standard; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$a_{i}=P_{i1}/\gcd(P_{11},P_{21})$; coprimality gives $a_{1}\mid P_{1j}$.
'''

[[node]]
platform = "DiazModulus.polynomial_hull_no_two_by_three_configuration"
env = "theorem"
title = 'Polynomial hulls of degree at most one or at least four'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $P\in\Qbar[X]$ has degree at most $1$ or at least $4$, then $W_{P}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries no $2\times3$ configuration.
'''
source = '''For degree at most $1$, $W_{P}$ has dimension $3$ \cite[Theorem 3.4]{Roy95}. For degree at least $4$, not found in the sources read; the method is the valuation count of \cite[\S7]{BSZ17}, at $0$ and $\infty$ together; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The case $P=X^{k}$ is Theorem~\ref{thm:power_hull_strong_six_exp_configuration_iff}.'''
sketch = '''
Lemma~\ref{lem:config_shifted_polynomial_spans} with $N=\deg P$; Lemmas~\ref{lem:polynomial_submodule_trailing_degrees_card}, \ref{lem:polynomial_submodule_degrees_card}, \ref{lem:shifted_polynomial_hull_orders} and~\ref{lem:five_point_sumset_rigid} make the order sums and the degree sums $\{-1,0,1,2\}$ and $\{-2,-1,0,1\}$ after shifting; a product of order sum $2$ would have its order above its degree.
'''

[[node]]
platform = "DiazModulus.polynomial_hull_two_by_three_configuration_iff"
root = true
env = "theorem"
title = 'Polynomial hulls'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. For $P\in\Qbar[X]$, $W_{P}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar P(u)+\Qbar\overline{P(u)}$ carries a $2\times3$ configuration if and only if $\deg P\in\{2,3\}$. So at a candidate Roy's theorem excludes $P(u)$ from $\widetilde{\mathcal L}$ through its hull exactly in degrees $2$ and $3$.
'''
source = '''The configurations of degrees $2$ and $3$ are \cite[Théorème 7(1)]{Dia07} at $v=u$, and already \cite[Théorème 2]{Dia04}; the converse was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$(1,u)\otimes(\bar u,1,u)$ and $(1,u^{2})\otimes(\bar u,u+c,\bar Q)$, $Q=u^{3}+cu^{2}$; Theorem~\ref{thm:polynomial_hull_no_two_by_three_configuration}.
'''

[[node]]
platform = "DiazModulus.real_polynomial_hull_no_two_by_three_configuration"
root = true
env = "corollary"
title = 'Real polynomials in Re u and Im u'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $G\in\R[a,b]$ has algebraic coefficients and $z=G(\operatorname{Re}u,\operatorname{Im}u)$, then $\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ carries no $2\times3$ configuration.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$z$ is real and a Laurent polynomial in $u$; Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}.
'''

[[node]]
platform = "DiazModulus.rank_one_config_inverse_adjoin"
env = "proposition"
title = 'Adjoining a generic point and its inverse'
statement = '''
Let $K\subseteq F$ be subfields of $\C$, $V_{0}\subseteq F$ a $K$-space and $u$ transcendental over $F$. Every $2\times3$ configuration over $K$ in $V_{0}+Ku+Ku^{-1}$ has its products in $V_{0}$.
'''
source = '''Not found in the sources read in this form; \cite[Proposition 12.2]{Wal00} treats $V_{0}=K$ without $u^{-1}$, and the factorisation is that of Theorem~\ref{thm:generic_circle_point_no_two_by_three_configuration}; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$ux_{i}y_{j}=P_{ij}(u)$ with $\deg P_{ij}\leq2$; Lemma~\ref{lem:rank_one_polynomial_matrix_factor}; the constant and $X^{2}$ coefficients lie in $K$, so a non-zero one makes $x$ or $y$ dependent; then swap $u$ and $u^{-1}$.
'''

[[node]]
platform = "DiazModulus.logAlgTilde_adjoin_circle_point_no_two_by_three_configuration"
root = true
env = "theorem"
title = "A barrier for Roy's theorem"
statement = '''
Assume Roy's theorem: there is no $2\times3$ configuration in $\widetilde{\mathcal L}$. If $u\bar u\in\Qbar$ and $u$ is transcendental over the field generated by $\widetilde{\mathcal L}$, there is none in $\widetilde{\mathcal L}+\Qbar u+\Qbar\bar u$ either.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\bar u=\rho u^{-1}$; Proposition~\ref{prop:rank_one_config_inverse_adjoin} with $K=\Qbar$ and $V_{0}=\widetilde{\mathcal L}$.
'''

# --- Which degree-one spaces Theorem B sees (R17) ------------------------------------------------

[[node]]
platform = "DiazModulus.coprime_fraction_cubic_over_quadratic_iff_natDegree_le"
env = "lemma"
section = "Which degree-one spaces Theorem B sees"
title = 'A coprime fraction over X times a quadratic'
statement = '''
Let $K$ be a field and $P,Q\in K[X]$ coprime with $Q\neq0$. There are $R,N\in K[X]$ with $R\neq0$, $\deg R\leq2$, $\deg N\leq3$ and $XRP=NQ$ if and only if $\max(\deg P,\deg Q)\leq2$, or $Q(0)=0$ and $\max(\deg P,\deg Q)\leq3$.
'''
source = '''Elementary; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$Q\mid XR$; write $XR=QS$, so $N=SP$; if $Q(0)\neq0$ then $X\mid S$. Conversely take $S=X$, or $S=1$ when $Q(0)=0$.
'''

[[node]]
platform = "DiazModulus.degree_one_space_cubic_over_quadratic_of_mem_square_or_reciprocal"
env = "lemma"
title = 'A Theorem B element in a degree-one space'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $W_{g}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar ug$ contains $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$ with $a\in\Qbar^{\times}$, then $u\,R(u)\,g=N(u)$ for some $R,N\in\Qbar[X]$ with $R\neq0$, $\deg R\leq2$ and $\deg N\leq3$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write the element in the basis $1,u,\bar u,g,ug$, replace $\bar u$ by $\rho/u$ and clear denominators; $R\neq0$ because $u$ is transcendental.
'''

[[node]]
platform = "DiazModulus.degree_one_space_mem_square_or_reciprocal_of_cubic_over_quadratic"
env = "lemma"
title = 'Cubic over quadratic gives a Theorem B element'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. If $1,u,\bar u,g,ug$ are free and $u\,R(u)\,g=N(u)$ for some $R,N\in\Qbar[X]$ with $R\neq0$, $\deg R\leq2$ and $\deg N\leq3$, then $W_{g}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar ug$ contains $u^{2}$, $\bar u^{2}$ or some $1/(u-a)$ with $a\in\Qbar^{\times}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$M\mapsto M(u)/(uR(u))$ maps the polynomials of degree below $5$ onto $W_{g}$ (dimension count). Then $u^{2}$, $\bar u^{2}$ or $1/(u-b)$ is the image of $X^{3}R$, $\rho^{2}R/X$ or $XR/(X-b)$, for a root $b$ of $R$.
'''

[[node]]
platform = "DiazModulus.degree_one_space_visible_to_four_dimensional_extensions_iff_cubic_over_quadratic"
root = true
env = "theorem"
title = 'Which degree-one spaces Theorem B sees'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. Call a space $W\supseteq H_{0}=\Qbar+\Qbar u+\Qbar\bar u$ visible if some $w\in W\setminus H_{0}$ makes $H_{0}+\Qbar w$ carry a $2\times3$ configuration, that is, if Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} sees it through a four-dimensional subspace. If $1,u,\bar u,g,ug$ are free, then $W_{g}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar ug$, which carries the configuration $(1,u)\otimes(\bar u,1,g)$, is visible if and only if $u\,R(u)\,g=N(u)$ for some $R,N\in\Qbar[X]$ with $R\neq0$, $\deg R\leq2$ and $\deg N\leq3$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and exchange, with Lemmas~\ref{lem:degree_one_space_cubic_over_quadratic_of_mem_square_or_reciprocal} and \ref{lem:degree_one_space_mem_square_or_reciprocal_of_cubic_over_quadratic}.
'''

[[node]]
platform = "DiazModulus.rational_degree_one_space_visible_to_four_dimensional_extensions_iff_natDegree_le"
env = "corollary"
title = 'Rational degree-one spaces'
statement = '''
Let $u\in\C\setminus\Qbar$ with $\rho=u\bar u\in\Qbar$. Call a space $W\supseteq H_{0}=\Qbar+\Qbar u+\Qbar\bar u$ visible if some $w\in W\setminus H_{0}$ makes $H_{0}+\Qbar w$ carry a $2\times3$ configuration, that is, if Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} sees it through a four-dimensional subspace. Let $g=P(u)/Q(u)$ with $P,Q\in\Qbar[X]$ coprime, and $1,u,\bar u,g,ug$ free. Then $W_{g}=\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar ug$ is visible if and only if $\max(\deg P,\deg Q)\leq2+[Q(0)=0]$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Theorem~\ref{thm:degree_one_space_visible_to_four_dimensional_extensions_iff_cubic_over_quadratic}; evaluation at $u$ is injective, so the condition is $XRP=NQ$, and Lemma~\ref{lem:coprime_fraction_cubic_over_quadratic_iff_natDegree_le} applies.
'''

[[node]]
platform = "DiazModulus.rational_pencil_space_visible_to_four_dimensional_extensions_iff_natDegree_le"
root = true
env = "theorem"
title = 'Pencil spaces with rational data'
statement = '''
Let $u\in\C\setminus\Qbar$, $s\in\Qbar$ with $s^{2}=u\bar u$, and $\lambda\in\Qbar$ with $|\lambda|=1$. Call a space $W\supseteq H_{0}=\Qbar+\Qbar u+\Qbar\bar u$ visible if some $w\in W\setminus H_{0}$ makes $H_{0}+\Qbar w$ carry a $2\times3$ configuration, that is, if Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} sees it through a four-dimensional subspace. Let $f=P(u)/Q(u)$ with $P,Q\in\Qbar[X]$ coprime, and suppose $1,u,\bar u,f,f/(s+\lambda u)$ are free. Then $W(\lambda,f)=\Qbar+\Qbar u+\Qbar\bar u+\Qbar f+\Qbar f/(s+\lambda u)$ is visible if and only if $\max(\deg P,\deg Q+1)\leq2+[Q(0)=0]+[P(-s\bar\lambda)=0]$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). For real $f$ these are the real pencil spaces of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}; for Laurent $f$ the criterion contains Theorem~\ref{thm:laurent_real_pencil_configuration_invisible_to_four_dimensional_extensions}.'''
sketch = '''
With $g=f/(s+\lambda u)$, $W(\lambda,f)=W_{g}$; reduce $P/(Q\cdot(s+\lambda X))$, cancelling $X+s\bar\lambda$ when $P(-s\bar\lambda)=0$, and apply Corollary~\ref{cor:rational_degree_one_space_visible_to_four_dimensional_extensions_iff_natDegree_le}.
'''

# --- Polynomials in u and u-bar (Theorem E) (R18) ------------------------------------------------

[[node]]
platform = "DiazModulus.coprime_pencil_of_degree_le_two_normal_form"
env = "lemma"
section = 'Polynomials in $u$ and $\bar u$ (Theorem E)'
title = 'Coprime pencils of degree at most two'
statement = '''
Let $K$ be a field and $a_0,a_1\in K[X]$ coprime with $1\leq\max(\deg a_0,\deg a_1)\leq2$. Then $Ka_0+Ka_1=Kp+Kq$ for a pair $(p,q)$ of one of the forms $(1,X)$; $(1,X^{2}+\alpha X)$ with $\alpha\in K$; $(X,X^{2}+\beta)$ with $\beta\neq0$; $(X+\beta,X^{2}+\gamma X)$ with $\beta\neq0$ and $\gamma\neq\beta$.
'''
source = '''Elementary; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Without $X^{2}$ terms the plane is $K+KX$. Otherwise it contains a monic $X^{2}+dX+e$ and a non-zero $r$ of degree at most $1$; $r$ constant, $r\in KX$ and $r\in K(X+\beta)$ with $\beta\neq0$ give the other three forms, the inequalities because $X$, resp. $X+\beta$, is not a common factor.
'''

[[node]]
platform = "DiazModulus.laurent_window_factor_in_hull_plus_min_degree_line"
env = "lemma"
title = 'A degree count in a window'
statement = '''
Let $K$ be a field, $N\geq0$, $H_N=KX^{N-1}+KX^{N}+KX^{N+1}\subseteq K[X]$ (with $N-1$ read as $0$ when $N=0$), and $M\subseteq K[X]$ a subspace of dimension $2$ whose non-zero elements all have degree at least $N+2$. Then $M$ has a non-zero element $n$ of least degree such that, for all $p,q,y\in K[X]$ with $\deg p<\deg q$: if $py$ and $qy$ lie in $H_N+M$, then $py\in H_N+Kn$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The degree count is in the manner of the valuation argument of \cite[\S7, proof of Theorem 33]{BSZ17}.'''
sketch = '''
Write $py=h+m$ and $qy=h'+m'$ with $h,h'\in H_N$ and $m,m'\in M$. If $m\neq0$, then $\deg m=\deg py<\deg qy=\deg m'$, so $m,m'$ span $M$, and the minimality of $\deg n$ in $n=am+bm'$ forces $b=0$.
'''

[[node]]
platform = "DiazModulus.laurent_window_quadratic_pencils_carry_no_three_factors"
env = "lemma"
title = 'Two pencils with no three free factors'
statement = '''
Let $K$ be a field, $N\geq0$, $H_N=KX^{N-1}+KX^{N}+KX^{N+1}\subseteq K[X]$, and $M\subseteq K[X]$ a subspace of dimension $2$ such that every non-zero $f\in M$ has $\ord f+2\leq N$ and $\deg f\geq N+2$, where $\ord f$ is the order of $f$ at $0$ (its trailing degree); call such an $M$ two-sided. Put $W=H_N+M$. There are no $\alpha\in K$ and free $b_0,b_1,b_2\in K[X]$ with $b_j\in W$ and $(X^{2}+\alpha X)b_j\in W$ for all $j$; and there are no $\beta,\gamma\in K$ with $\beta\neq0$ and free $b_0,b_1,b_2\in K[X]$ with $(X+\beta)b_j\in W$ and $(X^{2}+\gamma X)b_j\in W$ for all $j$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
For the pencil $(p,q)$, Lemma~\ref{lem:laurent_window_factor_in_hull_plus_min_degree_line} puts $Y=\sum_jKpb_j$ in $H_N+Kn$, so $\dim(Y\cap H_N)\geq2$. But $py\in H_N$ forces $X^{N-1}\mid y$, then $qy\in H_N$ by the order bound, and $\deg q=2$ leaves $y\in KX^{N-1}$.
'''

[[node]]
platform = "DiazModulus.laurent_window_degree_one_pencil_factor_space"
env = "lemma"
title = 'Three factors for the pencil $(1,X)$'
statement = '''
Let $K$ be a field, $N\geq0$, $H_N=KX^{N-1}+KX^{N}+KX^{N+1}\subseteq K[X]$, and $M\subseteq K[X]$ a subspace of dimension $2$ such that every non-zero $f\in M$ has $\ord f+2\leq N$ and $\deg f\geq N+2$, where $\ord f$ is the order of $f$ at $0$ (its trailing degree). Put $W=H_N+M$, and suppose there are free $b_0,b_1,b_2\in K[X]$ with $b_j\in W$ and $Xb_j\in W$ for all $j$. Then there is $G\in W$ with $XG\in W$ such that every $F\in W$ with $XF\in W$ lies in $KX^{N-1}+KX^{N}+KG$, and $W=H_N+KG+KXG$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Kill the coefficients of $X^{N-1}$ and $X^{N}$ in a combination $G$ of the $b_j$. Lemma~\ref{lem:laurent_window_factor_in_hull_plus_min_degree_line} with $(p,q)=(1,X)$ puts every such $F$ in $H_N+Kn$, with no $X^{N+1}$ term when $F\in H_N$; and $n$ and the $M$-part of $XG$ span $M$.
'''

[[node]]
platform = "DiazModulus.laurent_window_involution_pencil_normal_form"
env = "lemma"
title = 'Three factors for the pencil $(X,X^{2}+\beta)$'
statement = '''
Let $K$ be a field, $N\geq3$, $H_N=KX^{N-1}+KX^{N}+KX^{N+1}\subseteq K[X]$, and $M\subseteq K[X]$ a subspace of dimension $2$ such that no element of $M$ has a term in $X^{N-1}$, $X^{N}$ or $X^{N+1}$, and every non-zero $f\in M$ has $\ord f+2\leq N$ and $\deg f\geq N+2$, where $\ord f$ is the order of $f$ at $0$ (its trailing degree). Put $W=H_N+M$, let $\beta\in K$ be non-zero, and suppose there are free $b_0,b_1,b_2\in K[X]$ with $Xb_j\in W$ and $(X^{2}+\beta)b_j\in W$ for all $j$. Then there are $e,\zeta\in K$ with $e\neq0$ and $M=K(X^{N-2}+eX^{N+2})+K(\beta X^{N-3}+\zeta X^{N+2}+eX^{N+3})$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:laurent_window_factor_in_hull_plus_min_degree_line} with $(p,q)=(X,X^{2}+\beta)$. Killing two coefficients in a combination $y$ of the $b_j$ gives $y=aX^{N-2}+cX^{N}$, hence $X^{N-2}+eX^{N+2}\in M$; killing two others gives $y=sX^{N-3}+cX^{N}+seX^{N+1}$, hence the second generator.
'''

[[node]]
platform = "DiazModulus.config_shifted_coprime_polynomial_factors"
env = "lemma"
title = 'A configuration factors through a coprime pair'
statement = '''
Let $u\in\C\setminus\Qbar$, $H\subseteq\Qbar[X]$ a subspace and $N\geq0$. Let $x_0,x_1\in\C$ be free over $\Qbar$, and $y_0,y_1,y_2\in\C$ too, such that for all $i,j$ there is $Q_{ij}\in H$ with $Q_{ij}(u)=u^{N}x_iy_j$. Then there are coprime $a_0,a_1\in\Qbar[X]$ and free $b_0,b_1,b_2\in\Qbar[X]$ with $a_ib_j\in H$ for all $i,j$ and $x_1a_0(u)=x_0a_1(u)$.
'''
source = '''Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It is the normalisation of Lemma~\ref{lem:config_shifted_polynomial_spans}, sharpened by Lemma~\ref{lem:rank_one_polynomial_matrix_factor}.'''
sketch = '''
Evaluation at $u$ is injective, so the $2\times2$ minors of $(Q_{ij})$, which vanish at $u$, vanish; Lemma~\ref{lem:rank_one_polynomial_matrix_factor} gives $Q_{ij}=a_ib_j$, and $b_j(u)$ is a fixed non-zero multiple of $y_j$.
'''

[[node]]
platform = "DiazModulus.two_by_three_configuration_ratio_degree_le_two"
env = "lemma"
title = 'The ratio of a configuration has degree at most two'
statement = '''
Let $u\in\C\setminus\Qbar$ and $W\subseteq\C$ a $\Qbar$-space of dimension at most $5$ containing $1$, $u$ and $u^{-1}$. Let $x_0,x_1$ be free over $\Qbar$, and $y_0,y_1,y_2$ too, with all six $x_iy_j$ in $W$, and let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)\geq1$ and $x_1q(u)=x_0p(u)$. Then $\max(\deg p,\deg q)\leq2$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). When the six products span four dimensions, the step to a progression $t,th,th^{2},th^{3}$ is \cite[Lemma 4]{BSZ17}.'''
sketch = '''
With $h=p(u)/q(u)$ and $Y'=\sum_j\Qbar x_0y_j$, $Y'\cap hY'\neq0$. If $Y'+hY'$ contains $1,u,u^{-1}$, Theorem~\ref{thm:progression_pair_span_ratio_degree_le_two} applies; otherwise $Y'+hY'$ is spanned by a progression $t,th,th^{2},th^{3}$, and Lemma~\ref{lem:progression_space_ratio_degree_le_two} applies.
'''

[[node]]
platform = "DiazModulus.laurent_conj_twisted_symmetric_normal_form"
env = "lemma"
title = 'Twisted-symmetric Laurent polynomials'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $N\geq0$, $F\in\Qbar[X]$ and $g=F(v)/v^{N}$, and let $\gamma\in\Qbar$ with $\gamma\bar\gamma=1$ and $\bar g=\gamma vg$. Then there is $G\in\Qbar[X]$ with $G(0)=0$ and $g-\bigl(G(v)+\bar\gamma\,\overline{vG(v)}\bigr)\in\Qbar+\Qbar\bar v$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Divide $F=A+X^{N}B$ with $\deg A<N$ and put $G=B-B(0)$. As $\bar v=1/v$, $\overline{A(v)/v^{N}}$ is the value of a reflected polynomial, and comparing degrees in $\bar g=\gamma vg$, cleared at the transcendental $v$, gives $\overline{A(v)/v^{N}}=\gamma vG(v)+\gamma B(0)v$.
'''

[[node]]
platform = "DiazModulus.laurent_involution_space_conj_stable_constraints"
env = "lemma"
title = 'Conjugation-stable involution spaces'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $e,\beta,\zeta\in\Qbar$ with $\beta\neq0$, and suppose that $S=\Qbar+\Qbar v+\Qbar\bar v+\Qbar(\bar v^{2}+ev^{2})+\Qbar(\beta\bar v^{3}+\zeta v^{2}+ev^{3})$ is stable under complex conjugation. Then $e\bar e=\beta\bar\beta=1$ and $\zeta=-\beta e^{2}\bar\zeta$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write $\bar n_0$ and $\bar n_1$, for $n_0=\bar v^{2}+ev^{2}$ and $n_1=\beta\bar v^{3}+\zeta v^{2}+ev^{3}$, in the five generators, multiply by $v^{3}$, and compare the coefficients at $v^{\pm3}$ and $v^{\pm2}$ at the transcendental $v$.
'''

[[node]]
platform = "DiazModulus.laurent_involution_space_carries_two_by_three_configuration"
env = "lemma"
title = 'The configuration of the involution spaces'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $e,\beta,\zeta\in\Qbar$ be arbitrary and $S=\Qbar+\Qbar v+\Qbar\bar v+\Qbar(\bar v^{2}+ev^{2})+\Qbar(\beta\bar v^{3}+\zeta v^{2}+ev^{3})$. Then $1,v+\beta\bar v$ are free over $\Qbar$, so are $1,\bar v+e\beta v,\bar v^{2}+\zeta v+ev^{2}$, and the six products of a member of the first family with a member of the second lie in $S$. With $v=u/s$ these are the configurations of class (Q) in Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}.
'''
source = '''In print: for $v=u/s$, $e\bar e=\beta\bar\beta=1$ and $\zeta=-\beta e^{2}\bar\zeta$, it is the configuration $x\otimes(1,y,\bar y)$ to which the proof of \cite[Théorème 2]{Dia04} applies the strong six exponentials theorem, at $x=(1,(u+\beta\bar u)/s)$; also \cite[Théorème 4(1)]{Dia07}. Here $e,\beta,\zeta$ are arbitrary.'''
sketch = '''
Using only $v\bar v=1$, each product is an explicit combination of the generators, for instance $(v+\beta\bar v)(\bar v+e\beta v)=\beta(\bar v^{2}+ev^{2})+1+e\beta^{2}$; both families are free because a relation, cleared by $v$ or $v^{2}$, is a polynomial identity at the transcendental $v$.
'''

[[node]]
platform = "DiazModulus.laurent_real_pencil_normal_form_carries_two_by_three_configuration"
env = "lemma"
title = 'The configuration of the real pencil normal form'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $\kappa\in\Qbar$ with $\kappa\bar\kappa=1$, $G\in\Qbar[X]$ with $\deg G\geq1$, and $g=G(v)+\kappa\,\overline{vG(v)}$. Then $1,v$ are free over $\Qbar$, so are $\bar v,1,g$, and the six products of a member of $(1,v)$ with a member of $(\bar v,1,g)$ lie in $\Qbar+\Qbar v+\Qbar\bar v+\Qbar g+\Qbar\bar g$.
'''
source = '''Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It is the configuration of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}, written for Laurent data.'''
sketch = '''
The products are $\bar v,1,g,1,v$ and $vg=\kappa\bar g$. For freeness, $v^{n}\overline{G(v)}$, $n=\deg G$, is the value of a reflected polynomial, so the coefficient of $X^{2n+1}$ in a relation cleared by $v^{n+1}$ is the coordinate of $g$ times the leading coefficient of $G$.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_with_polynomial_part_configuration_class"
env = "lemma"
title = 'Hulls with a polynomial part'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $z\in\C$ and $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$. If $v^{2}P(v)\in W$ for some non-zero $P\in\Qbar[X]$, and $W$ carries a $2\times3$ configuration, then $\alpha v^{2}+\beta v^{3}\in W$ for some $\alpha,\beta\in\Qbar$, not both zero.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), as a consequence of Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff}.'''
sketch = '''
The hull of $A=v^{2}P(v)$ lies in $W$ and is five-dimensional (the coefficient of $X^{2d+4}$, $d=\deg P$, in a cleared relation), so it is $W$; Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff} at $u:=v$ gives $\deg X^{2}P\in\{2,3\}$.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_finrank_le_four_no_two_by_three_configuration"
env = "lemma"
title = 'Hulls of dimension at most four'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $k\geq0$, let $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$. If $\dim W\leq4$, then $W$ carries no $2\times3$ configuration.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), as a consequence of Theorems~\ref{thm:circle_point_extension_two_by_three_configuration_iff} and~\ref{thm:polynomial_hull_no_two_by_three_configuration}.'''
sketch = '''
If $z\in\Qbar+\Qbar v+\Qbar\bar v$, Theorem~\ref{thm:polynomial_hull_no_two_by_three_configuration} at $P=0$. Otherwise $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z$, and Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff} would give $z\equiv\delta w$ with $\delta\neq0$ and $w=v^{2}$, $\bar v^{2}$ or $1/(v-a)$, $a\neq0$: $\bar z\in W$ excludes the first two, and the Laurent form of $z$ the third.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_shifted_polynomial_model"
env = "lemma"
title = 'The shifted polynomial model'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $k\geq0$, let $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$. Suppose $\dim W=5$ and $W$ contains no $v^{2}P(v)$ with $P\in\Qbar[X]$ non-zero. Then there are $N\geq3$ and a subspace $M\subseteq\Qbar[X]$ of dimension $2$ such that, with $H_N=\Qbar X^{N-1}+\Qbar X^{N}+\Qbar X^{N+1}$: no element of $M$ has a term in $X^{N-1}$, $X^{N}$ or $X^{N+1}$; every non-zero $f\in M$ has $\ord f+2\leq N$ and $\deg f\geq N+2$, where $\ord f$ is the order of $f$ at $0$ (its trailing degree); a polynomial $F\in\Qbar[X]$ has $F(v)/v^{N}\in W$ if and only if $F\in H_N+M$; and every $w\in W$ is $F(v)/v^{N}$ for some $F\in H_N+M$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$N=k+3$ and the injective map $F\mapsto F(v)/v^{N}$; $M$ is spanned by the polynomials of $z$ and $\bar z$ with their coefficients at $N-1,N,N+1$ deleted, and an element of $M$ breaking a bound would give a non-zero $v^{2}P(v)$ in $W$, directly or after conjugation.
'''

[[node]]
platform = "DiazModulus.laurent_degree_one_conj_stable_space_real_pencil_normal_form"
env = "proposition"
title = 'Conjugation-stable degree-one Laurent spaces'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $N\geq0$, $F\in\Qbar[X]$ and $g=F(v)/v^{N}$. Suppose $1,v,\bar v,g,vg$ are free over $\Qbar$ and $\bar g\in\Qbar+\Qbar v+\Qbar vg$, and let $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar g+\Qbar vg$. Then there are $\kappa\in\Qbar$ with $\kappa\bar\kappa=1$ and $G\in\Qbar[X]$ with $G(0)=0$ such that $\deg G\geq2$ or $v^{2}\in W$, and $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar h+\Qbar\bar h$ for $h=G(v)+\kappa\,\overline{vG(v)}$.
'''
source = '''Not found in the sources read in this form; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It is the Laurent form of Theorem~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space}.'''
sketch = '''
Conjugating $\bar g=a+bv+c\,vg$ twice gives $c\bar c=1$ and $a=-c\bar b$; then $g-\bar b\bar v$ satisfies Lemma~\ref{lem:laurent_conj_twisted_symmetric_normal_form} with $\gamma=c$, and $vh=\kappa\bar h$, $\kappa=\bar c$, exchanges the two spanning families; $\deg G\leq1$ puts $v^{2}$ in $W$.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_without_polynomial_part_configuration_classes"
env = "proposition"
title = 'Hulls without a polynomial part'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $k\geq0$, let $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$. Suppose $\dim W=5$, $W$ contains no $v^{2}P(v)$ with $P\in\Qbar[X]$ non-zero, and $W$ carries a $2\times3$ configuration. Then $W$ is in one of the two classes
\begin{enumerate}
\item[(Q)] $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar(\bar v^{2}+ev^{2})+\Qbar(\beta\bar v^{3}+\zeta v^{2}+ev^{3})$ for some $e,\beta,\zeta\in\Qbar$ with $e\bar e=\beta\bar\beta=1$ and $\zeta=-\beta e^{2}\bar\zeta$;
\item[(R)] $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar g+\Qbar\bar g$ with $g=G(v)+\kappa\,\overline{vG(v)}$, for some $\kappa\in\Qbar$ with $\kappa\bar\kappa=1$ and some $G\in\Qbar[X]$ with $G(0)=0$ and $\deg G\geq2$.
\end{enumerate}
'''
source = '''Not found in the sources read; it is most of the ``only if'' half of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}, and given the lemmas above it is routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemmas~\ref{lem:laurent_conj_hull_shifted_polynomial_model} and~\ref{lem:config_shifted_coprime_polynomial_factors} give a coprime pencil, of degree at most $2$ by Lemma~\ref{lem:two_by_three_configuration_ratio_degree_le_two}, so one of the four of Lemma~\ref{lem:coprime_pencil_of_degree_le_two_normal_form}. Lemma~\ref{lem:laurent_window_quadratic_pencils_carry_no_three_factors} excludes two; $(1,X)$ gives (R) by Lemma~\ref{lem:laurent_window_degree_one_pencil_factor_space} and Proposition~\ref{prop:laurent_degree_one_conj_stable_space_real_pencil_normal_form}, and $(X,X^{2}+\beta)$ gives (Q) by Lemmas~\ref{lem:laurent_window_involution_pencil_normal_form} and~\ref{lem:laurent_involution_space_conj_stable_constraints}.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_two_by_three_configuration_iff"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Conjugation hulls of polynomials in $u$ and $\bar u$'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ with $s^{2}=u\bar u$ (so $s=\pm|u|$ is real), and put $v=u/s$, so that $\bar v=1/v$. Let $k\geq0$, let $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$. Then $W$ carries a $2\times3$ configuration if and only if $\dim W=5$ and $W$ is in one of the following classes:
\begin{enumerate}
\item[(P)] $\alpha u^{2}+\beta u^{3}\in W$ for some $\alpha,\beta\in\Qbar$, not both zero;
\item[(Q)] $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar(\bar v^{2}+ev^{2})+\Qbar(\beta\bar v^{3}+\zeta v^{2}+ev^{3})$ for some $e,\beta,\zeta\in\Qbar$ with $e\bar e=\beta\bar\beta=1$ and $\zeta=-\beta e^{2}\bar\zeta$;
\item[(R)] $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar g+\Qbar\bar g$ with $g=G(v)+\kappa\,\overline{vG(v)}$, for some $\kappa\in\Qbar$ with $\kappa\bar\kappa=1$ and some $G\in\Qbar[X]$ with $G(0)=0$ and $\deg G\geq2$.
\end{enumerate}
Since $u=sv$ and $\bar u=s\bar v$, the numbers $z$ are exactly the polynomials in $u$ and $\bar u$ with algebraic coefficients, $W$ is the conjugation hull of $z$, and $\Qbar+\Qbar u+\Qbar\bar u=\Qbar+\Qbar v+\Qbar\bar v$. The three classes are pairwise disjoint (Proposition~\ref{prop:laurent_conj_hull_configuration_classes_disjoint}), and each forces $\dim W=5$ (Lemma~\ref{lem:laurent_conj_hull_class_finrank_eq_five}).
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). The ``only if'' half, the classification, was not found in the sources read; its method is partly that of \cite[\S7 and Lemma 4]{BSZ17}. The ``if'' half consists of printed configurations or substitutions in them: class (P) is \cite[Théorème 7(1)]{Dia07}, already in \cite[Théorème 2]{Dia04}; class (Q) is the configuration of the proof of \cite[Théorème 2]{Dia04} at $x=(1,(u+\beta\bar u)/s)$, also \cite[Théorème 4(1)]{Dia07}; class (R) consists of the real pencil spaces of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.'''
sketch = '''
With $v=u/s$ every space moves between $u$ and $v$. Only if: Lemma~\ref{lem:laurent_conj_hull_finrank_le_four_no_two_by_three_configuration} gives $\dim W=5$; then Lemma~\ref{lem:laurent_conj_hull_with_polynomial_part_configuration_class} gives (P) when $W$ contains a non-zero $v^{2}P(v)$, and Proposition~\ref{prop:laurent_conj_hull_without_polynomial_part_configuration_classes} gives (Q) or (R) otherwise. If: in class (P), $W$ contains the hull of $\alpha u^{2}+\beta u^{3}$, which carries a configuration by Theorem~\ref{thm:polynomial_hull_two_by_three_configuration_iff}; (Q) and (R) carry those of Lemmas~\ref{lem:laurent_involution_space_carries_two_by_three_configuration} and~\ref{lem:laurent_real_pencil_normal_form_carries_two_by_three_configuration}.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_configuration_classes_disjoint"
root = true
env = "proposition"
title = 'The three classes are disjoint'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ with $s^{2}=u\bar u$ (so $s=\pm|u|$ is real), and put $v=u/s$, so that $\bar v=1/v$. For every $\Qbar$-subspace $W\subseteq\C$, no two of the conditions (P), (Q) and (R) of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff} hold.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Relations in $v$ and $1/v$ clear to polynomial identities at the transcendental $v$: the coefficients at $1,v,v^{5},v^{6}$ separate (P) from (Q); for (R), with $H(v)=v^{n}\overline{G(v)}$, $n=\deg G$, and $H(0)\neq0$, evaluation at $0$ kills the coordinates of $g$ and $\bar g$.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_class_finrank_eq_five"
env = "lemma"
title = 'The classes are five-dimensional'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ with $s^{2}=u\bar u$ (so $s=\pm|u|$ is real), and put $v=u/s$, so that $\bar v=1/v$. Let $k\geq0$, let $c_j\in\C$ for $j\in\Z$ (they need not be algebraic), and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$. If $W$ is in one of the classes (P), (Q) and (R) of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}, then $\dim W=5$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
In (P), $W$ contains $m=\alpha u^{2}+\beta u^{3}$ and $\bar m$, and $1,u,\bar u,m,\bar m$ are free (clear by $v^{3}$); in (Q) the generators are free in the same way, as $\beta\neq0$; in (R), with $H(v)=v^{n}\overline{G(v)}$ and $H(0)\neq0$, evaluation at $0$ of a cleared relation kills the coordinates of $g$ and $\bar g$.
'''

[[node]]
platform = "DiazModulus.laurent_conj_hull_large_exponent_configuration_iff_real_pencil_class"
root = true
env = "corollary"
title = 'Corollary E(a): exponents of absolute value at least four'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ with $s^{2}=u\bar u$ (so $s=\pm|u|$ is real), and put $v=u/s$, so that $\bar v=1/v$. Let $k\geq0$, let $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$. If $c_j\neq0$ for some $j$ with $4\leq|j|\leq k$, then $W$ carries a $2\times3$ configuration if and only if $W$ is in class (R) of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), given Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}.'''
sketch = '''
If: Lemma~\ref{lem:laurent_conj_hull_class_finrank_eq_five} and Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}. Only if: in (Q), and in (P), where the hull of $\alpha u^{2}+\beta u^{3}$ is five-dimensional by the same lemma and so equals $W$, $z$ lies in $\sum_{|j|\leq3}\Qbar v^{j}$, so $c_j=0$ for $|j|\geq4$.
'''

[[node]]
platform = "DiazModulus.cubic_window_hull_polynomial_class_iff"
env = "lemma"
title = 'The polynomial class of a cubic window'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $a,b,c,d\in\Qbar$ and $z\in\C$ with $z-(a\bar v^{3}+b\bar v^{2}+cv^{2}+dv^{3})\in\Qbar+\Qbar v+\Qbar\bar v$, and let $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$ have dimension $5$. Then $\alpha v^{2}+\beta v^{3}\in W$ for some $\alpha,\beta\in\Qbar$, not both zero, if and only if $a\bar c-b\bar d=0$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar m+\Qbar\bar m$ with $m=a\bar v^{3}+b\bar v^{2}+cv^{2}+dv^{3}$; an element $x_0+x_1v+x_2\bar v+xm+y\bar m$ lies in $\Qbar v^{2}+\Qbar v^{3}$ only if $xa+y\bar d=xb+y\bar c=0$, and Cramer's rule; conversely take $(x,y)=(\bar d,-a)$, or $(\bar c,-b)$ when $a=d=0$.
'''

[[node]]
platform = "DiazModulus.cubic_window_hull_involution_class_iff"
env = "lemma"
title = 'The involution class of a cubic window'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $a,b,c,d\in\Qbar$ and $z\in\C$ with $z-(a\bar v^{3}+b\bar v^{2}+cv^{2}+dv^{3})\in\Qbar+\Qbar v+\Qbar\bar v$, and let $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$ have dimension $5$. Then $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar(\bar v^{2}+ev^{2})+\Qbar(\beta\bar v^{3}+\zeta v^{2}+ev^{3})$ for some $e,\beta,\zeta\in\Qbar$ with $e\bar e=\beta\bar\beta=1$ and $\zeta=-\beta e^{2}\bar\zeta$ if and only if $a\bar a-d\bar d=0$ and $(a,d)\neq(0,0)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The coefficients of $\bar v^{3}$ and $v^{3}$ in $m$ give $a=x\beta$ and $d=xe$. Conversely, $p_{12}=a\bar c-b\bar d$ and $p_{13}=a\bar b-c\bar d$ are non-zero, $e=p_{13}/p_{12}$, $\beta=ea/d$ and $\zeta=e(c-be)/d$ give the normal form, and Lemma~\ref{lem:laurent_involution_space_conj_stable_constraints} the constraints.
'''

[[node]]
platform = "DiazModulus.cubic_window_hull_real_pencil_class_iff"
env = "lemma"
title = 'The real pencil class of a cubic window'
statement = '''
Let $v\in\C\setminus\Qbar$ with $v\bar v=1$. Let $a,b,c,d\in\Qbar$ and $z\in\C$ with $z-(a\bar v^{3}+b\bar v^{2}+cv^{2}+dv^{3})\in\Qbar+\Qbar v+\Qbar\bar v$, and let $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar z+\Qbar\bar z$, of any dimension. Then $W=\Qbar+\Qbar v+\Qbar\bar v+\Qbar g+\Qbar\bar g$ with $g=G(v)+\kappa\,\overline{vG(v)}$, for some $\kappa\in\Qbar$ with $\kappa\bar\kappa=1$ and some $G\in\Qbar[X]$ with $G(0)=0$ and $\deg G\geq2$, if and only if $|a\bar c-b\bar d|^{2}=(a\bar a-d\bar d)^{2}$ and $a\bar a-d\bar d\neq0$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Clearing $g\in W$ at the transcendental $v$ makes $G$ a cubic with $f_{3}=0$, $f_{-3}=\kappa\bar f_{2}$ and $f_{2}\neq0$, where $f_{j}$ are the coefficients of the part of $g$ outside $\Qbar+\Qbar v+\Qbar\bar v$; the Plücker identities then give $p_{14}=a\bar a-d\bar d\neq0$ and $p_{12}\bar p_{12}=p_{14}^{2}$, $p_{12}=a\bar c-b\bar d$. Conversely $\kappa=p_{14}/p_{12}$ and $G=G_{1}X+\bar p_{12}X^{2}$.
'''

[[node]]
platform = "DiazModulus.cubic_window_conj_hull_two_by_three_configuration_iff_criterion"
root = true
env = "corollary"
title = 'Corollary E(b): exponents within $\pm3$'
statement = '''
Let $u\in\C\setminus\Qbar$ and $s\in\Qbar$ with $s^{2}=u\bar u$ (so $s=\pm|u|$ is real), and put $v=u/s$, so that $\bar v=1/v$. Let $A,B,C,D\in\Qbar$, let $z\in\C$ with $z-(A\bar u^{3}+B\bar u^{2}+Cu^{2}+Du^{3})\in\Qbar+\Qbar u+\Qbar\bar u$, and let $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ have dimension $5$. Put $\Delta=A\bar C-B\bar D$ and $N=A\bar A-D\bar D$. Then, for the classes (P), (Q) and (R) of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}: $W$ is in (P) if and only if $\Delta=0$; in (Q) if and only if $N=0$ and $(A,D)\neq(0,0)$; in (R) if and only if $|\Delta|^{2}=s^{2}N^{2}$ and $N\neq0$. So $W$ carries a $2\times3$ configuration if and only if $N\Delta\,(|\Delta|^{2}-s^{2}N^{2})=0$, where $s^{2}=|u|^{2}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), given Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}.'''
sketch = '''
With $a=As^{3}$, $b=Bs^{2}$, $c=Cs^{2}$, $d=Ds^{3}$, $z\equiv a\bar v^{3}+b\bar v^{2}+cv^{2}+dv^{3}$, $a\bar c-b\bar d=s^{5}\Delta$ and $a\bar a-d\bar d=s^{6}N$. Lemmas~\ref{lem:cubic_window_hull_polynomial_class_iff}, \ref{lem:cubic_window_hull_involution_class_iff} and~\ref{lem:cubic_window_hull_real_pencil_class_iff} give the classes, and Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff} at $k=3$ the configuration, since $A=D=0$ forces $\Delta=0$.
'''

[[node]]
platform = "DiazModulus.candidate_laurent_conj_hull_class_not_mem_logAlgTilde"
root = true
env = "corollary"
title = 'The three classes at a candidate'
statement = '''
Assume Roy's strong six exponentials theorem: there is no $2\times3$ configuration in $\widetilde{\mathcal L}$, the $\Qbar$-span of $1$ and the logarithms of algebraic numbers. Let $u$ be a candidate: $u\neq0$, $|u|$ algebraic and $e^{u}$ algebraic. Let $s\in\Qbar$ with $s^{2}=u\bar u$, put $v=u/s$, let $k\geq0$ and $c_j\in\Qbar$ for $j\in\Z$, and put $z=\sum_{j=-k}^{k}c_jv^{j}$ and $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$. If $W$ is in one of the classes (P), (Q) and (R) of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}, then $z\notin\widetilde{\mathcal L}$.
'''
source = '''Each instance is a substitution in Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}; for class (Q) it is also one in \cite[Théorème 2]{Dia04}. Not found in the sources read as a family; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). It concerns candidates, so it is vacuous if Diaz's conjecture holds.'''
sketch = '''
Theorem~\ref{thm:hermite_lindemann_holds} gives $u\notin\Qbar$; Lemma~\ref{lem:laurent_conj_hull_class_finrank_eq_five} and Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff} put a configuration in $W$, and $z\in\widetilde{\mathcal L}$ would put $W$ in $\widetilde{\mathcal L}$ (Lemmas~\ref{lem:logAlg_conj_stable} and~\ref{lem:logAlgTilde_conj_stable}), against Roy's theorem.
'''

# --- What the classical theorems cannot refute (Theorem D) (R19) ------------------------------------

[[node]]
platform = "DiazModulus.transcendental_add_mul_add_mul_conj"
env = "lemma"
section = 'What the classical theorems cannot refute (Theorem D)'
title = 'Transcendence of $a+bu+c\bar u$'
statement = '''
Let $F$ be a subfield of $\C$ and $u\in\C$ transcendental over $F$ with $u\bar u\in F$. If $a,b,c\in F$ and $(b,c)\neq(0,0)$, then $a+bu+c\bar u$ is transcendental over $F$.
'''
source = '''Standard field theory.'''
sketch = '''
With $e=a+bu+c\bar u$ and $\rho=u\bar u\neq0$, $u$ is a root of the non-zero polynomial $bX^{2}+(a-e)X+c\rho$ over $F(e)$; if $e$ were algebraic over $F$, so would be $u$.
'''

[[node]]
platform = "DiazModulus.isAlgebraic_of_mem_of_isAlgebraic_adjoin_transcendental"
env = "lemma"
title = 'Elements of $F$ algebraic over $\Q(w)$'
statement = '''
Let $F$ be a subfield of $\C$, $w\in\C$ transcendental over $F$, and $z\in F$ algebraic over $\Q(w)$. Then $z$ is algebraic.
'''
source = '''Standard field theory.'''
sketch = '''
If $z$ were transcendental, $w$ would be transcendental over $\Q[z]\subseteq F$, so $(z,w)$ would be algebraically independent and $z$ transcendental over $\Q(w)$.
'''

[[node]]
platform = "DiazModulus.isAlgebraic_of_hyperbola_pair_not_algebraicIndependent"
env = "lemma"
title = 'The hyperbola step'
statement = '''
Let $F$ be a subfield of $\C$, $u\in\C$ transcendental over $F$ with $u\bar u\in F$, and $c_1,c_2\in F$. If $c_1+u$ and $c_2+\bar u$ are algebraically dependent over $\Q$, then $c_1$ and $c_2$ are algebraic.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$e_1=c_1+u$ is transcendental (Lemma~\ref{lem:transcendental_add_mul_add_mul_conj}), so $e_2=c_2+\bar u$ is algebraic over $\Q[e_1]$ (Lemma~\ref{lem:isAlgebraic_adjoin_of_not_algebraicIndependent_pair}): $\sum_{k\leq K}g_k(e_1)e_2^{k}=0$ with $g_K(e_1)\neq0$. As $c_2u+\rho=ue_2$, $\rho=u\bar u$, the polynomial $R(T)=\sum_kg_k(c_1+T)(c_2T+\rho)^{k}T^{K-k}$ over $F$ vanishes at $u$, so $R=0$ and $R(0)=g_K(c_1)\rho^{K}=0$; the same with $\bar u$ for $c_2$.
'''

[[node]]
platform = "DiazModulus.mem_logAlg_adjoin_circle_point_iff"
env = "lemma"
title = 'The space $\mathcal L_u$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $u\in\C$ and $\mathcal L_u=\operatorname{span}_{\Q}\mathcal L+\Q u+\Q\bar u$. Then $z\in\mathcal L_u$ if and only if $z=c+pu+q\bar u$ with $c\in\mathcal L$ and $p,q\in\Q$, and the $\Qbar$-span of $1$ and $\mathcal L_u$ is $\widetilde{\mathcal L}+\Qbar u+\Qbar\bar u$. At $u=0$ the membership criterion says that $\mathcal L$ is a $\Q$-vector space, so $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$.
'''
source = '''Elementary.'''
sketch = '''
$\mathcal L$ contains $0$ and is closed under addition, as $e^{a+b}=e^{a}e^{b}$, and under rational multiples (Lemma~\ref{lem:exp_ratMul_isAlgebraic}), so $\operatorname{span}_{\Q}\mathcal L=\mathcal L$; each $\Qbar$-span contains the generators of the other.
'''

[[node]]
platform = "DiazModulus.exists_noncandidate_transcendental_on_circle"
env = "lemma"
from_lean = true
title = 'A circle point off a countable field'
statement = '''
Let $K$ be a countable subfield of $\C$ and $\rho>0$ a real number. There is $t\in\C$ with $t\bar t=\rho$ that is transcendental over $K$ and has $e^{t}$ transcendental.
'''
source = '''Elementary: a countability argument.'''
sketch = '''
The points $x+i\sqrt{\rho-x^{2}}$ with $|x|<\sqrt\rho$ form an uncountable set, while the numbers algebraic over $K$, and the $t$ with $e^{t}$ algebraic (countably many translates of $2\pi i\Z$), form countable sets.
'''

[[node]]
platform = "DiazModulus.exists_circle_point_transcendental_over_logAlgTilde_closure"
env = "lemma"
title = 'A circle point transcendental over the field of $\widetilde{\mathcal L}$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$ and $\rho>0$ a real number. Then $F$ is countable, and some $u\in\C$ with $u\bar u=\rho$ is transcendental over $F$.
'''
source = '''Elementary: a countability argument.'''
sketch = '''
$\mathcal L$ is a countable union of translates of $2\pi i\Z$, so $\widetilde{\mathcal L}$, spanned over the countable $\Qbar$, and the field it generates are countable; Lemma~\ref{lem:exists_noncandidate_transcendental_on_circle} with $K=F$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_baker_number_field_basis"
env = "proposition"
title = "Baker's theorem over a number-field basis, for $\\mathcal L_u$"
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $K\subseteq\C$ be a number field, $(\beta_k)$ a basis of $K$ over $\Q$, and $\ell_k\in\mathcal L_u$. If $\sum_k\beta_k\ell_k$ is algebraic, then $\ell_k=0$ for every $k$.
'''
source = '''Restates Baker's theorem \cite{Bak66} in the form of \cite[Theorem 4.5]{Wal00} (Theorem~\ref{thm:baker_number_field_basis}), with $\mathcal L$ replaced by $\mathcal L_u$; the $\mathcal L_u$ form was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write $\ell_k=c_k+p_ku+q_k\bar u$ (Lemma~\ref{lem:mem_logAlg_adjoin_circle_point_iff}); Lemma~\ref{lem:transcendental_add_mul_add_mul_conj} forces $\sum_k\beta_kp_k=\sum_k\beta_kq_k=0$, so every $p_k$ and $q_k$ is $0$, and Theorem~\ref{thm:baker_number_field_basis} applies to the $c_k\in\mathcal L$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_baker_linear_forms"
env = "proposition"
title = "Baker's theorem for $\\mathcal L_u$"
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $l_1,\dots,l_n\in\mathcal L_u$ be linearly independent over $\Q$, and let $b_0,b_1,\dots,b_n$ be algebraic numbers, not all zero. Then $b_0+\sum_{i=1}^{n}b_il_i\neq0$.
'''
source = '''Restates Baker's theorem \cite{Bak66}, \cite[Theorem 1.6]{Wal00} (Theorem~\ref{thm:baker_linear_forms_in_logarithms}), with $\mathcal L$ replaced by $\mathcal L_u$, derived from the form of \cite[Theorem 4.5]{Wal00} as in \cite[\S4.2.5]{Wal00}; the $\mathcal L_u$ form was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
As in \cite[\S4.2.5]{Wal00}: write $b_j=\sum_ic_{ji}\beta_i$ in a $\Q$-basis $(\beta_i)$ of $\Q(b_1,\dots,b_n)$; Proposition~\ref{prop:logAlg_adjoin_circle_point_baker_number_field_basis} gives $\sum_jc_{ji}l_j=0$ for every $i$, so $c=0$, every $b_j=0$, and then $b_0=0$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_hermite_lindemann_gelfond_schneider"
env = "proposition"
title = "Hermite–Lindemann and Gel'fond–Schneider for $\\mathcal L_u$"
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Then $0$ is the only algebraic element of $\mathcal L_u$ (Hermite–Lindemann), and if $l_0\neq0$ and $\beta l_0$ lie in $\mathcal L_u$ with $\beta$ algebraic, then $\beta\in\Q$ (Gel'fond–Schneider).
'''
source = '''Restates the Hermite–Lindemann theorem \cite{Her1873,Lin1882} (Theorem~\ref{thm:hermite_lindemann_holds}) and the Gel'fond–Schneider theorem \cite{Gel34,Sch34} (Theorem~\ref{thm:gelfond_schneider}), with $\mathcal L$ replaced by $\mathcal L_u$, both derived from Baker's theorem for $\mathcal L_u$; the $\mathcal L_u$ form was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Proposition~\ref{prop:logAlg_adjoin_circle_point_baker_linear_forms} with $n=1$ and the form $-z+1\cdot z$; and with $n=2$, $b_0=0$ and the form $\beta\cdot l_0-1\cdot(\beta l_0)$, where $l_0$ and $\beta l_0$ are linearly independent over $\Q$ unless $\beta\in\Q$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_six_exponentials"
env = "proposition"
title = 'The six exponentials theorem for $\mathcal L_u$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Then there are no $x_1,x_2$, linearly independent over $\Q$, and $y_1,y_2,y_3$, linearly independent over $\Q$, with all six products $x_iy_j$ in $\mathcal L_u$.
'''
source = '''Restates the six exponentials theorem \cite[Ch.~II]{Lang66}, \cite{Ram68}, \cite[Theorem 1.12]{Wal00} (Theorem~\ref{thm:six_exponentials}), with $\mathcal L$ replaced by $\mathcal L_u$; the dependent cases use Baker's theorem \cite{Bak66}. The $\mathcal L_u$ form, and a route to it that avoids Roy's strong six exponentials theorem \cite{Roy92}, were not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Proposition~\ref{prop:logAlg_adjoin_circle_point_baker_linear_forms} makes both families linearly independent over $\Qbar$. As $\bar u=(u\bar u)u^{-1}$, Proposition~\ref{prop:rank_one_config_inverse_adjoin} with $K=\Qbar$ and $V_0=\widetilde{\mathcal L}$ puts the six products in $\widetilde{\mathcal L}\subseteq F$, Lemma~\ref{lem:transcendental_add_mul_add_mul_conj} then puts them in $\mathcal L$, and Theorem~\ref{thm:six_exponentials} applies. Roy's theorem is not used.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_trdeg_le_one_logAlg_part_eq_zero"
env = "lemma"
title = 'In transcendence degree one, ${\Q[S]}$ meets $\mathcal L$ only in $0$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $S\subseteq\C$ be a set such that $\Q[S]$, the $\Q$-algebra generated by $S$, has transcendence degree at most $1$, and suppose that $c+pu+q\bar u\in\Q[S]$ for some $c\in\mathcal L$ and $p,q\in\Q$, not both zero. Then $0$ is the only element of $\mathcal L$ in $\Q[S]$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$e=c+pu+q\bar u$ is transcendental over $F$ (Lemma~\ref{lem:transcendental_add_mul_add_mul_conj}), and every element of $\Q[S]$ is algebraic over $\Q(e)$; so $w\in\mathcal L\cap\Q[S]$, which lies in $F$, is algebraic (Lemma~\ref{lem:isAlgebraic_of_mem_of_isAlgebraic_adjoin_transcendental}), and Theorem~\ref{thm:hermite_lindemann_holds} gives $w=0$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_trdeg_le_one_hyperbola_case"
env = "lemma"
title = 'The hyperbola case'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $S\subseteq\mathcal L_u$ be such that $\Q[S]$, the $\Q$-algebra generated by $S$, has transcendence degree at most $1$, and let $c_1,c_2\in\mathcal L$ with $c_1+u$ and $c_2+\bar u$ in $\Q[S]$. Then $S\subseteq\Q u+\Q\bar u$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
The pair $(c_1+u,c_2+\bar u)$ is algebraically dependent, so $c_1,c_2$ are algebraic (Lemma~\ref{lem:isAlgebraic_of_hyperbola_pair_not_algebraicIndependent}) and $0$ (Theorem~\ref{thm:hermite_lindemann_holds}); then $u\in\Q[S]$, and Lemma~\ref{lem:logAlg_adjoin_circle_point_trdeg_le_one_logAlg_part_eq_zero} kills the part $c\in\mathcal L$ of each $z=c+pu+q\bar u\in S$ (Lemma~\ref{lem:mem_logAlg_adjoin_circle_point_iff}).
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_trdeg_le_one_trichotomy"
env = "lemma"
title = 'The trichotomy in transcendence degree one'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $S\subseteq\mathcal L_u$ be such that $\Q[S]$, the $\Q$-algebra generated by $S$, has transcendence degree at most $1$. Then $S\subseteq\mathcal L$, or $S\subseteq\Q e$ for some $e\in\C$, or $S\subseteq\Q u+\Q\bar u$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Write each $z\in S$ as $c+pu+q\bar u$ (Lemma~\ref{lem:mem_logAlg_adjoin_circle_point_iff}). If some $z_0\notin\mathcal L$ and some $z_1$ have non-parallel $(p_0,q_0)$ and $(p_1,q_1)$, two rational combinations of them are $c_1'+u$ and $c_2'+\bar u$, and Lemma~\ref{lem:logAlg_adjoin_circle_point_trdeg_le_one_hyperbola_case} applies; otherwise each $z-rz_0$, $r\in\Q$, lies in $\mathcal L\cap\Q[S]$, and Lemma~\ref{lem:logAlg_adjoin_circle_point_trdeg_le_one_logAlg_part_eq_zero} makes it $0$.
'''

[[node]]
platform = "Transcendence.quadratic_coeffs_eq_zero_of_transcendental"
env = "lemma"
from_lean = true
title = 'Quadratic relations at a transcendental number'
statement = '''
Let $x\in\C$ be transcendental and $c_0,c_1,c_2$ algebraic with $c_2x^{2}+c_1x+c_0=0$. Then $c_0=c_1=c_2=0$.
'''
source = '''Elementary.'''
sketch = '''
If $c_2\neq0$, $(2c_2x+c_1)^{2}=c_1^{2}-4c_2c_0$ makes $x$ algebraic; if $c_2=0\neq c_1$, so does $x=-c_0/c_1$; then $c_0=0$.
'''

[[node]]
platform = "DiazModulus.det_zero_linear_forms_rank_one"
env = "lemma"
from_lean = true
title = 'The lemma on linear forms over $\Q$'
statement = '''
Let $M=(L_{ij})_{i,j=1,2}$ be a matrix of linear forms $L_{ij}=\sum_{k=1}^{n}a_{ijk}X_k$ with $a_{ijk}\in\Q$. If $L_{11}L_{22}=L_{12}L_{21}$, that is $a_{11k}a_{22l}+a_{11l}a_{22k}=a_{12k}a_{21l}+a_{12l}a_{21k}$ for all $k,l$, then the rows of $M$ are linearly dependent over $\Q$, or its columns are.
'''
source = '''Elementary; it is the case $F=\Q$ of Lemma~\ref{lem:det_zero_linear_forms_rank_one_field}.'''
sketch = '''
If $L_{11}=0$, then $L_{12}L_{21}=0$, a zero row or a zero column. Otherwise, with $\alpha=a_{11k}\neq0$, $(\alpha L_{12}-a_{12k}L_{11})(\alpha L_{21}-a_{21k}L_{11})=0$, and then $\alpha L_{22}=a_{12k}L_{21}$ (the columns are proportional) or $\alpha L_{22}=a_{21k}L_{12}$ (the rows are).
'''

[[node]]
platform = "DiazModulus.four_exp_barrier_of_no_quadratic_relation"
env = "lemma"
from_lean = true
title = 'Singular matrices without a quadratic relation'
statement = '''
Let $e_1,\dots,e_n\in\C$ satisfy no quadratic relation over $\Q$: if $\sum_{k,l}f_{kl}e_ke_l=0$ with $f_{kl}\in\Q$, then $f_{kl}+f_{lk}=0$ for all $k,l$. Let $M=(m_{ij})_{i,j=1,2}$ with $m_{ij}=\sum_ka_{ijk}e_k$ and $a_{ijk}\in\Q$. If $\det M=0$, then the rows of $M$ are linearly dependent over $\Q$, or its columns are.
'''
source = '''Elementary.'''
sketch = '''
$\det M=\sum_{k,l}(a_{11k}a_{22l}-a_{12k}a_{21l})e_ke_l$, so the forms $L_{ij}=\sum_ka_{ijk}X_k$ satisfy $L_{11}L_{22}=L_{12}L_{21}$, and Lemma~\ref{lem:det_zero_linear_forms_rank_one} gives a rational relation between their rows or columns, which holds at $e$.
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_four_exponentials_trdeg_one"
env = "proposition"
title = 'Four exponentials in transcendence degree one, for $\mathcal L_u$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Let $\ell_{11},\ell_{12},\ell_{21},\ell_{22}\in\mathcal L_u$ be non-zero with $\ell_{11}\ell_{22}=\ell_{12}\ell_{21}$ and $\trdeg_{\Q}\Q[\ell_{11},\ell_{12},\ell_{21},\ell_{22}]\leq1$. Then the two rows, or the two columns, of $\begin{pmatrix}\ell_{11}&\ell_{12}\\\ell_{21}&\ell_{22}\end{pmatrix}$ are linearly dependent over $\Q$.
'''
source = '''Restates the four exponentials theorem in transcendence degree one \cite[Cor.~4]{W73}, \cite[Cor.~7]{Bro74} (Theorem~\ref{thm:four_exponentials_trdeg_one}), with $\mathcal L$ replaced by $\mathcal L_u$; the $\mathcal L_u$ form was not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
Lemma~\ref{lem:logAlg_adjoin_circle_point_trdeg_le_one_trichotomy}: entries in $\mathcal L$ are Theorem~\ref{thm:four_exponentials_trdeg_one}; entries on a line $\Q e$ give proportional rows; entries in $\Q u+\Q\bar u$ are Lemma~\ref{lem:four_exp_barrier_of_no_quadratic_relation} at $(u,\bar u)$, since $au^{2}+bu\bar u+c\bar u^{2}=0$, times $u^{2}$, is a quadratic relation with algebraic coefficients for the transcendental $u^{2}$ (Lemma~\ref{lem:quadratic_coeffs_eq_zero_of_transcendental}).
'''

[[node]]
platform = "DiazModulus.logAlg_adjoin_circle_point_theorem_D"
root = true
env = "theorem"
title = 'Theorem D: the classical theorems for $\mathcal L_u$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $F$ be the field generated by $\widetilde{\mathcal L}$, let $u\in\C$ be transcendental over $F$ with $u\bar u$ algebraic, and put $\mathcal L_u=\mathcal L+\Q u+\Q\bar u$. Say that a $\Q$-vector subspace $L\subseteq\C$ has the \emph{Theorem~D properties} if, with $\widetilde L$ the $\Qbar$-span of $1$ and $L$:
\begin{itemize}
\item \emph{conjugation:} $\bar z\in L$ for every $z\in L$;
\item \emph{Baker:} if $l_1,\dots,l_n\in L$ are linearly independent over $\Q$ and $b_0,b_1,\dots,b_n$ are algebraic, not all zero, then $b_0+\sum_{i=1}^{n}b_il_i\neq0$;
\item \emph{Hermite–Lindemann:} $0$ is the only algebraic element of $L$;
\item \emph{Gel'fond–Schneider:} if $l_0\neq0$ and $\beta l_0$ lie in $L$ and $\beta$ is algebraic, then $\beta\in\Q$;
\item \emph{Roy, relative to $\widetilde{\mathcal L}$:} if there is no $2\times3$ configuration in $\widetilde{\mathcal L}$, there is none in $\widetilde L$;
\item \emph{six exponentials:} there are no $x_1,x_2$, linearly independent over $\Q$, and $y_1,y_2,y_3$, linearly independent over $\Q$, with all six products $x_iy_j$ in $L$;
\item \emph{four exponentials in transcendence degree one:} if $\ell_{11},\ell_{12},\ell_{21},\ell_{22}\in L$ are non-zero, $\ell_{11}\ell_{22}=\ell_{12}\ell_{21}$ and $\trdeg_{\Q}\Q[\ell_{11},\ell_{12},\ell_{21},\ell_{22}]\leq1$, then the rows, or the columns, of $(\ell_{ij})$ are linearly dependent over $\Q$.
\end{itemize}
Then $\mathcal L\subseteq\mathcal L_u$, $u\in\mathcal L_u$, $u\notin\Qbar$, $u\neq0$ and $|u|$ is algebraic, and $\mathcal L_u$ has the Theorem~D properties; for it, $\widetilde L=\widetilde{\mathcal L}+\Qbar u+\Qbar\bar u$ (Lemma~\ref{lem:mem_logAlg_adjoin_circle_point_iff}). The Roy clause is an implication, so the statement is unconditional, and $e^{u}$ is not involved.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). With $\mathcal L$ replaced by $\mathcal L_u$, each clause restates a classical theorem: Baker \cite{Bak66}, Hermite–Lindemann \cite{Her1873,Lin1882}, Gel'fond–Schneider \cite{Gel34,Sch34}, six exponentials \cite[Ch.~II]{Lang66}, \cite{Ram68}, four exponentials in transcendence degree one \cite[Cor.~4]{W73}, \cite[Cor.~7]{Bro74}, and, as an implication, Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}.'''
sketch = '''
$u\notin\Qbar$ as $\Qbar\subseteq F$, and $|u|^{2}=u\bar u$. Conjugation by Lemmas~\ref{lem:mem_logAlg_adjoin_circle_point_iff} and~\ref{lem:logAlg_conj_stable}; Baker, Hermite–Lindemann and Gel'fond–Schneider are Propositions~\ref{prop:logAlg_adjoin_circle_point_baker_linear_forms} and~\ref{prop:logAlg_adjoin_circle_point_hermite_lindemann_gelfond_schneider}, six and four exponentials Propositions~\ref{prop:logAlg_adjoin_circle_point_six_exponentials} and~\ref{prop:logAlg_adjoin_circle_point_four_exponentials_trdeg_one}; Roy is Theorem~\ref{thm:logAlgTilde_adjoin_circle_point_no_two_by_three_configuration}, as $\widetilde L=\widetilde{\mathcal L}+\Qbar u+\Qbar\bar u$.
'''

[[node]]
platform = "DiazModulus.span_logAlg_theorem_D_properties"
root = true
env = "proposition"
title = 'The Theorem D properties of $\mathcal L$'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. Let $L=\operatorname{span}_{\Q}\mathcal L$, which is $\mathcal L$ (Lemma~\ref{lem:mem_logAlg_adjoin_circle_point_iff}). Then Diaz's conjecture, that $e^{u}$ is transcendental for every $u\neq0$ with $|u|$ algebraic, holds if and only if no non-zero $u\in L$ has $|u|$ algebraic; and $L$ has the Theorem~D properties of Theorem~\ref{thm:logAlg_adjoin_circle_point_theorem_D}, with $\widetilde L=\widetilde{\mathcal L}$.
'''
source = '''Not found in the sources read as a bundle; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The clauses are classical theorems about $\mathcal L$: Baker \cite{Bak66}, Hermite–Lindemann \cite{Her1873,Lin1882}, Gel'fond–Schneider \cite{Gel34,Sch34}, six exponentials \cite[Ch.~II]{Lang66}, \cite{Ram68} and four exponentials in transcendence degree one \cite[Cor.~4]{W73}, \cite[Cor.~7]{Bro74}; the Roy clause is relative, so Roy's theorem \cite[Corollary 2]{Roy92} is not needed.'''
sketch = '''
$L=\mathcal L$, so Diaz's conjecture is the contrapositive. The clauses are Lemma~\ref{lem:logAlg_conj_stable} and Theorems~\ref{thm:baker_linear_forms_in_logarithms}, \ref{thm:hermite_lindemann_holds}, \ref{thm:gelfond_schneider} (a non-rational $\beta$ would make $e^{\beta l_0}$ transcendental), \ref{thm:six_exponentials} and~\ref{thm:four_exponentials_trdeg_one}; the Roy clause holds as $\widetilde L=\widetilde{\mathcal L}$.
'''

[[node]]
platform = "DiazModulus.theorem_D_barrier"
root = true
env = "corollary"
title = 'Theorem D as a barrier'
statement = '''
Let $\mathcal L$ be the set of logarithms of algebraic numbers, the $z\in\C$ with $e^{z}$ algebraic, and $\widetilde{\mathcal L}$ the $\Qbar$-span of $1$ and $\mathcal L$. There is a $\Q$-vector subspace $L\subseteq\C$ with $\mathcal L\subseteq L$ that has the Theorem~D properties of Theorem~\ref{thm:logAlg_adjoin_circle_point_theorem_D} and contains some $u\neq0$ with $|u|$ algebraic. So these properties, as properties of $(\mathcal L,\widetilde{\mathcal L})$, with Roy's theorem for $\widetilde{\mathcal L}$ \cite[Corollary 2]{Roy92} supplying the hypothesis of the Roy clause, do not prove Diaz's conjecture: by Proposition~\ref{prop:span_logAlg_theorem_D_properties} the conjecture says that no such $u$ lies in $\mathcal L$, and an argument from the properties alone would apply to $L$ as well. The barrier concerns membership only: $L$ comes with no exponential function, so it says nothing about arguments through the values $e^{x_iy_j}$, such as \cite{W73}, or through Roy's rank bounds for larger matrices.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), given Theorem~\ref{thm:logAlg_adjoin_circle_point_theorem_D} and Lemma~\ref{lem:exists_circle_point_transcendental_over_logAlgTilde_closure}.'''
sketch = '''
Lemma~\ref{lem:exists_circle_point_transcendental_over_logAlgTilde_closure} at $\rho=1$ gives $u$ with $u\bar u=1$, transcendental over the field generated by $\widetilde{\mathcal L}$; Theorem~\ref{thm:logAlg_adjoin_circle_point_theorem_D} for $L=\mathcal L_u$.
'''

# --- Rational hulls: the degree-two normal form and Theorem F (R20) ------------------------------

[[node]]
platform = "DiazModulus.quadratic_pencil_wronskian_identities"
env = "lemma"
section = 'Rational hulls: the degree-two normal form and Theorem F'
title = 'The Wronskian of a quadratic pencil'
statement = '''
Let $K$ be a commutative ring and $p,q\in K[X]$ of degree at most $2$, with coefficients $p_i,q_i$ of $X^{i}$, and let $J=p'q-pq'$ be their Wronskian. Then $J=(p_2q_1-p_1q_2)X^{2}+2(p_2q_0-p_0q_2)X+(p_1q_0-p_0q_1)$ and $J^{2}=d_2p^{2}+d_1pq+d_0q^{2}$, with $d_2=q_1^{2}-4q_2q_0$, $d_1=4(p_2q_0+p_0q_2)-2p_1q_1$ and $d_0=p_1^{2}-4p_2p_0$. Here $d_2X^{2}+d_1X+d_0$ is the discriminant, in $Y$, of $p(Y)-Xq(Y)$; with $[ij]=p_iq_j-p_jq_i$, the first identity reads $J=[21]X^{2}+2[20]X+[10]$.
'''
source = '''Classical: the Wronskian of a pencil of binary quadratics, whose square is the discriminant of the pencil written as a quadratic form in its two members.'''
sketch = '''
Both identities are polynomial identities in the six coefficients: expand $p$ and $q$, differentiate term by term, and normalise in the commutative ring $K$.
'''

[[node]]
platform = "DiazModulus.quadratic_pencil_resultant_ne_zero"
env = "lemma"
title = 'The resultant of a coprime quadratic pencil'
statement = '''
Let $K$ be a field of characteristic zero and $p,q\in K[X]$ coprime with $\max(\deg p,\deg q)=2$; write $p_i,q_i$ for the coefficients of $X^{i}$ and $[ij]=p_iq_j-p_jq_i$. Then $\Res=[20]^{2}-[21][10]\neq0$. Up to sign, $\Res$ is the determinant of the Bezout matrix of $p$ and $q$, their resultant as binary quadratic forms.
'''
source = '''Classical: the resultant of two binary quadratics, up to sign the determinant of their Bezout matrix, vanishes only when they have a common factor.'''
sketch = '''
By Lemma~\ref{lem:quadratic_pencil_wronskian_identities} the coefficient matrix of $(q,p,J)$ in $(1,X,X^{2})$ has determinant $-2\Res$. If $\Res=0$, some $v\neq0$ has $v_0q+v_1p+v_2J=0$: $v_2=0$ makes $p,q$ proportional, so both constant by coprimality; $v_2\neq0$ gives $(v_2p'+v_0)q=p(v_2q'-v_1)$, so the one of $p,q$ of degree $2$ divides a polynomial of degree at most $1$ whose coefficient of $X$ is $2v_2$ times its leading coefficient, non-zero in characteristic zero.
'''

[[node]]
platform = "DiazModulus.quadratic_pencil_wronskian_span"
env = "lemma"
title = 'A coprime quadratic pencil and its Wronskian span the quadratics'
statement = '''
Let $K$ be a field of characteristic zero, $p,q\in K[X]$ coprime with $\max(\deg p,\deg q)=2$, and $J=p'q-pq'$. Then every $R\in K[X]$ of degree at most $2$ is $aq+bp+cJ$ for some $a,b,c\in K$. Characteristic zero is needed: in characteristic $2$, $p=X^{2}$ and $q=1$ give $J=0$.
'''
source = '''Classical: two binary quadratics with non-zero resultant and their Wronskian span the binary quadratics.'''
sketch = '''
The coefficient matrix $M$ of $(q,p,J)$ in $(1,X,X^{2})$ has determinant $-2\Res$ (Lemma~\ref{lem:quadratic_pencil_wronskian_identities}), which is non-zero by Lemma~\ref{lem:quadratic_pencil_resultant_ne_zero}; for $r$ the coefficient vector of $R$, $v=rM^{-1}$ gives $R=v_0q+v_1p+v_2J$.
'''

[[node]]
platform = "DiazModulus.coprime_pencil_mobius"
env = "lemma"
title = 'A change of basis of a coprime quadratic pencil'
statement = '''
Let $K$ be a field, $p,q\in K[X]$ coprime with $\max(\deg p,\deg q)=2$, and $a,b,c,d\in K$ with $ad-bc\neq0$. Then $ap+bq$ and $cp+dq$ are coprime, and $\max(\deg(ap+bq),\deg(cp+dq))=2$.
'''
source = '''Standard linear algebra.'''
sketch = '''
With $\Delta=ad-bc$, $p=\Delta^{-1}(d(ap+bq)-b(cp+dq))$ and $q=\Delta^{-1}(a(cp+dq)-c(ap+bq))$. A Bézout identity $xp+yq=1$ becomes $\Delta^{-1}(dx-cy)(ap+bq)+\Delta^{-1}(ay-bx)(cp+dq)=1$; and if both new members had degree at most $1$, so would $p$ and $q$.
'''

[[node]]
platform = "DiazModulus.qbar_matrix_fin_two_eigen_or_jordan"
env = "lemma"
title = 'Two-by-two matrices over $\Qbar$'
statement = '''
Let $M$ be a $2\times2$ matrix with entries in $\Qbar$, acting on $\Qbar^{2}$. Then $M=cI$ for some $c\in\Qbar$; or there are free $v,w\in\Qbar^{2}$ and $c_1\neq c_2$ in $\Qbar$ with $Mv=c_1v$ and $Mw=c_2w$; or there are free $v,w\in\Qbar^{2}$ and $c\in\Qbar$ with $Mv=cv$ and $Mw=cw+v$.
'''
source = '''Standard linear algebra: the Jordan form of a $2\times2$ matrix over an algebraically closed field.'''
sketch = '''
Explicit, for $M$ with rows $(\alpha,\beta)$ and $(\gamma,\delta)$. If $\beta=0$, the vectors $(1,0)$, $(0,1)$, $(0,\gamma)$ and $(\alpha-\delta,\gamma)$ give the three cases. If $\beta\neq0$, a root $l$ of $t^{2}-(\alpha+\delta)t+\alpha\delta-\beta\gamma$ lies in $\Qbar$, as a square root of the discriminant is algebraic; with the other root $m$, the vectors $(\beta,l-\alpha)$ and $(\beta,m-\alpha)$ are an eigenbasis if $l\neq m$, and $(\beta,l-\alpha)$ and $(0,1)$ a Jordan pair if $l=m$.
'''

[[node]]
platform = "DiazModulus.quadratic_ratio_wronskian_free"
env = "lemma"
title = 'The Wronskian quotient is free over $\Qbar(h)$'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)=2$, $J=p'q-pq'$, $h=p(u)/q(u)$ and $w=J(u)/q(u)$. If $A,B\in\Qbar[X]$ satisfy $A(h)+B(h)w=0$, then $A=B=0$: so $1$ and $w$ are linearly independent over the field $\Qbar(h)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$q(u)\neq0$, and $h$ is transcendental, as $p-hq$ would otherwise vanish at $u$. Lemma~\ref{lem:quadratic_pencil_wronskian_identities} at $u$, divided by $q(u)^{2}$, gives $w^{2}=\Delta(h)$ with $\Delta=d_2X^{2}+d_1X+d_0$, so $A^{2}=B^{2}\Delta$ in $\Qbar[X]$. If $B\neq0$, then $B\mid A$ and $\Delta$ is a square, so $d_1^{2}-4d_2d_0=0$; but $d_1^{2}-4d_2d_0=16\Res$, which is non-zero by Lemma~\ref{lem:quadratic_pencil_resultant_ne_zero}.
'''

[[node]]
platform = "DiazModulus.quadratic_ratio_pole_fractions_independent"
env = "lemma"
title = 'Pole fractions at three values are free'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)=2$ and $J=p'q-pq'$. Let $\lambda_0,\lambda_1,\lambda_2\in\Qbar$ be distinct, let $(\alpha_i,\beta_i)\in\Qbar^{2}$ be non-zero for each $i$, and put $g_i=q(u)\bigl(\alpha_iq(u)+\beta_iJ(u)\bigr)/\bigl(u(p(u)-\lambda_iq(u))\bigr)$. Then $1,u,u^{-1},g_0,g_1,g_2$ are free over $\Qbar$: pole fractions at three distinct values of $\lambda$ are free modulo $\Qbar+\Qbar u+\Qbar u^{-1}$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Step~1 of the elementary proof of Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
Write $a+bu+cu^{-1}=R(u)/u$ with $R=c+aX+bX^{2}$, and $R=a'q+b'p+c'J$ by Lemma~\ref{lem:quadratic_pencil_wronskian_span}. Dividing a relation by $q(u)/u$ and multiplying it by $\prod_j(h-\lambda_j)$, with $h=p(u)/q(u)$, gives $A(h)+B(h)w=0$ for $w=J(u)/q(u)$, so $A=B=0$ by Lemma~\ref{lem:quadratic_ratio_wronskian_free}; at $X=\lambda_i$ only the $i$-th fraction survives, so $d_i\alpha_i=d_i\beta_i=0$ and $d_i=0$, and then $a=b=c=0$.
'''

[[node]]
platform = "DiazModulus.degree_two_configuration_multiplier_complement"
env = "proposition"
title = 'A multiplier complement'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)=2$, and let $y_0,y_1,y_2\in W$ be free over $\Qbar$ with $(p(u)/q(u))y_j\in W$ for every $j$. Then there are $\lambda\in\{0,1,2\}$ and $g_1,g_2\in\C$ such that, with $k=q(u)/(p(u)-\lambda q(u))$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ and $kg_1,kg_2\in W$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Steps~1 to~3 of the elementary proof of Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
Step 1: as six free vectors do not fit in $W$, Lemma~\ref{lem:quadratic_ratio_pole_fractions_independent} gives some $\lambda\in\{0,1,2\}$ for which no non-zero pole fraction $g_\lambda(\alpha,\beta)=q(u)(\alpha q(u)+\beta J(u))/(u(p(u)-\lambda q(u)))$ lies in $W$. Step 2: the $Y_j=(p(u)/q(u)-\lambda)y_j$ lie in $W$, are free, and $kY_j=y_j\in W$; for $f\in V\cap(\Qbar+\Qbar u+\Qbar u^{-1})$, $V=\sum_j\Qbar Y_j$, Lemma~\ref{lem:quadratic_pencil_wronskian_span} writes $uf$ as $a'q+b'p+c'J$ at $u$, and $kf-b'q(u)/u=g_\lambda(a'+\lambda b',c')\in W$ forces $f\in\Qbar(p(u)-\lambda q(u))/u$. Step 3: so $\dim(V+\Qbar+\Qbar u+\Qbar u^{-1})\geq5$, $V+\Qbar+\Qbar u+\Qbar u^{-1}=W$, and two of the $Y_j$ serve as $g_1,g_2$.
'''

[[node]]
platform = "DiazModulus.quadratic_complement_multiplication_matrix"
env = "lemma"
title = 'Multiplication by $k$ modulo $\Qbar+\Qbar u+\Qbar u^{-1}$'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $k,g_0,g_1\in\C$ with $kg_j\in\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_0+\Qbar g_1$ for $j=0,1$. Then there are a $2\times2$ matrix $T$ over $\Qbar$ and $R_0,R_1\in\Qbar[X]$ of degree at most $2$ with $kg_j=R_j(u)/u+T_{0j}g_0+T_{1j}g_1$ for $j=0,1$. As the $R(u)/u$ with $\deg R\leq2$ are the elements of $\Qbar+\Qbar u+\Qbar u^{-1}$, $T$ is a matrix of multiplication by $k$ modulo $\Qbar+\Qbar u+\Qbar u^{-1}$; no dimension is assumed, so $T$ need not be unique.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Part of Step~4 of the elementary proof of Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
Write $kg_j=a_j+b_ju+c_ju^{-1}+d_jg_0+e_jg_1$ and take $T_{0j}=d_j$, $T_{1j}=e_j$ and $R_j=b_jX^{2}+a_jX+c_j$; $u\neq0$ as $u\notin\Qbar$.
'''

[[node]]
platform = "DiazModulus.quadratic_complement_eigen_forms"
env = "proposition"
title = 'The eigen-forms of the multiplication matrix'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $P,Q\in\Qbar[X]$ be coprime with $\max(\deg P,\deg Q)=2$, and let $g_0,g_1\in\C$ be such that $S=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_0+\Qbar g_1$ has dimension $5$ and $(P(u)/Q(u))g_j\in S$ for $j=0,1$. Write $P_c=P(u)-cQ(u)$. Then one of the following holds:
\begin{enumerate}
\item[(i)] the scalar shape: for some $c\in\Qbar$, $Q(u)R(u)/(uP_c)\in S$ for every $R\in\Qbar[X]$ of degree at most $2$;
\item[(ii)] the two-orbit shape: for some $c_1\neq c_2$ in $\Qbar$ and $R_1,R_2\in\Qbar[X]$ of degree at most $2$, $S=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar f_1+\Qbar f_2$ with $f_i=Q(u)R_i(u)/(uP_{c_i})$;
\item[(iii)] the cyclic shape: for some $c\in\Qbar$ and $R_0,R_1\in\Qbar[X]$ of degree at most $2$, $S=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar f_1+\Qbar f_2$ with $f_1=Q(u)R_0(u)/(uP_c)$ and $f_2=Q(u)\bigl(Q(u)R_0(u)+P_cR_1(u)\bigr)/(uP_c^{2})$.
\end{enumerate}
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Step~4 of the elementary proof of Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
Lemma~\ref{lem:quadratic_complement_multiplication_matrix} gives $T$ and $R_0,R_1$ for $k=P(u)/Q(u)$; with $G(x)=x_0g_0+x_1g_1$ and $H(x)=x_0R_0+x_1R_1$, $Tx=cx+y$ gives $G(x)=Q(u)\bigl(H(x)(u)+uG(y)\bigr)/(uP_c)$. Apply Lemma~\ref{lem:qbar_matrix_fin_two_eigen_or_jordan} to $T$: an eigenbasis gives the two-orbit shape and a Jordan pair the cyclic one, with the same span; if $T=cI$, multiplication by $k-c=P_c/Q(u)$ maps $g_0,g_1,Q(u)/u$ onto a basis of $\Qbar+\Qbar u+\Qbar u^{-1}$, so $Q(u)R(u)/(uP_c)\in\Qbar g_0+\Qbar g_1+\Qbar Q(u)/u$ for every $R$ of degree at most $2$.
'''

[[node]]
platform = "DiazModulus.quadratic_eigen_forms_canonical"
env = "lemma"
title = 'The three shapes in canonical form'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Let $P,Q\in\Qbar[X]$ be coprime with $\max(\deg P,\deg Q)=2$, write $P_c=P(u)-cQ(u)$, and suppose that $W$ has one of the shapes of Proposition~\ref{prop:quadratic_complement_eigen_forms}, with $W$ for $S$:
\begin{enumerate}
\item[(i)] the scalar shape: for some $c\in\Qbar$, $Q(u)R(u)/(uP_c)\in W$ for every $R\in\Qbar[X]$ of degree at most $2$;
\item[(ii)] the two-orbit shape: for some $c_1\neq c_2$ in $\Qbar$ and $R_1,R_2\in\Qbar[X]$ of degree at most $2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar f_1+\Qbar f_2$ with $f_i=Q(u)R_i(u)/(uP_{c_i})$;
\item[(iii)] the cyclic shape: for some $c\in\Qbar$ and $R_0,R_1\in\Qbar[X]$ of degree at most $2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar f_1+\Qbar f_2$ with $f_1=Q(u)R_0(u)/(uP_c)$ and $f_2=Q(u)\bigl(Q(u)R_0(u)+P_cR_1(u)\bigr)/(uP_c^{2})$.
\end{enumerate}
Then $W$ satisfies one of the following:
\begin{enumerate}
\item[(D1)] there are $t_0,t_1,t_2\in W$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W$;
\item[(D2a)] the two-orbit form: for some $P',Q',S_1,S_2\in\Qbar[X]$ with $P',Q'$ coprime, $\max(\deg P',\deg Q')=2$ and $\deg S_1,\deg S_2\leq2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=P'(u)S_2(u)/(uQ'(u))$;
\item[(D2b)] the cyclic form: for some such $P',Q',S_1,S_2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=Q'(u)\bigl(Q'(u)S_1(u)+P'(u)S_2(u)\bigr)/(uP'(u)^{2})$.
\end{enumerate}
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). Step~5 of the elementary proof of Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
Lemma~\ref{lem:coprime_pencil_mobius} keeps $(P-cQ,Q)$ and, for $c_1\neq c_2$, $(P-c_1Q,P-c_2Q)$ coprime of maximal degree $2$. Scalar: $t=(u^{-1},1,Q(u)/(uP_c))$ and $ut$ lie in $W$ (take $R=1$ and $R=X$), and $t$ is free, as a relation times $uP_c$ is $(a+bX)(P-cQ)+eQ=0$ at the transcendental $u$; this is (D1). Two-orbit: $P'=P-c_1Q$, $Q'=P-c_2Q$, $S_1=R_1/(c_1-c_2)$ and $S_2=-R_2/(c_1-c_2)$ change the two generators by $S_1(u)/u$ and $S_2(u)/u$, which lie in $\Qbar+\Qbar u+\Qbar u^{-1}$; this is (D2a). Cyclic: $P'=P-cQ$, $Q'=Q$, $S_1=R_0$ and $S_2=R_1$ give (D2b).
'''

[[node]]
platform = "DiazModulus.degree_two_configuration_normal_form"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Theorem NF: the degree-two normal form'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Let $x_0,x_1\in\C$ be free over $\Qbar$, and $y_0,y_1,y_2\in\C$ too, with all six products $x_iy_j$ in $W$ (a $2\times3$ configuration in $W$). Let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)=2$, and suppose $x_1q(u)=x_0p(u)$, so that the ratio $x_1/x_0$ is $p(u)/q(u)$. Then $W$ satisfies one of the following:
\begin{enumerate}
\item[(D1)] there are $t_0,t_1,t_2\in W$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W$;
\item[(D2a)] the two-orbit form: for some $P',Q',S_1,S_2\in\Qbar[X]$ with $P',Q'$ coprime, $\max(\deg P',\deg Q')=2$ and $\deg S_1,\deg S_2\leq2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=P'(u)S_2(u)/(uQ'(u))$;
\item[(D2b)] the cyclic form: for some such $P',Q',S_1,S_2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=Q'(u)\bigl(Q'(u)S_1(u)+P'(u)S_2(u)\bigr)/(uP'(u)^{2})$.
\end{enumerate}
$W$ is not assumed to consist of rational functions of $u$; in cases (D2a) and (D2b) the conclusion shows that it does.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}). The statement is Theorem~2 of the mission's research notes (round R12), with the normal forms of its Q1.3, which become (D2a) and (D2b) after a change of coordinate, proved there with rank-two vector bundles on $\mathbb P^{1}$; the proof here is elementary. The step from a configuration spanning four dimensions to a progression is \cite[Lemma 4]{BSZ17}. No source on scrolls or on vector bundles on $\mathbb P^{1}$ was among those read.'''
sketch = '''
$x_0\neq0$, and $q(u)\neq0$ by a Bézout identity, so $x_1=hx_0$ with $h=p(u)/q(u)$, and $y'=x_0y$ is free with $y'_j,hy'_j\in W$. Proposition~\ref{prop:degree_two_configuration_multiplier_complement} gives $\lambda\in\{0,1,2\}$ and $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $kg_1,kg_2\in W$, $k=q(u)/(p(u)-\lambda q(u))$; the pencil $P=q$, $Q=p-\lambda q$ is coprime of maximal degree $2$ by Lemma~\ref{lem:coprime_pencil_mobius}, and $k=P(u)/Q(u)$. Proposition~\ref{prop:quadratic_complement_eigen_forms} with $S=W$ gives the scalar, two-orbit or cyclic shape, and Lemma~\ref{lem:quadratic_eigen_forms_canonical} turns it into (D1), (D2a) or (D2b).
'''

[[node]]
platform = "DiazModulus.quadratic_two_orbit_space_carries_two_by_three_configuration"
env = "proposition"
title = 'The two-orbit spaces carry a configuration'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $P,Q,R_1,R_2\in\Qbar[X]$ with $\max(\deg P,\deg Q)=2$ and $\deg R_1,\deg R_2\leq2$, and suppose that $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$, with $g_1=Q(u)R_1(u)/(uP(u))$ and $g_2=P(u)R_2(u)/(uQ(u))$, has dimension $5$. Then $x_0=1$, $x_1=P(u)/Q(u)$ are free over $\Qbar$, so are $y_0=Q(u)/u$, $y_1=R_2(u)/u$, $y_2=g_1$, and $x_iy_j\in W$ for all $i,j$. So every five-dimensional space of the form (D2a) carries a $2\times3$ configuration with ratio $P(u)/Q(u)$; $P$ and $Q$ need not be coprime.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The space is the two-orbit normal form of the mission's research notes (round R12, Q1.3), there in the coordinate $h-c$. The configuration is the easy direction; the classification is Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
The five generators are free, so $P(u),Q(u)\neq0$, and $R(u)/u\in\Qbar+\Qbar u+\Qbar u^{-1}$ when $\deg R\leq2$. The products are $Q/u$, $R_2/u$, $g_1$ and $P/u$, $g_2$, $R_1/u$ (values at $u$). $x$ is free, as $a+bP/Q=0$ times $R_2/u$ gives $aR_2/u+bg_2=0$; so is $y$, as a relation has no $g_1$ term and, times $P/Q$, gives $(aP+cR_1)/u+bg_2=0$. Only $u\neq0$ is used.
'''

[[node]]
platform = "DiazModulus.quadratic_cyclic_space_carries_two_by_three_configuration"
env = "proposition"
title = 'The cyclic spaces carry a configuration'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $P,Q,R_1,R_2\in\Qbar[X]$ with $\max(\deg P,\deg Q)=2$ and $\deg R_1,\deg R_2\leq2$, put $g_1=Q(u)R_1(u)/(uP(u))$ and $g_2=Q(u)\bigl(Q(u)R_1(u)+P(u)R_2(u)\bigr)/(uP(u)^{2})$, and suppose that $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ has dimension $5$. Then $x_0=1$, $x_1=P(u)/Q(u)$ are free over $\Qbar$, so are $y_0=Q(u)/u$, $y_1=g_1$, $y_2=g_2$, and $x_iy_j\in W$ for all $i,j$. So every five-dimensional space of the form (D2b) carries a $2\times3$ configuration with ratio $P(u)/Q(u)$; $P$ and $Q$ need not be coprime.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}). The space is the cyclic normal form of the mission's research notes (round R12, Q1.3), there in the coordinate $h-c$. The configuration is the easy direction; the classification is Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}).'''
sketch = '''
The five generators are free, so $P(u),Q(u)\neq0$, and $R(u)/u\in\Qbar+\Qbar u+\Qbar u^{-1}$ when $\deg R\leq2$. The products are $Q/u$, $g_1$, $g_2$ and $P/u$, $R_1/u$, $g_1+R_2/u$ (values at $u$). $x$ is free, as $a+bP/Q=0$ times $g_2$ gives $bR_2/u+bg_1+ag_2=0$; so is $y$, as $aQ(u)/u+bg_1+cg_2=0$ forces $b=c=0$. Only $u\neq0$ is used.
'''

[[node]]
platform = "DiazModulus.rational_space_configuration_coprime_ratio"
env = "lemma"
title = 'The ratio of a configuration of rational functions'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W$ be a $\Qbar$-subspace of $\C$ contained in $\Qbar(u)$, the field generated by $\Qbar$ and $u$, and let $x_0,x_1\in\C$ be free over $\Qbar$, and $y_0,y_1,y_2\in\C$ too, with all six products $x_iy_j$ in $W$. Then there are coprime $p,q\in\Qbar[X]$ with $\max(\deg p,\deg q)\geq1$ and $x_1q(u)=x_0p(u)$: the ratio $x_1/x_0$ is $p(u)/q(u)$ in lowest terms, and it is not algebraic.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$x_1/x_0=(x_1y_0)/(x_0y_0)$ lies in $\Qbar(u)$, so it is $r(u)/s(u)$; divide $r$ and $s$ by their gcd, whose value at the transcendental $u$ is non-zero. Constant $p,q$ would give a relation between $x_0$ and $x_1$.
'''

[[node]]
platform = "DiazModulus.mobius_ratio_configuration_u_multiplier_triple"
env = "lemma"
title = 'A ratio of degree one'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space, let $x_0,x_1\in\C$ be free over $\Qbar$, and $y_0,y_1,y_2\in\C$ too, with all six products $x_iy_j$ in $W$, and let $p,q\in\Qbar[X]$ be coprime with $\max(\deg p,\deg q)=1$ and $x_1q(u)=x_0p(u)$. Then there are $y'_0,y'_1,y'_2\in W$, free over $\Qbar$, with $uy'_0,uy'_1,uy'_2\in W$: so $(1,u)\otimes y'$ is a configuration in $W$, with ratio $u$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
With $p=aX+b$ and $q=cX+d$: $q(u)\neq0$, and $\Delta=ad-bc\neq0$ by the freeness of $x$ and the degree. Put $y'_j=x_0y_j/q(u)$; then $\Delta y'_j=ax_0y_j-cx_1y_j$ and $\Delta uy'_j=dx_1y_j-bx_0y_j$ lie in $W$.
'''

[[node]]
platform = "DiazModulus.rational_space_two_by_three_configuration_iff"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Five-dimensional spaces of rational functions of $u$'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Suppose $W\subseteq\Qbar(u)$. Then $W$ carries a $2\times3$ configuration ($x_0,x_1$ free over $\Qbar$, $y_0,y_1,y_2$ free over $\Qbar$, all six $x_iy_j$ in $W$) if and only if it satisfies one of the following:
\begin{enumerate}
\item[(D1)] there are $t_0,t_1,t_2\in W$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W$;
\item[(D2a)] the two-orbit form: for some $P',Q',S_1,S_2\in\Qbar[X]$ with $P',Q'$ coprime, $\max(\deg P',\deg Q')=2$ and $\deg S_1,\deg S_2\leq2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=P'(u)S_2(u)/(uQ'(u))$;
\item[(D2b)] the cyclic form: for some such $P',Q',S_1,S_2$, $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=Q'(u)\bigl(Q'(u)S_1(u)+P'(u)S_2(u)\bigr)/(uP'(u)^{2})$.
\end{enumerate}
It is the form of Theorem~F (Theorem~\ref{thm:rational_conj_hull_two_by_three_configuration_iff}) that does not use complex conjugation.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}): the ``only if'' half, the classification. The configurations of the ``if'' half give, at a candidate, exclusions that are substitutions in Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}. Applied to the conjugation hulls of rational $z$, with Lemma~\ref{lem:rational_conj_hull_le_adjoin}, it gives the five-dimensional case of Theorem~F (Theorem~\ref{thm:rational_conj_hull_two_by_three_configuration_iff}).'''
sketch = '''
Only if: Lemma~\ref{lem:rational_space_configuration_coprime_ratio} gives the ratio $p(u)/q(u)$ in lowest terms, of degree at most $2$ by Lemma~\ref{lem:two_by_three_configuration_ratio_degree_le_two}; degree $1$ gives (D1) by Lemma~\ref{lem:mobius_ratio_configuration_u_multiplier_triple}, and degree $2$ gives (D1), (D2a) or (D2b) by Theorem~NF (Theorem~\ref{thm:degree_two_configuration_normal_form}). If: under (D1), $(1,u)\otimes t$ is a configuration; under (D2a) or (D2b), Propositions~\ref{prop:quadratic_two_orbit_space_carries_two_by_three_configuration} and~\ref{prop:quadratic_cyclic_space_carries_two_by_three_configuration} give $(1,P'(u)/Q'(u))\otimes y$.
'''

[[node]]
platform = "DiazModulus.rational_conj_hull_le_adjoin"
env = "lemma"
title = 'Conjugation hulls of rational functions are rational'
statement = '''
Let $u\in\C\setminus\Qbar$. Suppose $u\bar u$ is algebraic, let $z\in\Qbar(u)$, and let $W_z=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$. Then $u^{-1}\in W_z$ and $W_z\subseteq\Qbar(u)$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
$\rho=u\bar u$ is algebraic and non-zero, so $u^{-1}=\rho^{-1}\bar u$ and $\bar u=\rho u^{-1}\in\Qbar(u)$. Conjugation maps $\Qbar$ to itself and $u$ into $\Qbar(u)$, so it maps $\Qbar(u)$ into itself, and $\bar z\in\Qbar(u)$. Of $u\notin\Qbar$ only $u\neq0$ is used.
'''

[[node]]
platform = "DiazModulus.conj_hull_finrank_four_two_by_three_configuration_iff"
env = "proposition"
title = 'Four-dimensional conjugation hulls'
statement = '''
Let $u\in\C\setminus\Qbar$. Suppose $u\bar u$ is algebraic, let $z\in\C$, and suppose that $W_z=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ has dimension $4$. Then $W_z$ carries a $2\times3$ configuration ($x_0,x_1$ free over $\Qbar$, $y_0,y_1,y_2$ free over $\Qbar$, all six $x_iy_j$ in $W_z$) if and only if $z\in\Qbar+\Qbar u+\Qbar\bar u+\Qbar(u-a)^{-1}$ for some $a\in\Qbar$ with $a\bar a=u\bar u$. Then $W_z=\Qbar+\Qbar u+\Qbar\bar u+\Qbar(u-a)^{-1}$, with $a$ on the circle $|a|=|u|$.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), given Theorem~B (Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}) and the conjugation stability of the hull. The configuration is printed: rescaled, it is \cite[Théorème 7(1)]{Dia07} at $v=1/(u-a)$, and at a candidate the exclusion of $1/(u-a)$ is \cite[Corollaire 5(4)]{Dia07}.'''
sketch = '''
Put $H_0=\Qbar+\Qbar u+\Qbar\bar u$, of dimension $3$. As $\dim W_z=4$, $z\notin H_0$ and $\bar z\in H_0+\Qbar z$, so $W_z=H_0+\Qbar z$ and Theorem~B (Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}) applies. If: $a\bar a=u\bar u\neq0$ gives $a\neq0$, and Theorem~B's third alternative. Only if: Theorem~B gives $W_z=H_0+\Qbar w$ with $w=u^{2}$, $\bar u^{2}$ or $(u-a)^{-1}$, $a\neq0$, and $\bar w\in W_z$. For $w=u^{2}$ or $\bar u^{2}$ this makes $u$ algebraic; for $w=(u-a)^{-1}$ it puts $(u-b)^{-1}$, $b=u\bar u/\bar a$, in $H_0+\Qbar w$, and clearing denominators and evaluating at $b$ gives $b=a$, that is $a\bar a=u\bar u$.
'''

[[node]]
platform = "DiazModulus.rational_conj_hull_two_by_three_configuration_iff"
root = true
novelty = "not-routine"
env = "theorem"
title = 'Theorem F: conjugation hulls of rational functions of $u$'
statement = '''
Let $u\in\C\setminus\Qbar$. Suppose $u\bar u$ is algebraic, let $z\in\Qbar(u)$, and let $W_z=\Qbar+\Qbar u+\Qbar\bar u+\Qbar z+\Qbar\bar z$ be its conjugation hull. Then $W_z$ carries a $2\times3$ configuration ($x_0,x_1$ free over $\Qbar$, $y_0,y_1,y_2$ free over $\Qbar$, all six $x_iy_j$ in $W_z$) if and only if $\dim W_z=4$ and $z\in\Qbar+\Qbar u+\Qbar\bar u+\Qbar(u-a)^{-1}$ for some $a\in\Qbar$ with $a\bar a=u\bar u$, or $\dim W_z=5$ and $W_z$ satisfies one of the following:
\begin{enumerate}
\item[(D1)] there are $t_0,t_1,t_2\in W_z$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W_z$;
\item[(D2a)] the two-orbit form: for some $P',Q',S_1,S_2\in\Qbar[X]$ with $P',Q'$ coprime, $\max(\deg P',\deg Q')=2$ and $\deg S_1,\deg S_2\leq2$, $W_z=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=P'(u)S_2(u)/(uQ'(u))$;
\item[(D2b)] the cyclic form: for some such $P',Q',S_1,S_2$, $W_z=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g_1+\Qbar g_2$ with $g_1=Q'(u)S_1(u)/(uP'(u))$ and $g_2=Q'(u)\bigl(Q'(u)S_1(u)+P'(u)S_2(u)\bigr)/(uP'(u)^{2})$.
\end{enumerate}
Since $\bar u=(u\bar u)u^{-1}$, the polynomials $z$ in $u$ and $\bar u$ of Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff} (Theorem~E) are among these.
'''
source = '''\textbf{Not found in the sources read, and not routine} (Chapter~\ref{chap:14-not-found-in-the-sources}): the ``only if'' half, the classification. Theorem~F asks the question of Theorem~E (Theorem~\ref{thm:laurent_conj_hull_two_by_three_configuration_iff}) for every $z$ rational in $u$, and builds on Theorem~B (Theorem~\ref{thm:circle_point_extension_two_by_three_configuration_iff}), which holds for every complex $z$. For $z$ a polynomial in $u$ and $\bar u$, that its answer gives back the classes (P), (Q) and (R) of Theorem~E was checked by exact computation on random data, not proved, and the explicit criteria of Corollaries~\ref{cor:laurent_conj_hull_large_exponent_configuration_iff_real_pencil_class} and~\ref{cor:cubic_window_conj_hull_two_by_three_configuration_iff_criterion} do not follow from it. Special cases of the ``if'' half are printed: in dimension $4$ the configuration is \cite[Théorème 7(1)]{Dia07} at $v=1/(u-a)$, with the exclusion at a candidate in \cite[Corollaire 5(4)]{Dia07}; for polynomials of degree $2$ and $3$ in $u$ it is \cite[Théorème 7(1)]{Dia07}; class (Q) of Theorem~E is a substitution in \cite[Théorème 2]{Dia04} and \cite[Théorème 4(1)]{Dia07}. At a candidate, its configurations give exclusions that are substitutions in Roy's strong six exponentials theorem \cite[Corollary 2]{Roy92}.'''
sketch = '''
$\dim W_z\in\{3,4,5\}$, as $\Qbar+\Qbar u+\Qbar\bar u$ has dimension $3$. In dimension $3$ there is no configuration, by Corollary~\ref{cor:circle_point_config_card_le_four} ($2+3>4$); dimension $4$ is Proposition~\ref{prop:conj_hull_finrank_four_two_by_three_configuration_iff}; in dimension $5$, Lemma~\ref{lem:rational_conj_hull_le_adjoin} puts $u^{-1}$ in $W_z\subseteq\Qbar(u)$, and Theorem~\ref{thm:rational_space_two_by_three_configuration_iff} applies to $W=W_z$.
'''

[[node]]
platform = "DiazModulus.degree_one_multiplier_space_visible_or_degree_one_space"
env = "proposition"
title = 'Three $u$-multipliers'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Then there are $t_0,t_1,t_2\in W$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W$ (condition (D1)) if and only if $u^{2}\in W$, or $u^{-2}\in W$, or $(u-a)^{-1}\in W$ for some $a\in\Qbar$ with $a\neq0$, or $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g+\Qbar ug$ for some $g\in\C$ with $1,u,u^{-1},g,ug$ free. The alternatives before the last say that $W$ is visible: it contains $u^{2}$, $u^{-2}$ or $(u-a)^{-1}$, the elements of Theorem~B (when $u\bar u$ is algebraic, $u^{-2}$ is an algebraic multiple of $\bar u^{2}$); the last is a degree-one space.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}).'''
sketch = '''
If every $t_j$ lies in $\Qbar+\Qbar u+\Qbar u^{-1}$, which has dimension $3$, then $u\in\sum_j\Qbar t_j$ and $u^{2}\in W$. Otherwise take $g=t_j\notin\Qbar+\Qbar u+\Qbar u^{-1}$: if $(u-c)g\in\Qbar+\Qbar u+\Qbar u^{-1}$ for some $c\in\Qbar$, then $u^{-2}\in W$ (for $c=0$) or $(u-c)^{-1}\in W$ (for $c\neq0$); if not, $1,u,u^{-1},g,ug$ are free and span $W$. Conversely take $t=(1,u,u^{-1})$, $(1,u^{-1},u^{-2})$, $(1,u^{-1},(u-a)^{-1})$, as $u(u-a)^{-1}=1+a(u-a)^{-1}$, or $(1,u^{-1},g)$.
'''

[[node]]
platform = "DiazModulus.conj_stable_degree_one_multiplier_space_visible_or_real_pencil_space"
root = true
env = "proposition"
title = 'Conjugation-stable spaces with three $u$-multipliers'
statement = '''
Let $u\in\C\setminus\Qbar$. Let $s\in\Qbar$ be real with $s^{2}=u\bar u$. Let $W\subseteq\C$ be a $\Qbar$-space of dimension $5$ containing $1$, $u$ and $u^{-1}$. Suppose $W$ is stable under complex conjugation and satisfies (D1): there are $t_0,t_1,t_2\in W$, free over $\Qbar$, with $ut_0,ut_1,ut_2\in W$. Then $W$ contains $u^{2}$, $\bar u^{2}$ or some $(u-a)^{-1}$ with $a\in\Qbar$, $a\neq0$, or $W=\Qbar+\Qbar u+\Qbar\bar u+\Qbar f+\Qbar f/(s+\lambda u)$ for some $\lambda\in\Qbar$ with $\lambda\bar\lambda=1$ and some real $f\in\C$: a real pencil space $W(\lambda,f)$ of Proposition~\ref{prop:conj_stable_real_pencil_space_carries_two_by_three_configuration}.
'''
source = '''Not found in the sources read; routine (Chapter~\ref{chap:14-not-found-in-the-sources}), given Theorem~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space}. It is the conjugation-stable refinement of the degree-one case in the mission's research notes (round R10).'''
sketch = '''
As $\bar u=s^{2}u^{-1}$, $u^{-2}\in W$ if and only if $\bar u^{2}\in W$. If $W$ is not visible, Proposition~\ref{prop:degree_one_multiplier_space_visible_or_degree_one_space} gives $W=\Qbar+\Qbar u+\Qbar u^{-1}+\Qbar g+\Qbar ug$ with these five free. Then $Z=\{h\in W:uh\in W\}$ is $\Qbar+\Qbar u^{-1}+\Qbar g$, since an eigenvector of $u$ on $W/(\Qbar+\Qbar u+\Qbar u^{-1})$, whose eigenvalue is a root of a quadratic over $\Qbar$, would put $u^{-2}$ or some $(u-c)^{-1}$ in $W$; and $u^{-1}\bar g=s^{-2}\,\overline{ug}$ lies in $Z$, so $\bar g\in\Qbar+\Qbar u+\Qbar ug$. Then $1,u,\bar u,g,ug$ are free and span $W$, and Theorem~\ref{thm:conj_equivariant_degree_one_space_eq_real_pencil_space} gives $\lambda$ and $f$.
'''
